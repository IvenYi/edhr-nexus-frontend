<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <style>
    @keyframes arc-animation {
      /* 0%-25%: 从点扩展到180度弧 */
      0% {
        stroke-dasharray: 0 100.53;
      }
      25% {
        stroke-dasharray: 50.265 100.53;
      }
      /* 25%-65%: 保持弧长不变 */
      70% {
        stroke-dasharray: 50.265 100.53;
      }
      /* 75%-100%: 从180度弧收缩回点 */
      100% {
        stroke-dasharray: 0 100.53;
      }
    }

    @keyframes rotate-animation {
      0% {
        transform: rotate(-90deg);
      }
      100% {
        transform: rotate(630deg); /* -90 + 720 = 630 */
      }
    }

    .animated-circle {
      stroke-linecap: round;
      transform-origin: center;
      animation:
        arc-animation 1.5s linear infinite,
        rotate-animation 1.5s linear infinite;
    }
  </style>
  <!-- 圆环，半径16px，边框4px -->
  <circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-opacity="0" stroke-width="4" stroke-linecap="round" />
  <circle
    cx="20"
    cy="20"
    r="16"
    fill="none"
    stroke="currentColor"
    stroke-width="4"
    class="animated-circle"
  />
</svg>
