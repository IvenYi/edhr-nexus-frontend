server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: edhr
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

# Application-level settings
app:
  tenant:
    default-id: default
  jwt:
    secret: ${JWT_SECRET:edhr-phase0-jwt-secret-key-change-in-production-min-256-bits}
    expiration-ms: 86400000
  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size: 10MB

edhr:
  ocr:
    paddle:
      enabled: ${OCR_PADDLE_ENABLED:true}
      python-command: ${OCR_PADDLE_PYTHON_COMMAND:python3}
      script-path: ${OCR_PADDLE_SCRIPT_PATH:./scripts/paddle_id_card_ocr.py}
      timeout-seconds: ${OCR_PADDLE_TIMEOUT_SECONDS:30}
  onlyoffice:
    enabled: ${ONLYOFFICE_ENABLED:false}
    document-server-url: ${ONLYOFFICE_DOCUMENT_SERVER_URL:http://localhost:8088}
    converter-url: ${ONLYOFFICE_CONVERTER_URL:${ONLYOFFICE_DOCUMENT_SERVER_URL:http://localhost:8088}}
    public-backend-url: ${ONLYOFFICE_PUBLIC_BACKEND_URL:http://localhost:8081}
    jwt-secret: ${ONLYOFFICE_JWT_SECRET:dev-onlyoffice-secret-change-me}
    download-allowed-hosts: ${ONLYOFFICE_DOWNLOAD_ALLOWED_HOSTS:localhost,127.0.0.1,onlyoffice-document-server}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
