version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edhr-postgres
    environment:
      POSTGRES_DB: edhr_dev
      POSTGRES_USER: edhr
      POSTGRES_PASSWORD: edhr_dev_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edhr -d edhr_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edhr-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/edhr_dev
      SPRING_DATASOURCE_USERNAME: edhr
      SPRING_DATASOURCE_PASSWORD: edhr_dev_pwd
      JWT_SECRET: docker-edhr-jwt-secret-change-in-production
      FILE_UPLOAD_DIR: /app/uploads
      OCR_PADDLE_ENABLED: "true"
      OCR_PADDLE_PYTHON_COMMAND: python3
      OCR_PADDLE_SCRIPT_PATH: /app/scripts/paddle_id_card_ocr.py
      ONLYOFFICE_ENABLED: "true"
      ONLYOFFICE_DOCUMENT_SERVER_URL: http://localhost:8088
      ONLYOFFICE_CONVERTER_URL: http://onlyoffice-document-server
      ONLYOFFICE_PUBLIC_BACKEND_URL: http://backend:8081
      ONLYOFFICE_JWT_SECRET: docker-onlyoffice-jwt-secret-change-in-production
      ONLYOFFICE_DOWNLOAD_ALLOWED_HOSTS: localhost,127.0.0.1,onlyoffice-document-server,backend
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      onlyoffice-document-server:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edhr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  onlyoffice-document-server:
    image: onlyoffice/documentserver:8.2
    container_name: edhr-onlyoffice-document-server
    ports:
      - "8088:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: docker-onlyoffice-jwt-secret-change-in-production
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data

volumes:
  postgres_data:
  uploads_data:
  onlyoffice_data:
