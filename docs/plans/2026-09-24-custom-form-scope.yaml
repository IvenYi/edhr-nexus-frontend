  compatibility:
    - 历史执行没有 DHR 实例时可补充自定义记录，不伪造历史 DHR；既有最终完工的 DHR 缺失保护保持不变。
    - 审批前再次检查全部自定义份，阻止旧版本遗留的不完整审核直接定稿；允许退回整理。
  knowledge:
    result: scoped-passed
    tests: 59
    limitation: 完整工作树有两个既有未跟踪 DEC-0058/0059 冲突，隔离校验排除这两项；不能声称完整知识门禁通过。
