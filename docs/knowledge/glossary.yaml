knowledgeModelVersion: 0.3.25
terms:
  - id: term.production-quality-summary
    name: 正式质量累计
    definition: 从真实归属内成功正式报工或报废来源分别计算的良品、NG和报废登记量及其完整性。批次良品与NG只取冻结最终工序；产品报废取全流程本批产品，其他物料不混入。工序面板只取当前工序并按原单位及适用物料分别展示，正式累计显示为已生效数量，已保存过程参考显示为已填报数量；后者包含前者，不是待生效量，不相加，同指标浮层中分别解释。表单状态不等于统计计入状态。未采集不是0，缺失或不符单位待核对并保留来源，NG不是待处置库存、报废登记不是自动销毁；质量三项不加减明确产出，不改生命周期或旧证据。
    aliases: [批次质量指标, 工序质量累计, 产品报废登记量]
    status: implemented
    visibility: internal
  - id: term.final-output-operation
    name: 最终产出工序
    definition: 具体产品或产品簇制程版本中显式指定、用于决定批次最终产出的一个稳定路线节点绑定；至多一个且可不设，不默认末道工序、不额外阻断生产。新实例按使用时冻结配置解释，不是可复用全局工序的属性。
    aliases: [最终产出节点]
    status: implemented
    visibility: internal
  - id: term.production-output-summary
    name: 正式产出累计
    definition: 从最终完成且投影成功的产出来源记录计算的生产数量及完整性。普通工序按填写单位分别累计；批次仅取冻结的最终产出工序且核对冻结产品单位；工单只汇总所属批次。多次报工分别计入而重试不重复，无数据不等于零，空或异单位保留事实并标待核对。它不等同良品、不良品、报废合计、过程参考数或生产/DHR生命周期状态，不补算缺少新冻结依据的旧实例。
    aliases: [累计产出数量, 批次最终产出, 工单累计产出]
    status: implemented
    visibility: internal
  - id: term.form-projection-configuration
    name: 表单用途配置
    definition: 制表人把产品维护的统计用途或追溯项显式关联到主表字段组合或子表列的配置；来源映射、目录含义和模型版本随实际生产使用复制，后续模板及目录修改不静默回写已使用实例。它不建立真实生产或DHR归属，不是客户自由编写业务规则。
    aliases: [追溯与统计来源配置]
    status: specified
    visibility: internal
  - id: term.form-business-projection
    name: 正式业务投影
    definition: 表单最终完成时在同事务留下待处理批次，再由确定性解释器按该次冻结来源生成的报工、报废或消耗记录；保存及审批中内容只参与过程追溯，不提前计入正式统计。每条保留来源实例、用途、字段及实际行身份，投影不是原表单或DHR的替代记录；正式产出另按DEC-0078的显式产出来源、冻结最终节点及产品单位解释，不能仅凭成功投影就把全部报工数量相加为批次产出。
    aliases: [正式统计来源记录]
    status: specified
    visibility: internal
  - id: term.custom-form-scope
    name: 自定义表单归属
    definition: 自定义表单所随行的业务对象，分为指定工序与当前批次；批次归属跨工序共享同一表单及份实例，与表单创建时所在工序位置区分。
    aliases: [工序表单归属, 批次表单归属]
    status: specified
    visibility: internal
  - id: term.dhr-record-completeness
    name: 批记录资料齐套
    definition: 批记录所关联记录的闭环情况，独立于生产完工及汇总审核状态；自定义表单的每份最终完成或经正式授权关闭前为待完善，完工门禁关闭及不纳入目录均不构成豁免。
    aliases: [资料完整性, 资料待完善]
    status: specified
    visibility: internal
  - id: term.form-lookup-item
    name: 追溯项
    definition: 管理员维护、制表人显式关联字段或子表列、查询人选择条件并输入值的可复用内容反向查询含义；同一目录供授权表单及DHR反向追溯使用，不定义正向真实关联属性或业务报表固定筛选。产品统一称追溯项，查找项为同义旧称；它不是统计模型，内容命中不创建实体或DHR关系。当前支持文本、数字和日期，数字精确值与日期起止范围使用相应输入控件；自定义项引用字段兼容延期。九项预置含日期型追溯日期，由制表人明确绑定实际业务日期字段，不自动使用创建时间，也不自动合并已有自定义日期项；九项预置不可删除，默认三项、其他六项为展开区固定条件，自定义项通过添加条件选择，添加入口默认隐藏于展开区；反向查询区域按最新授权可重新设计，方向页签形式保持；反向移除归属与属性区，不新增限定范围浮层，正向原布局与结果列表实际归属展示保持，按DEC-0077-39/40定义。自定义项支持CRUD，有表单配置关联时先解除再删除；操作列关联配置弹窗支持查看全部配置、逐项勾选或全选解除及表单预览定位对应字段/子表列，历史填报内容保留，按DEC-0077-41定义。预置生产批次/SN统一批次和本单SN，有执行上下文时表达本单真实所属，无上下文可登记系统内对象而不产生归属；保存后内容可查，未保存输入不参与。来源、授权、未来正确快照与MVP开发历史各遵守已确认契约，其余目录生命周期及A12仍另定。
    aliases: [查找项]
    status: specified
    visibility: internal
  - id: term.form-production-subject-trace-item
    name: 生产批次/SN追溯项
    definition: 同时覆盖批次和SN的产品预置追溯含义；有真实生产或作业执行上下文时表达本单所属对象，字段填选值不能改变统计、表单或DHR归属。无上下文允许登记系统内对象，已设自动带入时提示上下文缺失，不据填选建立执行或DHR归属；正式DHR关联另经特别业务流程。草稿不做阻断性业务校验，其他带入生命周期及错误值最终校验细则仍待定。
    aliases: [生产主体追溯项]
    status: specified
    visibility: internal
  - id: term.form-saved-content-trace
    name: 已保存内容追溯
    definition: 表单反向按显式追溯绑定查询最近成功保存或暂存的内容，覆盖草稿、填报中、审批中及完成记录并显示状态，未保存输入不可查。表单多条件保持同实例/适用的同实际子表行；DHR反向可由同DHR内不同真实关联表单贡献条件，并保留对应字段/行定位。该查询不决定正向实例可见性，不提前形成正式统计或DHR归属；失效历史及A12另定，具体实现和验证见同包证据。
    aliases: [过程内容追溯]
    status: specified
    visibility: internal
  - id: term.form-fill-settings
    name: 表单填报设置
    definition: 作业表单节点或工序绑定表单的配置，显式选择直接填报或按流程填报；直接模式配置权限组、字段例外、按钮和签署，按流程模式沿用既有流程配置，所选模式及适用设置须贯通保存、发布快照和运行。当前为已确认要求，不表示闭环已验证。
    aliases: [填报方式配置]
    status: specified
    visibility: internal
  - id: term.master-data-deletion-impact
    name: 主数据删除关联清单
    definition: 删除主数据或版本前查询并展示的阻断关联及处理位置；由已有业务引用派生，不是另一套业务关联事实库。
    aliases: [删除影响, 删除约束关系]
    status: specified
    visibility: internal
  - id: term.master-data-description
    name: 主数据描述
    definition: 无子版本主数据的唯一自由文本说明字段；客户界面统一标为“描述”，不与同层级的备注字段并存。
    aliases: [主数据说明, description]
    status: implemented
    visibility: internal
  - id: term.master-data-page-permission
    name: 主数据页面权限
    definition: 绑定主数据页面资源及其服务端接口的现有 master-data.* authority；接口访问必须与对应页面权限一致。
    aliases: [主数据页面权限码, master-data authority]
    status: implemented
    visibility: internal
  - id: term.version-description
    name: 版本说明
    definition: 带子版本主数据的版本级唯一自由文本说明字段；客户界面统一标为“版本说明”，不额外保留重复的版本备注字段。
    aliases: [版本级说明, version description]
    status: implemented
    visibility: internal
  - id: term.workshop
    name: 车间
    definition: 在同一租户内独立维护、不采用业务版本管理的工厂建模主数据；字段为车间编码、车间名称、描述和启用或停用状态，供产线及后续生产业务引用。
    aliases: [车间主数据, Workshop]
    status: implemented
    visibility: internal
  - id: term.production-line
    name: 产线
    definition: 隶属于一个车间的生产组织单元；现有持久化关系通过 workshop_id 引用车间。
    aliases: [生产线, Production Line]
    status: implemented
    visibility: internal
  - id: term.material
    name: 物料
    definition: 物料管理维护的主数据；类型为产品（产成品）或半成品时可以派生为产品。
    aliases: [物料主数据]
    status: implemented
    visibility: internal
  - id: term.product
    name: 产品
    definition: 从产品或半成品物料派生的生产对象，不独立维护重复的产品主数据。
    aliases: [父产品, 产品物料]
    status: implemented
    visibility: internal
  - id: term.product-family
    name: 产品簇
    definition: 可包含多个半成品或产成品产品的产品集合；成员关系已持久化，并在同一租户内约束一个产品最多属于一个产品簇。
    aliases: [产品族]
    status: implemented
    visibility: internal
  - id: term.product-process-version
    name: 产品制程版本
    definition: 产品或产品簇下可并行存在并在后续生产执行中被显式选择的具体制程配置；制程根以 owner_type 和 owner_id 标识产品或产品簇所有者，并共用同一套版本及工序表单文档绑定模型。
    aliases: [制程配置版本, 产品工艺版本, 产品簇制程版本]
    status: implemented
    visibility: internal
  - id: term.route-version
    name: 工艺路线版本
    definition: 受版本控制并包含工序节点的工艺路线定义。
    aliases: [路线版本]
    status: implemented
    visibility: internal
  - id: term.operation
    name: 工序
    definition: 工艺路线版本中的执行节点，是表单和文档绑定的业务位置。
    aliases: [工序节点, 路线节点]
    status: implemented
    visibility: internal
  - id: term.dhr-template-version
    name: DHR 模板版本
    definition: 受版本控制的 DHR 目录定义，由产品制程版本绑定。
    aliases: [批记录模板版本, DHR 版本]
    status: implemented
    visibility: internal
  - id: term.dhr-directory-item
    name: DHR 目录项
    definition: DHR 模板版本目录中的表单项，指向一个具体表单模板版本。
    aliases: [DHR 表单目录项, 批记录目录项]
    status: implemented
    visibility: internal
  - id: term.dhr-instance
    name: DHR 实例
    definition: 以单个 BATCH 或 SN 生产对象为唯一业务锚点的动态批记录；首次合法开工时同事务自动创建，冻结生产、制程、路线、DHR 模板及目录上下文。按生产对象自动归集目录、作业、自定义实际实例及受控附件；目录映射只决定展示归属，不能排除无目录映射的实际证据。生产完成、汇总定版与放行含义分别保留，终止快照不因旧汇总转换或清理而删除。
    aliases: [动态批记录, 生产对象 DHR, 批记录实例]
    status: specified
    visibility: internal
  - id: term.dhr-summary-version
    name: DHR 汇总版本
    definition: 以生产对象为锚点、提交时冻结全部实际关联实例与受控附件、来源版本及状态、检查结果（含提交人对质量与异常、源审批签署、完整范围的逐项人工确认及说明）、目录展示与审批绑定的不可变业务修订，以 version_no 区分正常修订，不使用 evidence_model_version 区分并行模型。发起修订只基于最新定版创建汇总中草稿，重新提交才形成下一冻结版本；草稿和历史冻结版本通过版本选择区分，旧版正文只读且可按权限导出，数据审计不替代旧版查看。人工确认不等于系统自动判定质量合格，目录整理和导出选定范围不缩减证据或审批范围，正常旧批准只解释当时版本。前期错误旧汇总按 DEC-0063-09 转成待核查草稿或清理，不补造核查或删除源表单、生产对象、签署、原审计与终止快照。
    aliases: [DHR 冻结汇总版本]
    status: specified
    visibility: internal
  - id: term.dhr-controlled-attachment
    name: DHR 受控附件
    definition: 与生产对象 DHR 建立可追溯关联的手工文件或纸质记录扫描件；记录来源、内容摘要、核验与关联历史，冻结版本保留其当时引用。它不是表单实例的第四种业务来源。
    aliases: [DHR 附件证据, 纸质扫描附件]
    status: specified
    visibility: internal
  - id: term.dhr-summary-archive-display-name
    name: DHR 汇总归档显示名
    definition: 汇总草稿或冻结版本内真实证据的目录展示别名，与完整证据范围解耦；组行限当前范围，相邻折叠行限本段，单份限一份。别名不改变来源内容、实例身份或生产归属；正常冻结版本只读，未设置别名时显示来源名称。旧汇总转换保留可用别名、目录和位置，不表示继承旧核查结果。
    aliases: [汇总文档名称, 归档别名]
    status: specified
    visibility: internal
  - id: term.dhr-early-terminated
    name: DHR 已终止
    definition: 关联 BATCH/SN 生产对象提前结束后，DHR 真实停止正常推进的生命周期状态；已保存表单、签名和审计仍为真实记录。它不表示表单作废、审核通过、正常完工或产品放行。
    aliases: [已终止 DHR, EARLY_TERMINATED DHR]
    status: specified
    visibility: internal
  - id: term.form-template-version
    name: 表单模板版本
    definition: DHR 目录项实际引用并由工序绑定追溯的受控表单版本；用户可见的生效状态由 effectiveFrom/effectiveTo 时间窗计算，持久化 status 不替代该状态。
    aliases: [表单版本]
    status: implemented
    visibility: internal
  - id: term.form-instance
    name: 表单实例
    definition: 基于表单模板版本创建并保存的一份具体填报记录；当前实现由生产执行创建，后续统一目录可接入其他业务域。原始填写值和使用时模板快照是追溯、正式投影及DHR证据的来源，查询投影不反向改写实例或归属。表单实例的业务来源记录其创建业务承载域，区别于生产执行内的表单入口类型；批次归属自定义表单跨工序共享同一实例，创建或显示位置不改变其归属。表单流程绑定是可选的，未绑定流程时提交校验通过即进入已完成，绑定流程时在流程完成后进入同一已完成终态。
    aliases: [生产表单实例, FormInstance]
    status: specified
    visibility: internal
  - id: term.form-instance-business-source
    name: 表单实例业务来源
    definition: 表单实例创建时冻结的业务承载域，用于全局列表、详情、筛选和来源授权；当前唯一有效值为 PRODUCTION_EXECUTION，客户展示为“生产执行”。它不等同于工序配置、作业发起或自定义附件等生产执行内表单入口类型。
    aliases: [表单来源, 实例来源, businessSource]
    status: implemented
    visibility: internal
  - id: term.production-execution-form-entry-type
    name: 生产执行表单入口类型
    definition: 生产执行内部使表单出现在当前工序的方式，包括工序配置、作业发起和自定义附件；它服务于执行工作台的分类与选择，不是全局表单实例的业务来源，当前不作为全局实例目录的来源字段。
    aliases: [工序表单入口, 表单进入方式]
    status: specified
    visibility: internal
  - id: term.form-instance-number
    name: 表单实例号
    definition: 由系统为一份具体填报记录生成的不可修改编号；同份记录后续保存、提交、审批和退回修改保持编号不变，新建另一份生成新编号，区别于模板编号、版本号和子表明细行号。
    aliases: [表单记录号]
    status: specified
    visibility: internal
  - id: term.form-process-template
    name: 表单流程模板
    definition: 可复用的表单流程结构定义，不绑定具体表单；包含填报阶段、审批节点、结束流转及权限配置组。填报阶段可有多个组，审批节点对应一个组；组内主体共享默认字段权限，主体来源第一版为用户、部门和角色。未配置填报或审批主体时，由业务调用方按当前单租户内已认证用户的开放范围授权，不展开全量用户。流程模板不定义具体表单字段。
    aliases: [表单流程定义, 表单审批流程模板]
    status: specified
    visibility: internal
  - id: term.record-control-review-template
    name: 记录控制审批流程
    definition: 面向表单变更或表单作废申请确认后的可复用审批路径；首切片分类仅支持 CHANGE（表单变更）和 OBSOLETE（表单作废），流程不绑定具体表单记录。开始节点仅表示流程边界，不是用户任务且不配置按钮；审批节点固定提供审批、退回和转办，动作语义及显隐由系统固定，不能增删、替换、重复或隐藏。审批按钮的显示名称、样式和电子签名要求可配置，审批和退回可配置意见必填，转办不提供意见必填配置；流程不提供发起填报权限、表单校验或具体签名字段绑定。申请人在外部申请入口完成内容、申请人电子签名和已发布流程选择后点击确认，即构成审批发起并应直接进入首个审批节点。
    aliases: [表单变更作废审批流程, 记录控制审批流程]
    status: specified
    visibility: internal
  - id: term.record-control-application
    name: 记录控制申请
    definition: 表单变更或表单作废申请的公共上位概念；申请域负责申请内容、来源资格、申请人签名、业务锁和批准后业务落地。当前变更申请和作废申请仍保留独立对象与生命周期，不因该公共概念而合并状态。
    aliases: [记录控制申请单, RecordControlApplication]
    status: specified
    visibility: internal
  - id: term.record-change-action
    name: 表单变更
    definition: 对已完成表单通过独立受控申请产生新修订并替代当前有效修订的记录控制动作；上下文明确时可简称“变更”。中文产品文案不得再将该动作称为“更正”。
    aliases: [变更, CHANGE]
    status: specified
    visibility: internal
  - id: term.record-void-action
    name: 表单作废
    definition: 对表单整体无效发起独立受控申请，批准后使当前有效修订失效但不修改字段值的记录控制动作；上下文明确时可简称“作废”。
    aliases: [作废, OBSOLETE]
    status: specified
    visibility: internal
  - id: term.workflow-transfer-action
    name: 转办
    definition: 当前审批任务处理人在授权候选范围内变更该任务处理人的标准动作；不改变当前节点、流程路径或业务结果。中文产品文案不得使用“普通转办”作为并列正式名称。
    aliases: [TRANSFER]
    status: implemented
    visibility: internal
  - id: term.workflow-reassignment-action
    name: 重新分配
    definition: 具备专门权限的管理人员变更当前审批任务处理人的标准干预动作；不改变当前节点、流程路径或业务结果。中文产品文案不得使用“管理重新分配”作为并列正式名称。
    aliases: [REASSIGN]
    status: specified
    visibility: internal
  - id: term.workflow-return-action
    name: 退回
    definition: 审批人对当前审批任务作出不通过并将本轮申请退回申请阶段的标准动作；它不是独立的“拒绝”动作。
    aliases: [RETURN]
    status: specified
    visibility: internal
  - id: term.workflow-definition-version
    name: 工作流定义版本
    definition: 工作流定义下受版本控制的流程图配置；记录控制申请只可显式选择与申请类型匹配的当前已发布版本，实例创建后固定保存定义和版本引用，并记录流程图快照摘要。
    aliases: [流程定义版本, WorkflowDefinitionVersion]
    status: implemented
    visibility: internal
  - id: term.record-control-workflow-integration
    name: 记录控制流程集成边界
    definition: 记录控制申请域与公共流程域之间的稳定协作边界；记录控制域拥有申请、来源资格、签名和业务落地，公共流程域拥有候选查询、显式版本启动、路由、任务和流程运行日志。阶段一已实现候选查询与显式启动，其他共享类型仍是后续运行时边界。
    aliases: [记录控制审批流程集成边界, RecordControlWorkflowPort]
    status: implemented
    visibility: internal
  - id: term.record-control-transfer-button
    name: 记录控制审批转办按钮
    definition: 记录控制审批流程审批节点中用于声明转办动作呈现属性的固定按钮配置项；动作语义和显隐由系统固定，显示名称和按钮样式可配置，不提供审批意见必填配置。运行时转办的权限、原因、任务状态和审计由记录控制审批任务动作规则负责。
    aliases: [审批转办按钮, 记录控制转办按钮]
    status: specified
    visibility: internal
  - id: term.form-process-template-version
    name: 表单流程模板版本
    definition: 表单流程模板的受控配置版本，保存流程节点、连线及填报或审批权限配置组；组内多个主体共享组默认权限。未发布版本不得作为按流程填报的绑定目标，发布后版本内容固定。主体未配置时不展开全量用户，由业务调用方按开放操作范围处理。
    aliases: [表单流程版本]
    status: specified
    visibility: internal
  - id: term.form-process-binding-version
    name: 表单流程绑定版本
    definition: 作业流程表单填写节点将一个已发布表单流程版本绑定到一个表单模板版本形成的配置快照；绑定可保存针对真实表单字段的例外权限，并由节点固定引用。
    aliases: [表单流程绑定, 表单流程配置版本]
    status: specified
    visibility: internal
  - id: term.form-process-version-reference
    name: 表单流程版本引用
    definition: 作业流程版本的表单填报节点对某个已发布表单流程版本的固定配置引用；引用随所属作业流程版本冻结，不因表单流程后续升版自动改变。
    aliases: [流程版本引用, 表单流程引用]
    status: implemented
    visibility: internal
  - id: term.form-process-version-usage-projection
    name: 表单流程版本使用投影
    definition: 从作业流程图节点配置派生的可查询引用关系，用于在表单流程侧查看哪些作业流程版本正在使用某流程版本；投影由保存作业流程图时重建，不是独立维护的业务事实来源。
    aliases: [流程使用情况, 版本引用投影]
    status: implemented
    visibility: internal
  - id: term.form-process-field-slot
    name: 表单流程字段槽位
    definition: 历史方案中表单流程模板内代表稳定业务含义的字段契约；当前方案不再创建或配置该对象，仅保留用于读取历史配置和追溯旧决策。
    aliases: [字段槽位, 流程字段契约]
    status: deprecated
    visibility: internal
  - id: term.form-process-field-mapping
    name: 表单流程字段映射
    definition: 在绑定版本中将流程字段槽位映射到所选表单模板版本实际字段的配置记录；发布前需校验映射的存在性和兼容性。
    aliases: [字段槽位映射, 表单字段映射]
    status: deprecated
    visibility: internal
  - id: term.form-entry-permission-group
    name: 表单填报权限组
    definition: 填报阶段按岗位、角色或用户组授予字段编辑或只读及保存、提交等操作权限的主体；同一表单可配置多个权限组。
    aliases: [填报权限组, 表单录入权限组]
    status: deprecated
    visibility: internal
  - id: term.form-process-participant-rule
    name: 表单流程参与者规则
    definition: 表单流程审批节点通过标准主体引用解析处理人的规则；第一版支持用户、部门和角色，部门可限定本级或包含下级。部门负责人、用户组及业务责任人不属于已确认的第一版主体来源；到达节点时解析并冻结候选范围。
    aliases: [审批人规则, 审批参与者规则]
    status: specified
    visibility: internal
  - id: term.form-process-subject
    name: 表单流程主体
    definition: 表单流程节点上可选配置的填报人或审批参与者来源；多个主体可被放入同一个权限配置组，由组统一设置字段权限。未配置主体不代表无人可操作，而代表在当前单租户内对已认证用户开放对应操作。
    aliases: [填报主体, 审批主体, 表单流程参与主体]
    status: specified
    visibility: internal
  - id: term.identity-user-subject
    name: 用户主体
    definition: 由 UserAccount 稳定标识的流程主体，可直接作为审批主体或填报权限主体；主体引用保存用户 ID，不以显示名称作为唯一身份。
    aliases: [用户, 固定用户]
    status: implemented
    visibility: internal
  - id: term.identity-department-subject
    name: 部门主体
    definition: 由 Department 稳定标识的流程主体；部门范围默认为本部门及下级，也可选择仅本部门，具体成员按最新组织关系解析。
    aliases: [组织主体, 部门人员范围]
    status: implemented
    visibility: internal
  - id: term.identity-role-subject
    name: 角色主体
    definition: 由 Role 稳定标识的流程主体；当前产品页面将 Role 展示为岗位角色，具体成员按最新用户-角色关系解析，不另建独立岗位维度。
    aliases: [岗位角色, 角色]
    status: implemented
    visibility: internal
  - id: term.identity-runtime-subject-resolution
    name: 运行时主体解析
    definition: 在流程节点或其他业务调用时，使用当前有效的用户、部门和角色关系，将标准主体引用展开为最终用户集合；同一用户只保留一个解析结果，同时保留其命中的全部主体来源供权限合并、通知或审计使用。
    aliases: [主体解析器, 人员解析, 运行时人员解析]
    status: specified
    visibility: internal
  - id: term.identity-subject-resolution-match
    name: 主体解析命中
    definition: 运行时主体解析中某个最终用户与一个主体引用的匹配记录，包含主体类型、主体标识、部门范围（如适用）及用户标识；多个命中记录不得被去重逻辑丢弃。
    aliases: [解析来源, 主体命中来源]
    status: specified
    visibility: internal
  - id: term.workflow-task
    name: 逻辑工作流任务
    definition: 一个流程节点在运行时创建的单个逻辑待办任务；配置主体时多候选用户通过候选快照关联到同一任务，任一候选完成后任务完成；未配置审批主体时仍只创建一条逻辑任务，并由开放操作范围决定已认证用户的处理资格。
    aliases: [工作流任务, workflow_task]
    status: specified
    visibility: internal
  - id: term.workflow-task-resolution-snapshot
    name: 工作流任务主体解析快照
    definition: 工作流任务创建时保存的候选用户集合及主体命中来源快照，用于审计并冻结既有任务的候选范围，不随后续组织关系变化重算。
    aliases: [任务候选快照, 主体解析快照]
    status: specified
    visibility: internal
  - id: term.form-process-subject-selector
    name: 表单流程公共主体选择器
    definition: 在审批主体和填报权限主体等配置场景复用的主体选择组件；第一版支持用户、部门和角色，并保存稳定主体引用及部门范围。
    aliases: [主体选择器, 人员选择器]
    status: specified
    visibility: internal
  - id: term.form-process-subject-default-permission
    name: 权限组默认字段权限
    definition: 表单流程权限配置组设置的统一字段权限，第一版只有全部可编辑和全部只读两种选择；填报组内多个主体或审批节点内多个主体共享该默认权限，未配置字段例外时直接作为组内主体的字段权限。
    aliases: [默认权限, 主体默认权限, 主体默认字段权限]
    status: specified
    visibility: internal
  - id: term.form-process-permission-group
    name: 表单流程权限配置组
    definition: 表单流程中统一设置字段权限的配置单元。填报阶段一个权限组可包含多个用户、部门或角色主体；审批阶段每个审批节点本身就是一个权限组，节点内多个审批主体共享该组权限。组权限包括全部可编辑或全部只读的默认权限，以及绑定具体表单后的字段例外。
    aliases: [流程权限组, 填报权限组, 审批节点权限组]
    status: specified
    visibility: internal
  - id: term.form-template-field
    name: 表单真实字段
    definition: 某个表单模板版本中实际存在并具有稳定 fieldId 的字段；字段例外权限只能引用该字段，不跨表单共享字段身份。同一单选或多选字段在表单各放置位置共用同一组选项，位置副本不是独立字段或独立选项定义；名称或控件类型相同不使不同字段自动共享选项，按DEC-0080-01定义。
    aliases: [表单字段, 真实表单字段]
    status: specified
    visibility: internal
  - id: term.form-binding-field-permission-exception
    name: 表单绑定字段例外权限
    definition: 在作业流程表单填写节点绑定具体表单模板版本后，针对该表单真实字段覆盖权限配置组默认权限的编辑或只读配置；例外按权限组和稳定 fieldId 保存，每个绑定独立，未配置例外时继承组默认权限。
    aliases: [字段例外权限, 表单字段权限例外]
    status: specified
    visibility: internal
  - id: term.form-process-field-permission-policy
    name: 表单流程字段权限策略
    definition: 针对填报权限组或审批节点参与者设置字段权限的规则；每个主体先设置默认权限，再按流程字段配置少量例外，第一版权限只有编辑和只读，多个策略冲突时只读优先。
    aliases: [字段权限规则, 表单字段权限]
    status: deprecated
    visibility: internal
  - id: term.form-process-operation-permission-policy
    name: 表单流程操作权限策略
    definition: 表单流程填报阶段及审批节点的标准操作配置；当前动作包括保存、提交、审批、退回和审批转办，具体可用动作由节点类型、处理权及任务状态决定。它不承载具体字段权限，字段默认权限和例外权限由权限配置组及绑定配置分别决定；不据此开放其他终止动作。
    aliases: [操作权限规则, 表单操作权限]
    status: specified
    visibility: internal
  - id: term.form-process-node-button-config
    name: 表单流程节点按钮配置
    definition: 表单流程版本中针对开始或审批节点保存的按钮显示状态、显示名称和标准动作；电子签名通过独立签署事件关联按钮，不单独配置启用状态，已发布版本只读。
    aliases: [节点按钮配置, 流程按钮]
    status: specified
    visibility: internal
  - id: term.form-process-button-electronic-signature
    name: 表单流程按钮签署事件
    definition: 关联保存、提交、审批或退回按钮的签署事件；事件存在即表示动作执行前需要签名，是否填充签名字段由事件单独选择。DEC-0074 确认普通账号使用实际签署人的独立电子签名密码和有效认证，允许共享终端跨账号本人签署，仅用户名 admin 暂用登录密码例外；不改变 SIGN_FIELD。新认证规则仍为 specified/internal，不代表运行验证完成。
    aliases: [按钮签名要求, 电子签名配置]
    status: specified
    visibility: internal
  - id: term.form-process-standard-action
    name: 表单流程标准动作
    definition: 表单流程节点按钮可引用的受控动作标识；开始节点支持保存和提交，审批节点支持审批、退回和转办。转办原本就是审批节点应具备的标准动作；早期将其排除是已纠正的共同遗漏。加签、拒绝、终止和撤回仍不在开放范围内。
    aliases: [标准动作, 流程动作]
    status: specified
    visibility: internal
  - id: term.form-process-node-event-config
    name: 表单流程节点事件配置
    definition: 表单流程节点在标准动作执行前或执行后保存的事件声明，包含事件时机、关联动作和受控内置事件类型；第一版只持久化配置，不代表运行时事件执行已实现。
    aliases: [节点事件, 按钮事件配置]
    status: specified
    visibility: internal
  - id: term.form-process-builtin-event
    name: 表单流程内置事件
    definition: "表单按钮签署事件可选择的受控内置附加动作。当前可选 FILL_SIGN_FIELD，用于签署成功后填充当前绑定的签名字段；未选择填充时 builtin=NONE，签署本身仍按 BEFORE 事件与认证配置执行。签署事件不等于必须填充字段，认证口径遵循 DEC-0074，不支持自定义 handler。"
    aliases: [内置事件, 填充签名字段事件]
    status: specified
    visibility: internal
  - id: term.production-work-form-event-field-binding
    name: 作业节点事件字段绑定
    definition: 作业流程表单填写节点选定表单模板版本后，将表单流程内置事件绑定到该表单真实稳定 fieldId 的配置；绑定只属于当前作业节点，不回写可复用表单流程版本。
    aliases: [事件字段绑定, 签名字段绑定]
    status: specified
    visibility: internal
  - id: term.rdo-effective-status
    name: RDO 版本当前生效状态
    definition: 版本化业务对象在查询时由 effectiveFrom/effectiveTo 时间窗计算出的用户可见状态；生效时间为空或已到且未超过失效时间时为 ACTIVE，未来生效或已失效时为 EXPIRED，持久化生命周期 status 不参与该投影或引用判断。
    aliases: [版本生效状态, 当前生效状态]
    status: implemented
    visibility: internal
  - id: term.document-version
    name: 文档版本
    definition: 可按任意受控文档分类绑定到工序的具体文档版本，不限于 SOP。
    aliases: [受控文档版本, SOP 文档版本]
    status: implemented
    visibility: internal
  - id: term.operation-binding
    name: 工序绑定
    definition: 产品制程版本中将路线工序节点与 DHR 目录表单及文档版本关联的配置事实。
    aliases: [工序配置, 工序资源绑定]
    status: implemented
    visibility: internal
  - id: term.production-batch
    name: 生产批次
    definition: 工单拆分形成的生产对象在 BATCH 生产形态下的业务称谓；对象保存工单、产品制程版本、对象编号、目标数量、计划起止时间及备注，采用 CREATED、IN_PROGRESS、COMPLETED、EARLY_TERMINATED、CANCELLED 生命周期。质量显示按DEC-0079派生：良品与NG取冻结最终工序，产品报废取全流程本批产品；旧兼容数量列及其默认0不代表实际采集或当前累计。当前首次合法 START 已生成受限生产执行快照及 DHR 上下文；完整通用规则执行依据仍按后续契约建设。
    aliases: [批次, 工单批次]
    status: specified
    visibility: internal
  - id: term.execution-snapshot
    name: 执行快照
    definition: 生产执行使用的版本化依据，用于防止后续配置变更改写历史执行语义。当前生产对象首次合法 START 时，ExecutionSnapshotBuilder 将所选制程、路线、工序表单和文档、匹配作业及其已发布流程和命中规则写入 production_execution.snapshot_json；DHR 同事务另存上下文和目录快照。产品簇参与当前匹配，不等于已有独立冻结的产品簇上下文字段；通用事实、规则版本和求值依据的完整冻结仍待后续执行契约落实。
    aliases: [制程执行快照, 批次执行快照, 作业执行快照]
    status: specified
    visibility: internal
  - id: term.business-rule-runtime
    name: 业务规则运行引擎
    definition: 读取已发布且具备执行契约的结构化规则，对业务事件和事实进行确定性判断并返回允许、阻断或触发结果的运行组件。
    aliases: [规则运行引擎, 本体业务规则运行引擎]
    status: specified
    visibility: internal
  - id: term.transaction-orchestration
    name: 事务编排
    definition: 已废弃的生产业务术语；其原有关于定义、实例、节点、流程推进和动作处理器的业务语义由生产作业及其编排继承。它不指代数据库或框架 transaction。
    aliases: [自定义事务编排, 事务流程编排]
    status: deprecated
    visibility: internal
  - id: term.production-work
    name: 生产作业
    definition: 可被触发并按作业步骤执行的受控生产业务单元，例如清场作业、上料作业；由作业模板、流程版本、实例、步骤与受控动作组成，可被编排、审计和冻结。它是 eDHR 的生产业务术语，不是数据库或框架 transaction；当前仅确认作业骨架和定义身份，不能据此声称作业运行时已经完成。
    aliases: [作业]
    status: specified
    visibility: internal
  - id: term.production-work-definition
    name: 生产作业定义
    definition: 生产作业的可配置模板载体，持久化为 workflow_definition 中 type 为 WORK 的定义，包含名称、编码、描述、流程配置和适用规则。作业模板不以父子业务版本管理；其流程配置单独形成流程版本。删除模板时只以是否存在作业适用规则作为业务阻断条件：有规则禁止删除，无规则则连同草稿、历史和当前已发布流程配置一起删除。不复用旧 TRANSACTION 类型作为对外兼容层；仅本机开发数据库通过新的 Liquibase 迁移归一旧值。
    aliases: [作业模板, WORK 作业定义]
    status: specified
    visibility: internal
  - id: term.production-work-flow-version
    name: 作业流程版本
    definition: 属于一个作业模板的流程配置版本，保存作业节点和连线，可处于草稿、已发布或历史状态。草稿可以编辑和保存，但草稿与已发布流程版本均不可单独删除；删除作业模板时才由系统按适用规则删除门禁统一清理其流程版本。新建作业模板首次进入流程配置时前端临时显示含开始和结束边界节点的 V1 草稿，保存或发布后才落库；临时或首次持久化草稿默认不在开始和结束节点之间创建连线。每个作业模板同一时刻最多保留一个可编辑草稿。首版草稿入口支持表单填写和条件分支节点及其定义；条件节点使用有序 conditionBranches 和唯一 conditionDefaultBranch 配置，每个条件分支独立保存 all/any/not/clause AST、字段目录版本和字段显示快照。条件节点允许多个出口，但每个条件分支和否则分支最多一条线；普通节点和开始节点仍最多一条出口，不支持并行节点。发布后该版本成为当前已发布流程且不可编辑，系统自动创建继承其配置的下一草稿。历史已发布版本可覆盖当前草稿；若不存在草稿，则复制操作创建继承该历史版本配置的下一号草稿。复制不改变已发布历史；当前已发布流程版本是该作业模板对外可用的流程。保存失败不得改变上一次成功保存的版本状态或流程图。已有消息通知和人工确认节点可被画布兼容读取和配置，但不是首版新增入口。节点运行、消息发送、人工任务、条件求值和条件推进不属于当前配置能力。
    aliases: [作业流程版本, 流程版本]
    status: specified
    visibility: internal
  - id: term.production-work-flow-node
    name: 作业流程节点
    definition: 作业流程版本中的图节点配置，表示开始、结束、表单填写或条件节点等流程位置；节点之间的连线属于流程配置关系，不代表生产运行时节点实例或执行状态已经实现。
    aliases: [流程节点, 作业节点]
    status: specified
    visibility: internal
  - id: term.production-work-form-node-business-document-reference
    name: 作业流程业务单据节点引用
    definition: 作业流程表单填写节点面向配置用户展示的业务单据引用；节点内部仍通过 formTemplateVersionId 引用既有表单模板版本，业务单据称谓仅作用于该节点配置界面，不替代表单主数据模块的技术术语。
    aliases: [业务单据引用, 表单填写节点业务单据]
    status: specified
    visibility: internal
  - id: term.production-work-runtime-field-catalog
    name: 作业条件字段目录
    definition: 作业条件配置适配器提供的版本化字段与运算符目录。当前 workConditionAdapter 的 work-runtime-fields-v1 包含 workType、triggerType、sourceType、sourceNumber、executionStatus 五个 string 字段；分支保存目录版本及字段显示快照。该目录是配置契约，不是规则引擎，也不等同于某次运行的事实值快照；真实取值与执行依据按对应运行契约分别核对。
    aliases: [作业运行字段目录]
    status: implemented
    visibility: internal
  - id: term.production-work-flow-edge
    name: 作业流程连线
    definition: 保存于作业流程版本图中的连线，使用 source、target 关联具体节点，并以 sourceHandle 对应条件分支或否则出口。当前每个条件出口最多连接一条向后续节点的线；草稿可以尚未连接，发布须通过出口完整性校验。连线与拥有它的流程版本分别建模。
    aliases: [作业流程边, 作业条件出口连线]
    status: implemented
    visibility: internal
  - id: term.production-work-condition-rule
    name: 作业条件规则
    definition: 条件分支通过公用构建器配置的结构化表达式，使用 all、any、not 组合条件。第一版目录 work-runtime-fields-v1 开放 workType、triggerType、sourceType、sourceNumber、executionStatus 五个 string 字段，支持 equals、not-equals、contains、starts-with、in、is-present、is-null；in 的值为数组。每个分支保存 conditionRule、目录版本和字段显示快照，节点另有唯一默认分支。当前 ProductionExecutionEngine 已有受限取值、求值及推进实现；固定工程值、完整来源和执行审计契约仍按 open-questions 核对，不能等同于通用规则层已验收。
    aliases: [条件规则, 条件规则 AST, 作业条件 AST]
    status: implemented
    visibility: internal
  - id: term.production-work-condition-node
    name: 作业条件节点
    definition: 作业流程中根据有序条件分支选择后续出口的节点配置；包含一个或多个条件分支以及唯一否则分支。画布以纵向主流程展开，统一入口接收入边，分支出口只向后续节点出边。当前受限 WORK 运行已有按分支求值和推进实现；配置语义与完整运行契约及验收仍分别核对。
    aliases: [条件节点, 条件分支节点]
    status: specified
    visibility: internal
  - id: term.production-work-condition-branch
    name: 作业条件分支
    definition: 条件节点中按数组顺序排列的单个分支；独立保存条件 AST、字段目录版本和字段显示快照，拥有最多一条向后续节点输出的动态出口，支持画布快捷添加并连线。当前受限 WORK 运行已按顺序选择首个满足分支；完整取值政策、结果事件和审计契约仍待核对。纵向间距和避免覆盖属于配置交互层推断。
    aliases: [条件分支]
    status: specified
    visibility: internal
  - id: term.production-work-condition-default-branch
    name: 作业条件默认分支
    definition: 条件节点唯一的否则分支；不属于条件规则组、不保存条件 AST，在全部条件分支均未满足时作为后续出口，只向后续节点输出并支持画布快捷添加。当前受限 WORK 运行已有默认出口及推进代码；完整结果和异常审计契约仍待后续功能验证。
    aliases: [否则分支, 默认出口]
    status: specified
    visibility: internal
  - id: term.production-work-applicability-rule
    name: 作业适用规则
    definition: 将一个作业模板应用于全局、指定生产范围或例外排除范围的配置规则。规则只能配置存在当前已发布作业流程版本的模板；无当前已发布流程的模板仍展示但不可选。优先级固定由 ruleType 派生，顺序为 EXCEPTION 例外排除、SCOPED 指定范围、GLOBAL 全局适用；优先级不是用户可输入、修改或选择的字段，客户页面不展示。未来运行期按该顺序自动匹配作业，不在产品或工序配置中手工引用；当前不表示生产运行时已经完成。
    aliases: [作业适用范围, 作业绑定规则, 作业适用规则类型]
    status: specified
    visibility: internal
  - id: term.production-work-instance
    name: 作业实例
    definition: 根据生产上下文和作业适用规则匹配后推进的作业运行对象。当前受限生产执行已在 production_execution 的快照及状态中保存匹配作业、已发布流程和命中规则；独立作业实例模型及其完整生命周期仍属后续设计，不能由现有内嵌状态推定全部完成。
    aliases: [生产作业实例, 作业运行实例]
    status: specified
    visibility: internal
  - id: term.production-work-execution-snapshot
    name: 作业执行快照
    definition: 作业实例创建时形成的不可变执行依据，包含作业模板引用、创建时当前已发布作业流程版本引用、命中的作业适用规则快照和该已发布流程的作业流程配置快照；后续模板、规则和流程变更不回写既有快照。
    aliases: [作业快照, 作业实例快照]
    status: specified
    visibility: internal
  - id: term.action-handler
    name: 动作处理器
    definition: 按受控执行契约完成创建表单、更新状态、写入审计或调用外部系统等确定性副作用的标准处理器或项目插件。
    aliases: [业务动作处理器, 动作插件]
    status: specified
    visibility: internal
  - id: term.ai-delivery-pipeline
    name: Codex 协作交付流程
    definition: 团队使用 Codex 作为产品外部开发与交付工具时，通过仓库化协作契约、业务知识基线、业务决策、decisionPackage 和 Git 版本化资产保持多人对需求、规则、实现与质量标准理解一致的开发治理流程；它不是 eDHR 产品内的页面、服务或生产运行组件。
    aliases: [AI 辅助交付流程, Codex 二开交付流程]
    status: specified
    visibility: internal
  - id: term.requirement-impact-analysis
    name: 本体驱动需求影响分析
    definition: Codex 从已确认需求出发，沿结构化业务知识和实现证据识别直接、传递、潜在、不受影响及兼容迁移范围，并对证据不足的结论明确标记不确定性的研发分析活动。
    aliases: [需求影响分析, 本体驱动影响分析]
    status: specified
    visibility: internal
  - id: term.implementation-evidence-link
    name: 实现证据链接
    definition: 将业务概念、关系、规则、事件、动作或决策连接到领域模块、接口、持久化、页面、审计、测试、快照及下游投影等实现资产的可校验引用。
    aliases: [实现链接, 业务到代码证据链]
    status: specified
    visibility: internal
  - id: term.work-order
    name: 工单
    definition: 生产准备阶段的计划实体，保存必填工单编号、产品和计划数量，以及可选订单编号、计划起止时间、备注、可选或已锁定的产品制程版本、生产模式、生产形态和生命周期状态；创建后即处于 CREATED，CREATED 与 IN_PROCESS 状态均可在剩余计划数量内继续拆分多个生产对象，不存在 RELEASED 发布状态；生产执行中可主动提前结束并进入 EARLY_TERMINATED，区别于正常完成和行政关闭。
    aliases: [生产工单, 工单计划]
    status: specified
    visibility: internal
  - id: term.production-object
    name: 生产对象
    definition: 工单拆分后实际管理的批次或 SN 对象，保存对象编号、生产形态、锁定制程版本、目标数量、计划起止时间、备注和生命周期状态。BATCH的正式产出与质量累计分别按DEC-0078/0079从真实冻结来源解释，不以旧实体良品、NG、报废兼容列的默认0作为真实质量证据，也不据本轮BATCH算法推定SN质量算法已实现。
    aliases: [批次对象, SN 对象, 工单对象]
    status: implemented
    visibility: internal
  - id: term.production-object-early-termination
    name: 生产对象提前结束
    definition: 生产对象处于进行中时由用户主动结束生产，不代表按完整制程正常完工；业务状态统一使用 EARLY_TERMINATED，并保留结束原因。本期确认其关联 DHR 同事务真实终止、保留已保存证据并停止普通执行；运行实现仍待独立验证。工单级主动命令不在本期范围。
    aliases: [批次提前结束, 提前结束, early termination]
    status: specified
    visibility: internal
  - id: term.work-order-early-termination
    name: 工单提前结束
    definition: 工单处于生产中时由用户主动终止剩余生产，不代表全部对象按完整制程正常完成；业务状态统一使用 EARLY_TERMINATED，工单状态机转移及生产对象全部终态后的自动汇总已经实现。用户主动发起的工单级提前结束接口、结束原因，以及对未完成生产对象、活动执行事务和 DHR 的主动级联仍待实现。
    aliases: [生产工单提前结束, 工单强制结束, work order early termination]
    status: specified
    visibility: internal
  - id: term.production-object-lineage
    name: 生产对象父子追溯关系
    definition: 生产对象因批次再拆分、批次转 SN 或返工而形成的来源关系；子对象记录父对象和分配数量，保留制程执行依据、DHR、事务及审计追溯，使历史对象可以解释其来源和数量流向。
    aliases: [父子批次关系, 批次来源关系, 对象谱系]
    status: planned
    visibility: internal
  - id: term.production-batch-management-resplit
    name: 批次管理再拆分
    definition: 在批次管理页面对既有生产批次再次拆分的独立业务能力，与工单创建阶段的初始生产对象拆分分属不同弹窗和生命周期阶段；该能力不纳入当前 MVP，但数据模型需为后续 BATCH 转 BATCH、BATCH 转 SN 和返工子批次扩展保留父子追溯空间。
    aliases: [既有批次再拆分, 批次运营拆分, batch resplit]
    status: planned
    visibility: internal
  - id: term.work-order-production-object-split-dialog
    name: 工单生产对象拆分弹窗
    definition: 工单管理页面用于把工单计划数量首次准备为多个 BATCH 或 SN 生产对象的弹窗；候选对象先进入待提交清单，提交后写入生产对象，不负责既有批次的再次拆分。
    aliases: [工单拆分弹窗, 初始拆分弹窗]
    status: implemented
    visibility: internal
  - id: term.production-batch-resplit-dialog
    name: 批次管理再拆分弹窗
    definition: 批次管理页面用于对既有生产批次执行再次拆分的后续弹窗；它独立于工单生产对象拆分弹窗，需依据父批次状态、剩余可用数量和执行上下文创建子对象并展示父子追溯关系。当前仅保留产品边界和扩展规划，尚未实现。
    aliases: [批次再拆分弹窗, 批次管理拆分弹窗]
    status: planned
    visibility: internal
  - id: term.production-mode
    name: 生产模式
    definition: 当前首版工单与生产对象支持的生产模式，仅允许量产；其值从所选产品制程版本继承。
    aliases: [量产模式]
    status: implemented
    visibility: internal
  - id: term.production-form
    name: 生产形态
    definition: 产品制程版本定义的对象识别形态，当前只支持 BATCH 和 SN；同一工单的全部生产对象必须使用同一种形态。
    aliases: [批次形态, SN 形态, object type]
    status: implemented
    visibility: internal
  - id: term.batch
    name: 批次
    definition: 生产形态为 BATCH 的生产对象，可在工单计划数量范围内拆分。当前页面、服务及数据库按目标数量 > 0 校验；这是实现事实，不足以确认 0 < q < 1 的正式业务资格。原结构化规则 >= 1 与正数量表述的差异由 question.production-batch-quantity-lower-bound 待决，不能从本词条选择下限；数量必填、总量边界和已确认的分配及末批余数要求继续适用。
    aliases: [生产批次]
    status: implemented
    visibility: internal
  - id: term.production-batch-management
    name: 批次管理页面
    definition: 生产准备阶段面向既有 BATCH 生产对象的列表页面；页面复用 ProductionObject 列表投影，支持整行打开详情及数据审计，操作栏不重复提供查看动作。未开工对象可取消，进行中对象可填写原因后提前结束；DHR 图标对所有批次状态显示并按查看权限及实例存在性给出只读档案或提示，点击不创建 DHR。执行详情和流转单打印仍按各自能力边界提供，不得伪造数据。批次管理 MVP 不提供既有 BATCH 再拆分。
    aliases: [批次列表, 生产批次管理]
    status: implemented
    visibility: internal
  - id: term.production-object-execution-detail
    name: 生产对象执行详情
    definition: 从批次管理进入的生产对象执行上下文入口，用于查看生产执行阶段的工序、事务和执行记录。生产工作台已有受限执行实现；本词条专指批次管理的执行详情入口，其开放情况须单独核验，不得将占位入口表示为已有完整执行详情或伪造执行数据。
    aliases: [批次执行详情, 执行记录]
    status: planned
    visibility: internal
  - id: term.production-object-dhr-view
    name: 生产对象 DHR 查看
    definition: 批次管理操作栏常显的关联 DHR 只读查阅入口；无 dhr.instances.view 权限时提示无权，有权限但尚无关联实例时提示尚未生成，有实例时复用 DHR 档案界面只读查看。查询和点击不创建实例；BATCH/SN DHR 仅在首次合法 START 时自动创建。当前工作树已有入口及查询源码，浏览器交互和发布验收尚未据此证明。
    aliases: [批次 DHR, 批记录查看]
    status: implemented
    visibility: internal
  - id: term.serial-number
    name: SN
    definition: 生产形态为 SN 的单件生产对象；首版要求每个 SN 对象的目标数量必须为 1。
    aliases: [序列号, 序号对象]
    status: implemented
    visibility: internal
  - id: term.data-audit-action-category
    name: 数据审计动作类别
    definition: 数据审计在客户页面展示的统一动作分类；生产工单及生产对象只投影“新增”和“修改”，生命周期动作不形成额外客户动作类别。
    aliases: [审计操作类别, 审计动作]
    status: implemented
    visibility: internal
  - id: term.production-object-pending-list
    name: 生产对象待提交清单
    definition: 生产对象手动添加、按数量批量添加或 CSV/XLS/XLSX 导入后，在真正持久化前暂存的候选记录集合；BATCH 导入候选需包含批次号和数量，SN 导入候选需包含 SN 编号，数量由生产形态隐含为 1，计划起止时间及备注可选，清单通过一次批量提交进入生产对象持久化。
    aliases: [批次待提交清单, SN待提交清单, 待添加生产对象]
    status: implemented
    visibility: internal
  - id: term.production-object-batch-submission
    name: 生产对象批量提交
    definition: 将待提交清单中的多个生产对象候选记录一次性提交到服务端事务边界内的标准动作；任一记录校验或持久化失败时整批不应留下部分成功结果。
    aliases: [批次批量添加, 批量拆分生产对象]
    status: implemented
    visibility: internal
  - id: term.production-batch-import-template
    name: 生产对象导入模板（批次/SN）
    definition: 生产对象导入使用的固定列集合；BATCH 形态要求批次号和数量，SN 形态只要求 SN 编号，SN 数量由生产形态隐含为 1，计划开始时间、计划结束时间和备注均为可选字段，支持 CSV、XLS、XLSX 文件。
    aliases: [批次导入模板, SN导入模板, 生产对象导入模板]
    status: implemented
    visibility: internal
  - id: term.process-version-read-only-preview
    name: 制程版本只读预览
    definition: 已关联工单制程版本在拆分阶段的只读引用与详情查看能力；不可改写版本选择，可查看版本元数据、工艺路线、批记录模板和工序配置。
    aliases: [制程版本预览, 锁定制程预览]
    status: implemented
    visibility: internal
  - id: term.audit-change-snapshot
    name: 审计变更快照
    definition: 数据审计事件中用于追溯业务变化的变更前和变更后业务字段快照；创建事件的变更前快照为空对象，更新、取消和关闭事件均应保存真实持久化对象变化前后的字段，不得使用方法参数伪造快照。快照持久化继续使用稳定内部字段和值，客户界面通过共享生产审计映射将已知字段、状态、生产形态和时间转换为中文业务展示；该转换不得改写原始快照或其证据完整性。
    aliases: [变更前后快照, 审计字段快照]
    status: implemented
    visibility: internal
  - id: term.audit-event
    name: 审计事件
    definition: 一次已记录操作的不可变审计记录，具有独立事件标识、受影响对象、原始动作、操作者和发生时间，并可保留变更前后快照。事件与客户页面展示的动作类别分别建模；同一“修改”类别可以对应多次不同事件，分类投影不改写原始事件与快照。
    aliases: [数据审计事件, AuditEvent]
    status: implemented
    visibility: internal
  - id: term.record-correction-request
    name: 表单变更申请
    definition: 针对已完成记录发起的独立受控申请；申请提交新修订，经匹配的已发布审批流程批准后替代当前有效修订。
    aliases: [变更申请, 变更申请单, RecordCorrectionRequest]
    status: specified
    visibility: internal
  - id: term.record-void-request
    name: 表单作废申请
    definition: 针对记录整体无效发起的独立受控申请；批准后作废当前有效修订但不修改字段值。
    aliases: [作废申请单, RecordVoidRequest]
    status: specified
    visibility: internal
  - id: term.correction-revision
    name: 变更修订
    definition: 表单变更产生的完整数据修订，保留基于修订、哈希、生效区间和申请引用；历史修订只读且不可覆盖。
    aliases: [记录修订, CorrectionRevision]
    status: specified
    visibility: internal
  - id: term.record-impact-assessment
    name: 记录影响评估
    definition: 表单变更或作废申请对 DHR、放行、审批完整性和替代记录影响的结构化评估摘要。
    aliases: [影响评估, ImpactAssessment]
    status: specified
    visibility: internal
  - id: term.change-review-task
    name: 记录控制审批任务
    definition: 变更或作废申请在所选审批流程中的当前或历史节点任务；处理结果与签名引用属于任务运行数据。
    aliases: [变更作废审批任务, ChangeReviewTask]
    status: specified
    visibility: internal
  - id: term.record-control-parallel-review-group
    name: 记录控制并行审批组
    definition: 表单变更或作废审批流程中的并行审批结构，由一个并行拆分、两个或更多审批分支及一个并行汇聚组成；首版创建时默认生成两条分支，但分支数量没有固定上限。一个并行组必须在全部分支批准后汇聚，任一分支退回则本轮退回；不允许嵌套并行组或交叉汇聚。
    aliases: [并行审批组]
    status: specified
    visibility: internal
  - id: term.workflow-event-log
    name: 流程事件日志
    definition: 用于展示和排查记录控制审批时间线的业务运行日志概念；阶段一继续由现有 WorkflowActionLog/workflow_action_log 承载，不新建 WorkflowEventLog 第二套表。合规证据另由不可变审计事件保存。
    aliases: [审批流程日志, WorkflowEventLog]
    status: specified
    visibility: internal
  - id: term.execution-custom-form
    name: 执行自定义表单
    definition: 操作员在当前租户范围内选择有效表单模板的明确版本、填写添加原因并确定工序或批次归属后创建的填报表单，创建时冻结所选模板完整执行快照；工序归属绑定所选工序，批次归属在同一批次各工序共享同一个表单及份实例。可配置是否必须在归属对象完工前完成，默认开启；关闭只允许生产先完成，不豁免资料齐套、签名或审批要求。表单模板没有发布生命周期，候选和添加资格不要求 PUBLISHED；作业流程及表单流程的独立发布要求继续适用，不表示现场修改模板结构。
    aliases: [自定义填报表单]
    status: specified
    visibility: internal
  - id: term.execution-active-editor
    name: 表单正在填写人员
    definition: 当前生产对象和工序内实际填写某一表单的用户；同一用户在该表单不同份或多个窗口填写时去重，纯查看人员不计入。
    aliases: [在线协同人数统计对象]
    status: specified
    visibility: internal
  - id: term.production-form-copy
    name: 生产表单份实例
    definition: 同一生产工序表单下由操作员按需新增、独立保存和提交的具体一份填报；份数为该表单已创建实例数，当前序列表示正在查看的份序号。
    aliases: [表单份, 填报份实例]
    status: specified
    visibility: internal
  - id: term.form-field-business-purpose
    name: 表单字段业务用途
    definition: 表单真实字段或实际子表列显式关联的业务含义；通过用途来源映射明确报工、报废等指标，不通过字段名称猜测。当前工序质量和已保存过程参考分别按相应来源与时点累计，良品、NG、报废与明确产出独立；旧字段用途标记属于历史实现来源，不是任意将三项相加为产出的公式。
    aliases: [字段业务用途标识]
    status: implemented
    visibility: internal
  - id: term.production-execution-workspace
    name: 生产执行工作台
    definition: 在一个页面识别批次或SN生产对象，并查看工单、产品配置、工艺路线、eDHR及当前工序的条件、表单、SOP和执行动作的高频生产操作入口。
    aliases: [生产执行]
    status: specified
    visibility: internal
  - id: term.equipment-category
    name: 设备分类
    definition: 对设备类型进行分组的主数据；内置生产设备、检验设备和计量器具，并支持用户自行新增分类。
    aliases: [Equipment Category]
    status: implemented
    visibility: internal
  - id: term.equipment-type
    name: 设备类型
    definition: 注塑机、模温机等某一种类设备，按设备分类组织，与具体单台设备区分维护。
    aliases: [Equipment Type]
    status: implemented
    visibility: internal
  - id: term.equipment
    name: 设备
    definition: 归于某一设备类型的具体单台设备，例如注塑机类型下的注塑机001。
    aliases: [单台设备, Equipment]
    status: implemented
    visibility: internal
