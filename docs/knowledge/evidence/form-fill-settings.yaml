evidence:
  - id: evidence.form-fill-settings-confirmed
    type: document
    path: docs/knowledge/evidence/form-fill-settings-confirmed.md
    description: user-confirmed；两类绑定显式选择模式，共用配置并闭环保存、发布快照与运行。最新确认当前 MVP 不兼容旧数据、旧数据可重造，取消历史回填、新旧双轨兼容和旧数据自动迁移；保留新执行快照不可变、权限及签署校验。尚未独立质量验证，不是实现通过证明。
    visibility: internal
  - id: evidence.form-fill-settings-design
    type: document
    path: docs/knowledge/evidence/form-fill-settings-confirmed.md
    description: inference；缺失模式推导、旧数据开放默认和在途兼容已被最新 user-confirmed 指令撤销，仅保留历史追溯；双模式草稿保留、START 复用及存储仍为工程选择，不等同于新旧双轨兼容。secondary-reference 标明交接包旧兼容内容失效。
    visibility: internal
