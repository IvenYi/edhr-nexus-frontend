    description: user-confirmed；用户确认全局表单实例来源按创建时冻结的业务承载域定义，当前唯一值为 PRODUCTION_EXECUTION/生产执行；工序配置、作业发起和自定义附件只是生产执行内部表单入口类型，不能作为全局来源。冠骋外部源码的原始核对只作为本次决策的交叉线索，其路径不进入仓库证据字段。
