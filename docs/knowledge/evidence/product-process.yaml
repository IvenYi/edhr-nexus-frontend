    description: 建立受控文档版本及通用工序文档版本绑定，迁移旧 SOP 引用。
    visibility: internal
  - id: evidence.migration-0049-dhr-item-binding
    type: database
    path: gmp-platform/backend/src/main/resources/db/changelog/0049-product-process-dhr-item-binding.sql
    description: 为工序表单绑定增加 dhrTemplateItemId 追溯并调整唯一约束。
    visibility: internal
  - id: evidence.migration-0052-document-pages
    type: database
    path: gmp-platform/backend/src/main/resources/db/changelog/0052-product-process-document-pages.sql
    description: 为工序文档版本绑定增加 pageStart 和 pageEnd。
    visibility: internal
  - id: evidence.migration-0053-product-family-process-owner
    type: database
    path: gmp-platform/backend/src/main/resources/db/changelog/0053-product-family-process-owner.sql
    description: 建立产品簇成员表及租户内唯一归属约束；为 product_process 回填并约束 owner_type、owner_id，同时保留历史 product_version_id 兼容性。
    visibility: internal
  - id: evidence.product-modeling-page
    type: code
    path: gmp-platform/frontend/src/pages/master-data/ProductModelingPage.tsx
    description: 产品建模列表页面及制程版本入口；现存通用文档列“SOP 文档”标签差异由 DEC-0001 跟踪。
    visibility: internal
  - id: evidence.product-modeling-workspace-page
    type: code
    path: gmp-platform/frontend/src/pages/master-data/ProductModelingWorkspacePage.tsx
    description: 产品制程版本、路线、DHR、工序表单和文档绑定工作台页面。
    visibility: internal
  - id: evidence.product-process-version-editor
    type: code
    path: gmp-platform/frontend/src/pages/master-data/components/ProductProcessVersionEditorDialog.tsx
    description: 制程版本和工序资源绑定编辑器，显示 required 复选框并校验 PDF 文档页码范围。
    visibility: internal
  - id: evidence.product-process-controller-test
    type: test
    path: gmp-platform/backend/src/test/java/com/zencas/edhr/masterdata/controller/ProductProcessControllerTest.java
    description: 产品来源、并行版本、引用范围、DHR 表单追溯和产品建模控制器行为测试。
    visibility: internal
  - id: evidence.product-family-member-repository-test
    type: test
    path: gmp-platform/backend/src/test/java/com/zencas/edhr/masterdata/repository/ProductFamilyMemberRepositoryTest.java
    description: 产品簇成员租户隔离、单产品唯一归属、产品与产品簇制程所有者查询和 0053 迁移定义约束测试。
