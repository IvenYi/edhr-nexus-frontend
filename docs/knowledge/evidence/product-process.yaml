knowledgeModelVersion: 0.3.12
evidence:
  - id: evidence.business-knowledge-model
    type: document
    path: docs/architecture/business-knowledge-model.md
    description: 产品制程概念、关系、状态投影和规划能力的人类可读架构基线。
    visibility: internal
  - id: evidence.material-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/Material.java
    description: 物料主数据实体，产品建模直接引用其版本记录。
    visibility: internal
  - id: evidence.product-process-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/ProductProcess.java
    description: 产品制程父记录以 ownerType 和 ownerId 表示 PRODUCT 或 PRODUCT_FAMILY 所有者，并保留 productVersionId 兼容历史产品所有者。
    visibility: internal
  - id: evidence.product-process-owner-repository
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/repository/ProductProcessRepository.java
    description: 产品制程仓储同时支持历史 productVersionId 查询和 ownerType、ownerId 所有者查询。
    visibility: internal
  - id: evidence.product-family-member-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/ProductFamilyMember.java
    description: 产品簇成员实体以 tenantId、productFamilyId 和 productId 表示成员关系，并声明产品在租户内唯一归属约束。
    visibility: internal
  - id: evidence.product-family-member-repository
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/repository/ProductFamilyMemberRepository.java
    description: 产品簇成员仓储提供按租户查询产品归属和产品簇成员列表的持久化访问。
    visibility: internal
  - id: evidence.product-family-repository
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/repository/ProductFamilyRepository.java
    description: 产品簇仓储提供按租户和不区分大小写编码查询，用于创建和编辑时的编码唯一性校验。
    visibility: internal
  - id: evidence.product-process-version-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/ProductProcessVersion.java
    description: 产品制程版本实体保存非空 productionMode、productionForm、routeVersionId 和 dhrTemplateVersionId。
    visibility: internal
  - id: evidence.operation-binding-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/ProductProcessOperationBinding.java
    description: 工序绑定实体关联产品制程版本和路线节点标识。
    visibility: internal
  - id: evidence.operation-form-binding-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/ProductProcessOperationFormBinding.java
    description: 工序表单绑定同时保存 dhrTemplateItemId、formTemplateVersionId 和 required 配置。
    visibility: internal
  - id: evidence.operation-document-binding-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/ProductProcessOperationDocumentBinding.java
    description: 工序文档绑定保存 documentVersionId、pageStart 和 pageEnd。
    visibility: internal
  - id: evidence.product-process-request-dto
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/dto/ProductProcessVersionRequest.java
    description: 产品制程保存请求保留 productionMode 和 productionForm，并定义路线、DHR、工序表单和文档版本引用及 PDF 页码字段。
    visibility: internal
  - id: evidence.product-process-controller
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/controller/ProductProcessController.java
    description: 产品来源筛选、制程版本 CRUD、productionMode 校验与审计快照、productionForm 仅允许批次或 SN 的保存校验、引用校验、required 配置持久化和 PDF 页码校验的控制器实现。
    visibility: internal
  - id: evidence.route-version-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/RouteVersion.java
    description: 工艺路线版本实体。
    visibility: internal
  - id: evidence.route-node-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/RouteNode.java
    description: 路线版本中的工序节点实体，包含 routeVersionId 和 nodeKey。
    visibility: internal
  - id: evidence.dhr-template-version-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/template/entity/DhrTemplateVersion.java
    description: DHR 模板版本实体。
    visibility: internal
  - id: evidence.dhr-template-item-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/template/entity/DhrTemplateItem.java
    description: DHR 目录项实体通过 formTemplateVersionId 指向受控表单版本。
    visibility: internal
  - id: evidence.form-template-version-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/template/entity/FormTemplateVersion.java
    description: 表单模板版本实体；持久化 status 默认 DRAFT，但该字段不定义用户可见的 RDO 生效状态。
    visibility: internal
  - id: evidence.document-version-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/entity/DocumentVersion.java
    description: 任意受控文档分类下的文档版本实体。
    visibility: internal
  - id: evidence.migration-0044-product-process-modeling
    type: database
    path: gmp-platform/backend/src/main/resources/db/changelog/0044-product-process-modeling.sql
    description: 建立产品制程、制程版本和三类初始工序绑定表及数量约束；production_form 继续是非空字符串列，未使用数据库枚举或 CHECK 收窄取值。
    visibility: internal
  - id: evidence.migration-0045-document-versions
    type: database
    path: gmp-platform/backend/src/main/resources/db/changelog/0045-document-management-versions.sql
    description: 建立受控文档版本及通用工序文档版本绑定，迁移旧 SOP 引用。
    visibility: internal
  - id: evidence.migration-0049-dhr-item-binding
    type: database
    path: gmp-platform/backend/src/main/resources/db/changelog/0049-product-process-dhr-item-binding.sql
    description: 为工序表单绑定增加 dhrTemplateItemId 追溯并调整唯一约束。
    visibility: internal
  - id: evidence.migration-0052-document-pages
    type: database
    path: gmp-platform/backend/src/main/resources/db/changelog/0052-product-process-document-pages.sql
    description: 为工序文档版本绑定增加 pageStart 和 pageEnd。
    visibility: internal
  - id: evidence.migration-0053-product-family-process-owner
    type: database
    path: gmp-platform/backend/src/main/resources/db/changelog/0053-product-family-process-owner.sql
    description: 建立产品簇成员表及租户内唯一归属约束；为 product_process 回填并约束 owner_type、owner_id，同时保留历史 product_version_id 兼容性。
    visibility: internal
  - id: evidence.migration-0054-product-family-code-case-insensitive
    type: database
    path: gmp-platform/backend/src/main/resources/db/changelog/0054-product-family-code-case-insensitive.sql
    description: 建立产品簇编码在租户内按 LOWER(code) 不区分大小写唯一的数据库约束。
    visibility: internal
  - id: evidence.product-modeling-page
    type: code
    path: gmp-platform/frontend/src/pages/master-data/ProductModelingPage.tsx
    description: 产品建模列表页面及制程版本入口；现存通用文档列“SOP 文档”标签差异由 DEC-0001 跟踪。
    visibility: internal
  - id: evidence.product-modeling-workspace-page
    type: code
    path: gmp-platform/frontend/src/pages/master-data/ProductModelingWorkspacePage.tsx
    description: 产品制程版本、路线、DHR、工序表单和文档绑定兼容工作台页面；生产模式选择已隐藏，新建和复制固定提交量产，编辑保留已存储值，生产方式选项只包含批次和 SN。
    visibility: internal
  - id: evidence.product-process-version-editor
    type: code
    path: gmp-platform/frontend/src/pages/master-data/components/ProductProcessVersionEditorDialog.tsx
    description: 产品和产品簇共享的制程版本与工序资源绑定编辑器；隐藏生产模式选择，新建和复制固定提交量产，编辑保留已存储值，生产方式选项只包含批次和 SN，同时支持 required 复选框和 PDF 文档页码校验。
    visibility: internal
  - id: evidence.process-modeling-page-verification
    type: test
    path: gmp-platform/frontend/scripts/verify-process-modeling-pages.mjs
    description: 前端制程建模聚焦验证脚本，检查生产模式选择不再渲染，新建和复制默认量产，编辑保留已存储值且提交负载仍包含 productionMode；同时检查共享编辑器和兼容工作台的生产方式选项只包含批次和 SN。
    visibility: internal
  - id: evidence.product-process-controller-test
    type: test
    path: gmp-platform/backend/src/test/java/com/zencas/edhr/masterdata/controller/ProductProcessControllerTest.java
    description: 产品来源、产品簇制程所有者 API、并行版本、引用范围、DHR 表单追溯和产品建模控制器行为测试，包括兼容 Controller 拒绝“批次转SN”生产方式。
    visibility: internal
  - id: evidence.product-family-member-repository-test
    type: test
    path: gmp-platform/backend/src/test/java/com/zencas/edhr/masterdata/repository/ProductFamilyMemberRepositoryTest.java
    description: 产品簇成员租户隔离、单产品唯一归属、产品与产品簇制程所有者查询和 0053 迁移定义约束测试。
    visibility: internal
  - id: evidence.product-family-membership-service
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/service/ProductFamilyMembershipService.java
    description: 产品簇成员服务实现合规产品校验、唯一归属、事务性转移及产品、原产品簇和目标产品簇审计；产品簇审计快照保存 memberProductId、memberProductCode 和 memberProductName 内部键。
    visibility: internal
  - id: evidence.process-modeling-controller
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/controller/ProcessModelingController.java
    description: 产品簇 CRUD 要求用户维护编码并校验租户内不区分大小写唯一；历史父状态不投影到列表、详情或审计快照。控制器还实现成员跨簇转移确认、数量投影和关联成员或制程版本删除保护。
    visibility: internal
  - id: evidence.product-family-membership-service-test
    type: test
    path: gmp-platform/backend/src/test/java/com/zencas/edhr/masterdata/service/ProductFamilyMembershipServiceTest.java
    description: 产品簇成员服务覆盖不合规产品拒绝、跨簇普通添加拒绝和事务性转移的三方审计。
    visibility: internal
  - id: evidence.process-modeling-controller-test
    type: test
    path: gmp-platform/backend/src/test/java/com/zencas/edhr/masterdata/controller/ProcessModelingControllerTest.java
    description: 产品簇编码必填、租户内不区分大小写唯一、同记录编码更新、父状态审计投影排除、删除保护、成员转移确认及列表数量投影的控制器测试。
    visibility: internal
  - id: evidence.process-owner-type
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/dto/ProcessOwnerType.java
    description: 制程所有者枚举定义 PRODUCT 与 PRODUCT_FAMILY 两种共享制程归属类型。
    visibility: internal
  - id: evidence.product-process-owner-service
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/service/ProductProcessOwnerService.java
    description: 统一产品和产品簇制程根、版本、工序表单和文档配置的读取与 CRUD，保留 productionMode 校验、持久化和审计快照字段，并将 productionForm 保存值限定为批次或 SN；同时实现版本号去重及引用校验，工序引用的表单模板版本只按 RdoVersionStatusResolver 的 effectiveFrom/effectiveTo 生效时间窗判断，产品簇制程版本状态和审计快照也按有效期计算。
    visibility: internal
  - id: evidence.product-process-resolution-service
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/service/ProductProcessResolutionService.java
    description: 按查询时间解析可用制程版本，优先产品；产品无可用版本时回退产品簇并返回固定提示；两者均不可用时阻断。
    visibility: internal
  - id: evidence.product-process-owner-service-test
    type: test
    path: gmp-platform/backend/src/test/java/com/zencas/edhr/masterdata/service/ProductProcessOwnerServiceTest.java
    description: 覆盖产品和产品簇独立制程根、同一所有者版本号不区分大小写去重、产品簇新增制程版本时写入对应的产品簇审计快照，以及共享 OwnerService 拒绝“批次转SN”生产方式。
    visibility: internal
  - id: evidence.product-process-resolution-service-test
    type: test
    path: gmp-platform/backend/src/test/java/com/zencas/edhr/masterdata/service/ProductProcessResolutionServiceTest.java
    description: 覆盖产品制程优先、产品无可用版本时回退产品簇及双方均不可用时阻断。
    visibility: internal
  - id: evidence.product-family-modeling-page
    type: code
    path: gmp-platform/frontend/src/pages/master-data/ProductFamilyModelingPage.tsx
    description: 产品簇建模页面的父子版本管理、成员入口、详情审计及全屏共享制程版本编辑器实现；审计投影隐藏 id 和 productProcessId，并将成员关系、制程版本和工序配置快照字段映射为中文业务标签。
    visibility: internal
  - id: evidence.product-family-modeling-api
    type: code
    path: gmp-platform/frontend/src/api/product-family-modeling.ts
    description: 产品簇 CRUD、成员批量添加、转移和移除的前端 API 访问层。
    visibility: internal
