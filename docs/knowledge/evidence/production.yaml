knowledgeModelVersion: 0.3.25
evidence:
  - id: evidence.production-work-order-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/entity/WorkOrder.java
    description: original-evidence；当前WorkOrder保存工单编号、订单编号、产品、生产形态/模式、计划数量、计划时间、备注、状态及提前结束原因时间；已移除制程版本字段。MVP初始化直接移除旧列与约束，不保留退役兼容读取。
    visibility: internal
  - id: evidence.production-object-entity
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/entity/ProductionObject.java
    description: 生产对象保存工单、对象编号、BATCH/SN形态、对象独立制程引用、目标数量、计划时间、备注和状态；未开工引用可修改，首次START后固定。批次复用BATCH，不新增实体。
    visibility: internal
  - id: evidence.production-service
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/ProductionService.java
    description: original-evidence；当前split每对象显式选版，只锁定工单生产形态；updateObject在工单→对象锁下校验CREATED、无执行实例、父工单活动、数量增量及当前制程资格。requireApplicableProcess用于已有引用及首START，区分产品优先候选和既有簇引用。allocatedQuantity排除CANCELLED，正常完成要求全量分配且未取消对象全部完成；endOrder须无未结束子对象、原因必填，不级联。实际运行另见本轮证据。
    visibility: internal
  - id: evidence.production-object-status-machine
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/engine/ProductionObjectStatusMachine.java
    description: 生产对象状态机配置，定义 CREATED->IN_PROGRESS、IN_PROGRESS->COMPLETED、IN_PROGRESS->EARLY_TERMINATED 和 CREATED->CANCELLED 的合法转移。
    visibility: internal
  - id: evidence.work-order-status-machine
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/engine/WorkOrderStatusMachine.java
    description: 原始状态机含CREATED->IN_PROCESS/COMPLETED/CANCELLED、IN_PROCESS->COMPLETED/EARLY_TERMINATED、COMPLETED->CLOSED；本轮加入CREATED->EARLY_TERMINATED。正常自动完成仍受服务层全计划分配与有效批次完成条件限制，不因存在CREATED->COMPLETED边就允许绕过；无RELEASED。
    visibility: internal
  - id: evidence.work-order-controller
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/controller/WorkOrderController.java
    description: 工单CRUD不接收制程字段；CREATED按是否曾拆批限制产品/编号，计划量不得小于有效分配；手动end要求所有子对象先终态及必填原因并写审计。工单单条读取接受production.work-orders或production.batches以支持批次编辑；列表及工单写命令仍只接受production.work-orders。源码不代替实际接口测试。
    visibility: internal
  - id: evidence.production-object-controller
