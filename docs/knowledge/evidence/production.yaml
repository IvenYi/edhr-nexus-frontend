    visibility: internal
  - id: evidence.guancheng-batch-lifecycle-source
    type: document
    path: docs/knowledge/evidence/guancheng-batch-lifecycle-source.md
    description: 冠骋原始源码核对记录：批次开工初始化路由执行与事务追溯；拆分创建 waiting 批次并回写工单数量；未开始删除恢复工单数量、移除 DHR/表单和批次数据；进行中结束写入 ended、结束原因、结束事务并作废 DHR，且级联关闭子 SN/返工批次；正常完工更新批次、DHR、放行单和工单状态。
    visibility: internal
