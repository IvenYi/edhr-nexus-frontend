    description: 原始源码 StartOfContainer.java 的开工行为：初始化路由节点执行记录和当前工序，执行批次开工事务并建立主题追溯关系，最后把状态更新为 running。
    visibility: internal
  - id: evidence.guancheng-batch-close-source
    type: document
    path: docs/knowledge/evidence/guancheng-batch-lifecycle-source.md
    description: 原始源码 ContainerCloseBs.java、SnCloseBs.java 和 EdhrInstService.java 的结束行为：进行中批次写入 ended、完成日期和结束原因，关闭活动事务，作废 DHR，并级联关闭子 SN/返工批次。
    visibility: internal
  - id: evidence.guancheng-batch-remove-source
    type: document
    path: docs/knowledge/evidence/guancheng-batch-lifecycle-source.md
    description: 原始源码 RemoveOfContainer.java 的删除行为：仅允许 waiting 批次，校验有效事务实例后回滚工单批次计数与数量，删除无效事务和 DHR/表单实例，写入删除事务并删除或恢复批次历史快照。
    visibility: internal
  - id: evidence.guancheng-batch-split-source
    type: document
    path: docs/knowledge/evidence/guancheng-batch-lifecycle-source.md
    description: 原始源码 MfgOrderSplitContainerBs.java 的拆分行为：校验工单剩余数量，初始化批次的工艺、首工序、DHR/放行模板和打印记录，保存批次工作创建事务及主题追溯，并回写工单已创建批次数量与未生产数量。
    visibility: internal
  - id: evidence.guancheng-batch-complete-source
    type: document
    path: docs/knowledge/evidence/guancheng-batch-lifecycle-source.md
    description: 原始源码 ContainerWorkCompleteBs.java 的完工行为：按工序推进路由，最后工序写入 CONTAINER_COMPLETE 并置 finished，更新 DHR 物料运行状态，条件满足时创建产品放行单，清理执行任务并更新工单完成状态。
    visibility: internal
  - id: evidence.production-object-early-termination-gap
    type: code
    path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/engine/ProductionObjectStatusMachine.java
