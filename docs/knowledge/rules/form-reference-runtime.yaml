knowledgeModelVersion: 0.3.25
rules:
  - id: rule.form-reference-runtime
    name: 引用配置在模拟与正式填报中生效
    status: implemented
    visibility: internal
    trigger: form.reference.query-or-fill-or-submit
    scope: form-reference-runtime
    condition: {fact: fact.form-field.type, operator: equals, value: reference}
    result:
      type: allow-with-governance
      actions: [query-reference-options, select-reference-record, validate-reference-on-submit]
      configuration: [source, candidate-scope, display-field, query-conditions, explicit-dictionary-scope]
      contexts: [main-form, dynamic-subtable-row]
      preserveContracts: [source-authorization, frozen-template-version, signature, audit]
    explanation: user-confirmed；引用字段须在模拟和正式填报按配置生效，覆盖主表与动态子表，并在正式提交验证引用有效性。DEC-0082-14明确新字典引用须显式选择具体业务字典，查询和选值校验共用范围；不把跨字典混查解释为完整新配置。DEC-0082-15统一物料及生产批次/SN入口，默认全部适用候选、可按需限定范围，保持真实身份、用途适配和旧冻结解释；仅物料产品范围可以显式带入当前产品。DEC-0082-16要求来源或范围改变后保留并标明不适用条件，修正或移除前阻止当前设计保存，不新增其他草稿完整性门禁。具体ID键、typeConfig归一化、旧控件兼容、四种比较和AND组合、缺值处理、SQL映射及未配置提示是工程实现，不改变原右值语义或扩展用途；不回写历史。既有implemented/internal成熟度保持，新增15/16为specified/internal；本轮实现、运行与独立质量另取当前证据，不据此宣称所有来源已部署或发布。
    evidenceIds: [evidence.form-reference-user-confirmed, evidence.form-reference-runtime-design, evidence.form-reference-original-boundary, evidence.form-reference-lookup-implementation, evidence.form-reference-frozen-config-implementation, evidence.form-reference-preview-controller, evidence.form-reference-frontend-config, evidence.form-reference-runtime-control, evidence.form-reference-lookup-tests, evidence.form-reference-config-tests, evidence.form-reference-production-integration-tests, evidence.form-reference-frontend-tests, evidence.reference-dictionary-correction, evidence.reference-source-unification]
