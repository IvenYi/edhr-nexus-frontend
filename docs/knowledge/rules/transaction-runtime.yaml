knowledgeModelVersion: 0.3.25
rules:
  - id: rule.transaction.published-version-only
    name: 事务运行只读取已发布版本
    status: deprecated
    visibility: internal
    trigger: transaction.instance.start
    scope: transaction-runtime
    condition:
      all:
        - fact: transactionDefinition.status
          operator: equals
          value: published
    result:
      type: planned-transaction-trigger
      versionSource: published-transaction-definition
      freezeReference: true
    explanation: 事务运行只能基于已发布事务定义创建实例，并冻结所用版本引用；未发布草稿不得进入生产运行。
    evidenceIds: [evidence.ai-transaction-runtime-architecture]
  - id: rule.production-work.published-version-only
    name: 作业运行只读取已发布版本
    status: specified
    visibility: internal
    trigger: production-work.instance.start
    scope: production-work-runtime
    condition:
      all:
        - fact: productionWorkDefinition.type
          operator: equals
          value: WORK
        - fact: productionWorkFlowVersion.status
          operator: equals
          value: PUBLISHED
    result:
      type: planned-production-work-trigger
      versionSource: published-production-work-flow-version
      freezeReference: true
    explanation: 未来作业运行只能基于 type 为 WORK 的作业模板所拥有的已发布作业流程版本创建实例，并冻结所用流程版本引用；未发布草稿不得进入生产运行。该 specified 规则是运行时实现的目标约束，不表示当前作业运行时、实例推进、审计或执行契约已经完成。
    evidenceIds: [evidence.ai-transaction-runtime-architecture]
  - id: rule.production-work.applicability-resolves-published-flow
    name: 作业适用规则解析当前已发布流程
    status: specified
    visibility: internal
    trigger: production-work.applicability.resolve
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkApplicabilityRule.isApplicable
          operator: equals
          value: true
        - fact: productionWorkDefinition.hasPublishedFlowVersion
          operator: equals
          value: true
    result:
      type: resolve-published-production-work-flow
      definitionSource: productionWorkApplicabilityRule.definitionId
      flowVersionSource: productionWorkDefinition.currentPublishedFlowVersionId
      freezeReferenceAt: production-work-instance.create
      applicabilityRulePrioritySource: productionWorkApplicabilityRule.ruleType
      applicabilityRulePriorityOrder: [EXCEPTION, SCOPED, GLOBAL]
      userMayProvidePriority: false
      customerMaySeePriority: false
    explanation: 适用规则引用作业模板，由系统按 EXCEPTION、SCOPED、GLOBAL 的固定优先级匹配当前上下文，并解析模板当前已发布流程；草稿和历史流程不作为新实例目标，优先级不供用户输入或展示。作业实时匹配，后续工序创建实例时保存所选规则、匹配事实及已发布图；已创建实例即使失配仍保留，批次首次START不固定后续候选。完整独立实例及通用执行契约仍待建设；保持specified，不由源码存在推定本轮运行通过。
    evidenceIds:
    - evidence.ai-transaction-runtime-architecture
    - evidence.business-knowledge-model
    - evidence.production-work-template-configuration-controller
    - evidence.production-work-template-configuration-test
    - evidence.production-execution-snapshot-builder-source
    - evidence.production-execution-service-source
    - evidence.production-execution-engine-source
  - id: rule.production-work.template-delete-when-no-applicability-rule
    name: 无适用规则时允许删除作业模板
    status: implemented
    visibility: internal
    trigger: production-work.template.delete
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkApplicabilityRule.count
          operator: greater-than-or-equal
          value: 1
    result:
      type: block
      reason: production-work-template-has-applicability-rule
      allowedWhen: productionWorkApplicabilityRule.count == 0
      versionsDoNotAffectDecision: true
    explanation: 本条约束配置删除入口；当前受限生产执行已有独立实现，不改变这里按适用规则引用进行的删除判定。删除作业模板时只检查该模板是否存在任何作业适用规则；存在一条或多条规则即禁止删除，无论模板是否存在草稿、历史流程或当前已发布流程。没有任何作业适用规则时，允许在同一事务中删除作业模板及其全部流程配置。该规则替代仅因存在已发布流程而禁止删除父作业模板的历史语义。
    evidenceIds: [evidence.ai-transaction-runtime-architecture, evidence.production-work-template-configuration-controller, evidence.production-work-template-configuration-test]
  - id: rule.production-work.applicability-requires-current-published-flow
    name: 作业适用规则只允许配置当前已发布流程作业
    status: specified
    visibility: internal
    trigger: production-work.applicability-rule.save
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkDefinition.selected
          operator: equals
          value: true
        - fact: productionWorkDefinition.hasPublishedFlowVersion
          operator: equals
          value: false
    result:
      type: block
      reason: production-work-definition-has-no-current-published-flow
      customerMessage: 该作业尚未发布作业流程版本
      selectorVisibility: visible-but-disabled
      selectorCanBeSubmitted: false
    explanation: 作业适用规则只能保存到存在当前已发布作业流程版本的作业模板。没有当前已发布流程的作业仍在选择器中展示，但不可选，并提示“该作业尚未发布作业流程版本”；草稿和历史流程不能满足该准入条件。
    evidenceIds: [evidence.production-work-template-configuration-controller, evidence.production-work-applicability-dialog-ui, evidence.production-work-template-configuration-test]
  - id: rule.production-work.instance-auto-matches-applicability
    name: 生产作业实例按适用规则自动匹配
    status: specified
    visibility: internal
    trigger: production-work.instance.create
    scope: production-work-runtime
    condition:
      all:
        - fact: productionWorkApplicabilityRule.matchContext
          operator: is-present
          value: true
        - fact: productionWorkDefinition.hasPublishedFlowVersion
          operator: equals
          value: true
    result:
      type: planned-production-work-trigger
      selectionSource: production-work-applicability-rule
      ruleTypeOrder: [EXCEPTION, SCOPED, GLOBAL]
      manualProductOperationReference: forbidden
      flowVersionSource: productionWorkDefinition.currentPublishedFlowVersionId
      contractTarget: production-work-runtime.applicability-match.v1
      contractInputs: [productionObject, productId, productFamilyId, operationId, effectiveApplicabilityRules]
      contractOutputs: [matchedApplicabilityRule, selectedProductionWorkDefinition, currentPublishedFlowVersion]
      deterministic: true
      contextTiming: current-at-match
      newlyMatchedWorkScope: subsequent-operations-only
      backfillPassedOperations: false
      preserveExistingInstances: true
    explanation: 按当前生产对象、产品、产品簇及实际工序自动匹配，顺序为EXCEPTION、SCOPED、GLOBAL；不手工引用作业。产品转簇可改变后续工序候选，已过站不补做，已有实例失配仍保留。当前OPERATION_START工程边界为PENDING查询预览、合法START事务重新匹配创建缺失实例，IN_PROGRESS/COMPLETED不补入；GET不落库，不以批次首次START固定所有后续候选。新实例使用创建时当前已发布流程；result.contractTarget仍描述通用目标接口，不代表同名独立handler或完整注册已存在。
    evidenceIds:
    - evidence.ai-transaction-runtime-architecture
    - evidence.business-knowledge-model
    - evidence.production-execution-snapshot-builder-source
    - evidence.production-execution-service-source
    - evidence.production-execution-engine-source
  - id: rule.production-work.instance-freezes-work-and-rule-snapshot
    name: 创建作业实例时冻结作业与适用规则执行快照
    status: specified
    visibility: internal
    trigger: production-work.instance.create
    scope: production-work-runtime
    condition:
      all:
        - fact: productionWorkMatch.matched
          operator: equals
          value: true
        - fact: productionWorkDefinition.hasPublishedFlowVersion
          operator: equals
          value: true
    result:
      type: freeze-execution-snapshot
      contractTarget: production-work-runtime.instance-create-and-freeze.v1
      contractInputs: [productionObject, matchedApplicabilityRule, selectedProductionWorkDefinition, currentPublishedFlowVersion]
      contractOutputs: [productionWorkInstance, immutableProductionWorkExecutionSnapshot]
      freezeAt: production-work-instance.create
      fields: [productionWorkDefinitionId, publishedProductionWorkFlowVersionId, applicabilityRuleSnapshot, matchContext, productionWorkFlowConfigurationSnapshot]
      templateReference: productionWorkMatch.definitionId
      flowVersionReference: productionWorkDefinition.currentPublishedFlowVersionId
      applicabilityRuleSnapshotSource: matched-production-work-applicability-rule
      flowConfigurationSnapshotSource: current-published-production-work-flow-version
      immutableAfterCreate: true
      retainOnApplicabilityMismatch: true
      retainBeforeFirstBusinessNode: true
    explanation: 作业实例创建时冻结模板、当时已发布流程、命中规则、匹配事实和流程配置。已创建实例包括尚未执行业务节点的实例，均保持原批次归属、图、表单及进度；转簇、失配或发布不移除或重置。当前嵌入实现以state中的works状态识别实例，snapshot中的候选计划单独不算实例；制程快照冻结与作业实例冻结分开。独立实例完整规则修订上下文和通用执行注册仍未闭环；此result为目标契约，不将局部实现当全部目标已验收。
    evidenceIds:
    - evidence.ai-transaction-runtime-architecture
    - evidence.business-knowledge-model
    - evidence.production-execution-snapshot-builder-source
    - evidence.production-execution-service-source
    - evidence.production-execution-engine-source
  - id: rule.production-work.template-configuration-audited
    name: 作业模板配置变更需要审计
    status: implemented
    visibility: internal
    trigger: production-work.template-configuration.change
    scope: production-work-template-configuration
    condition:
      any:
        - fact: productionWorkChange.subject
          operator: in
          value: [definition, flow-version, applicability-rule]
    result:
      type: write-audit-record
      auditSubjects: [production-work-definition, production-work-flow-version, production-work-applicability-rule]
      includeBeforeAfter: true
    explanation: 新增、编辑或删除作业模板、作业流程版本或作业适用规则时，配置接口记录可追溯的审计事件及变更前后快照。发布时同时记录已发布版本、原当前版本（如有）及自动创建的继承草稿；历史版本复制到草稿时记录来源版本、目标草稿和覆盖前后快照。既有无审计作业的历史基线导入由独立规则约束；该 implemented 规则不表示生产运行时审计、作业实例审计或历史基线迁移已经完成。
    evidenceIds: [evidence.ai-transaction-runtime-architecture, evidence.production-work-template-configuration-controller, evidence.production-work-template-configuration-test]
  - id: rule.production-work.flow-version-lifecycle
    name: 作业流程版本草稿生命周期
    status: implemented
    visibility: internal
    trigger: production-work.flow-version.change
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkDefinition.persisted
          operator: equals
          value: true
    result:
      type: manage-production-work-flow-draft
      initialDraftVersionNumber: 1
      maximumEditableDrafts: 1
      publishCreatesInheritedDraft: true
      publishedVersionEditable: false
      draftVersionEditable: true
      draftVersionSavable: true
      draftVersionDeletable: false
      publishedVersionDeletable: false
      historicalVersionCopyTarget: current-draft-or-next-draft
      copyWithoutDraftCreatesNextDraft: true
    explanation: 新建作业模板进入流程配置时，前端临时生成空的 V1 草稿；该临时草稿只显示开始和结束节点，两个边界节点之间默认不创建连线。用户保存或发布时才创建流程版本记录。每个作业模板同一时刻只能存在一个可编辑草稿，草稿可以继续编辑和保存，但不能单独删除；已发布流程版本不可编辑且不能单独删除。发布后该版本成为当前已发布流程，同时系统创建继承其节点、连线和节点配置的下一草稿。历史已发布流程在存在草稿时复制到当前草稿并覆盖其配置但不改变草稿版本号；若不存在草稿，复制操作创建继承来源配置的下一号草稿。复制不改变已发布历史。作业模板删除由独立的适用规则删除门禁决定：存在任何适用规则时禁止删除；没有适用规则时，无论草稿、历史或当前已发布流程是否存在，都允许在同一事务中删除模板及其流程配置。当前代码和控制器测试已覆盖生命周期主路径；保存异常回滚和重新读取恢复仍缺少独立集成测试，不据此扩展为运行时能力。
    evidenceIds: [evidence.production-work-template-configuration-controller, evidence.production-work-flow-editor-ui, evidence.production-work-template-configuration-test, evidence.production-work-flow-version-draft-persistence]
  - id: rule.production-work.flow-version-single-delete-forbidden
    name: 作业流程版本不可单独删除
    status: implemented
    visibility: internal
    trigger: production-work.flow-version.delete
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.deleteRequested
          operator: equals
          value: true
    result:
      type: block
      reason: production-work-flow-version-single-delete-forbidden
      forbiddenStatuses: [DRAFT, PUBLISHED, HISTORICAL]
      allowedCleanupPath: production-work.template.delete
      cleanupRequiresNoApplicabilityRule: true
    explanation: 草稿、当前已发布版本和历史流程版本均不能通过流程版本接口单独删除。需要清理流程版本时，只能在作业模板删除已通过“无任何适用规则”门禁后，由系统在同一事务中级联清理；这不等价于开放流程版本删除。当前控制器统一阻断版本删除，测试覆盖已发布版本和草稿版本两条阻断路径。
    evidenceIds: [evidence.production-work-flow-version-draft-persistence, evidence.production-work-template-configuration-controller, evidence.production-work-template-configuration-test]
  - id: rule.production-work.flow-version-draft-save-persistence
    name: 作业流程草稿保存必须持久化
    status: implemented
    visibility: internal
    trigger: production-work.flow-version.draft-save
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.status
          operator: equals
          value: DRAFT
        - fact: productionWorkFlowVersion.saveRequested
          operator: equals
          value: true
    result:
      type: persist-flow-configuration
      persists: [nodes, edges, node-configuration]
      target: productionWorkFlowVersion
      preserveLastSavedStateOnFailure: true
      savedStateChangesOnlyOnSuccessfulCommit: true
    explanation: 可编辑草稿保存成功后将节点、连线和节点配置写入该草稿；首次进入新作业流程配置的临时 V1 草稿在首次保存或发布时才创建版本记录。当前控制器测试覆盖成功保存、边界校验失败不保存以及 UPDATE 审计；前端保存失败时保留待保存状态。真实数据库重新读取和保存异常回滚仍缺少独立集成测试；该规则不表示运行时执行或生产实例快照已实现。
    evidenceIds: [evidence.production-work-flow-version-draft-persistence, evidence.production-work-template-configuration-test]
  - id: rule.production-work.flow-version.draft-save-defers-publish-validation
    name: 作业流程草稿保存不执行发布完整性门禁
    status: specified
    visibility: internal
    trigger: production-work.flow-version.draft-save
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.status
          operator: equals
          value: DRAFT
        - fact: productionWorkFlowVersion.saveRequested
          operator: equals
          value: true
    result:
      type: persist-flow-configuration
      allowedIncompleteDraft: true
      skips: [required-form-version, graph-connectivity]
      retainsBasicDataIntegrityChecks: true
      validationFeedbackPersistence: transient-only
    explanation: 草稿保存允许表单填写节点暂未选择生效表单版本，也允许未形成完整开始至结束连通图；保存仍执行节点、连线和数据格式的基础完整性检查。当前 WorkTemplateEditor.saveDraft 直接保存，完整 validatePublish 只在发布入口调用，后端保存执行边界和普通节点出口校验。WorkTemplateControllerTest 已有不完整草稿可保存的断言，不能再写成前端仍待移除发布校验。保持本记录原 specified 成熟度；真实数据库回读与保存异常回滚未由本次静态审读证明。
    evidenceIds: [evidence.production-work-flow-editor-ui, evidence.production-work-template-configuration-controller, evidence.production-work-flow-version-draft-persistence]
  - id: rule.production-work.flow-version.publish-integrity-validation
    name: 作业流程版本发布完整性校验
    status: specified
    visibility: internal
    trigger: production-work.flow-version.publish
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.status
          operator: equals
          value: DRAFT
        - fact: productionWorkFlowVersion.publishRequested
          operator: equals
          value: true
    result:
      type: block
      validations:
        formNodes:
          requiredReference: formTemplateVersionId
          effectiveWindow:
            operator: is-referenceable
            value: true
          resolver: RdoVersionStatusResolver
          statusSource:
          - effectiveFrom
          - effectiveTo
          persistedStatusParticipates: false
        graph:
          exactlyOneBoundaryNode:
          - START
          - END
          edgeNodeReferencesMustExist: true
          selfEdgesForbidden: true
          duplicateOutgoingEdgesForbidden: true
          ordinaryNodeMaximumOutgoingEdges: 1
          everyNonStartNodeRequiresIncomingEdge: true
          everyNonEndNodeRequiresOutgoingEdge: true
          everyNodeMustBeReachableFromStart: true
          everyNodeMustReachEnd: true
        conditionBranchCompleteness: every-condition-and-default-branch-requires-one-outgoing-edge-at-publish
      failureFeedback:
        invalidNodeBorder: red
        nodeMessage: true
        persistence: transient-only
      onSuccess: publish-current-draft-as-read-only
    explanation: 发布将草稿变为对外可用且只读配置：表单版本按 RDO 生效时间窗校验，持久化 status 不参与该引用判断；校验节点引用、开始/结束边界、自连线、重复出口、普通节点单出口及全图连通。DEC-0011 及 validatePublishableConditionRules 已要求每个条件分支和唯一默认分支在发布时各有一条出口，不再把这一配置完整性要求写成等待完整运行契约。草稿可保留未连出的分支；失败反馈只用于节点红框及消息，不写入业务 AST/快照。现有代码和测试源码范围已核对，本次未运行数据库或生产场景。
    evidenceIds: [evidence.production-work-flow-editor-ui, evidence.production-work-template-configuration-controller, evidence.production-work-template-configuration-test, evidence.rdo-version-status-resolver, evidence.template-modeling-rdo-status-projection, evidence.form-template-version-persisted-status-default, evidence.product-process-owner-service]
  - id: rule.rdo.version-effective-status
    name: RDO 版本状态与引用资格按有效时间窗计算
    status: implemented
    visibility: internal
    trigger: rdo.version.read-or-reference
    scope: rdo-version-governance
    condition:
      all:
        - fact: rdoVersion.effectiveWindow
          operator: is-referenceable
          value: true
    result:
      type: compute-rdo-version-status
      resolver: RdoVersionStatusResolver
      fields: [effectiveFrom, effectiveTo]
      referenceableStatus: ACTIVE
      persistedStatusParticipates: false
    explanation: 版本化 RDO 的用户可见状态和可被其他配置引用的资格统一由 effectiveFrom/effectiveTo 时间窗计算；持久化 status 可保留为生命周期或兼容字段，但不得改变状态投影或引用判断。
    evidenceIds: [evidence.rdo-version-status-resolver, evidence.template-modeling-rdo-status-projection, evidence.form-template-version-persisted-status-default, evidence.product-process-owner-service]
  - id: rule.production-work.flow-canvas-configuration
    name: 作业流程画布配置边界
    status: specified
    visibility: internal
    trigger: production-work.flow-version.draft-edit
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.status
          operator: equals
          value: DRAFT
    result:
      type: persist-flow-configuration
      boundaryNodes:
      - START
      - END
      configurableNodeTypes:
      - FORM
      - CONDITION
      legacyReadableNodeTypes:
      - NOTIFICATION
      - CONFIRMATION
      formReferenceSource: form-template-modeling
      conditionBranchHandles: dynamic-condition-branches-and-default
      conditionBranchStructure: ordered-condition-branches-with-default
      conditionRuleBuilder:
        status: implemented
        astShape: semantic-condition-expression
        groupOperators:
        - all
        - any
        - not
        recursiveGroups: true
        supports:
        - condition-group-editing
        - add-remove-condition
        - type-validation
        - summary
        - read-only-display
        fieldCatalog: work-runtime-fields-v1
        fields:
        - workType
        - triggerType
        - sourceType
        - sourceNumber
        - executionStatus
        fieldTypes:
        - string
        - string
        - string
        - string
        - string
        operators:
        - equals
        - not-equals
        - contains
        - starts-with
        - in
        - is-present
        - is-null
        multiValueOperator: in
        multiValueValueType: array
        fieldSnapshotPersisted: true
        businessValidation: publish-time
        conditionEvaluation: limited-production-execution-slice
      runtimeExecution:
        status: partial
        scope: production-execution-embedded-WORK
        genericExecutionContract: pending
        freeTextIsSoleFact: forbidden
      draftInteractions:
        directionQuickAdd: true
        quickAddNodeTypes:
        - FORM
        - CONDITION
        quickAddCreatesEdge: true
        manualConnection: true
        conditionNodeInput: unified-entry-only
        conditionBranchHandles: source-only
        conditionDefaultBranchHandle: source-only
        conditionBranchAsConnectionTarget: forbidden
        conditionBranchMaximumOutgoingEdges: 1
        conditionDefaultBranchMaximumOutgoingEdges: 1
        conditionNodePanelCreatesNodes: false
        primaryLayoutDirection: vertical
        conditionBranchLayoutDirection: vertical
        layoutSpacingAndOverlapAvoidance: implementation-inferred
        gridSnap: true
        alignmentGuides: true
        autoLayout: true
        autoLayoutChanges:
        - node-position
        autoLayoutMarksDraftDirty: true
      runtimeExecutionIncluded: false
    explanation: 作业流程草稿画布自动提供不可删除的开始和结束边界节点；新建的临时或首次持久化草稿默认不在两个边界节点之间创建连线，用户需通过快捷添加或手动连接建立流程关系。首版新增入口支持表单填写和条件分支节点，并在右侧面板编辑节点定义；条件节点由有序 conditionBranches 和唯一 conditionDefaultBranch 组成，每个条件分支及否则分支各自拥有最多一条出口。条件节点只通过统一入口接收入边，条件分支和否则分支出口只能作为连接源，不能作为连接目标；节点配置面板不负责新增节点，节点新增统一通过画布快捷交互完成。作业流程及条件分支以纵向配置为主，具体间距和避免覆盖属于实现层推断。表单节点引用现有表单建模数据。条件规则构建器已完成递归条件组交互和 all/any/not/clause 语义 AST，支持条件增删、类型校验、摘要和只读展示；作业适配器第一版开放 workType、triggerType、sourceType、sourceNumber、executionStatus 五个 string 字段，目录版本为 work-runtime-fields-v1，支持 equals、not-equals、contains、starts-with、in、is-present、is-null，in 使用数组值。条件节点确认后保存 AST、字段目录版本和字段快照；后端已实现配置层发布前校验 AST 结构、字段白名单、目录版本、字段快照、条件分支完整性和动态出口。该配置证据本身不证明生产运行；后续 ProductionExecutionEngine 已有嵌入 WORK 的受限五字段求值、顺序分支和节点推进，ExecutionSnapshotBuilder 已冻结对应已发布版本及图，但完整业务事实来源、异常/结果审计及通用执行契约仍须补齐；现有自由文本 conditionExpression 不得作为唯一事实来源。方向快捷入口会自动创建节点和连线，用户也可以从连接点手动连线；节点移动支持网格吸附并在拖动时显示对齐辅助线；一键整理只改变草稿节点位置并标记为待保存，不改变流程业务关系。草稿节点、连线和节点配置的保存请求及发布门禁已由控制器测试覆盖；真实数据库重新读取和保存异常回滚仍缺少独立集成测试，不能据此扩大为生产执行能力。已有消息通知和人工确认节点仅保留兼容读取和配置能力。消息发送和人工确认任务派发不由本配置切片证明；现有条件求值和流程推进按后续受限生产执行范围记录，不能扩大为通用引擎。
    evidenceIds:
    - evidence.production-work-flow-editor-ui
    - evidence.production-work-template-configuration-controller
    - evidence.production-work-template-configuration-test
    - evidence.production-work-flow-version-draft-persistence
    - evidence.production-execution-snapshot-builder-source
    - evidence.production-execution-engine-source
  - id: rule.production-work.form-node-business-document-configuration
    name: 作业流程表单填写节点使用业务单据称谓且不支持完成条件配置
    status: implemented
    visibility: internal
    trigger: production-work.flow-node.configure
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkFlowNode.kind
          operator: equals
          value: FORM
    result:
      type: omit-projection
      unsupportedField: completionCondition
      readHistoricalField: forbidden
      migrateHistoricalField: forbidden
      cleanHistoricalField: forbidden
      persistField: forbidden
      displayLabel: 业务单据
      referenceField: formTemplateVersionId
      databaseMigration: none
    explanation: 当前配置面板使用“业务单据”，内部仍通过 formTemplateVersionId 引用表单模板版本。DEC-0010-02 明确不支持 completionCondition 且后续保存不应写入该字段；没有专门配置入口或语义读取器，并不证明保存会移除它。当前 normalizeFlowGraph 保留非 CONDITION 节点原 config，persistentFlowGraph 只移除 UI 瞬态属性，后端 saveGraph 序列化输入节点，因而旧/注入字段仍可能被草稿透传保存，见 discrepancy.production-work-form-completion-condition-passthrough。规范保留，本次登记差异，不新增迁移或修改生产逻辑。
    evidenceIds: [evidence.production-work-form-node-business-document-config, evidence.production-work-flow-editor-ui, evidence.production-work-flow-version-draft-persistence]
  - id: rule.production-work.condition-rule-publish-validation
    name: 作业条件规则发布前校验
    status: specified
    visibility: internal
    trigger: production-work.flow-version.publish
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.status
          operator: equals
          value: DRAFT
        - fact: productionWorkFlowVersion.containsConditionRule
          operator: equals
          value: true
    result:
      type: persist-flow-configuration
      conditionNodeConfiguration: conditionBranches-and-conditionDefaultBranch
      conditionBranchOrder: array-order-is-business-semantic
      conditionBranchRuleRequired: every-condition-branch
      conditionDefaultBranch: exactly-one-otherwise-branch
      acceptedConditionFields: ['conditionBranches[].conditionRule', conditionDefaultBranch]
      rejectedLegacyFields: ['config.conditionRule', 'conditionBranches[].rule', condition-true, condition-false]
      conditionRuleShape: all-any-not-clause
      fieldCatalogVersion: work-runtime-fields-v1
      allowedFields: [workType, triggerType, sourceType, sourceNumber, executionStatus]
      fieldTypes: [string, string, string, string, string]
      allowedOperators: [equals, not-equals, contains, starts-with, in, is-present, is-null]
      multiValueOperator: in
      multiValueValueType: array
      requiredNodeConfiguration: [conditionBranches, conditionDefaultBranch]
      requiredConditionBranchConfiguration: [conditionRule, fieldCatalogVersion, fieldSnapshot]
      dynamicOutgoingEdges: condition-node-branches-and-default
      maximumOutgoingEdgesPerBranch: 1
      rejects: [empty-branches, missing-default-branch, malformed-ast, unknown-field, unknown-operator, unregistered-catalog, missing-field-snapshot, multiple-edges-per-branch, legacy-config-conditionRule, legacy-branch-rule, legacy-condition-true-exit, legacy-condition-false-exit]
    explanation: 用户已确认多个有序 conditionBranches 和唯一 conditionDefaultBranch；发布层要求每个条件分支有合法 conditionRule、字段目录和字段快照，各分支具备唯一出口，并拒绝旧结构及固定出口。此发布配置规则与当前受限 WORK 求值分开：后续已有五字段取值、条件求值、节点推进及嵌入快照，但完整来源和运行执行契约仍未闭环。本次仅核对源码与已有测试断言。
    evidenceIds:
    - evidence.production-work-condition-branch-model
    - evidence.production-work-condition-rule-builder
    - evidence.production-work-condition-rule-controller
    - evidence.production-work-condition-rule-test
    - evidence.production-execution-snapshot-builder-source
    - evidence.production-execution-engine-source
  - id: rule.production-work.condition-branches-first-match
    name: 作业条件分支按顺序命中首个满足分支
    status: specified
    visibility: internal
    trigger: production-work.condition-node.evaluate
    scope: production-work-runtime
    condition:
      all:
        - fact: productionWorkConditionNode.published
          operator: equals
          value: true
        - fact: productionWorkConditionNode.conditionBranches
          operator: is-present
          value: true
    result:
      type: evaluate-condition-branches
      branchOrder: array-order
      selection: first-satisfied-condition-branch
      fallback: conditionDefaultBranch
      executionStatus: limited-production-execution-slice
    explanation: 当前 ProductionExecutionEngine.conditionOutlet 已按冻结的条件分支数组求值，选择第一个满足分支，否则选择默认分支，再推进节点，并留存节点 conditionFacts/decisions。现有取值为五个受限字段，其中 workType=WORK、triggerType=OPERATION_START、executionStatus=RUNNING 为固定工程值，sourceType/sourceNumber 来自生产对象上下文；不能据此认定完整业务来源政策、异常和结果审计契约已确认或通用运行注册完成。保留 specified/internal，源码核对不等于本次业务测试通过。
    evidenceIds:
    - evidence.production-work-condition-branch-model
    - evidence.production-execution-snapshot-builder-source
    - evidence.production-execution-engine-source
  - id: rule.production-work.ordinary-node-single-outgoing-edge
    name: 作业流程首版普通节点单一出口约束
    status: specified
    visibility: internal
    trigger: production-work.flow-version.draft-save
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.status
          operator: equals
          value: DRAFT
        - fact: productionWorkFlowGraph.isFirstReleaseFlow
          operator: equals
          value: true
    result:
      type: persist-flow-configuration
      parallelExecution: unavailable
      outgoingEdgeRules:
        appliesTo:
        - START
        - ordinary-work-node
        excludes:
        - CONDITION
        maximumOutgoingEdges: 1
        duplicateOrAdditionalEdge: forbidden
      conditionNodeBranchModel: conditionBranches-with-default-branch
      conditionBranchOutgoingEdgeLimit: 1
      conditionDefaultOutgoingEdgeLimit: 1
      runtimeConditionEvaluation: limited-production-execution-slice
      runtimeParallelExecution: unavailable
    explanation: 首版普通节点与 START 最多一条出口，第二条普通出口不合法；条件节点允许多个动态分支，但每个条件和默认分支最多一条线。配置按 DEC-0011 的新模型核对；生产执行已有受限 WORK 条件求值和顺序节点推进，普通节点并行执行仍未支持。配置门禁、受限运行和通用规则执行成熟度分别记录。
    evidenceIds:
    - evidence.production-work-flow-editor-ui
    - evidence.production-work-template-configuration-controller
    - evidence.production-work-template-configuration-test
    - evidence.production-execution-snapshot-builder-source
    - evidence.production-execution-engine-source
  - id: rule.production-work.applicability-always-effective
    name: 作业适用规则保存即有效
    status: implemented
    visibility: internal
    trigger: production-work.applicability-rule.save
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkApplicabilityRule.persisted
          operator: equals
          value: true
    result:
      type: omit-projection
      projection: production-work-applicability-active-status
      persistedIsActive: true
      userMayToggleActive: false
      excludes: [active-status, active-toggle]
    explanation: 所有已保存的 WORK 作业适用规则均为有效规则。共享实体保留 isActive 字段以避免影响审批流程绑定规则，但 WORK 配置不得接受用户启用或停用选择，既有 WORK 规则恢复后也必须为有效；未来运行时据此将保存规则视为可参与适用性判定的规则。
    evidenceIds: [evidence.production-work-template-configuration-controller, evidence.production-work-template-configuration-test]
  - id: rule.production-work.applicability-query-projection
    name: 作业适用规则查询投影
    status: implemented
    visibility: internal
    trigger: production-work.applicability-rule.list
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkApplicabilityRule.listRequested
          operator: equals
          value: true
    result:
      type: omit-projection
      projection: production-work-applicability-list-query
      includes: [definition-name-or-code, rule-type, product-family, product, operation]
      excludes: [active-status]
      unrestrictedScopeDisplay: 不限
    explanation: 作业适用规则列表按作业名称或编码、适用方式、产品簇、产品和工序投影与筛选；状态不属于该查询投影。规则未限定产品簇、产品或工序时，客户页面显示“不限”，不以缺失值或状态字段替代其业务含义。
    evidenceIds: [evidence.production-work-template-configuration-controller, evidence.production-work-applicability-dialog-ui]
  - id: rule.production-work.audit-baseline
    name: 历史作业模板审计基线
    status: implemented
    visibility: internal
    trigger: production-work.audit.baseline-migration
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkDefinition.auditEventCount
          operator: equals
          value: 0
    result:
      type: write-audit-record
      action: BASELINE
      source: SYSTEM
      operator: 系统
      preservesOriginalCreationClaim: false
    explanation: 对不存在审计事件的既有 WORK 作业模板，数据迁移写入来源为 SYSTEM、操作者为“系统”、动作为 BASELINE 的历史基线事件。该事件只说明系统在迁移时建立了可追溯起点，不得伪称为原始用户创建事件；新增、更新和删除继续记录其各自的变更前后快照。
    evidenceIds: [evidence.production-work-template-configuration-controller, evidence.production-work-template-configuration-migration]
  - id: rule.production-work.applicability-summary-projection
    name: 作业适用规则摘要投影
    status: specified
    visibility: internal
    trigger: production-work.applicability-rule.compose
    scope: production-work-template-configuration
    condition:
      all:
        - fact: productionWorkApplicabilityRule.definitionId
          operator: is-present
          value: true
    result:
      type: omit-projection
      projection: applicability-rule-summary
      includes: [definition-name, rule-type, product-family-scope, product-scope, operation-scope, fixed-rule-order]
      excludes: [editable-priority, numeric-priority, draft-flow-option, historical-flow-option]
      publishedFlowPreviewSource: productionWorkDefinition.currentPublishedFlowVersionId
    explanation: 新增或编辑适用规则时，客户页面根据已选作业、规则类型与范围实时组成可读摘要，并展示该作业当前已发布流程的只读预览入口。摘要可解释例外排除、指定范围、全局适用的固定处理顺序，但不暴露优先级字段；草稿和历史流程不属于适用规则选择或预览的目标。
    evidenceIds: [evidence.business-knowledge-model, evidence.production-work-applicability-dialog-ui, evidence.production-work-flow-preview-ui]
  - id: rule.form-process.binding-requires-form-and-flow
    factCatalogProfile: form-process-binding
    name: 按流程填报绑定必须同时引用流程和表单版本
    status: specified
    visibility: internal
    trigger: form-process.binding.publish
    scope: form-process-configuration
    condition:
      all:
      - fact: formFillSettings.mode
        operator: equals
        value: PROCESS
      - any:
        - fact: formProcessBinding.formTemplateVersionId
          operator: is-null
          value: true
        - fact: formProcessBinding.formProcessTemplateVersionId
          operator: is-null
          value: true
    result:
      type: block
      reason: form-process-binding-reference-required
    explanation: 本成对引用门禁适用于 DEC-0067 显式 PROCESS 模式：必须有具体表单模板版本及已发布表单流程版本。DIRECT 模式不要求流程引用，但仍执行自身权限、按钮、签署和表单版本校验；不能以无流程跳过所有设置。后续已有冻结和表单运行实现，其完整验证按对应证据核对，本次不提升原 specified 成熟度。
    evidenceIds:
    - evidence.production-form-process-user-confirmed-v2
    - evidence.production-form-process-buttons-events-v2
    - evidence.form-fill-settings-confirmed
    - evidence.form-fill-settings-design
    - evidence.form-fill-settings-current-mode-validation
  - id: rule.form-process.binding-mapping-required
    name: 表单流程绑定发布前校验字段槽位映射
    status: deprecated
    visibility: internal
    trigger: form-process.binding.publish
    scope: form-process-configuration
    condition:
      any:
        - fact: formProcessBinding.requiredFieldSlotMappingComplete
          operator: equals
          value: false
        - fact: formProcessBinding.fieldMappingCompatible
          operator: equals
          value: false
    result:
      type: block
      reason: form-process-field-slot-mapping-invalid
    explanation: 历史版本曾要求绑定配置完成流程字段槽位映射。当前方案不再使用流程字段、业务字段分类或字段映射；旧 fieldSlots/fieldMappings 仅兼容读取，不参与新版本发布阻断。
    evidenceIds: [evidence.production-form-process-user-confirmed]
  - id: rule.form-process.entry-permission-default-edit
    name: 填报字段默认可编辑
    status: deprecated
    visibility: internal
    trigger: form-process.entry-permission.configure
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessEntry.fieldPermissionRuleMatched
          operator: equals
          value: false
    result:
      type: persist-flow-configuration
      permission: EDIT
      bulkToggleValues: [EDIT, READ_ONLY]
    explanation: 历史规则把默认编辑描述为字段级配置。当前方案改由表单流程节点为每个主体保存统一默认权限，见 rule.form-process.subject-default-permission。
    evidenceIds: [evidence.production-form-process-user-confirmed]
  - id: rule.form-process.permission-default-exception
    name: 表单流程字段权限采用默认权限与例外字段
    status: deprecated
    visibility: internal
    trigger: form-process.permission.configure
    scope: form-process-configuration
    condition:
      all:
        - fact: permission.subjectMatched
          operator: equals
          value: true
    result:
      type: persist-flow-configuration
      model: default-with-exceptions
      permissionStates: [EDIT, READ_ONLY]
      exceptionTarget: form-process-field-slot
      appliesTo: [entry-permission-group, approval-participant]
      bindingStage: field-mapping-only
      conflictPolicy: READ_ONLY_FIRST
    explanation: 历史规则使用流程字段表达例外权限，已由真实表单字段例外方案替代；当前规则不再作为新配置入口。
    evidenceIds: [evidence.production-form-process-permission-default-exception-design]
  - id: rule.form-process.field-permission-readonly-wins
    name: 表单字段权限冲突时只读优先
    status: deprecated
    visibility: internal
    trigger: form-process.permission.resolve
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessPermission.matchedReadonlyPolicy
          operator: equals
          value: true
    result:
      type: planned-permission-control
      permission: READ_ONLY
      precedence: READ_ONLY_OVER_EDIT
    explanation: 历史规则针对多个流程字段权限策略的冲突合并，已由主体默认权限与绑定级真实字段例外取值替代；运行时权限解析仍未实现。
    evidenceIds: [evidence.production-form-process-user-confirmed]
  - id: rule.form-process.subject-default-permission
    name: 表单流程主体配置统一默认权限
    status: deprecated
    visibility: internal
    trigger: form-process.subject.configure
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessSubject.sourceConfigured
          operator: equals
          value: true
        - fact: formProcessSubject.defaultPermission
          operator: in
          value: [EDIT, READ_ONLY]
    result:
      type: persist-flow-configuration
      target: formProcessSubject.defaultPermission
      allowedValues: [EDIT, READ_ONLY]
      fieldLevelConfiguration: forbidden
    explanation: 历史规则按单个主体保存默认权限，已由权限配置组模型替代；当前默认权限应保存到填报权限组或审批节点组。
    evidenceIds: [evidence.production-form-process-user-confirmed-v2]
  - id: rule.form-process.permission-group-default-permission
    name: 表单流程权限配置组统一默认权限
    status: specified
    visibility: internal
    trigger: form-process.permission-group.configure
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessPermissionGroup.subjectConfigurationPresent
          operator: equals
          value: true
        - fact: formProcessPermissionGroup.defaultPermission
          operator: in
          value: [EDIT, READ_ONLY]
    result:
      type: persist-flow-configuration
      target: formProcessPermissionGroup.defaultPermission
      allowedValues: [EDIT, READ_ONLY]
      appliesTo: [entry-permission-group, approval-node-group]
      fieldLevelConfiguration: forbidden
    explanation: 填报阶段按权限配置组统一设置默认权限，一个组可包含多个主体；审批阶段每个审批节点本身就是一个权限组，节点内多个审批主体共享该默认权限。流程设计页不逐字段配置具体表单字段。
    evidenceIds: [evidence.production-form-process-user-confirmed-v4]
  - id: rule.form-process.subject-selector-supported-dimensions
    name: 表单流程主体选择器支持的身份维度
    status: specified
    visibility: internal
    trigger: form-process.subject.configure
    scope: form-process-configuration
    condition:
      all:
        - fact: subjectSelector.opened
          operator: equals
          value: true
    result:
      type: persist-flow-configuration
      subjectTypes: [USER, DEPARTMENT, ROLE]
      multiSelect: true
      forbiddenSubjectTypes: [USER_GROUP, DEPARTMENT_OWNER, BUSINESS_OWNER]
      stableReferenceRequired: true
    explanation: 审批主体和填报权限主体共用公共主体选择器。第一版只展示用户、部门和角色三类真实存在且有基础关系数据的维度，允许多选并保存稳定 ID；用户组、部门负责人和业务责任人尚无对应主数据或解析器，不进入配置入口。
    evidenceIds: [evidence.identity-user-account, evidence.identity-department, evidence.identity-role, evidence.identity-subject-selector-user-confirmed]
  - id: rule.form-process.department-subject-scope-default
    name: 部门主体默认范围
    status: specified
    visibility: internal
    trigger: form-process.department-subject.configure
    scope: form-process-configuration
    condition:
      all:
        - fact: subject.type
          operator: equals
          value: DEPARTMENT
    result:
      type: persist-flow-configuration
      scopeOptions: [DEPARTMENT_AND_DESCENDANTS, DEPARTMENT_ONLY]
      defaultScope: DEPARTMENT_AND_DESCENDANTS
      scopeLabelRequired: true
    explanation: 选择部门作为流程主体时，默认覆盖本部门及下级部门，也可切换为仅本部门；配置结果需要保留范围标识，避免用户只看到部门名称而误解实际人员范围。
    evidenceIds: [evidence.identity-department, evidence.identity-subject-selector-user-confirmed]
  - id: rule.form-process.subject-members-resolve-latest-relations
    name: 流程主体按最新关系解析成员
    status: specified
    visibility: internal
    trigger: form-process.subject.resolve
    scope: form-process-runtime
    condition:
      any:
        - fact: subject.type
          operator: equals
          value: DEPARTMENT
        - fact: subject.type
          operator: equals
          value: ROLE
    result:
      type: persist-flow-configuration
      membershipSource: latest-user-organization-and-role-relations
      resolveAt: node-arrival
      entryPermissionCheckAt: user-access
      publishedSnapshot: false
    explanation: 部门和角色不在流程发布时固定成员。当前SubjectResolver读取组织/角色关系；审批节点进入时冻结解析候选供后续处理，填报资格在访问/动作校验时解析当前关系，两个时点不可混用。已有冻结及普通权限实现，泛工作流转办原来源留存差异另记，不再泛称运行时解析未实现。
    evidenceIds:
    - evidence.identity-user-memberships
    - evidence.identity-subject-selector-user-confirmed
    - evidence.identity-subject-resolver-implementation
    - evidence.production-execution-access-source
  - id: rule.form-process.entry-subject-optional-open-scope
    name: 未配置填报主体时所有已认证用户可填报
    status: specified
    visibility: internal
    trigger: form-process.entry-permission.authorize
    scope: form-process-runtime
    condition:
      all:
        - fact: formProcessEntry.subjectConfigurationPresent
          operator: equals
          value: false
        - fact: authenticatedUser.present
          operator: equals
          value: true
    result:
      type: planned-permission-control
      scope: all-authenticated-users-in-default-tenant
      expandAllUsers: false
      requires: [workflow-instance-active, entry-node-active]
    explanation: 填报主体和权限组不是必填项；未配置时不限制为特定主体，当前单租户内所有已认证用户均可填报。授权时按当前用户和流程状态判断，不为了表示所有人而查询或展开全量用户。
    evidenceIds: [evidence.production-form-process-user-confirmed-v3]
  - id: rule.form-process.approval-subject-optional-open-scope
    name: 未配置审批主体时所有已认证用户可审批
    status: specified
    visibility: internal
    trigger: form-process.approval-task.authorize
    scope: form-process-runtime
    condition:
      all:
        - fact: formProcessApproval.subjectConfigurationPresent
          operator: equals
          value: false
        - fact: authenticatedUser.present
          operator: equals
          value: true
    result:
      type: planned-permission-control
      scope: all-authenticated-users-in-default-tenant
      expandAllUsers: false
      logicalTaskCount: 1
      requires: [workflow-instance-active, approval-node-active, workflow-task-open]
    explanation: 审批主体不是必填项；未配置时当前单租户内所有已认证用户均可审批。运行时只保留一个逻辑任务，不生成按用户数量增长的候选任务，也不构造全量候选快照。
    evidenceIds: [evidence.production-form-process-user-confirmed-v3, evidence.workflow-task-empty-subject-user-confirmed]
  - id: rule.form-process.binding-field-exception
    name: 作业流程绑定后按真实表单字段配置例外权限
    status: specified
    visibility: internal
    trigger: production-work.form-entry-node.bind-form-process
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessBinding.formTemplateVersionId
          operator: is-present
          value: true
        - fact: formProcessBinding.formProcessTemplateVersionId
          operator: is-present
          value: true
        - fact: formProcessBinding.formProcessTemplateVersion.status
          operator: equals
          value: PUBLISHED
    result:
      type: persist-form-required-configuration
      target: formProcessBinding.fieldPermissionExceptions
      fieldReference: formTemplateField.fieldId
      allowedValues: [EDIT, READ_ONLY]
      processFieldSlots: forbidden
      processFieldMappings: forbidden
      bindingScoped: true
    explanation: 作业流程表单填写节点先绑定一个具体表单模板版本和一个已发布表单流程版本，再针对该表单真实存在的稳定 fieldId 配置少量例外权限。例外权限只对当前绑定生效，不改变可复用的表单流程版本。
    evidenceIds: [evidence.production-form-process-user-confirmed-v2]
  - id: rule.form-process.binding-field-permission-inheritance
    name: 未配置字段例外时继承权限组默认权限
    status: specified
    visibility: internal
    trigger: form-process.permission.resolve
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessBinding.fieldPermissionException.exists
          operator: equals
          value: false
    result:
      type: planned-permission-control
      permissionSource: formProcessPermissionGroup.defaultPermission
      exceptionOverride: none
    explanation: 绑定中没有为某个真实表单字段配置例外时，该字段直接继承其所属填报权限组或审批节点组的默认权限；因此用户无需逐字段重复配置。
    evidenceIds: [evidence.production-form-process-user-confirmed-v2, evidence.production-form-process-user-confirmed-v4]
  - id: rule.form-process.entry-bulk-default-permission-persists
    name: 填报节点批量默认权限必须落到真实主体配置
    status: deprecated
    visibility: internal
    trigger: form-process.entry-permission.bulk-configure
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessEntry.bulkPermissionRequested
          operator: in
          value: [EDIT, READ_ONLY]
    result:
      type: persist-flow-configuration
      target: formProcessSubject.defaultPermission
      permission: formProcessEntry.bulkPermissionRequested
      materializeMissingSubjectConfiguration: true
      forbiddenOutcome: display-only-change
    explanation: 历史规则把批量默认权限写入单个主体配置，已由权限配置组默认权限规则替代；空主体仍按开放操作范围处理。
    evidenceIds: [evidence.production-form-process-permission-default-exception-design-v2]
  - id: rule.form-process.binding-switch-cleans-invalid-field-exceptions
    name: 切换绑定版本清理失效字段例外
    status: specified
    visibility: internal
    trigger: production-work.form-entry-node.binding.change
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessBinding.versionChanged
          operator: equals
          value: true
    result:
      type: persist-form-required-configuration
      target: formProcessBinding.fieldPermissionExceptions
      retainWhen:
        all:
        - fact: exception.fieldId.existsInSelectedFormTemplateVersion
          operator: equals
          value: true
        - fact: exception.permissionGroup.existsInSelectedFormProcessVersion
          operator: equals
          value: true
      removeWhen:
        any:
        - fact: exception.fieldId.existsInSelectedFormTemplateVersion
          operator: equals
          value: false
        - fact: exception.permissionGroup.existsInSelectedFormProcessVersion
          operator: equals
          value: false
      invalidExceptionAction: remove-before-save
    explanation: 换表单/流程后按新表单真实fieldId与现行权限组身份筛选绑定例外，组内主体成员变化不使例外变成逐人配置。权限组键为start:<permissionGroupRules.id>、start:open或approval:<node.id>；有效例外保留。DEC-0023-08的切换有效性要求与本规则remove-before-save目标继续，但当前作业草稿切换后直接保存仍可带旧失效组/字段，见 discrepancy.form-process-binding-switch-draft-retains-invalid-exceptions。发布校验和产品制程保存验证存在，不能证明每次作业草稿切换均已清理。
    evidenceIds:
    - evidence.production-form-process-permission-default-exception-design-v2
    - evidence.production-form-process-user-confirmed-v4
    - evidence.form-fill-settings-current-mode-validation
  - id: rule.form-process.published-version-reference-fixed
    factCatalogProfile: form-process-binding
    name: 表单流程发布版本引用固定
    status: specified
    visibility: internal
    trigger: production-work.form-entry-node.bind-form-process
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessBinding.formProcessTemplateVersion.status
          operator: equals
          value: PUBLISHED
    result:
      type: persist-form-reference-pair
      references: [formProcessTemplateVersionId, formTemplateVersionId]
      immutableAfterPublish: true
      eachBindingOwnsExceptions: true
    explanation: 每个作业流程表单填写节点固定保存一个已发布表单流程版本和一个具体表单模板版本；同一表单流程可以复用到多个表单，但每个绑定独立保存字段例外权限。已发布版本内容不可在原版本上修改。
    evidenceIds: [evidence.production-form-process-user-confirmed-v2]
  - id: rule.form-process.approval-any-candidate
    name: 审批候选人任一处理完成节点
    status: specified
    visibility: internal
    trigger: form-process.approval-task.complete
    scope: form-process-runtime-before-explicit-transfer
    condition:
      all:
        - fact: formProcessApproval.candidateCount
          operator: greater-than-or-equal
          value: 1
    result:
      type: planned-production-work-trigger
      completionStrategy: first-completed-candidate
      sequentialApproval: false
    explanation: 本条范围明确限定未显式转办的审批节点：多个有权候选中任一可完成，需要逐个顺序审批时配置多个节点。按DEC-0081显式委托后仅当前受让人处理，不由原候选数量或原来源继续授予他人办理权；普通生产表单与泛WorkflowEngine仍分别核对。源码及历史断言不代表本轮并发或事务验收，指定成熟度保持。
    evidenceIds:
    - evidence.production-form-process-user-confirmed
    - evidence.production-form-process-guancheng-research
    - evidence.production-execution-engine-source
    - evidence.workflow-task-multi-candidate-runtime-implementation
    - evidence.tenant-task-delegation-20261020
  - id: rule.form-process.approval-return-to-entry
    name: 审批退回固定回到填报阶段
    status: specified
    visibility: internal
    trigger: form-process.approval.return
    scope: form-process-runtime
    condition:
      all:
        - fact: formProcessApproval.returnRequested
          operator: equals
          value: true
    result:
      type: planned-production-work-trigger
      targetStage: ENTRY
      arbitraryHistoricalTarget: false
    explanation: 首版退回固定回填报阶段，不允许选择任意历史节点。ProductionExecutionEngine 的 RETURN 分支已按原流程重置填报入口及待处理状态，保留既有表单份和数据的当前规则另行核对；不再只称未来配置契约。本次仅核对静态实现，未重跑退回业务场景。
    evidenceIds:
    - evidence.production-form-process-user-confirmed
    - evidence.production-execution-engine-source
  - id: rule.form-process.termination-cascades-to-outer-work
    name: 表单流程终止同步终止外层作业流程
    status: specified
    visibility: internal
    trigger: form-process.terminate
    scope: form-process-runtime
    condition:
      all:
        - fact: formProcess.status
          operator: equals
          value: TERMINATED
    result:
      type: planned-production-work-trigger
      outerProcessResult: TERMINATED
      synchronous: true
    explanation: 表单流程终止向等待它的外层作业返回终止并级联的目标约束保留。当前普通表单按钮白名单排除 TERMINATE，该终止链没有完整实现证据；后续已有其他WORK匹配、推进和表单运行，不能据此泛称整个生产作业运行不存在，也不能将其他完成/退回路径当作终止链已实现。
    evidenceIds: [evidence.production-form-process-user-confirmed, evidence.production-form-process-guancheng-research]
  - id: rule.form-process.node-button-configuration-v1
    name: 表单流程节点按钮配置白名单
    status: implemented
    visibility: internal
    trigger: form-process.node-button.configure
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessNode.type
          operator: in
          value: [START, APPROVAL]
        - fact: formProcessNode.button.action
          operator: in
          value: [SAVE, SUBMIT, APPROVE, RETURN, TRANSFER]
    result:
      type: persist-flow-configuration
      target: formProcessNode.buttons
      persists:
      - visible
      - label
      - action
      - parameters
      electronicSignatureActions:
      - SAVE
      - SUBMIT
      - APPROVE
      - RETURN
      signatureEvent:
        builtinOptions:
        - NONE
        - FILL_SIGN_FIELD
        event: BEFORE
        signatureMethod: ACCOUNT_PASSWORD
        fieldBindingRequiredFor: FILL_SIGN_FIELD
      transfer:
        nodeKind: APPROVAL
        reasonRequired: true
        opinionRequiredConfigurable: false
        electronicSignatureConfigurable: false
      forbiddenActions:
      - ADD_SIGN
      - REJECT
      - DENY
      - DISAPPROVE
      - TERMINATE
      - WITHDRAW
      approvalOpinionRequiredConfigurable: true
      publishedVersionEditable: false
    explanation: 开始节点支持保存和提交，审批节点支持审批、退回和转办；按钮可保存显隐、显示名称和样式。电子签名事件仅关联保存、提交、审批或退回；转办原因由系统固定必填，不配置审批意见必填或签名字段事件。配置持久化已经实现；各动作的运行时成熟度仍以对应规则和证据为准。 签署后填充字段为可选：NONE不绑定签名字段，FILL_SIGN_FIELD才要求目标字段。ACCOUNT_PASSWORD是保留枚举，普通按钮实际使用DEC-0074独立签名密码及指定签署人，不从枚举推回登录密码政策。
    evidenceIds: [evidence.production-form-process-buttons-events-v3, evidence.form-approval-transfer-user-confirmed, evidence.form-approval-transfer-configuration, evidence.form-approval-transfer-tests]
  - id: rule.form-process.node-button-event-configuration-v1
    name: 表单流程节点按钮事件配置
    status: deprecated
    visibility: internal
    trigger: form-process.node-button-event.configure
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessNode.buttonEvent.timing
          operator: equals
          value: BEFORE
        - fact: formProcessNode.buttonEvent.action
          operator: in
          value: [SAVE, SUBMIT, APPROVE, RETURN]
    result:
      type: persist-flow-configuration
      target: formProcessNode.buttonEvents
      persists: [timing, action, handlerId]
      handlerIdOptional: true
      runtimeExecution: unavailable
      publishedVersionEditable: false
    explanation: 历史规则曾允许事件保存可选处理器标识，已由 rule.form-process.node-button-builtin-event-configuration-v2 替代；旧字段仅用于历史配置读取，不参与新版本发布。
    evidenceIds: [evidence.production-form-process-buttons-events-v1]
  - id: rule.form-process.node-button-builtin-event-configuration-v2
    name: 填充签名字段的按钮内置签署事件配置
    status: specified
    visibility: internal
    trigger: form-process.node-button-event.configure
    scope: form-process-configuration
    condition:
      all:
      - fact: formProcessNode.buttonEvent.timing
        operator: equals
        value: BEFORE
      - fact: formProcessNode.buttonEvent.action
        operator: in
        value:
        - SAVE
        - SUBMIT
        - APPROVE
        - RETURN
      - fact: formProcessNode.buttonEvent.builtin
        operator: in
        value:
        - FILL_SIGN_FIELD
    result:
      type: persist-flow-configuration
      target: formProcessNode.buttonEvents
      persists:
      - timing
      - action
      - builtin
      - signatureMethod
      perButton: true
      builtinEventWhitelist:
      - FILL_SIGN_FIELD
      forbiddenFields:
      - handlerId
      - processorId
      - processingMarker
      runtimeExecution: existing-consumer-with-separate-verification
      publishedVersionEditable: false
    explanation: 本条只定义需要FILL_SIGN_FIELD的按钮签署子集；签署后不填字段的NONE配置由节点按钮总规则承接，不应被本条白名单排除。当前第一版签署事件按节点内具体按钮独立保存，固定使用执行前时机、关联标准动作和受控内置事件类型；不同按钮可以声明不同事件并在绑定阶段使用不同签名字段。不提供单独的启用勾选，不需要事件时直接删除该按钮事件配置。DEC-0074 局部替代旧账户登录密码约定：普通按钮使用实际签署人的独立签名密码，仅用户名 admin 暂用登录密码例外；ACCOUNT_PASSWORD 仅保留为既有配置枚举，不据此推导登录密码认证。处理标识等技术字段不属于用户配置项；本配置规则不证明新认证、事件执行或审计副作用已完成验证，SIGN_FIELD 不受影响。 当前已有受限签署消费者，原配置切片不承诺运行验收，不能据此断言消费者不存在。
    evidenceIds:
    - evidence.production-form-process-buttons-events-v3
    - evidence.production-form-process-user-confirmed-v4
    - evidence.button-signature-confirmed
    - evidence.button-signature-decision-package
    - evidence.production-execution-access-source
  - id: rule.form-process.node-button-event-empty-projection
    name: 未配置按钮事件时隐藏节点事件区域
    status: specified
    visibility: internal
    trigger: form-process.node-button-event.project
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessNode.buttonEvent.exists
          operator: equals
          value: false
    result:
      type: omit-projection
      projection: node-event-configuration
      display: hidden
    explanation: 节点没有任何按钮事件声明时，不展示空的节点事件配置区域；事件区域只呈现已声明的按钮事件，避免将未配置状态误解为待启用事件。
    evidenceIds: [evidence.production-form-process-user-confirmed-v4]
  - id: rule.production-work.form-entry-event-field-binding
    name: 作业流程表单填写节点绑定内置事件字段
    status: specified
    visibility: internal
    trigger: production-work.form-entry-node.bind-form-process-event
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessBinding.formTemplateVersionId
          operator: is-present
          value: true
        - fact: formProcessBinding.formProcessTemplateVersionId
          operator: is-present
          value: true
        - fact: formProcessBinding.formProcessTemplateVersion.status
          operator: equals
          value: PUBLISHED
        - fact: formProcessBinding.eventBinding.eventId
          operator: exists-in
          value: formProcessBinding.formProcessTemplateVersion.buttonEvents
        - fact: formProcessBinding.eventBinding.fieldId
          operator: exists-in
          value: formProcessBinding.formTemplateVersion.fields
        - fact: formProcessBinding.eventBinding.field.type
          operator: in
          value: [signature, electronicSignature, sign]
    result:
      type: persist-form-required-configuration
      target: productionWorkFormEntryNode.eventBindings
      references: [eventId, fieldId]
      eventWhitelist: [FILL_SIGN_FIELD]
      fieldReference: formTemplateField.fieldId
      bindingScoped: true
      processVersionWriteBack: false
      invalidBindingAction: block
    explanation: 显式 PROCESS 模式中，作业表单节点把所选已发布流程的 FILL_SIGN_FIELD 事件映射到当前表单真实且稳定的签名 fieldId；普通文本不可作目标，绑定只属于当前节点，不回写复用流程。DIRECT 的绑定按DEC-0067独立设置。已有签署消费者及服务端字段写入，不能再笼统称无运行实现；实际按钮认证遵循DEC-0074，SIGN_FIELD保持独立协议。本次静态核对不表示全部权限/签署/审计验收通过。
    evidenceIds:
    - evidence.production-form-process-buttons-events-v2
    - evidence.production-execution-access-source
    - evidence.form-fill-settings-confirmed
  - id: rule.production-work.form-process-reference-projection
    name: 作业流程保存时重建表单流程版本引用投影
    status: implemented
    visibility: internal
    trigger: production-work.flow-version.save-graph
    scope: form-process-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.nodes
          operator: contains
          value: form-entry-node-with-form-process-version-reference
    result:
      type: rebuild-query-projection
      projection: form-process-version-usage
      sourceOfTruth: productionWorkFlowVersion.nodesJson
      rebuildScopes: [save-graph, create-inherited-draft, publish, copy-published-to-draft]
      deleteWithOwner: production-work.flow-version.delete
    explanation: 作业流程图中的表单填报节点配置仍是表单流程版本引用的事实来源。系统保存作业流程图、创建继承草稿、发布或复制已发布版本时，在同一事务内重建该作业版本的引用使用投影，用于后续影响分析；投影不得由用户手工维护，也不能反向改写流程图配置。 当前FormProcessReferenceService.rebuildForWorkVersion按已存formProcessVersionId构建引用，包括DIRECT中休眠的流程配置，用于使用分析和删除保护；formProcessReferenceStatuses仅对当前PROCESS生效配置提示。存储引用与运行生效引用含义不同，未确认仅活动模式才能计删除保护，不能自行缩小。
    evidenceIds: [evidence.production-form-process-user-confirmed-v5, evidence.form-process-version-reference-implementation, evidence.form-process-version-reference-migration, evidence.form-process-version-reference-tests]
  - id: rule.form-process.version-usage-analysis
    factCatalogProfile: form-process-binding
    name: 表单流程版本使用情况分析
    status: implemented
    visibility: internal
    trigger: form-process.version.view-usage
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessVersionUsageProjection.formProcessDefinitionId
          operator: equals
          value: requested-form-process-definition-id
    result:
      type: return-query-projection
      projection: form-process-version-usage
      fields: [formProcessVersion, workDefinition, workFlowVersion, workFlowVersionStatus, workNode, formTemplateVersion, formTemplateName]
      groupsBy: formProcessVersion
    explanation: 表单流程侧必须能够查看每个流程版本被哪些作业模板、作业流程版本和表单填报节点引用，并区分草稿、当前发布和历史发布的作业流程版本。使用情况用于影响分析和受控升级，不代表运行时实例已经消费该引用。
    evidenceIds: [evidence.production-form-process-user-confirmed-v5, evidence.form-process-version-usage-controller, evidence.form-process-version-usage-ui]
  - id: rule.production-work.form-process-reference-outdated-notification
    factCatalogProfile: form-process-binding
    name: 作业草稿引用旧版表单流程时必须提醒
    status: implemented
    visibility: internal
    trigger: production-work.flow-version-draft.open-or-publish
    scope: form-process-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.status
          operator: equals
          value: DRAFT
        - fact: formProcessVersionReference.referencedVersionIsCurrent
          operator: equals
          value: false
        - fact: formProcessDefinition.hasCurrentPublishedVersion
          operator: equals
          value: true
    result:
      type: notify
      target: production-work-form-entry-node
      message: form-process-current-published-version-available
      publishConfirmationIncludesWarning: true
      automaticUpgrade: false
    explanation: 作业流程草稿引用的表单流程版本不再是当前发布版时，界面必须明确提示新版存在，并在发布确认中继续提示。系统不得静默替换草稿引用；用户需要显式确认升级。
    evidenceIds: [evidence.production-form-process-user-confirmed-v5, evidence.form-process-version-upgrade-controller, evidence.form-process-version-upgrade-ui]
  - id: rule.production-work.form-process-reference-controlled-upgrade
    factCatalogProfile: form-process-binding
    name: 作业草稿表单流程引用必须受控升级
    status: implemented
    visibility: internal
    trigger: production-work.form-entry-node.upgrade-form-process-reference
    scope: form-process-configuration
    condition:
      all:
        - fact: productionWorkFlowVersion.status
          operator: equals
          value: DRAFT
        - fact: targetFormProcessVersion.status
          operator: equals
          value: PUBLISHED
        - fact: targetFormProcessVersion.isCurrent
          operator: equals
          value: true
        - fact: formProcessBinding.compatibilityWithTargetVersion
          operator: equals
          value: true
    result:
      type: update-reference
      target: productionWorkFormEntryNode.formProcessVersionId
      valueFrom: targetFormProcessVersion.id
      validateFields: [fieldPermissions, eventBindings, signatureFieldBindings]
      incompatibleAction: block-with-reason
      persistOn: production-work.flow-version.draft-save
      automaticDraftSave: false
    explanation: 用户确认升级时，系统必须校验当前作业节点保存的字段权限例外、按钮事件和签名字段绑定是否仍能在目标当前发布版本中解析。任一引用失效时拒绝静默升级并返回具体原因；兼容时只更新当前画布中的草稿引用，不代替用户保存草稿。用户显式保存草稿后才持久化该引用并重建使用投影，发布校验继续作为最终兜底。
    evidenceIds: [evidence.production-form-process-user-confirmed-v5, evidence.form-process-version-upgrade-controller, evidence.form-process-version-upgrade-tests]
  - id: rule.production-work.form-process-historical-published-reference-admin-exception
    factCatalogProfile: form-process-binding
    name: 历史已发布表单流程版本保留管理员维护口子
    status: specified
    visibility: internal
    trigger: production-work.form-entry-node.reference-historical-form-process-version
    scope: form-process-configuration
    condition:
      all:
        - fact: referencedFormProcessVersion.status
          operator: equals
          value: PUBLISHED
        - fact: referencedFormProcessVersion.isCurrent
          operator: equals
          value: false
    result:
      type: allow-with-governance
      ordinaryEntrypoint: hidden
      futureAdministratorMaintenance: true
      requiresFutureGovernance: [dedicated-permission, explicit-warning, audit-trail]
    explanation: 普通配置入口只展示当前发布版本，但后端暂不把所有历史已发布版本一刀切阻断，为后续管理员级版本维护保留能力。该规则不表示当前已经提供管理员历史版本维护界面；未来开放时必须补充专用权限、明确提示和审计记录。
    evidenceIds: [evidence.production-form-process-user-confirmed-v5, evidence.form-process-version-upgrade-controller]
  - id: rule.production-work.form-entry-form-process-optional
    factCatalogProfile: form-process-binding
    name: 表单填报节点的表单流程可选
    status: deprecated
    visibility: internal
    trigger: production-work.flow-version.publish
    scope: form-process-configuration
    condition:
      all:
        - fact: productionWorkFormEntryNode.formTemplateVersionId
          operator: is-present
          value: true
        - fact: productionWorkFormEntryNode.formProcessVersionId
          operator: is-null
          value: true
    result:
      type: allow-with-governance
      publishAllowed: true
      skipValidations: [formProcessVersion, fieldPermissions, eventBindings, signatureFieldBindings]
      requiredReference: form-template-version
    explanation: 历史规则保留；DEC-0067 以显式填报方式局部替代无流程即跳过字段权限、按钮事件和签名字段校验及清除绑定配置的约定。直接填报现在要求独立配置并执行适用设置，按流程填报继续沿用既有流程；表单模板版本必选和流程版本治理不变。保留本记录原 result 用于历史解释，不进入现行规则投影。
    evidenceIds: [evidence.production-form-process-user-confirmed-v5, evidence.form-process-optional-binding-controller]
  - id: rule.form-instance.completion-path-by-form-process-binding
    name: 表单实例按表单流程绑定状态完成
    status: specified
    visibility: internal
    trigger: form-instance.submit
    scope: form-instance-runtime
    condition:
      any:
        - all:
            - fact: formInstance.formProcessVersionId
              operator: is-null
              value: true
            - fact: formInstance.submissionValidation.passed
              operator: equals
              value: true
        - all:
            - fact: formInstance.formProcessVersionId
              operator: is-present
              value: true
            - fact: formProcessInstance.status
              operator: equals
              value: completed
    result:
      type: complete-form-instance
      status: COMPLETED
      completionModes: [WITHOUT_WORKFLOW, WORKFLOW_COMPLETED]
      createWorkflowInstanceWhen: formInstance.formProcessVersionId is present
      createReviewTaskWhen: formInstance.formProcessVersionId is present
      createEffectiveRevision: true
    explanation: 表单流程绑定是可选的。未绑定表单流程时，提交校验通过即可将表单实例从 OPEN 直接置为 COMPLETED，不创建表单流程实例或审批任务；绑定表单流程时，提交先进入流程，只有流程完成后才将表单实例置为同一 COMPLETED 终态。完成方式和流程事件用于区分是否经过审批，不能用“已复核”作为无流程表单的状态名称。
    evidenceIds: [evidence.production-form-process-user-confirmed-v5, evidence.record-correction-void-design]
  - id: rule.form-process.delete-referenced-forbidden
    factCatalogProfile: form-process-binding
    name: 已被作业流程引用的表单流程禁止删除
    status: implemented
    visibility: internal
    trigger: form-process.delete
    scope: form-process-configuration
    condition:
      all:
        - fact: formProcessVersionUsageProjection.referenceCount
          operator: greater-than-or-equal
          value: 1
    result:
      type: block
      reason: form-process-referenced-by-production-work-flow
    explanation: 只要使用情况投影显示表单流程仍被任何作业流程版本中的表单填报节点引用，就禁止删除该表单流程。删除前必须先解除相关作业流程引用，以保护已发布作业流程版本的历史快照和追溯解释。
    evidenceIds: [evidence.production-form-process-user-confirmed-v5, evidence.form-process-delete-reference-guard, evidence.form-process-delete-reference-guard-test]
  - id: rule.ai.runtime-determinism
    name: Codex/生成式 AI 不直接决定生产运行结果
    status: specified
    visibility: internal
    trigger: production.runtime.execute
    scope: production-runtime
    condition:
      all:
        - fact: runtimeDecision.source
          operator: equals
          value: generative-ai
    result:
      type: block
      reason: runtime-must-use-versioned-rules-and-handlers
    explanation: Codex 或其他生成式 AI 只能在产品外部交付流程中生成候选知识、规则、作业定义、扩展插件、迁移、测试和文档；这些候选产物必须经过仓库契约规定的校验、人工确认和发布，生产运行结果不得由 Codex 或生成式 AI 直接决定，而必须由版本化规则、作业定义和已注册动作处理器确定性执行。
    evidenceIds: [evidence.ai-transaction-runtime-architecture]
