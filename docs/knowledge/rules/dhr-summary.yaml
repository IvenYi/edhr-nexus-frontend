knowledgeModelVersion: 0.3.24
rules:
  - id: rule.dhr-summary-only-after-production-complete
    name: 生产完成后才能整理和提交 DHR 汇总
    status: specified
    visibility: internal
    trigger: dhr-summary.save-or-submit
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.production-complete, operator: equals, value: true}
    result:
      type: allow-with-governance
      action: edit-or-submit-summary
    explanation: 普通汇总整理与提交仍要求生产正常完成；该资格不控制证据可见性，进行中及已终止 DHR 仍按权限只读查阅实际证据。终止后不进入普通汇总或审批，沿用 DEC-0069。
    evidenceIds: [evidence.dhr-summary-user-confirmed, evidence.dhr-summary-service]
  - id: rule.dhr-summary-required-directory-completeness
    name: 提交前满足必填基础目录完整性
    status: specified
    visibility: internal
    trigger: dhr-summary.submit
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.required-directory-qualified, operator: equals, value: true}
    result:
      type: allow-with-governance
      action: freeze-summary-version
    explanation: 必填基础目录应具有适用规则要求的合格完成记录；缺失、未完成或无有效记录时阻断提交，作废/失败/已替代记录可查但不冒充合格完成。表单 COMPLETED 不代表检验合格；该检查不替代其他适用质量结论、异常处置、签署、有效性及未完成补录检查，目录整理不能绕过检查。
    evidenceIds: [evidence.dhr-summary-user-confirmed, evidence.dhr-summary-service]
  - id: rule.dhr-summary-freeze-version
    name: DHR 汇总提交形成不可变版本
    status: specified
    visibility: internal
    trigger: dhr-summary.submit
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.version-frozen, operator: equals, value: false}
    result:
      type: freeze-execution-snapshot
      fields: [evidenceScope, checkResults, manualReviewConfirmation, baseDirectory, overlayDirectories, directoryPresentation, placements, sourceVersions, sourceStatuses, sourceSnapshots, attachmentReferences, sourceHashes, summaryHash, reviewBinding]
      laterChangesRewriteVersion: false
      revisionBasis: latest-formalized-version
      revisionCreates: draft
      revisionDraftSummaryStatus: DRAFT
      nextVersionNumberAssignedAt: submit
      historicalVersionAccess: explicit-version-selector-read-only
    explanation: 核查后在提交时重新核对完整集合、来源版本及新增实例/附件，陈旧提交拒绝并提示刷新；冻结生产对象全部实际关联证据及检查结果（规则依据/版本、时间、问题、处置及确认），目录位置、顺序和别名仅是同一版本的展示属性。审批、详情和 ZIP 统一当前模型，同一实例身份唯一；version_no 保留正常业务修订，不设 evidence_model_version 分支。发起修订沿既有资格、原因及权限基于最新定版创建 DRAFT 汇总中草稿，不立即创建或批准下一冻结版本；重新核查提交时才分配下一 version_no，并按原配置审批。草稿存在时历史版本仍可通过版本选择只读查看及按原权限导出，不以数据审计替代版本正文查看，也不以历史只读入口开放草稿写权。正常版本不被后续变化改写；前期错误旧汇总按 DEC-0063-09 备份后转换为待核查草稿或清理，保留可用编排，不覆盖当前模型冻结和草稿，不删除源表单、生产对象、签署、原审计或终止快照。转换草稿必须重新核查提交，旧 FORMALIZED 状态或版本行存在不证明完成核查。
    evidenceIds: [evidence.dhr-summary-user-confirmed, evidence.dhr-summary-compliance-assessment, evidence.dhr-summary-service, evidence.dhr-frozen-evidence-integrity-source, evidence.dhr-summary-migration]
  - id: rule.dhr-summary-manual-review-confirmation
    name: 提交前人工逐项确认并冻结确认记录
    status: specified
    visibility: internal
    trigger: dhr-summary.submit
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.manual-review-confirmed, operator: equals, value: true}
    result:
      type: allow-with-governance
      action: freeze-summary-version
      requiredConfirmations: [quality-and-exceptions, source-approvals-and-signatures, complete-evidence-scope]
      requiredNote: true
      freezeIn: checkResult.manualReview
      freezeFields: [confirmedBy, confirmedAt, note]
      automaticQualityConclusionInterpretation: false
    explanation: 提交人须逐项人工核查质量结果及异常处置、来源审批签署和完整证据范围，填写说明；缺任一确认或说明阻断提交。checkResult 保留三项确认、确认人、时间及说明。该签认只记录人的核查责任，不自动判定任意表单质量合格或签署有效，亦不替代其他客观阻断检查。旧冻结缺少 checkResult 不能追认为已核查，转换草稿必须再次确认；迁移不得补造过去的确认人、时间、说明或审批，审批不因模型标记而豁免核查。
    evidenceIds: [evidence.dhr-summary-user-confirmed, evidence.dhr-summary-service, evidence.dhr-summary-complete-evidence-tests]
  - id: rule.dhr-summary-review-binding
    name: DHR 汇总审核策略绑定已发布流程版本
    status: specified
    visibility: internal
    trigger: product-process-version.save
    scope: dhr-summary-review-configuration
    condition: {fact: fact.dhr-summary.review-mode, operator: equals, value: REQUIRED}
    result:
      type: persist-version-references
      workflowBusinessType: DHR_SUMMARY
      workflowVersionStatus: PUBLISHED
      freezeAt: first-production-start
    explanation: REQUIRED 选择已发布 DHR_SUMMARY 定义和版本并在开工冻结；NONE 不另启本系统汇总审批，不豁免适用法定审核、源表单签署或放行。当前已有旧审批代码，但本次完整证据及检查结果审批尚未验收。
    evidenceIds: [evidence.dhr-summary-user-confirmed, evidence.dhr-summary-service, evidence.dhr-summary-process-configuration-ui]
  - id: rule.dhr-summary-optional-placement-order
    name: 实例自定义展示位置与同级顺序
    status: specified
    visibility: internal
    trigger: dhr-summary.save-or-submit
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.version-frozen, operator: equals, value: false}
    result:
      type: allow-with-governance
      action: persist-instance-presentation-order
      positionScope: same-level-directory-or-form
      preserveAcross: [draft-reopen, frozen-version-read]
      removal: restore-default-position-without-changing-evidence-scope
      sameTemplateInstances: independent-persistence
    explanation: 作业/自定义实例可整理到同级任意位置，取消自定义位置恢复默认来源位置；证据范围、内容和生产归属不变。保存重开及提交冻结保持位置与顺序，来源分组仅改变批量整理单位，旧冻结版本不可修改。
    evidenceIds: [evidence.dhr-summary-order-user-confirmed, evidence.dhr-summary-order-service, evidence.dhr-summary-order-ui, evidence.dhr-summary-order-migration]
  - id: rule.dhr-summary-source-group-presentation
    name: 来源分组与实例级展示整理
    status: specified
    visibility: internal
    trigger: dhr-summary.open-or-place-or-submit
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.source-definition-key, operator: is-present, value: true}
    result:
      type: allow-with-governance
      action: present-and-organize-source-definition-group
      groupingKey: [originKind, operationId, formId]
      missingSourceKeyFallback: recordId
      placementInteraction: whole-group-or-single-instance-presentation-only
      partialPlacementDisplay: customized-presentation-count/total-count-not-evidence-coverage
      mixedCompletionHandling: retain-all-real-statuses-without-silent-skipping
      leftDirectoryGrouping: adjacent-same-source-instances-only
      preservePlacementOrderIn: [draft, readOnly]
      instanceRemoval: restore-default-position-without-changing-evidence-scope
      persistenceUnit: form-instance
      frozenVersionMutation: forbidden
    explanation: 同工序同作业填报节点或同一次自定义创建项成组，同模板不同节点/创建项不得合组。全部实例自动归集并保留真实状态，整组和单份操作仅整理展示，不以完成或手选过滤证据。左侧仅相邻同源折叠，真实交错顺序保持；应有缺项及未完成补录按适用规则阻断，空来源不造证据。旧实现测试仅见 DEC-0072 实现差异，不证明本次能力。
    evidenceIds: [evidence.dhr-summary-source-group-user-confirmed, evidence.dhr-summary-source-group-ui, evidence.dhr-summary-work-form-id, evidence.dhr-summary-custom-form-id, evidence.dhr-summary-source-group-test, evidence.dhr-summary-service, evidence.dhr-summary-source-group-backend-test]
  - id: rule.dhr-summary-archive-display-name
    name: 草稿实例展示别名与证据范围解耦并随版本冻结
    status: specified
    visibility: internal
    trigger: dhr-summary.rename-placement-or-submit
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.version-frozen, operator: equals, value: false}
    result:
      type: allow-with-governance
      action: persist-placement-display-name
      editScope: current-draft-evidence-presentation
      originKinds: [DIRECTORY, WORK, CUSTOM]
      directoryPlacement: automatic-fixed-target-without-order-override-or-removal
      adjacentGroupScope: current-adjacent-segment-only
      singleRowScope: one-instance
      sourceMutation: forbidden
      frozenVersionMutation: forbidden
      emptyDisplayNameFallback: source-name
      reorganize: copy-previous-version-display-name
    explanation: DIRECTORY、WORK、CUSTOM 的真实证据均可设置草稿展示别名；组行限当前范围，相邻折叠行限本段，单份限一份。保存重开、冻结指纹和新草稿继承保留别名，未设置别名时显示来源名称，这是当前展示默认值而非旧模型兼容；来源内容、生产归属、基础目录及完整证据范围不变，DIRECTORY 固定展示位置保留。旧汇总转换保留可用别名和位置，不能据此继承历史核查结论；迁移验证见 DEC-0063-09。
    evidenceIds: [evidence.dhr-summary-source-group-user-confirmed, evidence.dhr-summary-service, evidence.dhr-summary-controller, evidence.dhr-summary-ui, evidence.dhr-summary-display-name-migration, evidence.dhr-summary-display-name-test-source]
  - id: rule.dhr-summary-auto-evidence-scope
    name: 按生产对象自动归集全部实际关联证据
    status: specified
    visibility: internal
    trigger: dhr-summary.collect-or-check
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.evidence-scope, operator: is-present, value: true}
    result:
      type: return-query-projection
      target: dhrSummary.completeEvidence
      sources: [directory-instance, work-instance, custom-instance, controlled-attachment]
      manualSelectionFiltersEvidence: false
      completionFiltersVisibility: false
      emptySourceCreatesEvidence: false
    explanation: 执行上下文绑定作业/工序表单的生产对象，自动归集实际实例及受控附件。未完成、失败、作废、已替代记录保持可见与真实状态；合格完成和提交资格由适用检查决定。自定义上下文和附件关联须核验，填错批次值是内容错误，不假设正常自动归属会错。
    evidenceIds: [evidence.dhr-summary-user-confirmed]
  - id: rule.dhr-summary-block-stale-approval
    name: 有效证据变化阻断过时批准且保留历史
    status: specified
    visibility: internal
    trigger: dhr-summary.source-effective-change-or-approve
    scope: dhr-summary-review
    condition: {fact: fact.dhr-summary.effective-evidence-change, operator: equals, value: true}
    result:
      type: block
      action: approve-stale-summary-version
      notifyAffectedReview: true
      automaticReturn: false
      humanResolution: return-or-new-version-review
      preserveOldApproval: true
    explanation: 自动检测完整证据范围的来源生效变化并提示，包含新增关联证据及附件变化；申请待审不等于生效。人工退回或发起新版本重审，旧批准和快照保留，源变更作废仍由记录控制域判定；不改变生产、终止或放行状态。
    evidenceIds: [evidence.dhr-filling-review-confirmed, evidence.dhr-summary-user-confirmed]
  - id: rule.dhr-summary-controlled-attachment-upload
    name: DHR 受控附件格式与单文件容量边界
    status: specified
    visibility: internal
    trigger: dhr-summary.attachment-upload
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.production-complete, operator: equals, value: true}
    result:
      type: allow-with-governance
      action: upload-controlled-attachment
      supportedFormats: [PDF, PNG, JPEG, DOC, DOCX, XLS, XLSX]
      maxFileSizeBytes: 52428800
      maxFileSizeInclusive: true
      officeHandling: original-file-upload-and-download
      officeOnlinePreview: false
      officeOnlineEdit: false
      officeConversion: false
      preserveOriginalBytes: true
      originalDigestAlgorithm: SHA-256
      unlinkDeletesOriginalFile: false
      preserveFrozenReferences: true
    explanation: DEC-0063-10 与 officeAttachmentSupport 的已确认范围；50MB 为 50*1024*1024 字节，含边界，超出一字节拒绝。保留既有 PDF/PNG/JPEG，新增四种 Office 原文件上传下载；原件字节、摘要、核验、权限、冻结引用及带原因解除关联保留原文件的规则不变。生产完成仅为前置条件，仍须满足原汇总编辑授权和可编辑状态；格式与容量合格不等于来源、生产对象或内容核验通过。此规则为 specified/internal，不证明实现、迁移或整体验证已通过。
    evidenceIds: [evidence.dhr-summary-user-confirmed, evidence.dhr-summary-attachment-service]
  - id: rule.dhr-review-task-frozen-attachment-download
    name: 审批任务附件仅供任务授权主体按冻结版本下载
    status: specified
    visibility: internal
    trigger: dhr-review.attachment-download
    scope: dhr-summary-review
    condition: {fact: fact.dhr-summary.review-task-attachment-authorized, operator: equals, value: true}
    result:
      type: allow-with-governance
      action: download-frozen-version-attachment
      taskScope: current-pending-or-own-handled-task
      attachmentScope: task-bound-frozen-version
      liveDhrViewPermissionSubstitute: false
    explanation: 审批页附件下载必须经过任务处理权或本人已办授权，并仅返回任务绑定版本快照中 id 与摘要匹配的附件；仅有 DHR 查看权或其他任务权限不能扩大下载范围。
    evidenceIds: [evidence.dhr-summary-user-confirmed, evidence.dhr-review-controller, evidence.dhr-review-service, evidence.dhr-summary-attachment-service, evidence.dhr-review-attachment-permission-tests]
  - id: rule.dhr-summary-zip-source-trace
    name: 冻结版本中文 ZIP 的可打印正文、附件原件与来源追溯
    status: specified
    visibility: internal
    trigger: dhr-summary.export-zip
    scope: dhr-summary
    condition: {fact: fact.dhr-summary.version-frozen, operator: equals, value: true}
    result:
      type: allow-with-governance
      action: export-frozen-version-zip
      include: [source-production-execution-audit, source-production-execution-signatures, dhr-audit, review-signatures]
      selectedRangeChangesApprovalScope: false
      selectionStructure: frozen-archive-directory-tree
      selectionUnits: [directory, group, instance, controlled-attachment]
      scope: [FULL, SELECTED]
      humanDirectoryLanguage: zh-CN
      sourceDirectories: [批记录模板, 作业表单, 自定义表单]
      combinedPdf: frozen-template-layouts-in-archive-order
      instancePdf: original-template-layout-by-source
      instanceAttachmentsDirectory: 附件
      summaryAttachmentsDirectory: 汇总附件
      traceDirectory: 追溯资料
      traceFormat: JSON
      attachmentContentInCombinedPdf: false
      attachmentIndexInCombinedPdf: true
      instanceAttachments: frozen-instance-original-evidence
      missingOrCorruptInstanceAttachment: block-export
      officeConversion: false
      contentBasis: same-explicit-frozen-version
      currentLiveValuesSubstitute: false
    explanation: 选择器按同版冻结档案目录、顺序和别名支持完整及自定义范围；总 PDF 按档案顺序呈现表单正文与附件索引，单实例原模板版式 PDF 按实际来源归类，目录整理不改变来源身份或重复计数。表单内附件原件归对应实例的附件目录，汇总附件原件归根级汇总附件；实例原件缺失或内容损坏时阻断完整导出及包含该实例的选定范围导出，不能静默省略原证据。附件内容不合入总 PDF，Office 不转换。JSON 与机器清单留在追溯资料，用于冻结数据、摘要、来源生产执行审计与签名及 DHR 审计/审批签署的关联，不代替可打印正文。版本及完整/选定范围明确标识，部分包不冒充完整 DHR，总 PDF 不替代附件原件；导出不重定义冻结证据或审批对象。具体打印引擎、字段文件识别和防护、默认联选依赖属于工程推断，见确认证据；实现仍在进行，不据旧 ZIP 源码或旧测试声称本轮 PDF、全部外部记录控制事件或发布验收完成。
    evidenceIds: [evidence.dhr-summary-user-confirmed, evidence.dhr-summary-archive-service, evidence.dhr-frozen-evidence-integrity-source, evidence.dhr-form-files-source, evidence.dhr-form-files-test-source, evidence.dhr-summary-attachment-archive-tests]
