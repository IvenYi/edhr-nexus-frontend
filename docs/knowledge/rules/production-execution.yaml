knowledgeModelVersion: 0.3.25
rules:
  - id: rule.operation-output-field-purpose
    name: 当前工序显式用途的正式累计与过程参考
    status: implemented
    visibility: internal
    trigger: production-execution.query
    scope: production-execution
    condition:
      fact: operation.hasQuantityPurposeFields
      operator: equals
      value: true
    result:
      type: return-query-projection
      fields: [goodQuantity, ngQuantity, scrapQuantity, outputQuantity]
      source: current-operation-explicit-business-purpose-sources
      separateFormalAndSavedReference: true
      independentMetrics: true
    explanation: 当前工序按真实属于该工序的显式报工、报废等用途来源分别累计良品、NG、报废和明确产出，不按字段名猜测，不把三项相加或相减推导产出。已生效数量限最终完成且成功投影并满足指标计入条件的来源；已填报数量是各份已保存内容的累计，包含已生效部分，不等于待生效量，两者不能相加。DEC-0079-06确认以主值浮层展示已填报累计，来源按真实份次、配置及实际行去重并分别标明表单状态及计入状态；不凭已完成推断已生效，无正式值或待核对仍可查看来源。普通工序按原单位和适用物料分组，不能套用产品单位或把全部物料报废视作产品报废；批次质量范围按DEC-0079另定。保留DEC-0045原始确认和历史实现证据；新projection优先、无新统计绑定时legacy仅过程兼容，旧operationOutputs不再合成产出。既有累计链为implemented/internal；06新增展示承诺的实现及3000交互须取得本轮证据，不以知识更新冒充验收或标verified/runtime。
    evidenceIds: [evidence.batch-quality-linkage-confirmed, evidence.batch-quality-linkage-runtime-source, evidence.batch-quality-linkage-main-validation, evidence.operation-output-user-decision, evidence.operation-output-field-purpose-source, evidence.operation-output-summary-source, evidence.production-execution-snapshot-builder-source, evidence.production-execution-service-source, evidence.operation-quantity-popover-confirmed]
  - id: rule.production-execution-context
    name: 批次和SN执行上下文
    status: implemented
    visibility: internal
    trigger: production-object.scan
    scope: production-execution
    condition:
      fact: productionObject.exists
      operator: equals
      value: true
    result:
      type: return-query-projection
      fields: [productionObject, workOrder, product, productProcessVersion, routeVersion, dhrTemplateVersion, executionStatus, operations]
    explanation: 扫描批次或SN条码后，同屏展示当前对象关联的工单、产品、产品配置、工艺路线和eDHR，并明确是否已开工、当前执行工序及工序可执行状态；具体接口字段与条码识别算法由实现证据说明，不构成新业务默认规则。
    evidenceIds: [evidence.production-execution-user-decision, evidence.production-execution-product-configuration-contract, evidence.production-execution-snapshot-builder-source, evidence.production-execution-service-source, evidence.production-execution-page-source, evidence.production-execution-integration-tests]
  - id: rule.production-execution-completion-check
    name: 工序完工条件校验
    status: implemented
    visibility: internal
    trigger: operation.complete
    scope: production-execution
    condition:
      fact: operation.completionConditionsSatisfied
      operator: equals
      value: true
    result:
      type: allow-with-governance
      action: operation.complete
      requiredCheck: current-operation-completion-conditions
    explanation: 当前工序申请完工时必须校验完工条件，并向操作者说明检查结果；仅当条件满足才允许完工。本切片已有服务端必填表单实际完成记录、适用作业完成与字段值复校验；不能把缺少来源当成满足。通知投递、原始路线连线条件、返工入口与不支持节点继续明确阻断，implemented只描述该受限运行链，不表示全部配置可运行。既有必填表单业务语义仍复用 rule.product-process.form-complete-before-operation，不据此全局推进旧规则成熟度。
    evidenceIds: [evidence.production-execution-user-decision, evidence.production-execution-product-configuration-contract, evidence.production-execution-engine-source, evidence.production-execution-service-source, evidence.production-execution-access-source, evidence.production-execution-engine-tests, evidence.production-execution-integration-tests]
  - id: rule.production-execution.form-current-node-action-projection
    name: 生产执行按当前表单流程节点投影动作
    status: specified
    visibility: internal
    trigger: production-form.controls.query
    scope: production-execution-form-process
    condition:
      all:
        - fact: productionForm.currentNodeKind
          operator: in
          value: [START, APPROVAL]
        - fact: productionForm.currentNodeActionProjection
          operator: is-present
          value: true
    result:
      type: return-query-projection
      fields: [nodeId, nodeName, nodeKind, buttons, permissions, signaturePermissions]
      source: active-form-process-node
      actionSource: current-node-button-configuration
      fillActionsOnlyAt: [START]
      approvalActionsOnlyAt: [APPROVAL]
      forbiddenActionsAtApproval: [SAVE, SUBMIT]
      clientRendering: controls.buttons
      authorization: server-recomputed-before-execution
    explanation: 用户已确认生产执行表单完成首个填报节点并到达后续审批节点后不再展示暂存/提交；审批节点动作由当前节点按钮配置投影。源码证据表明底部动作栏位于生产执行页，FormCanvasPreview/FormDocumentPreview 只负责字段或文档渲染；前端投影不能替代服务端当前节点、处理权和动作白名单校验。空或缺失按钮配置的历史回退策略登记为实现差异，不在本规则中静默扩展业务语义。
    evidenceIds: [evidence.production-execution-form-action-projection-user-confirmed, evidence.production-execution-form-action-projection-source, evidence.production-execution-form-action-projection-page-source, evidence.production-execution-form-action-projection-renderer-source, evidence.production-execution-form-action-projection-engine-test]
