knowledgeModelVersion: 0.3.25
rules:
  - id: rule.identity.runtime-subject-resolution
    name: 运行时主体解析为当前有效用户
    status: implemented
    visibility: internal
    trigger: subject.resolve
    scope: identity-runtime
    condition:
      all:
        - fact: subject.references
          operator: is-present
          value: true
    result:
      type: resolve-subject-users
      supportedSubjectTypes: [USER, DEPARTMENT, ROLE]
      departmentScopes: [SELF_ONLY, SELF_AND_CHILDREN]
      membershipSource: latest-at-call-time
      inactiveUsersExcluded: true
      deduplicateBy: userId
      retainMatchProvenance: true
      invalidReferenceBehavior: ignore-and-report
    explanation: 身份域公共解析器接收标准主体引用，在调用时读取最新用户、部门、角色及其关系，将部门按主体范围展开，将角色按当前用户-角色关系展开，并排除无效或非 ACTIVE 用户。最终用户集合按稳定 userId 去重；每个用户命中的全部主体来源、部门范围和角色引用保留在解析结果中。解析器只负责身份解析，不决定任务落库、审批策略、字段权限合并或通知投递。
    evidenceIds: [evidence.identity-user-account, evidence.identity-department, evidence.identity-role, evidence.identity-user-department-repository, evidence.identity-user-role-repository, evidence.identity-department-repository, evidence.identity-subject-resolver-contract, evidence.identity-subject-resolver-implementation, evidence.identity-subject-resolver-tests]
  - id: rule.identity.empty-subjects-do-not-expand-users
    name: 空主体由业务调用方解释且不展开全量用户
    status: specified
    visibility: internal
    trigger: subject.resolve
    scope: identity-runtime
    condition:
      all:
        - fact: subject.references
          operator: is-present
          value: false
    result:
      type: planned-permission-control
      expandAllUsers: false
      callerOwnsAuthorization: true
    explanation: 公共主体解析器收到空主体时不把“所有人”转换成全量用户列表。需要开放操作范围的表单流程调用方负责结合认证用户、流程实例和任务状态授权；需要具体收件人集合的其他调用方不得把空主体误认为全量收件人。
    evidenceIds: [evidence.identity-form-process-empty-subject-user-confirmed, evidence.identity-subject-resolver-contract]
  - id: rule.identity.runtime-department-overlap-deduplication
    name: 重叠部门解析避免重复用户
    status: implemented
    visibility: internal
    trigger: subject.resolve
    scope: identity-runtime
    condition:
      all:
        - fact: subject.references
          operator: is-present
          value: true
        - fact: subject.departmentScopes
          operator: in
          value: [SELF_ONLY, SELF_AND_CHILDREN]
    result:
      type: resolve-subject-users
      deduplicateBy: userId
      retainMatchProvenance: true
    explanation: 同一解析请求中父部门含下级和子部门主体可能展开相同成员；解析器按各主体分别遍历部门树，汇集部门 ID 后批量查询成员，最终按 userId 去重并保留不同主体的命中来源。当前实现不含跨主体子树展开缓存，不能把结果去重解释为已避免所有重复遍历。
    evidenceIds: [evidence.identity-department-repository, evidence.identity-user-department-repository, evidence.identity-subject-resolver-contract, evidence.identity-subject-resolver-implementation, evidence.identity-subject-resolver-tests]
  - id: rule.workflow.task-creation-freezes-candidate-resolution
    name: 工作流任务创建冻结候选解析快照
    status: implemented
    visibility: internal
    trigger: workflow-task.create
    scope: workflow-runtime
    condition:
      all:
        - fact: subject.resolution.completed
          operator: equals
          value: true
    result:
      type: create-logical-workflow-task
      logicalTaskCount: 1
      candidateSnapshotUserCount: resolved-user-count
      persistResolutionSnapshot: true
      persistMatchProvenance: true
      candidateMembershipFrozenAfterCreate: true
      membershipFreezeScope: creation-resolution-evidence
    explanation: 审批节点到达时使用主体解析结果创建一个逻辑工作流任务，并在候选快照中记录去重候选、主体命中来源及未解析主体。candidateMembershipFrozenAfterCreate限定创建来源证据：不因组织或角色关系变化重算，也不能被显式转办覆盖。DEC-0081允许单独改变当前受让人，不把原来源保留解释成原候选继续拥有转办后的处理权。
    evidenceIds: [evidence.workflow-task-multi-candidate-user-confirmed, evidence.identity-subject-resolver-contract, evidence.workflow-task-multi-candidate-runtime-implementation, evidence.workflow-task-candidate-persistence, evidence.workflow-task-candidate-migration, evidence.tenant-task-delegation-20261020]
  - id: rule.workflow.task-any-candidate-completes-and-closes-siblings
    name: 任一候选完成逻辑任务
    status: implemented
    visibility: internal
    trigger: workflow-task.complete
    scope: workflow-runtime
    condition:
      all:
        - fact: task.candidateMembership
          operator: contains-actor
          value: true
        - fact: workflowTask.status
          operator: in
          value: [PENDING, PROCESSING]
    result:
      type: complete-logical-task
      nonCandidateBehavior: block
    explanation: 对具有非空当前有效人员集合且非 unrestricted 的待处理任务，task.candidateMembership判断当前处理资格：未显式转办时为创建候选，按DEC-0081合法委托后仅包含当前受让人，不能以仍保留的原来源给旧候选办理权。PENDING或PROCESSING时当前有权人员可完成单条逻辑任务，终态使其他人自然失权；非当前有效人员仍block。DEC-0033的unrestricted范围及旧assignee回退由各自路径负责，不从本条推导其必须具有候选成员。
    evidenceIds: [evidence.workflow-task-multi-candidate-user-confirmed, evidence.production-form-process-user-confirmed-v2, evidence.workflow-task-multi-candidate-runtime-implementation, evidence.workflow-task-candidate-persistence, evidence.tenant-task-delegation-20261020]
