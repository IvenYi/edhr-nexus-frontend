knowledgeModelVersion: 0.3.25
rules:
  - id: rule.record-correction.new-revision-only
    name: 表单变更必须形成新修订
    status: specified
    visibility: internal
    trigger: record-correction.approved
    scope: record-control
    condition:
      all:
        - fact: sourceRecord.completed
          operator: equals
          value: true
        - fact: sourceRecord.currentRevisionExists
          operator: equals
          value: true
    result:
      type: update-reference
      target: correctionRevision
      referenceMode: new-revision-with-frozen-source
      sourceRevisionReadOnly: true
    explanation: DEC-0087-02 明确首期申请保存与正式值隔离的拟变更内容，批准时才生成并切换到下一有效内容修订；审批通过前不写回来源记录，来源修订的完整快照、原签名和哈希作为历史证据只读保留。该时点补正不取消受控变更必须形成新修订的约束。
    evidenceIds: [evidence.record-correction-void-design, evidence.record-control-v1-user-confirmed, evidence.record-control-integration-20261028]
  - id: rule.record-void.no-field-mutation
    name: 表单作废不修改字段值
    status: specified
    visibility: internal
    trigger: record-void.approved
    scope: record-control
    condition:
      all:
        - fact: voidRequest.approved
          operator: equals
          value: true
        - fact: currentRevision.exists
          operator: equals
          value: true
    result:
      type: update-reference
      target: currentRevision
      referenceMode: mark-voided-without-field-change
      retainHistory: true
    explanation: 作废是记录级结果；通过后当前有效修订标为已作废但不改字段值，历史修订、投影、DHR 成员、签名和审计证据不得物理删除。
    evidenceIds: [evidence.record-correction-void-design]
  - id: rule.record-control.explicit-published-workflow-selection
    name: 记录控制发起必须显式选择匹配的已发布审批流程
    status: implemented
    visibility: internal
    trigger: record-control.application.confirm
    scope: record-control-workflow
    condition:
      all:
        - fact: selectedWorkflow.versionStatus
          operator: equals
          value: PUBLISHED
        - fact: selectedWorkflow.actionTypeMatchesRequest
          operator: equals
          value: true
        - fact: selectedWorkflow.explicitlySelected
          operator: equals
          value: true
    result:
      type: freeze-execution-snapshot
      references: [workflowDefinitionId, workflowVersionId]
      blockWhenNoCandidate: true
    explanation: P0 变更和作废不预绑定、不自动代选；申请人必须从有对应发起权限且动作类型匹配的当前已发布流程版本中显式选择。公共流程阶段一已实现候选查询和显式版本启动，启动时重新校验定义类型、申请类型和当前已发布版本，冻结定义、版本、上下文和流程快照摘要；草稿、历史非当前版本和停用模板不可用于发起。来支已提供记录控制域的来源资格、签名、申请确认事务和流程引用回写实现；当前集成候选的迁移、首次完成修订和实际运行验证另取本切片证据，不由该实现说明宣称完整 P0 通过。
    evidenceIds: [evidence.record-correction-void-design, evidence.record-control-start-entry-user-confirmed, evidence.record-control-workflow-stage1-candidate-service, evidence.record-control-workflow-stage1-candidate-api, evidence.record-control-workflow-stage1-explicit-start-engine, evidence.record-control-workflow-stage1-engine-tests, evidence.record-control-workflow-stage1-service-tests, evidence.record-control-workflow-stage1-api-tests]
  - id: rule.record-control.application-confirmation-starts-review
    name: 记录控制申请确认即启动审批
    status: specified
    visibility: internal
    trigger: record-control.application.confirm
    scope: record-control-workflow
    condition:
      all:
        - fact: request.contentPrepared
          operator: equals
          value: true
        - fact: request.applicantSignatureVerified
          operator: equals
          value: true
        - fact: selectedWorkflow.explicitlySelected
          operator: equals
          value: true
        - fact: selectedWorkflow.versionStatus
          operator: equals
          value: PUBLISHED
        - fact: selectedWorkflow.actionTypeMatchesRequest
          operator: equals
          value: true
    result:
      type: planned-transaction-trigger
      transaction: create-review-instance-and-route
      freezeReferences: [workflowDefinitionId, workflowVersionId]
      target: firstApprovalNode
      startNodeTask: none
    explanation: 申请内容准备完成、申请人电子签名验证通过且显式选择匹配的已发布流程后，点击确认即构成一次发起动作；系统应在同一确定性事务中创建审批实例、冻结流程版本并直接推进到首个审批节点，不产生开始节点待办或二次保存、提交动作。公共流程 Java 端口及记录控制申请适配器已有源码和聚焦断言；本条更广业务规则保留 specified/internal，当前集成运行证据不覆盖非管理员完整矩阵、撤回/转办/重新分配及完整 DHR/A12 生命周期。
    evidenceIds: [evidence.record-control-start-entry-user-confirmed, evidence.record-correction-void-design, evidence.record-control-workflow-stage1-port, evidence.record-control-workflow-stage1-explicit-start-engine, evidence.record-control-workflow-stage1-engine-tests]
  - id: rule.record-control.review-template-category-scope
    name: 首切片审批流程仅支持表单变更和表单作废
    status: specified
    visibility: internal
    trigger: review-template.configure-or-reference
    scope: record-control-workflow
    condition:
      all:
        - fact: workflowTemplate.category
          operator: in
          value: [CHANGE, OBSOLETE]
    result:
      type: allow-with-governance
      categories: [CHANGE, OBSOLETE]
      appliesTo: [new-template, new-reference]
    explanation: 首切片流程工作台仅管理表单变更和表单作废两类审批流程；分类持久化并参与查询和动作匹配。
    evidenceIds: [evidence.record-correction-void-design]
  - id: rule.record-control.canonical-action-terms
    name: 记录控制动作使用统一中文产品术语
    status: specified
    visibility: internal
    trigger: record-control.product-content.publish
    scope: record-control
    condition:
      all:
        - fact: recordControl.productTerminologyContext
          operator: equals
          value: true
    result:
      type: include-as-product
      target: recordControl.customerFacingActionNames
      values: [表单变更, 表单作废, 转办, 重新分配, 退回]
      preserveTechnicalIdentifiers: [correction, CHANGE, OBSOLETE, TRANSFER, RETURN]
    explanation: 当前产品文档、页面文案、接口说明和验收用例中的记录控制动作统一使用表单变更、表单作废、转办、重新分配和退回；“更正”“普通转办”“管理重新分配”不再作为现行中文产品动作名。稳定英文技术标识、Java 类名、数据库字段和权限码不因中文术语治理而破坏性重命名；CAPA 纠正措施和普通语义中的请求拒绝不属于本规则范围。
    evidenceIds: [evidence.record-control-terminology-user-confirmed]
  - id: rule.record-control.review-template-required-approver-subjects
    name: 审批流程审批节点必须配置审批主体
    status: specified
    visibility: internal
    trigger: review-template.publish
    scope: record-control-workflow
    condition:
      any:
        - fact: reviewTemplate.approvalNodePresent
          operator: equals
          value: false
        - fact: reviewTemplate.approvalNode.approverSubjectsConfigured
          operator: equals
          value: false
    result:
      type: block
      reason: review-template-approval-subjects-required
    explanation: 记录控制审批流程发布前必须至少有一个审批节点，且每个审批节点都必须配置审批主体。未配置审批主体不得发布，也不能解释为当前租户全员可审。
    evidenceIds: [evidence.record-control-review-template-required-approvers]
  - id: rule.record-control.review-template-fixed-actions
    name: 审批流程动作语义固定但呈现属性可配置
    status: specified
    visibility: internal
    trigger: review-template.configure
    scope: record-control-workflow
    condition:
      any:
        - fact: reviewTemplate.fixedActionMutated
          operator: equals
          value: true
        - fact: reviewTemplate.configurableFillPermissionRequested
          operator: equals
          value: true
    result:
      type: block
      reason: review-template-actions-are-system-fixed
    explanation: 记录控制审批流程不提供发起填报权限或表单校验配置，也不绑定具体表单字段。开始节点只表示流程边界，不配置按钮；审批节点固定提供审批、退回、转办，动作语义及显隐由系统固定，不能增删、替换、重复或隐藏。审批按钮的显示名称、样式和动作前账户密码电子签名可配置，审批和退回可配置审批意见必填，转办不提供审批意见必填配置。记录控制审批流程不提供填充签名字段或签名字段绑定；此处沿用 DEC-0041 的配置范围，记录控制运行时签署尚未实现，不套用 DEC-0074 的生产/DHR 按钮认证规则。
    evidenceIds: [evidence.record-control-start-entry-user-confirmed, evidence.record-control-review-template-required-approvers, evidence.record-control-review-template-publish-tests]
  - id: rule.record-control.review-template-start-has-no-buttons
    name: 记录控制审批流程开始节点不配置按钮
    status: specified
    visibility: internal
    trigger: review-template.configure-or-publish
    scope: record-control-workflow
    condition:
      all:
        - fact: reviewTemplate.startNode.buttonConfigurationPresent
          operator: equals
          value: true
    result:
      type: block
      reason: review-template-start-node-has-no-button-configuration
    explanation: 记录控制审批流程只描述申请确认后的审批路径；开始节点是无用户任务的流程边界。开始节点不得保存 SAVE、SUBMIT、按钮事件或其他按钮配置，编辑器不显示节点按钮页，发布接口必须拒绝非空开始节点按钮配置。该规则不改变普通表单流程开始节点的保存和提交按钮。
    evidenceIds: [evidence.record-control-start-entry-user-confirmed, evidence.record-control-review-template-editor, evidence.record-control-review-template-publish-tests]
  - id: rule.record-control.review-template-transfer-button-present
    name: 审批节点配置中固定提供转办按钮
    status: specified
    visibility: internal
    trigger: review-template.configure
    scope: record-control-workflow
    condition:
      all:
        - fact: reviewTemplate.approvalNodePresent
          operator: equals
          value: true
    result:
      type: allow-with-governance
      requiredActions: [APPROVE, RETURN, TRANSFER]
      visible: true
      configurable: [displayName, style]
      forbiddenConfig: [requireOpinion]
      runtimeBoundary: transfer-task-action
    explanation: 每个记录控制审批节点都固定提供转办按钮；按钮动作语义和显隐由系统固定，显示名称和按钮样式可配置，不提供审批意见必填配置。转办运行时仍需按任务权限、授权候选范围和原因校验，并记录任务处理人变化及审计。
    evidenceIds: [evidence.record-control-review-template-required-approvers, evidence.record-control-review-template-editor, evidence.record-correction-void-design]
  - id: rule.record-control.source-record-remains-completed-during-review
    name: 记录控制审批中不改变来源记录主状态
    status: specified
    visibility: internal
    trigger: record-control.submit
    scope: record-control-state
    condition:
      all:
        - fact: request.status
          operator: in
          value: [SUBMITTED, IN_REVIEW]
    result:
      type: update-reference
      target: sourceRecord
      referenceMode: retain-lifecycle-status-and-add-active-request-marker
      lockConflictingRequest: true
    explanation: 审批中的变更或作废只锁定来源记录并显示对应标记，不借用 IN_AUDIT 改写表单主状态；来源记录继续显示提交前的完成或复核状态。保留原有效修订不代表下游可以继续收尾；相关 DHR 按 DEC-0068-13 在活动申请期间暂缓汇总提交和审批通过，该阻断与来源真实生效分别判断。
    evidenceIds: [evidence.record-correction-void-design, evidence.dhr-filling-review-confirmed]
  - id: rule.record-control.parallel-review-joins-all-approval
    name: 记录控制并行审批全部通过后汇合
    status: specified
    visibility: internal
    trigger: change-review-task.resolve
    scope: record-control-workflow
    condition:
      all:
        - fact: workflow.parallelBranchesExist
          operator: equals
          value: true
        - fact: workflow.allBranchesApproved
          operator: equals
          value: true
    result:
      type: planned-production-work-trigger
      action: apply-record-correction-or-void
      rejectOnAnyReturn: true
      invalidateRemainingTasksOnReturn: true
    explanation: P0 支持顺序和并行审批；并行分支必须全部批准后汇合，任一退回则本轮退回且其余待办失效。该规则描述审批引擎待开发契约，不表示旧表单按钮配置已经提供并行审批。
    evidenceIds: [evidence.record-correction-void-design]
  - id: rule.record-control.intervention-preserves-path
    name: 转办和重新分配不改变流程路径
    status: implemented
    visibility: internal
    trigger: change-review-task.reassign
    scope: record-control-workflow
    condition:
      any:
        - fact: intervention.type
          operator: equals
          value: ORDINARY_TRANSFER
        - fact: intervention.type
          operator: equals
          value: MANAGERIAL_REASSIGNMENT
    result:
      type: write-audit-record
      preserves: [currentNode, workflowPath, businessOutcome]
      requiresReason: true
      managerialPermissionRequired: true
      managerialSignatureRequired: true
    explanation: 记录控制转办只允许当前有处理权人员从任务详情转给授权候选范围内人员并排除申请人自审；DEC-0081的普通任务租户内集合外委托不扩展本范围。重新分配从流程干预进入，需要专门权限、原授权资格，并按DEC-0091/0092强制电子签名，缺少有效签名不能执行。签名不替代授权或原因，也不将该要求外推普通转办或撤回。两者均只改变当前任务处理责任，保留原候选依据，记录原因、原处理人、目标处理人和管理操作身份，不改变节点、路径或业务结果；本轮源码及主侧PG断言核对支持implemented/internal，不代表知识运行投影、独立质量或生产发布。
    evidenceIds: [evidence.record-correction-void-design, evidence.workflow-reassignment-signature-user-confirmed, evidence.workflow-operations-20261030-user-confirmed, evidence.workflow-operations-responsibility-source, evidence.workflow-operations-postgres-tests, evidence.workflow-operations-main-verification]
  - id: rule.record-control.p0-intervention-boundary
    name: P0 不提供终止跳过强制跳转加签和管理员直接批准
    status: specified
    visibility: internal
    trigger: record-control-workflow.configure-or-operate
    scope: record-control-workflow
    condition:
      any:
        - fact: requestedAction
          operator: in
          value: [TERMINATE, FORCE_JUMP, SKIP, ADD_SIGNER, ADMIN_DIRECT_APPROVE]
        - fact: formProcessButtonConfigurationRequested
          operator: equals
          value: true
    result:
      type: block
      reason: p0-action-not-supported-and-not-a-form-button-configuration
    explanation: P0 只定义记录控制审批的受限撤回、转办和重新分配；终止、强制跳转、跳过、加签和管理员直接批准不进入 P0。记录控制规划动作不得被投影为旧表单按钮配置或已实现能力。
    evidenceIds: [evidence.record-correction-void-design]
  - id: rule.production.work-order-required-fields
    name: 工单必填字段和计划数量校验
    status: specified
    visibility: internal
    trigger: work-order.create-or-update
    scope: work-order
    condition:
      any:
        - fact: workOrder.orderNoPresent
          operator: equals
          value: false
        - fact: workOrder.productSelected
          operator: equals
          value: false
        - fact: workOrder.plannedQuantityPositive
          operator: equals
          value: false
    result:
      type: block
      reason: work-order-required-field-invalid
    explanation: 工单编号、产品和大于零的计划数量必填；订单编号、计划时间和备注可选。工单不再绑定制程，制程由各生产对象创建时显式选择。
    evidenceIds: [evidence.work-order-create-contract, evidence.work-order-page, evidence.production-work-order-entity, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.work-order-planned-time-order
    name: 工单计划时间顺序校验
    status: implemented
    visibility: internal
    trigger: work-order.create-or-update
    scope: work-order
    condition:
      all:
        - fact: workOrder.plannedTimeRangeValid
          operator: equals
          value: false
    result:
      type: block
      reason: planned-end-before-start
    explanation: 当计划开始和结束时间同时提供时，计划结束时间不能早于计划开始时间。
    evidenceIds: [evidence.work-order-create-contract, evidence.production-work-order-entity, evidence.migration-0064-production-work-order-fields, evidence.work-order-page]
  - id: rule.production.active-process-version-selection
    name: 生产对象新选制程必须当前有效
    status: specified
    visibility: internal
    trigger: production-object.create-or-change-process
    scope: product-process-resolution
    condition:
      all:
        - fact: processVersion.effectiveStatus
          operator: not-equals
          value: ACTIVE
    result:
      type: block
      reason: inactive-process-version-unavailable
    explanation: 新建或更换批次制程只能选择当前有效且适用的产品或产品簇版本，候选不展示无效版本。已选版本后续失效保留引用并提示，首次开工必须重核，不能沿用旧工单锁版豁免。
    evidenceIds: [evidence.product-process-resolution-for-production, evidence.production-service, evidence.work-order-page, evidence.production-service-test, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.work-order-mass-production-only
    name: 工单首版仅支持量产
    status: specified
    visibility: internal
    trigger: work-order.create-or-split
    scope: work-order
    condition:
      all:
        - fact: processVersion.productionMode
          operator: is-present
          value: true
        - fact: processVersion.productionMode
          operator: not-equals
          value: 量产
    result:
      type: block
      reason: unsupported-production-mode
    explanation: 生产对象所选制程必须为量产；工单不再以制程字段指定生产方式，生产形态由首批确定并保持。
    evidenceIds: [evidence.production-service, evidence.production-service-test, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.production-form-supported
    name: 生产形态仅支持批次或 SN
    status: implemented
    visibility: internal
    trigger: production-object.split
    scope: production-object
    condition:
      all:
        - fact: processVersion.productionForm
          operator: not-equals
          value: BATCH
        - fact: processVersion.productionForm
          operator: not-equals
          value: SN
    result:
      type: block
      reason: invalid-production-form
    explanation: 生产形态从制程读取并规范化为 BATCH 或 SN；其他值阻断拆分。
    evidenceIds: [evidence.production-service, evidence.production-service-test]
  - id: rule.production.batch-reuses-production-object
    name: 生产批次复用生产对象 BATCH 形态
    status: specified
    visibility: internal
    trigger: production-object.create
    scope: production-batch
    condition:
      all:
        - fact: productionObject.objectType
          operator: equals
          value: BATCH
    result:
      type: write-audit-record
      statuses: [CREATED, IN_PROGRESS, COMPLETED, EARLY_TERMINATED, CANCELLED]
    explanation: 生产批次不新增独立持久化实体或状态机，统一复用 ProductionObject 的 BATCH 生产形态及 CREATED、IN_PROGRESS、COMPLETED、EARLY_TERMINATED、CANCELLED 状态。
    evidenceIds: [evidence.production-object-entity, evidence.production-object-status-machine, evidence.production-service, evidence.production-service-test]
  - id: rule.production.production-object-planned-window
    name: 生产对象计划时间字段与顺序校验
    status: implemented
    visibility: internal
    trigger: production-object.create
    scope: production-object
    condition:
      all:
        - fact: productionObject.plannedTimeRangeValid
          operator: equals
          value: false
    result:
      type: block
      reason: planned-end-before-start
    explanation: 生产对象保存可选计划开始时间和计划结束时间；两者同时提供时，计划结束时间不得早于计划开始时间。
    evidenceIds: [evidence.production-object-entity, evidence.production-object-controller, evidence.production-service, evidence.migration-0066-production-object-planned-window, evidence.work-order-page]
  - id: rule.production.production-batch-import-required-fields
    name: 批次导入必填字段
    status: implemented
    visibility: internal
    trigger: production-object.import
    scope: production-batch
    condition:
      any:
        - fact: importedBatch.batchNoPresent
          operator: equals
          value: false
        - fact: importedBatch.quantityPositive
          operator: equals
          value: false
    result:
      type: block
      reason: batch-import-required-field-invalid
    explanation: 批次导入模板 canonical 字段为批次号和数量（必填）、计划开始时间、计划结束时间和备注（可选）；支持 CSV、XLS、XLSX，上传后校验字段、时间顺序及总量边界并进入待提交清单。
    evidenceIds: [evidence.production-work-order-batch-import-template-ui, evidence.production-work-order-page-pending-list, evidence.work-orders-api]
  - id: rule.production.production-batch-input-quantity-required
    name: 生产批次数量必填且大于零
    status: specified
    visibility: internal
    trigger: production-object.prepare
    scope: production-batch
    condition:
      all:
        - fact: split.targetQuantity
          operator: greater-than-or-equal
          value: 0
        - fact: split.targetQuantity
          operator: not-equals
          value: 0
    result:
      type: persist-version-references
      requiredFields: [quantity]
      target: production-object-pending-list
    explanation: 2026-10-27用户明确BATCH数量必须大于0且允许0.5，本条恢复为当前规范。手动、按每批数量、导入及修改共用该边界，仍受存储精度、总量及其他资格约束；SN=1，批次数为正整数。2026-10-12撤回过度推断只保留为历史依据，不再是现行待决。
    evidenceIds: [evidence.production-work-order-page-pending-list, evidence.production-work-order-batch-import-template-ui, evidence.production-service, evidence.production-batch-quantity-policy-boundary, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.production-object-pending-before-submit
    name: 生产对象先进入待提交清单
    status: implemented
    visibility: internal
    trigger: production-object.prepare
    scope: production-object-batch-submission
    condition:
      all:
        - fact: productionObject.inputMode
          operator: in
          value: [manual, bulk, csv, xls, xlsx]
    result:
      type: persist-version-references
      submissionRequired: true
    explanation: 手动添加、按数量批量添加和 CSV/XLS/XLSX 导入均先生成待提交清单记录，不直接调用持久化接口；用户确认后统一批量提交。
    evidenceIds: [evidence.production-work-order-page-pending-list, evidence.production-work-order-batch-import-template-ui, evidence.work-orders-api]
  - id: rule.production.locked-process-version-read-only-preview
    name: 批次所选制程提供只读内容预览
    status: specified
    visibility: internal
    trigger: production-object.prepare
    scope: production-object
    condition:
      all:
        - fact: productionBatch.productProcessVersion
          operator: is-present
          value: true
    result:
      type: require-explicit-process-version
      immutableAfterFirstStart: true
      preview: read-only
    explanation: 保留稳定ID，当前含义直接改为批次所选制程的只读内容预览。预览只读不限制未开工批次选择或换版，已开工按实际冻结快照解释，不回读当前配置冒充历史。
    evidenceIds: [evidence.production-work-order-process-lock-preview-ui, evidence.production-service, evidence.production-service-test, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.batch-prefix-generation
    name: 批量添加按前缀生成批次号
    status: implemented
    visibility: internal
    trigger: production-object.prepare
    scope: production-object-batch-submission
    condition:
      all:
        - fact: batch.generateCount
          operator: greater-than-or-equal
          value: 1
    result:
      type: persist-version-references
      generatedPattern: "{prefix}-{sequence:03d}"
      target: production-object-pending-list
    explanation: 批量添加按用户输入的批次前缀和三位序号生成候选批次号（例如 PREFIX-001、PREFIX-002）；候选仍先进入待提交清单。
    evidenceIds: [evidence.production-work-order-page-pending-list]
  - id: rule.production.mass-batch-count-distribution
    name: 量产批次按批次数分配剩余数量
    status: implemented
    visibility: internal
    trigger: production-object.prepare
    scope: production-batch
    condition:
      all:
        - fact: process.productionMode
          operator: equals
          value: 量产
        - fact: process.productionForm
          operator: equals
          value: BATCH
        - fact: split.batchCount
          operator: greater-than-or-equal
          value: 1
    result:
      type: persist-version-references
      target: production-object-pending-list
      distribution: equal-quotient-with-final-remainder
    explanation: 量产且 BATCH 形态的批量添加“按批次数”模式中，用户输入的拆分数量表示批次数；当前可分配数量除以批次数得到前 N-1 批数量，最后一批承接余数。
    evidenceIds: [evidence.production-work-order-page-pending-list, evidence.production-service]
  - id: rule.production.mass-batch-quantity-distribution
    name: 量产批次按每批正数量生成并保留余数
    status: specified
    visibility: internal
    trigger: production-object.prepare
    scope: production-batch
    condition:
      all:
        - fact: process.productionMode
          operator: equals
          value: 量产
        - fact: process.productionForm
          operator: equals
          value: BATCH
        - fact: split.quantityPerBatch
          operator: greater-than-or-equal
          value: 0
        - fact: split.quantityPerBatch
          operator: not-equals
          value: 0
    result:
      type: persist-version-references
      target: production-object-pending-list
      distribution: fixed-quantity-with-final-remainder
      generatedCount: ceil(availableRemaining / quantityPerBatch)
    explanation: 按每批正数量Q生成，Q可小于1，末批承接不足Q的正余数，总量不超过当前剩余量；不丢弃或补足余数。数量下限由2026-10-27确认，存储精度仍受约束。
    evidenceIds: [evidence.production-work-order-page-pending-list, evidence.production-service, evidence.production-batch-quantity-policy-boundary, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.sn-bulk-count-creates-unit-objects
    name: SN 批量添加按拆分数量生成单件对象
    status: implemented
    visibility: internal
    trigger: production-object.prepare
    scope: production-object
    condition:
      all:
        - fact: process.productionForm
          operator: equals
          value: SN
        - fact: split.batchCount
          operator: greater-than-or-equal
          value: 1
    result:
      type: persist-version-references
      target: production-object-pending-list
      generatedCountFrom: split.batchCount
      targetQuantity: 1
    explanation: SN 形态的批量添加中，用户输入的拆分数量表示要生成的 SN 对象个数；每个候选对象数量固定为 1，编号按用户前缀加序号生成或由服务端自动生成，仍先进入待提交清单。
    evidenceIds: [evidence.production-work-order-page-pending-list, evidence.production-service, evidence.production-service-test]
  - id: rule.production.sn-import-required-fields
    name: SN 导入编号字段校验
    status: implemented
    visibility: internal
    trigger: production-object.import
    scope: production-object
    condition:
      any:
        - fact: importedSn.snNumberPresent
          operator: equals
          value: false
    result:
      type: block
      reason: sn-import-required-field-invalid
    explanation: SN 导入模板只包含 SN 编号、计划开始时间和计划结束时间；SN 数量不作为导入列，由生产形态隐含为 1。SN 编号为必填且必须唯一，导入记录先进入待提交清单并在批量提交时再次由服务端校验。
    evidenceIds: [evidence.production-work-order-page-pending-list, evidence.production-work-order-batch-import-template-ui, evidence.production-service, evidence.production-service-test]
  - id: rule.production.split-batch-table-action-boundary
    name: 已拆分表提供受限未开工修改和取消
    status: specified
    visibility: internal
    trigger: production-object.list.display
    scope: production-batch
    condition:
      all:
        - fact: productionBatch.listContext
          operator: equals
          value: work-order-split-dialog
    result:
      type: allow-with-governance
      operationColumn: true
      actions: [edit-unstarted, cancel-unstarted]
      sharedCommandOwner: production-object
    explanation: 用户已确认未开工批次可改；拆分弹窗与独立批次页复用编辑组件/API是本轮工程选择。已拆分表只对满足对象及父工单状态约束的未开工对象提供修改/取消，不新增正常完成旁路；待提交清单仍只是暂存。
    evidenceIds: [evidence.production-work-order-page-pending-list]
  - id: rule.production.batch-management-reuses-production-object-list
    name: 批次管理复用生产对象 BATCH 列表
    status: implemented
    visibility: internal
    trigger: production-batch-management.list.display
    scope: production-batch-management
    condition:
      all:
        - fact: productionObject.objectType
          operator: equals
          value: BATCH
    result:
      type: omit-projection
      source: production-object
      filters: [objectType=BATCH]
      independentEntity: false
    explanation: 批次管理页面只读取既有 ProductionObject 的 BATCH 生产对象列表；页面新增的是列表投影、权限和标准业务动作入口，不创建独立批次实体。取消、提前结束等动作仍遵循 ProductionObject 状态机和生产执行联动规则。
    evidenceIds: [evidence.production-batch-management-page, evidence.production-batch-management-controller, evidence.production-batch-management-api, evidence.production-object-entity]
  - id: rule.production.batch-management-row-detail-and-audit-entry
    name: 批次管理行级详情与数据审计入口
    status: specified
    visibility: internal
    trigger: production-batch-management.row.interact
    scope: production-batch-management
    condition:
      all:
        - fact: productionObject.objectType
          operator: equals
          value: BATCH
    result:
      type: omit-projection
      rowClick: production-object.detail
      auditPlacement: production-object.detail.audit-tab
      auditEntityType: PRODUCTION_OBJECT
      auditActionProjection: [CREATE, UPDATE]
    explanation: 批次详情中的数据审计读取该对象PRODUCTION_OBJECT事件，涉及制程的条目显示归属及版本，首次START保存的冻结配置在对应制程旁提供{}详情。未开工引用和已冻结配置须明确区分；应有的历史原件缺失不按当前主数据补造。普通UPDATE保持真实差量，不要求每条重复制程身份或配置；标题动作仍只显示新增/修改，真实保存首次冻结快照的条目可另附“开工”次要说明以辨识记录，该说明不是新的动作类别。PRODUCTION_EXECUTION继续保存完整执行证据。
    evidenceIds: [evidence.production-batch-management-page, evidence.audit-controller-action-projection, evidence.audit-controller-test, evidence.production-object-audit-snapshot-controller, evidence.production-object-audit-snapshot-controller-test, evidence.production-object-execution-status-audit-source, evidence.production-object-execution-status-audit-tests, evidence.audit-aspect, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.batch-management-action-entry-boundary
    name: 批次管理操作栏按状态提供业务动作入口
    status: specified
    visibility: internal
    trigger: production-batch-management.row.actions.display
    scope: production-batch-management
    condition:
      all:
        - fact: productionObject.objectType
          operator: equals
          value: BATCH
    result:
      type: omit-projection
      actions: [cancel, early-terminate, dhr-view, execution-detail, print-travel-sheet]
      availability:
        cancel: productionObject.status == CREATED
        early-terminate: productionObject.status == IN_PROGRESS and earlyTermination.reasonPresent == true
        dhr-view: always-visible
        execution-detail: productionObject.status in [IN_PROGRESS, COMPLETED, EARLY_TERMINATED]
        print-travel-sheet: true
      rowClickOwns: [production-object.detail, production-object.detail.audit-tab]
      forbiddenAction: view
    explanation: 未开工且无执行实例、所属工单仍CREATED或IN_PROCESS的BATCH可编辑制程和数量；已取消或已开工不能借编辑恢复。其他既有取消、原因必填的提前结束、DHR只读查阅及执行详情入口保持，不新增既有批次再拆分。
    evidenceIds: [evidence.production-batch-management-page, evidence.production-batch-dhr-lookup-test, evidence.dhr-instance-controller, evidence.dhr-instance-service, evidence.production-object-status-machine, evidence.production-object-controller, evidence.production-object-cancel-side-effects-current, evidence.production-object-early-termination-gap, evidence.production-object-start-side-effects-current, evidence.guancheng-batch-close-source, evidence.guancheng-batch-start-source, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.batch-management-dhr-read-only-entry
    name: 批次 DHR 图标常显与只读查阅
    status: implemented
    visibility: internal
    trigger: production-object.dhr-view
    scope: production-batch-management
    condition:
      all:
        - fact: productionObject.objectType
          operator: equals
          value: BATCH
    result:
      type: omit-projection
      entry: always-visible
      permission: dhr.instances.view
      deniedMessage: 没有 DHR 查看权限
      missingMessage: 该批次尚未生成 DHR（首次开工后自动创建）
      foundView: dhr-archive-read-only
      lookupCreatesInstance: false
      creationTiming: first-production-object-start
    explanation: 批次 DHR 图标在所有状态下始终占位展示，保持操作列对齐。DHR 仅在首次合法 START 同事务自动创建，每生产对象至多一份；入口按生产对象查找，无权限时提示，有权限但无实例时提示尚未生成，有实例时复用列表档案界面只读查看。当前工作树已有查询、权限与界面代码及聚焦服务测试；浏览器真实交互尚未验证。
    evidenceIds: [evidence.production-batch-management-page, evidence.production-batch-dhr-lookup-test, evidence.dhr-instance-controller, evidence.dhr-instance-service, evidence.dhr-instance-frontend-api, evidence.dhr-instance-management-page, evidence.dhr-instance-start-transaction-source, evidence.dhr-instance-migration]
  - id: rule.production.batch-management-execution-detail-entry
    name: 批次管理的执行详情导航与真实数据边界
    status: planned
    visibility: internal
    trigger: production-object.execution-detail
    scope: production-object
    condition:
      all:
        - fact: productionObject.status
          operator: in
          value: [IN_PROGRESS, COMPLETED, EARLY_TERMINATED]
    result:
      type: return-query-projection
      target: production-execution-module
      unavailableStatuses:
      - CREATED
      - CANCELLED
      placeholderAllowed: false
    explanation: BatchManagementPage 当前已有执行工作台导航，后续 ProductionExecutionPage 展示受限生产执行记录；不能再把模块整体写成未交付占位。CREATED/CANCELLED 的该详情入口范围与正常开工动作分开，展示须来自真实执行数据。本 planned/internal 记录保留早期来源成熟度，不因本次静态纠错自动声明页面或生产验收通过。
    evidenceIds:
    - evidence.production-object-start-side-effects-current
    - evidence.production-object-entity
    - evidence.production-execution-service-source
    - evidence.production-execution-engine-source
  - id: rule.production.production-object-batch-submit-atomic
    name: 生产对象批量提交整批事务
    status: implemented
    visibility: internal
    trigger: production-object.batch-submit
    scope: production-object-batch-submission
    condition:
      all:
        - fact: batch.itemsPresent
          operator: equals
          value: true
    result:
      type: write-audit-record
      transactionBoundary: single-request
      rollbackOnAnyFailure: true
    explanation: 待提交清单通过一次 batch API 请求进入 ProductionService.splitBatch，并在同一事务边界内逐条校验和保存；任一条失败时整批回滚，不保留部分成功对象。
    evidenceIds: [evidence.production-object-batch-controller, evidence.production-service-batch-split, evidence.work-orders-api]
  - id: rule.production.process-required-on-first-split
    name: 每个生产对象创建必须选择制程
    status: specified
    visibility: internal
    trigger: production-object.split
    scope: production-object
    condition:
      all:
        - fact: split.requestedProcessVersionId
          operator: is-null
          value: null
    result:
      type: block
      reason: process-version-required-before-object-create
    explanation: 保留稳定ID但取消首次限制：每个新建对象都须显式指定当前适用版本，工单无制程选择，不存在继承工单锁版的旁路。
    evidenceIds: [evidence.production-service, evidence.work-order-controller, evidence.production-service-test, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.work-order-split-eligibility
    name: 工单在创建或生产中可继续拆分
    status: specified
    visibility: internal
    trigger: production-object.split
    scope: work-order
    condition:
      any:
        - fact: workOrder.status
          operator: equals
          value: CREATED
        - fact: workOrder.status
          operator: equals
          value: IN_PROCESS
    result:
      type: allow-with-governance
      allowedStatuses: [CREATED, IN_PROCESS]
      requiredConstraints: [remaining-planned-quantity, explicit-applicable-process-version, single-production-form]
    explanation: 工单进入 IN_PROCESS 只表示至少一个生产对象已开工，不冻结尚未分配的计划数量；CREATED 与 IN_PROCESS 工单均可继续拆分。COMPLETED、CLOSED、CANCELLED 和 EARLY_TERMINATED 工单不得拆分。
    evidenceIds: [evidence.production-service, evidence.production-service-test, evidence.work-order-page, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.first-split-locks-process
    name: 生产对象保存所选制程引用
    status: specified
    visibility: internal
    trigger: production-object.split
    scope: production-object
    condition:
      all:
        - fact: split.processVersionResolved
          operator: equals
          value: true
    result:
      type: persist-version-references
      target: productionObject.processVersionId
      immutableAfterFirstStart: true
    explanation: 历史ID原位修正为对象级引用：每次拆分只向该生产对象保存显式所选制程，不写回工单；未开工按资格换版，首次开工后引用和实际配置冻结。
    evidenceIds: [evidence.production-service, evidence.production-work-order-entity, evidence.production-object-entity, evidence.production-service-test, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.process-resolution-product-then-family
    name: 制程按产品优先产品簇兜底解析
    status: specified
    visibility: internal
    trigger: production-object.process-options
    scope: product-process-resolution
    condition:
      any:
        - fact: product.hasAvailableProcessVersion
          operator: equals
          value: true
        - fact: productFamily.hasAvailableProcessVersion
          operator: equals
          value: true
    result:
      type: require-explicit-process-version
      resolutionOrder: [product, product-family]
    explanation: 新选候选按产品优先、无可用产品版本时产品簇兜底。已有簇引用若仍有效且产品仍属该簇，不因新增自有制程失效；候选优先级不是已有引用适用性的判据。
    evidenceIds: [evidence.product-process-resolution-for-production, evidence.production-service-test, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.single-production-form-per-order
    name: 同一工单不得混用生产形态
    status: specified
    visibility: internal
    trigger: production-object.create-or-change-process-or-start
    scope: work-order
    condition:
      all:
        - fact: workOrder.existingObjectFormsMatchRequestedForm
          operator: equals
          value: false
    result:
      type: block
      reason: mixed-production-form-in-work-order
    explanation: 同一工单所有对象保持BATCH或SN同一形态，新拆批、未开工换版和首次开工均校验，防止同版本内容修改改变身份；全部旧批取消也不解除既定形态。
    evidenceIds: [evidence.production-service, evidence.production-service-test, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.sn-object-target-one
    name: SN 对象目标数量必须为一
    status: implemented
    visibility: internal
    trigger: production-object.split
    scope: production-object
    condition:
      all:
        - fact: productionForm
          operator: equals
          value: SN
        - fact: split.targetQuantity
          operator: not-equals
          value: 1
    result:
      type: block
      reason: sn-target-quantity-must-equal-one
    explanation: SN 生产形态按单件对象管理，目标数量固定为 1。
    evidenceIds: [evidence.production-service, evidence.production-service-test]
  - id: rule.production.sn-object-number-unique
    name: SN 对象编号必须唯一
    status: implemented
    visibility: internal
    trigger: production-object.split
    scope: production-object
    condition:
      all:
        - fact: productionForm
          operator: equals
          value: SN
        - fact: productionObject.objectNoAlreadyUsed
          operator: equals
          value: true
    result:
      type: block
      reason: sn-number-unique
    explanation: SN 生产对象以 objectNo 承载可追溯序列号；保存前校验该编号在租户内未被其他生产对象占用，重复编号阻断创建。当前模型暂不引入独立 SN 主数据实体。
    evidenceIds: [evidence.production-service, evidence.production-object-entity, evidence.production-service-test]
  - id: rule.production.object-allocation-within-order-plan
    name: 生产对象目标数量不得超过工单计划数量
    status: specified
    visibility: internal
    trigger: production-object.create-or-update-or-cancel
    scope: work-order
    condition:
      all:
        - fact: workOrder.objectTargetQuantityWithinPlannedQuantity
          operator: equals
          value: false
    result:
      type: block
      reason: object-target-quantity-exceeds-work-order-plan
    explanation: 有效分配A为所有非CANCELLED对象目标量，剩余R=计划Q-A。改量须新量-旧量<=R，减少释放额度但不自动改变计划Q；取消释放、提前结束仍占原目标量。并发修改按同一工单约束校验，良品/NG/报废不减目标量。
    evidenceIds: [evidence.production-service, evidence.production-object-entity, evidence.production-service-test, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.object-lifecycle
    name: 生产对象生命周期
    status: specified
    visibility: internal
    trigger: production-object.status.change
    scope: production-object
    condition:
      any:
        - fact: productionObject.statusTransition
          operator: equals
          value: CREATED->IN_PROGRESS
        - fact: productionObject.statusTransition
          operator: equals
          value: IN_PROGRESS->COMPLETED
        - fact: productionObject.statusTransition
          operator: equals
          value: IN_PROGRESS->EARLY_TERMINATED
        - fact: productionObject.statusTransition
          operator: equals
          value: CREATED->CANCELLED
    result:
      type: write-audit-record
      allowedTransitions: [CREATED->IN_PROGRESS, IN_PROGRESS->COMPLETED, IN_PROGRESS->EARLY_TERMINATED, CREATED->CANCELLED]
    explanation: 生产对象可由 CREATED 开工为 IN_PROGRESS，再按完整制程正常完成为 COMPLETED；进行中对象可主动提前结束为 EARLY_TERMINATED；未开工对象可由 CREATED 取消为 CANCELLED；既有对象不允许删除数据。
    evidenceIds: [evidence.production-object-status-machine, evidence.production-service, evidence.production-object-controller, evidence.production-object-audit-snapshot-controller, evidence.production-object-audit-snapshot-controller-test, evidence.production-service-test]
  - id: rule.production.object-start-transition-and-order-projection
    name: 生产对象开工状态与工单投影
    status: implemented
    visibility: internal
    trigger: production-object.start
    scope: production-object
    condition:
      all:
        - fact: productionObject.status
          operator: equals
          value: CREATED
    result:
      type: write-audit-record
      objectStatus: IN_PROGRESS
      firstObjectWorkOrderStatus: IN_PROCESS
    explanation: ProductionService.startObject 只负责将 CREATED 对象转为 IN_PROGRESS，并在首个对象开工时将 CREATED 工单转为 IN_PROCESS；公开的生产对象直接开工接口已阻断。首次合法 START 由生产执行服务校验工序并在同一事务创建 DHR，拆分阶段不创建 DHR。
    evidenceIds: [evidence.production-object-start-side-effects-current, evidence.production-object-status-machine, evidence.production-service, evidence.production-object-controller, evidence.dhr-instance-start-transaction-source]
  - id: rule.production.object-cancel-before-start
    name: 未开工生产对象取消保留追溯
    status: specified
    visibility: internal
    trigger: production-object.cancel
    scope: production-object
    condition:
      all:
        - fact: productionObject.status
          operator: equals
          value: CREATED
    result:
      type: write-audit-record
      objectStatus: CANCELLED
      physicalDelete: false
      excludeFromWorkOrderAllocation: true
      reevaluateWorkOrderTerminalState: true
    explanation: 未开工对象取消后保留记录及审计，其目标量退出有效分配而计划量不变。全部未开工对象取消时工单保持CREATED，后续可选择当前制程继续拆分，但产品和生产形态不解锁；剩余计划未分配时不因全部对象终态完成工单。
    evidenceIds: [evidence.production-object-cancel-side-effects-current, evidence.production-object-status-machine, evidence.production-service, evidence.production-object-controller, evidence.production-object-audit-snapshot-controller, evidence.production-object-audit-snapshot-controller-test, evidence.production-service-test, evidence.guancheng-batch-remove-source, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.object-early-termination
    name: 进行中生产对象提前结束
    status: specified
    visibility: internal
    trigger: production-object.early-terminate
    scope: production-object
    condition:
      all:
        - fact: productionObject.status
          operator: equals
          value: IN_PROGRESS
        - fact: earlyTermination.reasonPresent
          operator: equals
          value: true
    result:
      type: write-audit-record
      statusLabel: 提前结束
      requiresEndReason: true
      terminal: true
      sideEffects:
      - terminate-associated-dhr-without-voiding-forms
      - preserve-work-order-status
      canonicalStatusCode: EARLY_TERMINATED
    explanation: 进行中批次要求原因和时间，同事务终止关联DHR、停止普通执行并保留真实表单，不自动作废。单批EARLY_TERMINATED不触发工单结束；原目标分配保留，剩余计划可继续拆分。工单主动结束单独判断，不级联其他对象。
    evidenceIds: [evidence.production-object-early-termination-gap, evidence.guancheng-batch-close-source, evidence.production-service, evidence.production-object-controller, evidence.dhr-termination-user-confirmed, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.split-initializes-execution-context
    name: 批次拆分准备生产对象与制程引用
    status: specified
    visibility: internal
    trigger: production-object.split
    scope: production-batch
    condition:
      all:
        - fact: productionObject.objectType
          operator: equals
          value: BATCH
    result:
      type: persist-version-references
      initialStatus: CREATED
      objectReferences: [work-order, process-version]
      workOrderHasProcessVersion: false
      dhrCreatedBySplit: false
      dhrCreationTiming: first-legal-start
    explanation: 拆分只创建CREATED对象并保存工单及对象显式制程引用，尚未冻结配置；不生成执行实例或DHR。首次合法START同事务重核并冻结实际制程配置、创建唯一DHR。
    evidenceIds: [evidence.production-service, evidence.production-object-entity, evidence.production-object-batch-controller, evidence.dhr-instance-management-user-confirmed, evidence.dhr-instance-start-transaction-source, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.object-normal-completion-dhr-projection
    name: 正常完工同步 DHR 状态
    status: specified
    visibility: internal
    trigger: production-execution.complete-all-operations
    scope: production-object
    condition:
      all:
        - fact: productionObject.routeHasNoCurrentOperation
          operator: equals
          value: true
    result:
      type: write-audit-record
      status: COMPLETED
      dhrStatus: COMPLETED
      productReleaseImplied: false
    explanation: 同一生产执行动作确认全部工序完成后，生产对象与关联 DHR 在同一事务进入 COMPLETED；缺失 DHR 时阻断完成。DHR 正常完成不等于汇总定版、审核通过或产品放行；提前结束另按 DEC-0069 处理。历史外部系统的放行单联动不定义本产品当前动作。
    evidenceIds: [evidence.dhr-instance-management-user-confirmed, evidence.dhr-instance-start-transaction-source, evidence.dhr-instance-service, evidence.production-object-status-machine, evidence.production-service]
  - id: rule.production.object-terminal-cascade-to-work-order
    name: 完整分配且全部正常完成才自动完成工单
    status: specified
    visibility: internal
    trigger: production-object.terminal
    scope: work-order
    condition:
      all:
        - fact: workOrder.normalCompletionEligible
          operator: equals
          value: true
    result:
      type: write-audit-record
      reevaluateWorkOrderStatus: true
      terminalObjectStatuses: [COMPLETED, CANCELLED, EARLY_TERMINATED]
      statusMapping: [fully-allocated-and-all-non-cancelled-completed->COMPLETED]
      autoEarlyTermination: false
    explanation: 自动正常完成须计划全部分配、至少一个有效对象且所有未取消对象均COMPLETED。剩余未分配量或单批提前结束时保持原活动工单状态；不增加合格产量等于计划量的条件。
    evidenceIds: [evidence.production-object-cancel-side-effects-current, evidence.production-service, evidence.production-service-test, evidence.guancheng-batch-close-source, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.work-order-lifecycle
    name: 工单生命周期
    status: specified
    visibility: internal
    trigger: work-order.status.change
    scope: work-order
    condition:
      any:
        - fact: workOrder.statusTransition
          operator: equals
          value: CREATED->EARLY_TERMINATED
        - fact: workOrder.statusTransition
          operator: equals
          value: CREATED->IN_PROCESS
        - fact: workOrder.statusTransition
          operator: equals
          value: IN_PROCESS->COMPLETED
        - fact: workOrder.statusTransition
          operator: equals
          value: COMPLETED->CLOSED
        - fact: workOrder.statusTransition
          operator: equals
          value: CREATED->CANCELLED
        - fact: workOrder.statusTransition
          operator: equals
          value: IN_PROCESS->EARLY_TERMINATED
    result:
      type: write-audit-record
      allowedTransitions: [CREATED->IN_PROCESS, CREATED->EARLY_TERMINATED, IN_PROCESS->COMPLETED, IN_PROCESS->EARLY_TERMINATED, COMPLETED->CLOSED, CREATED->CANCELLED]
    explanation: CREATED按字段边界编辑；CREATED/IN_PROCESS可继续拆分。首次批次开工进入IN_PROCESS，计划已全分配且全部未取消对象正常完成才自动COMPLETED；单批提前结束不联动。手动工单结束要求无未结束子对象且原因必填；COMPLETED可CLOSED，无对象未开工可CANCELLED，全部未开工对象取消仍CREATED。无RELEASED。
    evidenceIds: [evidence.work-order-status-machine, evidence.production-service, evidence.work-order-controller, evidence.production-audit-annotations, evidence.audit-aspect, evidence.audit-aspect-test, evidence.production-service-test, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.work-order-early-termination
    name: 未结束工单手动提前结束
    status: specified
    visibility: internal
    trigger: work-order.early-terminate
    scope: work-order
    condition:
      all:
        - fact: workOrder.status
          operator: in
          value: [CREATED, IN_PROCESS]
        - fact: productionObject.allAssociatedObjectsTerminal
          operator: equals
          value: true
        - fact: earlyTermination.reasonPresent
          operator: equals
          value: true
    result:
      type: write-audit-record
      workOrderStatus: EARLY_TERMINATED
      requiresEndReason: true
      terminal: true
      sideEffects: [prohibit-further-split-or-start]
      cascadeToObjects: false
    explanation: 用户确认先处理全部子批次、原因必填、不主动级联；当前入口允许CREATED或IN_PROCESS是本轮工程选择。存在CREATED/IN_PROGRESS子对象时阻断，全部终态后记录工单终止原因时间及审计，子批次、表单和DHR保持既有结果，工单不能继续拆分或开工。
    evidenceIds: [evidence.production-work-order-entity, evidence.work-order-status-machine, evidence.production-service, evidence.guancheng-batch-close-source, evidence.production-object-early-termination-gap, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.batch-management-resplit-planned
    name: 批次管理再拆分作为后续扩展能力
    status: planned
    visibility: internal
    trigger: production-batch-management.resplit
    scope: production-batch
    condition:
      all:
        - fact: capability.phase
          operator: equals
          value: post-mvp
    result:
      type: persist-version-references
      parentChildLineageRequired: true
      quantityConservationRequired: true
      supportedFutureForms: [BATCH_TO_BATCH, BATCH_TO_SN, REWORK_CHILD]
      executionSnapshotRequired: true
    explanation: 当前 MVP 只实现工单到生产对象的初始拆分；批次管理页面对既有批次再次拆分是独立能力，暂不进入 MVP。后续实现必须保留父子生产对象、数量守恒、制程/路线执行依据继承，以及事务、DHR 和审计追溯空间，不能复用工单初始拆分弹窗或接口。
    evidenceIds: [evidence.guancheng-batch-lifecycle-source, evidence.guancheng-batch-split-source, evidence.production-object-entity, evidence.production-service]
  - id: rule.production.production-object-lineage-queryable
    name: 父子生产对象关系可查询
    status: planned
    visibility: internal
    trigger: production-object.detail-or-audit.display
    scope: production-object
    condition:
      all:
        - fact: productionObject.hasParentOrChildren
          operator: equals
          value: true
    result:
      type: persist-version-references
      detailFields: [parentObjectId, childObjectIds, splitQuantity, sourceReason]
      auditLinkRequired: true
    explanation: MVP 暂不提供父子对象查询或谱系页面；只有后续批次再拆分立项并完成业务讨论后，才确认父子关系字段、查询形式和关联审计。该规则仅保留扩展规划，不代表当前页面或实体已支持查询。
    evidenceIds: [evidence.guancheng-batch-lifecycle-source, evidence.guancheng-batch-split-source, evidence.production-object-entity]
  - id: rule.production.audit-action-projection
    name: 生产数据审计动作统一投影
    status: implemented
    visibility: internal
    trigger: production.audit.display
    scope: production-audit
    condition:
      all:
        - fact: audit.entityType
          operator: in
          value: [WORK_ORDER, PRODUCTION_OBJECT]
        - fact: audit.action
          operator: in
          value: [CREATE, UPDATE, CANCEL, STATUS_CHANGE]
    result:
      type: omit-projection
      projections: [list, detail, audit]
      allowedActions: [CREATE, UPDATE]
      actionLabels:
        CREATE: 新增
        UPDATE: 修改
      normalizedAction:
        CANCEL: UPDATE
        STATUS_CHANGE: UPDATE
    explanation: 工单及生产对象的数据审计在所有页面统一只投影“新增”和“修改”两类动作；生命周期取消、开工、完成、关闭等内部动作统一归入“修改”，不得向客户展示 CANCEL 或 STATUS_CHANGE 等额外动作类别。批次审计可在真实保存首次冻结快照的记录标题中附“开工”次要说明以辨识记录，但不得替代“修改”动作标签或新增筛选类别；说明和详情均沿该条历史审计原件。
    evidenceIds: [evidence.audit-controller-action-projection, evidence.production-audit-annotations, evidence.production-object-audit-snapshot-controller, evidence.production-object-audit-snapshot-controller-test, evidence.audit-aspect, evidence.audit-aspect-test, evidence.audit-controller-test, evidence.work-order-page, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.work-order-audit-change-snapshot
    name: 工单审计保留变更前后业务快照
    status: specified
    visibility: internal
    trigger: work-order.audit.write
    scope: work-order-audit
    condition:
      all:
        - fact: audit.entityType
          operator: equals
          value: WORK_ORDER
        - fact: audit.action
          operator: in
          value: [CREATE, UPDATE]
    result:
      type: write-audit-record
      snapshotFields: [contentBefore, contentAfter]
      createBefore: {}
      forbidSyntheticArguments: true
    explanation: 工单新增、编辑、取消、关闭及手动提前结束记录实际业务变化前后值，未拆批时改产品或计划量也要审计。新增前为空对象，请求参数不能冒充真实快照；终止原因和时间可追溯。
    evidenceIds: [evidence.work-order-audit-snapshot-controller, evidence.work-order-audit-snapshot-controller-test, evidence.audit-aspect, evidence.production-audit-annotations, evidence.audit-aspect-test, evidence.batch-process-direct-correction-confirmed]
    implementationNote: WorkOrderController 已显式构造真实工单快照并写入审计事件；AuditAspect 仅负责通用元数据，原快照缺口已修复。
  - id: rule.production.production-object-audit-change-snapshot
    name: 生产对象审计保留新增及修改业务快照
    status: specified
    visibility: internal
    trigger: production-object.audit.write
    scope: production-object-audit
    condition:
      all:
        - fact: audit.entityType
          operator: equals
          value: PRODUCTION_OBJECT
    result:
      type: write-audit-record
      snapshotFields: [contentBefore, contentAfter]
      createBefore: {}
      createSnapshot: contentAfter
      updateSnapshotFields: [contentBefore, contentAfter]
      batchSplitOwnership: one-record-per-production-object
      batchSummaryAction: false
      actionProjection: [CREATE, UPDATE]
    explanation: 每个实际生产对象单独写CREATE，新增前为空，包含工单、产品、制程身份、编号、形态、数量、计划与备注。未开工修改制程/数量及取消、开工、完成、提前结束写UPDATE，按真实前后变化留证。首次合法START的对象审计保留实际冻结制程配置，不能仅记录同名V1标签；未开工审计若仅引用须注明未冻结。PRODUCTION_EXECUTION仍保存执行细节，历史缺失不回填。既有execution.production-object-audit-snapshot只承接原控制器范围，不自动提升本轮快照详情的运行成熟度。
    evidenceIds:
    - evidence.batch-process-direct-correction-confirmed
    - evidence.production-object-audit-snapshot-controller
    - evidence.production-object-audit-snapshot-controller-test
    - evidence.audit-controller-action-projection
    - evidence.audit-controller-test
    - evidence.audit-aspect
    - evidence.production-execution-service-source
    - evidence.production-object-execution-status-audit-source
    - evidence.production-object-execution-status-audit-tests
    executionContractId: execution.production-object-audit-snapshot
  - id: rule.production.audit-field-localized-display
    name: 生产审计字段统一中文展示
    status: specified
    visibility: internal
    trigger: production.audit.snapshot.display
    scope: production-audit
    condition:
      all:
        - fact: audit.entityType
          operator: in
          value: [WORK_ORDER, PRODUCTION_OBJECT]
    result:
      type: omit-projection
      rawJsonVisible: false
      explicitSnapshotDetailEnabled: true
      sharedMapping: production-audit-formatter
      localizedDimensions: [field-label, field-order, status, production-form, date-time]
      emptySnapshotLabel: 无
      emptyValueLabel: "-"
      preservesOriginalSnapshot: true
    explanation: 审计主视图统一中文字段、状态、形态、时间及空值，保留未知字段可见。批次事件实际保存了processSnapshot时提供显式{}详情，读取该冻结原件；未涉及制程的差量事件不要求重复身份或配置。该详情不把主视图变为原始JSON列表，不查询当前主数据代替历史，也不修改原contentBefore/contentAfter。
    evidenceIds: [evidence.production-audit-localized-formatter, evidence.work-order-page, evidence.production-batch-management-page, evidence.production-audit-localized-display-guideline, evidence.batch-process-direct-correction-confirmed]
  - id: rule.production.locked-process-ignores-effective-window
    name: 历史工单锁版不重核有效期策略已撤销
    status: deprecated
    visibility: internal
    trigger: production-object.split
    scope: work-order
    condition:
      all:
        - fact: workOrder.processVersionId
          operator: is-present
          value: true
        - fact: workOrder.processVersionLocked
          operator: equals
          value: true
    result:
      type: persist-version-references
      effectiveWindowRecheck: false
    explanation: 只保留历史实现依据，2026-10-27已撤销工单锁版豁免。新对象/换版须当前有效适用，未开工首次START重核；已开工继续既有快照，不重新校验当前主数据有效期，也不回填历史。
    evidenceIds: [evidence.production-service, evidence.product-process-resolution-for-production, evidence.batch-process-direct-correction-confirmed]
