knowledgeModelVersion: 0.3.3
rules:
  - id: rule.product.source-from-material
    name: 产品来源于产品或半成品物料
    status: implemented
    visibility: internal
    trigger: material.query-as-product
    scope: product
    condition:
      all:
        - fact: material.typeName
          operator: in
          value: [产成品, 半成品]
    result:
      type: include-as-product
      source: material
    explanation: 产品管理读取物料管理中类型为产成品或半成品的数据，不重复维护产品主数据。
    evidenceIds: [evidence.product-process-controller, evidence.product-process-controller-test]
  - id: rule.product-process.multiple-parallel-versions
    name: 同一父产品允许存在多个并行制程版本
    status: implemented
    visibility: internal
    trigger: product-process.version.create
    scope: product
    condition:
      all:
        - fact: productProcessVersion.versionLabel
          operator: unique-within
          value: product
    result:
      type: allow-parallel-versions
      uniqueCurrentVersion: false
    explanation: 父产品下可存在多个并行制程版本，不设置唯一当前版本。
    evidenceIds: [evidence.migration-0044-product-process-modeling, evidence.product-process-controller-test]
  - id: rule.product-family.membership-cardinality
    name: 一个产品最多属于一个产品簇
    status: implemented
    visibility: internal
    trigger: product-family.member.persist
    scope: product-family-membership
    condition:
      all:
        - fact: product.productFamilyCount
          operator: greater-than-or-equal
          value: 2
    result:
      type: block
      reason: product-belongs-to-at-most-one-product-family
    explanation: 产品簇可包含多个产品，但同一个产品最多关联一个产品簇。
    evidenceIds: [evidence.product-family-member-entity, evidence.migration-0053-product-family-process-owner, evidence.product-family-membership-service, evidence.product-family-member-repository-test, evidence.product-family-membership-service-test]
  - id: rule.product-family.code-maintenance
    name: 产品簇编码由用户维护且租户内唯一
    status: implemented
    visibility: internal
    trigger: product-family.create-or-update
    scope: product-family
    condition:
      all:
        - fact: productFamily.code
          operator: is-present
          value: true
    result:
      type: persist-unique-code
      target: productFamily.code
      source: request.code
      scope: tenant
      caseSensitive: false
      required: true
    explanation: 创建或编辑产品簇时，用户必须输入产品簇编码；编码在同一租户内不区分大小写唯一，更新自身记录时允许保持原编码。
    evidenceIds: [evidence.product-family-repository, evidence.migration-0054-product-family-code-case-insensitive, evidence.process-modeling-controller, evidence.process-modeling-controller-test, evidence.product-family-modeling-page]
  - id: rule.product-family.parent-status-projection
    name: 产品簇不投影独立业务状态
    status: implemented
    visibility: internal
    trigger: product-family.read-or-audit
    scope: product-family
    condition:
      all:
        - fact: productFamily.legacyStatus
          operator: exists
          value: true
    result:
      type: omit-projection
      projections: [list, detail, audit]
    explanation: 历史持久化状态字段仅为兼容保留，不作为产品簇可操作或可展示的业务状态；列表、详情和审计快照均不投影该字段。
    evidenceIds: [evidence.process-modeling-controller, evidence.process-modeling-controller-test, evidence.product-family-modeling-page]
  - id: rule.product-family.member-audit-customer-labels
    name: 产品簇成员审计字段客户中文化
    status: implemented
    visibility: internal
    trigger: product-family.member.audit-display
    scope: product-family-audit-display
    condition:
      all:
        - fact: audit.entityType
          operator: equals
          value: PRODUCT_FAMILY
    result:
      type: omit-projection
      projections: [audit]
      internalKeys: [memberProductId, memberProductCode, memberProductName]
      fieldLabels:
        memberProductId: 成员产品 ID
        memberProductCode: 成员产品编码
        memberProductName: 成员产品名称
    explanation: 产品簇详情的数据审计仅替换成员关系快照的字段标签；memberProductId、memberProductCode 和 memberProductName 仍是服务端审计快照键，不作为客户可见字段名展示。
    evidenceIds: [evidence.product-family-membership-service, evidence.product-family-modeling-page]
  - id: rule.product-family.delete-protection
    name: 产品簇关联成员或制程时不得删除
    status: implemented
    visibility: internal
    trigger: product-family.delete
    scope: product-family
    condition:
      any:
        - fact: productFamily.memberCount
          operator: greater-than-or-equal
          value: 1
        - fact: productFamily.processVersionCount
          operator: greater-than-or-equal
          value: 1
    result:
      type: block
      message: 请先处理产品簇成员和制程版本
    explanation: 产品簇仍关联任一产品成员或制程版本时，删除操作被阻断，并提示先处理产品簇成员和制程版本。
    evidenceIds: [evidence.process-modeling-controller, evidence.product-process-owner-service, evidence.process-modeling-controller-test]
  - id: rule.product-family.multiple-parallel-process-versions
    name: 产品簇允许存在多个并行制程版本
    status: implemented
    visibility: internal
    trigger: product-process.version.create
    scope: product-family-process-version
    condition:
      all:
        - fact: productProcess.ownerType
          operator: equals
          value: PRODUCT_FAMILY
        - fact: productProcessVersion.versionLabel
          operator: unique-within
          value: product-family
    result:
      type: allow-parallel-versions
      ownerType: PRODUCT_FAMILY
      uniqueCurrentVersion: false
    explanation: 产品簇可以拥有多个并行制程版本，不设置唯一当前版本。
    evidenceIds: [evidence.product-process-owner-service, evidence.product-process-owner-service-test]
  - id: rule.product-family.process-version-status
    name: 产品簇制程版本状态由有效期计算
    status: implemented
    visibility: internal
    trigger: product-process.version.read
    scope: product-family-process-version
    condition:
      all:
        - fact: productProcess.ownerType
          operator: equals
          value: PRODUCT_FAMILY
    result:
      type: compute-rdo-version-status
      resolver: RdoVersionStatusResolver
      fields: [effectiveFrom, effectiveTo]
    explanation: 产品簇不设置独立状态；其每个制程版本的状态由 RdoVersionStatusResolver 根据生效时间和失效时间独立计算并展示。
    evidenceIds: [evidence.product-process-owner-service, evidence.product-process-owner-service-test, evidence.product-family-modeling-page]
  - id: rule.product-family.version-audit-traceability
    name: 产品簇制程版本审计可追溯
    status: implemented
    visibility: internal
    trigger: product-family.process-version.audit-display
    scope: product-family-audit-display
    condition:
      all:
        - fact: audit.entityType
          operator: equals
          value: PRODUCT_FAMILY
    result:
      type: omit-projection
      projections: [audit]
      internalKeys: [id, productProcessId]
      fieldLabels:
        processVersion: 制程版本
        version: 版本
        productionMode: 生产模式
        productionForm: 生产方式
        routeVersionId: 工艺路线版本
        dhrTemplateVersionId: 批记录模板版本
        description: 备注
        effectiveFrom: 生效时间
        effectiveTo: 失效时间
        status: 版本状态
        operationBindings: 工序配置
        operation: 工序
        forms: DHR 目录表单
        documents: 文档
    explanation: 产品簇详情审计记录制程版本新增、编辑和删除的变更前后快照，并包含版本字段及工序表单、文档配置。审计投影隐藏技术键 id 和 productProcessId，使用中文业务标签；嵌套制程版本的 status 保留为版本状态，不代表产品簇具有独立业务状态。
    evidenceIds: [evidence.product-process-owner-service, evidence.product-process-owner-service-test, evidence.product-family-modeling-page]
  - id: rule.product-process.shared-owner-model
    name: 产品与产品簇共用制程绑定模型
    status: implemented
    visibility: internal
    trigger: product-process.save-or-migrate
    scope: product-process-root-and-version
    condition:
      all:
        - fact: productProcess.ownerType
          operator: in
          value: [PRODUCT, PRODUCT_FAMILY]
        - fact: productProcess.ownerId
          operator: is-present
          value: true
    result:
      type: persist-version-references
      ownerTypeField: owner_type
      ownerIdField: owner_id
      legacyProductVersionIdCompatible: true
    explanation: 产品和产品簇共用同一套制程根、版本、工序以及表单和文档绑定模型；实现上使用 owner_type(PRODUCT/PRODUCT_FAMILY) 与 owner_id，历史 product_version_id 保持兼容迁移。
    evidenceIds: [evidence.product-process-entity, evidence.product-process-owner-repository, evidence.migration-0053-product-family-process-owner, evidence.product-process-owner-service, evidence.product-process-owner-service-test]
  - id: rule.product-process.bind-route-and-dhr-versions
    name: 制程版本绑定一个可引用的路线版本和 DHR 版本
    status: implemented
    visibility: internal
    trigger: product-process.version.save
    scope: product-process-version
    condition:
      all:
        - fact: routeVersion
          operator: exists
          value: true
        - fact: RdoVersionStatusResolver.isReferenceable(routeVersion.effectiveDate, routeVersion.expiryDate)
          operator: equals
          value: true
        - fact: dhrTemplateVersion
          operator: exists
          value: true
        - fact: RdoVersionStatusResolver.isReferenceable(dhrTemplateVersion.effectiveFrom, dhrTemplateVersion.effectiveTo)
          operator: equals
          value: true
    result:
      type: persist-version-references
      routeVersionCount: 1
      dhrTemplateVersionCount: 1
    explanation: 每个产品制程版本必须引用存在且被 RdoVersionStatusResolver.isReferenceable(...) 判定为可引用的工艺路线版本和 DHR 模板版本。
    evidenceIds: [evidence.product-process-version-entity, evidence.product-process-controller, evidence.product-process-request-dto]
  - id: rule.product-process.operation-from-bound-route
    name: 工序绑定必须来自已选路线版本
    status: implemented
    visibility: internal
    trigger: product-process.operation-bindings.save
    scope: product-process-version
    condition:
      all:
        - fact: operationBinding.routeNodeKey
          operator: exists-in
          value: selectedRouteVersion.operationNodes
    result:
      type: persist-operation-binding
      target: product-process-version
    explanation: 工序绑定按路线节点标识归属制程版本，并且节点必须来自该版本绑定的工艺路线。
    evidenceIds: [evidence.operation-binding-entity, evidence.product-process-controller, evidence.product-process-controller-test]
  - id: rule.product-process.form-traceability
    name: 工序表单追溯到可引用的 DHR 目录项和表单版本
    status: implemented
    visibility: internal
    trigger: product-process.operation-form-binding.save
    scope: operation-binding
    condition:
      all:
        - fact: dhrTemplateItem
          operator: exists
          value: true
        - fact: dhrTemplateItem.directory.versionId
          operator: equals
          value: productProcessVersion.dhrTemplateVersionId
        - fact: dhrTemplateItem.formTemplateVersionId
          operator: equals
          value: formBinding.formTemplateVersionId
        - fact: formTemplateVersion
          operator: exists
          value: true
        - fact: RdoVersionStatusResolver.isReferenceable(formTemplateVersion.effectiveFrom, formTemplateVersion.effectiveTo)
          operator: equals
          value: true
        - fact: operationBinding.formBindings.formTemplateVersionId
          operator: unique-within
          value: operation-binding
    result:
      type: persist-form-reference-pair
      fields: [dhrTemplateItemId, formTemplateVersionId]
    explanation: 一个工序可绑定零到多个 DHR 目录表单；每项必须属于所选 DHR 版本、匹配该目录项的表单版本、引用可引用的表单版本，且同一工序不能重复同一表单版本。
    evidenceIds: [evidence.operation-form-binding-entity, evidence.migration-0049-dhr-item-binding, evidence.product-process-controller, evidence.product-process-controller-test]
  - id: rule.product-process.multiple-classified-documents
    name: 工序可绑定多个任意分类的文档版本
    status: implemented
    visibility: internal
    trigger: product-process.operation-document-binding.save
    scope: operation-binding
    condition:
      all:
        - fact: documentVersion
          operator: exists
          value: true
        - fact: operationBinding.documentBindings.documentVersionId
          operator: unique-within
          value: operation-binding
    result:
      type: persist-multiple-document-version-references
      categoryRestriction: none
    explanation: 工序文档绑定面向存在的受控文档版本，不限于 SOP 分类；同一工序可引用零到多个不同文档版本，但不可重复同一版本。
    evidenceIds: [evidence.operation-document-binding-entity, evidence.migration-0045-document-versions, evidence.product-process-controller]
  - id: rule.product-process.pdf-page-range
    name: PDF 文档引用可配置页码范围
    status: implemented
    visibility: internal
    trigger: product-process.operation-document-binding.save
    scope: operation-binding
    condition:
      any:
        - all:
            - fact: documentVersion
              operator: exists
              value: true
            - any:
                - fact: documentFile.mimeType
                  operator: equals-ignore-case
                  value: application/pdf
                - fact: documentFile.originalName
                  operator: ends-with-ignore-case
                  value: .pdf
            - any:
                - all:
                    - fact: documentBinding.pageStart
                      operator: is-null
                      value: true
                    - fact: documentBinding.pageEnd
                      operator: is-null
                      value: true
                - all:
                    - fact: documentBinding.pageStart
                      operator: is-present
                      value: true
                    - fact: documentBinding.pageEnd
                      operator: is-present
                      value: true
                    - fact: documentBinding.pageStart
                      operator: greater-than-or-equal
                      value: 1
                    - fact: documentBinding.pageEnd
                      operator: greater-than-or-equal
                      value: documentBinding.pageStart
        - all:
            - fact: documentVersion
              operator: exists
              value: true
            - not:
                any:
                  - fact: documentFile.mimeType
                    operator: equals-ignore-case
                    value: application/pdf
                  - fact: documentFile.originalName
                    operator: ends-with-ignore-case
                    value: .pdf
            - fact: documentBinding.pageStart
              operator: is-null
              value: true
            - fact: documentBinding.pageEnd
              operator: is-null
              value: true
    result:
      type: persist-page-range
      fields: [pageStart, pageEnd]
    explanation: PDF 由 MIME 类型不区分大小写等于 application/pdf 或原始文件名不区分大小写以 .pdf 结尾判定。PDF 可不配置页码，配置时两端必须同时提供、起始页至少为 1 且结束页不早于起始页；非 PDF 不允许任何页码。
    evidenceIds: [evidence.operation-document-binding-entity, evidence.migration-0052-document-pages, evidence.product-process-controller, evidence.product-process-version-editor]
  - id: rule.product-process.explicit-execution-selection
    name: 生产执行显式选择产品或产品簇制程版本
    status: specified
    visibility: internal
    trigger: work-order.split-batch
    scope: work-order-and-production-batch
    condition:
      all:
        - fact: productionBatch.productProcessVersion
          operator: explicitly-selected
          value: true
        - fact: productionBatch.productProcessVersion.ownerType
          operator: in
          value: [PRODUCT, PRODUCT_FAMILY]
    result:
      type: require-explicit-process-version
      target: production-batch
    explanation: 已确认的生产规则是创建生产对象时必须显式选择产品或产品簇的具体制程版本；工单/批次选择、持久化和运行期消费尚未实现，因此该规则仅作为内部指定规则保留。
    evidenceIds: [evidence.business-knowledge-model]
  - id: rule.product-process.available-version-window
    name: 制程版本可用性严格沿用 RdoVersionStatusResolver
    status: implemented
    visibility: internal
    trigger: production-process.version.resolve
    scope: product-process-version
    condition:
      all:
        - fact: RdoVersionStatusResolver.resolve(processVersion.effectiveFrom, processVersion.effectiveTo, queryTime)
          operator: equals
          value: ACTIVE
    result:
      type: require-explicit-process-version
      resolver: RdoVersionStatusResolver
      unavailableWhen: [effectiveFrom-later-than-query-time, effectiveTo-less-than-or-equal-to-query-time]
    explanation: 制程版本可用性严格沿用 RdoVersionStatusResolver；effectiveFrom 晚于查询时间，或 effectiveTo 小于等于查询时间，均不可用。
    evidenceIds: [evidence.product-process-resolution-service, evidence.product-process-resolution-service-test]
  - id: rule.product-process.product-version-takes-precedence
    name: 产品有可用制程时不返回产品簇兜底
    status: implemented
    visibility: internal
    trigger: production-process.version.resolve
    scope: production-process-selection
    condition:
      all:
        - fact: product.availableProcessVersionCount
          operator: greater-than-or-equal
          value: 1
        - fact: selectedProcessVersion.ownerType
          operator: equals
          value: PRODUCT
        - fact: RdoVersionStatusResolver.isReferenceable(selectedProcessVersion.effectiveFrom, selectedProcessVersion.effectiveTo, queryTime)
          operator: equals
          value: true
    result:
      type: require-explicit-process-version
      ownerType: PRODUCT
      returnProductFamilyFallback: false
    explanation: 制程解析服务发现产品存在可用制程版本时，只返回产品版本，不返回产品簇兜底版本。
    evidenceIds: [evidence.product-process-resolution-service, evidence.product-process-resolution-service-test]
  - id: rule.product-process.product-family-fallback
    name: 产品无可用制程时返回产品簇兜底
    status: implemented
    visibility: internal
    trigger: production-process.version.resolve
    scope: production-process-selection
    condition:
      all:
        - fact: product.availableProcessVersionCount
          operator: equals
          value: 0
        - fact: productFamily.availableProcessVersionCount
          operator: greater-than-or-equal
          value: 1
        - fact: selectedProcessVersion.ownerType
          operator: equals
          value: PRODUCT_FAMILY
        - fact: RdoVersionStatusResolver.isReferenceable(selectedProcessVersion.effectiveFrom, selectedProcessVersion.effectiveTo, queryTime)
          operator: equals
          value: true
    result:
      type: require-explicit-process-version
      ownerType: PRODUCT_FAMILY
      returnProductFamilyFallback: true
      message: 当前产品未配置可用制程，以下为产品簇兜底制程
    explanation: 制程解析服务发现产品没有可用制程版本且所属产品簇有可用版本时，返回产品簇版本并带“当前产品未配置可用制程，以下为产品簇兜底制程”提示。
    evidenceIds: [evidence.product-process-resolution-service, evidence.product-process-resolution-service-test]
  - id: rule.product-process.no-available-version-block
    name: 产品和产品簇均无可用制程时阻断
    status: implemented
    visibility: internal
    trigger: production-process.version.resolve
    scope: production-process-selection
    condition:
      all:
        - fact: product.availableProcessVersionCount
          operator: equals
          value: 0
        - fact: productFamily.availableProcessVersionCount
          operator: equals
          value: 0
    result:
      type: block
      reason: no-available-process-version
    explanation: 制程解析服务发现产品和所属产品簇都没有按 RdoVersionStatusResolver 判定为可用的制程版本时，阻断解析。
    evidenceIds: [evidence.product-process-resolution-service, evidence.product-process-resolution-service-test]
  - id: rule.product-family.member-transfer-future-only
    name: 产品簇成员转移只影响未来生产对象
    status: specified
    visibility: internal
    trigger: product-family.member.transfer
    scope: product-family-membership-and-production
    condition:
      all:
        - fact: product.currentProductFamily
          operator: is-present
          value: true
        - fact: product.newProductFamily
          operator: is-present
          value: true
    result:
      type: persist-version-references
      appliesTo: future-production-objects
      existingProductionObjectsUnchanged: true
    explanation: 转移产品簇只影响未来创建的生产对象，已存在的生产对象不因成员关系变化而重算产品簇或制程。
    evidenceIds: []
  - id: rule.product-family.member-transfer-audit
    name: 产品簇成员转移需要事务确认和审计
    status: implemented
    visibility: internal
    trigger: product-family.member.transfer
    scope: product-family-membership
    condition:
      all:
        - fact: productFamilyTransfer.confirmation
          operator: equals
          value: second-confirmation
        - fact: productFamilyTransfer.reason
          operator: is-null
          value: true
    result:
      type: persist-version-references
      transactionRequired: true
      reasonField: not-collected
      auditSubjects: [product, old-product-family, new-product-family]
    explanation: 产品成员转移必须在事务中执行并二次确认，不填写转移原因，同时记录产品、旧产品簇和新产品簇审计。
    evidenceIds: [evidence.product-family-membership-service, evidence.process-modeling-controller, evidence.product-family-membership-service-test, evidence.process-modeling-controller-test]
  - id: rule.product-process.freeze-batch-execution-snapshot
    name: 生产对象创建时保存产品簇和制程配置快照
    status: specified
    visibility: internal
    trigger: production-batch.execution-start
    scope: production-batch
    condition:
      all:
        - fact: productionBatch.product
          operator: is-present
          value: true
        - fact: productionBatch.productProcessVersion
          operator: is-present
          value: true
    result:
      type: freeze-execution-snapshot
      source: selected-product-process-version
      fields: [productId, productFamilyId, selectedProductProcessVersionId, configurationSnapshot]
    explanation: 未来创建的生产对象需要保存产品、产品簇、所选版本和配置快照；生产快照落库尚未实现。
    evidenceIds: []
  - id: rule.product-process.form-required-configuration
    name: 工序表单完工要求仅作为配置保存
    status: implemented
    visibility: internal
    trigger: product-process.operation-form-binding.save
    scope: operation-binding
    condition:
      all:
        - fact: productModelEditor.formBinding.required
          operator: configurable
          value: checkbox
        - fact: productProcessOperationFormBinding.required
          operator: persisted
          value: boolean
    result:
      type: persist-form-required-configuration
      field: required
      defaultWhenNull: true
    explanation: 产品制程版本编辑器显示“工序结束前完成”复选框，后端将其保存到 ProductProcessOperationFormBinding.required；当前这是配置能力，不产生工序运行阻断。
    evidenceIds: [evidence.product-process-version-editor, evidence.product-process-controller, evidence.operation-form-binding-entity]
  - id: rule.product-process.form-complete-before-operation
    name: 必填表单未完成时阻断工序完工
    status: planned
    visibility: internal
    trigger: operation.complete
    scope: operation
    condition:
      all:
        - fact: formBinding.required
          operator: equals
          value: true
        - fact: formInstance.status
          operator: not-equals
          value: completed
    result:
      type: block
      reason: required-form-not-completed
    explanation: 当 required 配置为 true 且表单实例状态不是 completed 时，未来应阻断工序完工；当前没有运行期执行契约或阻断实现。
    evidenceIds: [evidence.business-knowledge-model, evidence.operation-form-binding-entity]
