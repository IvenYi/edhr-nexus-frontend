knowledgeModelVersion: 0.3.24
decisions:
  - id: DEC-0068
    title: DHR 填报与审核、受控追加及证据影响边界
    status: specified
    visibility: internal
    context: >-
      user-confirmed；依据 DEC-PACKAGE-20260923-DHR-FILLING-REVIEW 及本次用户确认沉淀 L2 设计，实施仍在进行。
      supersedes 仅局部替代 DEC-0063-07 的审核延期、DEC-0062-08 的填报补充及汇总审核退回排除边界，
      以及 DEC-0056-01 中本切片 DHR 菜单的展示名称；按最新明确指令使用 DHR审核，其他模块审批术语不变。
      DEC-0062 的唯一 DHR 与生产完成语义、DEC-0063 的三类实例、不可变版本、制程冻结绑定及不回填边界继续适用。
      不将进行中的代码、旧测试报告或接口设想解释为本切片已经实现；不扩展 schema、事实目录或执行契约。
    decisionStatements:
      - id: DEC-0068-01
        statement: user-confirmed；DHR 管理保留 DHR填报、DHR汇总、DHR审核、DHR列表四个菜单。填报承载来源表单的填报与受控追加，汇总整理并冻结版本，审核提供针对不可变汇总版本的个人待办/已办，列表承担查询与详情；不能因新增入口混淆职责或授予其他动作权限。
        status: specified
        visibility: internal
      - id: DEC-0068-02
        statement: user-confirmed；沿用目录直接绑定、作业表单节点、生产执行自定义表单三种实例来源，按实例区分同模板多份，保持既有实例级归档规则。“补录”是低频动作，不凸显为日常主操作，也不因此定义第四种业务来源；具体追加来源映射留待实现核对。DHR 汇总候选的视觉呈现与整组操作由 DEC-0072 局部细化，不改变本条的逐实例证据边界。
        status: specified
        visibility: internal
      - id: DEC-0068-03
        statement: user-confirmed；受控追加创建新的表单实例，不修改旧实例，不手工新建 DHR，不覆写旧汇总版本。完工补录不自动重开生产或恢复工序执行；旧记录、签署和审计历史保留。
        status: specified
        visibility: internal
      - id: DEC-0068-04
        statement: user-confirmed；表单变更、表单作废由朋友负责的记录控制模块实现与判定生效，DHR 只消费有效来源变化并评估证据影响；申请发起或审批中不等同于已生效，不接管变更作废审批或替其定义活动记录作废资格。
        status: specified
        visibility: internal
      - id: DEC-0068-05
        statement: user-confirmed；汇总版本审核中，系统自动识别并标识已纳入证据的有效变化，通知受影响情况并阻断基于过时证据的批准；退回整理必须由人执行，不由系统自动退回。退回后形成新草稿与新汇总版本，原提交快照与审批历史保留。
        status: specified
        visibility: internal
      - id: DEC-0068-06
        statement: user-confirmed；已批准汇总版本受到证据变化影响时，不自动退回、不清除批准结论或历史，不就地改写旧版证据；需要重新审核时，由人发起新版本整理和重审，旧批准只解释其当时的冻结版本。
        status: specified
        visibility: internal
      - id: DEC-0068-07
        statement: user-confirmed；需要审核的汇总按生产开工时冻结的 DHR_SUMMARY 流程定义及版本显式启动，审核任务与结果绑定本次不可变汇总版本；不得自动追随最新流程、临时改用绑定规则或通过通用流程入口绕过 DHR 的权限、证据有效性和版本校验。NONE 不被本决策改为强制审核。
        status: specified
        visibility: internal
      - id: DEC-0068-08
        statement: user-confirmed；填报、追加、证据影响识别、退回、新版本重审与批准均不自动改变生产完成状态或产品放行状态；不新增产品放行规则，不自动重开生产，不回填历史 DHR 审核绑定、汇总版本或历史审批事实。
        status: specified
        visibility: internal
      - id: DEC-0068-09
        statement: user-confirmed；新页面复用当前共享组件规范。独立列表使用 ListTableShell、共享表格样式及 TableStateCell；普通新建编辑使用 FormDialog、FormDialogSection 与 FormDialogFieldGrid，确认使用 ConfirmDialog；详情、预览和签名按既有专用组件边界处理。规范路径和验收要点见本决策证据，不另建本切片 UI 规范。
        status: specified
        visibility: internal
      - id: DEC-0068-10
        statement: user-confirmed；扩展路径为 product-core 与 transaction-orchestration，由 DHR 域编排既有表单及流程引擎；主开发负责 DHR 代码和测试，朋友负责表单变更作废模块。菜单/动作授权、冻结流程候选资格、证据检测与人工动作审计分别核验，不增加客户条件分支。
        status: specified
        visibility: internal
    supersedes: [DEC-0062, DEC-0063, DEC-0056]
    evidenceIds: [evidence.dhr-filling-review-confirmed, evidence.dhr-filling-review-source-boundary, evidence.dhr-filling-review-ui-standard]
    acceptanceScenarios:
      - id: scenario.dhr-filling-review-menus-and-sources
        given: 用户具有相应 DHR 菜单与动作权限，生产对象已有 DHR 和三类表单实例
        when: 使用四个菜单查询、填报、整理和审核
        then: 各入口职责和权限独立，实例身份与证据关联逐份保留；DHR 汇总候选按 DEC-0072 成组呈现，低频补录不成为突出主操作，列表和弹窗遵守共享组件规范
        evidenceIds: [evidence.dhr-filling-review-confirmed, evidence.dhr-filling-review-ui-standard]
        evidenceRequirements: [菜单及接口权限测试, 三类来源与多份回归, 页面交互与共享组件视觉验证]
      - id: scenario.dhr-filling-review-controlled-addition
        given: 生产已完成且已有来源实例及冻结汇总版本
        when: 有权用户执行受控补录
        then: 创建新表单实例，保留旧实例和旧汇总快照，不手工创建 DHR、不重开生产、不改变放行
        evidenceIds: [evidence.dhr-filling-review-confirmed]
        evidenceRequirements: [新增身份与历史不变集成测试, 权限与并发测试, 生产完成状态及放行无副作用回归]
      - id: scenario.dhr-filling-review-frozen-binding
        given: 已完成 DHR 冻结 REQUIRED 审核绑定，之后流程已发布其他版本
        when: 提交本次汇总并生成个人审核待办
        then: 任务准确绑定本次不可变汇总版本和既定流程版本，通用入口不得绕过 DHR 校验，不产生产品放行
        evidenceIds: [evidence.dhr-filling-review-confirmed]
        evidenceRequirements: [冻结绑定集成测试, 任务与已办归属测试, 通用入口防绕过测试, 并发提交测试]
      - id: scenario.dhr-filling-review-effective-impact
        given: 审核中的冻结汇总已纳入一份来源实例
        when: 来源变更或作废实际生效后请求批准
        then: 系统自动标识影响并阻断过时批准，人工退回整理后形成新版本，保留旧快照和退回历史；仅申请待审不伪装为来源已生效
        evidenceIds: [evidence.dhr-filling-review-confirmed]
        evidenceRequirements: [真实生效接口集成测试, 生效与批准并发测试, 待审申请对照测试, 人工退回与历史保留测试]
      - id: scenario.dhr-filling-review-approved-history
        given: 汇总版本已经批准，后续其证据发生有效变化
        when: 系统识别影响且用户决定发起重新审核
        then: 系统不自动退回或擦除旧批准，由人创建新版本重审，原批准与原快照保持可追溯，生产及放行状态不自动变化
        evidenceIds: [evidence.dhr-filling-review-confirmed]
        evidenceRequirements: [批准后影响集成测试, 人工新版重审测试, 快照与审计历史不可变回归]
    implementationDiscrepancies: []
