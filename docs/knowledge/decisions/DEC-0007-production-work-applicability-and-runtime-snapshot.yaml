knowledgeModelVersion: 0.3.25
decisions:
  - id: DEC-0007
    title: 生产作业适用规则准入、模板删除与实例执行快照
    status: specified
    visibility: internal
    context: 初始作业配置阶段尚无生产执行、作业实例运行和快照落库；当时确认模板删除只受适用规则引用阻断，规则配置须使用当前已发布流程，生产执行按上下文自动匹配作业并冻结执行依据。后续 ExecutionSnapshotBuilder/ProductionExecutionEngine 已有 OPERATION_START 范围的匹配、嵌入作业图快照、受限条件求值和节点推进，不能再概括为全部未实现；独立作业实例、完整规则修订依据及通用事实/异常审计契约仍有缺口。本决策初始仅替代 DEC-0006 的“存在已发布流程即禁止删除模板”和仅冻结作业版本的旧边界；2026-10-26直接修正03/04的作业实时匹配及实例保留含义，并明确DEC-0002-10的未来对象限制不适用于作业候选，其制程范围后由2026-10-27批次制程确认直接修正，按DEC-0002-10与DEC-0012当前定义执行。原始证据见evidence.production-work-live-matching-confirmed，其余配置、生命周期、审计与页面语义保留。
    decisionStatements:
      - id: DEC-0007-01
        statement: 作业模板没有任何适用规则时，无论是否存在草稿、历史流程或当前已发布流程，均允许同事务删除模板及全部流程配置；存在适用规则时禁止删除。初始配置阶段无生产运行的时点说明不再作为当前全系统事实；后续实例冻结仍须按自身证据验证。
        status: specified
        visibility: internal
      - id: DEC-0007-02
        statement: 作业适用规则只能配置有当前已发布作业流程版本的作业模板；无当前已发布流程的作业仍在选择器中展示但不可选，并提示“该作业尚未发布作业流程版本”。草稿和历史流程不能满足该准入条件。
        status: specified
        visibility: internal
      - id: DEC-0007-03
        statement: 生产作业按当前生产上下文、产品簇和适用规则实时自动匹配，不在产品或工序配置中手工引用模板/版本。产品转簇后新命中的作业只对后续工序生效，已过站工序不补做；批次首次开工不冻结后续工序全部作业候选。当前 OPERATION_START 切片沿用工序开工触发：待开工工序查询当前候选，合法 START 事务重新匹配并创建缺失实例，已开工或已完成工序不补入新作业。该触发与查询/创建分离是工程落实，不新增触发类型或旧模式开关。
        status: specified
        visibility: internal
      - id: DEC-0007-04
        statement: 创建作业实例时冻结作业模板、创建时当前已发布流程版本、命中适用规则、匹配事实及流程配置。已创建实例即使尚未执行任何业务节点，也继续归属于原批次并沿原快照执行；产品转簇、规则失配或后续发布均不删除、替换或重置既有实例。候选计划不等于实例；当前嵌入实现以 state.operations 中的 works 状态识别已创建实例，不以 snapshot 中的计划项单独判断。
        status: specified
        visibility: internal
      - id: DEC-0007-05
        statement: 本决策初始交付只确认未来执行契约和快照边界，当时不得据配置称运行已实现。后续已有受限自动匹配、嵌入作业状态、快照落库、节点推进和生产执行审计；按对应源码及独立决策记录实际范围，不能把局部实现提升为独立作业实例或完整通用规则运行资格。
        status: specified
        visibility: internal
    supersedes: [DEC-0006]
    evidenceIds: [evidence.production-work-live-matching-confirmed, evidence.production-work-applicability-and-runtime-decision, evidence.ai-transaction-runtime-architecture, evidence.production-work-template-configuration-controller, evidence.production-work-applicability-dialog-ui, evidence.production-work-template-configuration-test]
    acceptanceScenarios:
      - id: scenario.production-work-template-delete-without-applicability-rule
        given: 一个作业模板没有任何作业适用规则，但存在草稿、历史流程或当前已发布流程
        when: 用户删除该作业模板
        then: 系统允许在同一事务中删除作业模板及其全部流程配置，不因流程版本状态阻断
        evidenceIds: [evidence.production-work-template-configuration-controller, evidence.production-work-template-configuration-test]
        evidenceRequirements: [作业模板删除 API 测试, 级联流程配置删除集成测试, 审计测试]
      - id: scenario.production-work-template-delete-blocked-by-applicability-rule
        given: 一个作业模板至少存在一条作业适用规则
        when: 用户删除该作业模板
        then: 系统禁止删除并返回存在作业适用规则的稳定业务原因
        evidenceIds: [evidence.production-work-template-configuration-controller, evidence.production-work-template-configuration-test]
        evidenceRequirements: [作业模板删除 API 测试]
      - id: scenario.production-work-applicability-selector-requires-published-flow
        given: 作业选择器同时包含有当前已发布流程和没有当前已发布流程的作业模板
        when: 用户新增作业适用规则
        then: 两类作业均展示；无当前已发布流程的作业不可选并提示“该作业尚未发布作业流程版本”，服务端也拒绝为其保存规则
        evidenceIds: [evidence.production-work-applicability-dialog-ui, evidence.production-work-template-configuration-controller]
        evidenceRequirements: [适用规则 UI E2E, 适用规则 API 测试]
      - id: scenario.production-work-instance-auto-match-and-freeze
        given: 待开工工序的当前生产上下文命中一条指向有当前已发布流程作业模板的适用规则
        when: 系统创建作业实例
        then: 系统不读取产品或工序上的手工作业引用，而是按适用规则自动选择作业，并冻结作业模板、已发布流程版本、命中规则快照和流程配置快照
        evidenceIds: []
        evidenceRequirements: [作业运行时集成测试, 快照持久化测试, 版本兼容测试, 审计追溯测试]
      - id: scenario.production-work-live-match-after-family-transfer
        given: 批次已有作业实例且存在待开工工序
        when: 产品转簇并查询和开工后续工序
        then: 后续工序按当前规则及已发布流程匹配；查询不创建实例；已有实例包括零业务节点执行的实例保留原快照和归属；已过站工序不补做
        evidenceIds: [evidence.production-work-live-matching-confirmed]
        evidenceRequirements: [产品转簇集成测试, 既有实例及表单保留比较, 查询零写入, START审计回滚]
    implementationDiscrepancies:
      - id: discrepancy.production-work-template-delete-still-blocks-published-flow
        status: resolved
        severity: medium
        visibility: internal
        path: gmp-platform/backend/src/main/java/com/zencas/edhr/workflow/controller/WorkTemplateController.java
        lineHint: 115
        summary: 当前控制器按适用规则存在性阻断删除；无规则时遍历删除草稿、历史和当前已发布流程配置后再删除模板，并由控制器测试覆盖有已发布流程历史无规则时允许删除、有规则时阻断删除的两条路径。本知识任务不修改业务代码。
        evidenceIds: [evidence.production-work-template-configuration-controller, evidence.production-work-template-configuration-test]
      - id: discrepancy.production-work-runtime-and-snapshot-unimplemented
        status: accepted
        severity: high
        visibility: internal
        path: docs/architecture/ai-enabled-custom-delivery-and-transaction-runtime.md
        lineHint: 151
        summary: 初始配置阶段未实现运行闭环的历史差异保留。首次合法 START 冻结制程侧路线、工序和表单；作业按 DEC-0007-03/04 在各工序实例创建时冻结规则、匹配事实和已发布图，后续候选实时匹配。受限作业状态嵌入生产执行；尚缺独立作业实例完整规则修订依据、通用事实及异常审计契约，正式执行注册资格不能从局部实现推定。2026-10-26直接修正当前定义，旧整批冻结表述及原始来源见本轮确认证据，不回写历史审计和快照。
        evidenceIds:
        - evidence.ai-transaction-runtime-architecture
        - evidence.production-execution-snapshot-builder-source
        - evidence.production-execution-service-source
        - evidence.production-execution-engine-source
      - id: discrepancy.production-work-unpublished-selector-message
        status: open
        severity: medium
        visibility: internal
        path: gmp-platform/frontend/src/pages/workflow-center/WorkApplicabilityRulesTab.tsx
        lineHint: 269
        summary: 选择器已展示并禁用无当前已发布流程的作业，但现有 title 为“该作业尚未发布作业流程版本，无法配置适用规则”，行内标签为“未发布流程”；尚未独立验证确认文案“该作业尚未发布作业流程版本”的精确提示投影。本知识任务不修改前端。
        evidenceIds: [evidence.production-work-applicability-dialog-ui]
      - id: discrepancy.production-work-template-delete-fallback-message
        status: open
        severity: medium
        visibility: internal
        path: gmp-platform/frontend/src/pages/workflow-center/WorkTemplateList.tsx
        lineHint: 309
        summary: 删除作业模板失败时的前端兜底文案仍提示“没有已发布流程或其他配置记录”，与当前仅按是否存在作业适用规则阻断的业务规则不一致；后端返回稳定业务错误时会优先显示后端消息。本知识任务不修改前端。
        evidenceIds: [evidence.production-work-template-configuration-ui]
