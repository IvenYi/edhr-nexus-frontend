knowledgeModelVersion: 0.3.25
decisions:
  - id: DEC-0018
    title: 工单提前结束与批次管理再拆分边界
    status: specified
    visibility: internal
    context: "provenance: user-confirmed（工单需要补上提前结束能力；统一使用 EARLY_TERMINATED；MVP 暂不做既有 BATCH 再拆分及父子谱系查询；两个拆分弹窗分别归属工单初始拆分和批次管理再拆分）；provenance: original-evidence（冠骋批次关闭、批次转 SN、返工子批次、删除和开工源码）。本决策区分已确认的产品边界与后续规划，未将冠骋行为直接视为 eDHR 已实现功能。"
    decisionStatements:
      - id: DEC-0018-01
        statement: "provenance: user-confirmed；工单提供用户主动的提前结束动作，使用EARLY_TERMINATED并保留结束原因、时间及审计；它不由单个批次提前结束自动触发。"
        status: specified
        visibility: internal
      - id: DEC-0018-01A
        statement: "provenance: user-confirmed；工单和生产对象的提前结束统一使用 EARLY_TERMINATED，区别于正常完成 COMPLETED、行政关闭 CLOSED 和未开工取消 CANCELLED。"
        status: specified
        visibility: internal
      - id: DEC-0018-02
        statement: "provenance: user-confirmed；工单手动提前结束前必须先处理所有子批次：存在CREATED或IN_PROGRESS对象时阻止操作，用户须分别取消未开工对象或按既有规则处理生产中对象。无未结束对象后填写原因才可结束工单；不主动级联取消/终止批次、表单或DHR，已结束子对象保持原状态；工单结束后不得继续拆分或开工。"
        status: specified
        visibility: internal
      - id: DEC-0018-03
        statement: "provenance: user-confirmed；未开工对象取消不改变工单计划数量，CANCELLED对象targetQuantity不计有效分配量。全部未开工对象取消时工单保持CREATED，可以重新选择当前适用制程继续拆分，但既定生产形态及曾拆批后的产品身份锁定不解除；对象及审计保留。"
        status: implemented
        visibility: internal
      - id: DEC-0018-04
        statement: "provenance: user-confirmed + original-evidence；批次管理页面对既有批次再次拆分是独立能力，不等同于工单管理页面把工单首次拆成 BATCH/SN 的初始拆分；既有 BATCH->BATCH 暂不纳入当前 MVP，后续再讨论是否与 BATCH->SN、返工子批次共用独立接口和生命周期设计。"
        status: planned
        visibility: internal
      - id: DEC-0018-05
        statement: "provenance: user-confirmed + inference；MVP 暂不实现父子生产对象查询或谱系页面；若后续决定实现批次管理再拆分，再单独讨论是否持久化父子关系、来源原因和数量流向，以及在详情或数据审计中提供查询。当前不把该未来能力写成 eDHR 已有功能。"
        status: planned
        visibility: internal
      - id: DEC-0018-06
        statement: "provenance: inference + original-evidence + superseded-by-user-confirmed；该早期推断曾建议批量导入或批量拆分通过 correlationId 关联内部汇总记录。后续 DEC-0019-04 已明确否决该方案：当前批量拆分为每个实际生产对象分别写入一条 CREATE 审计，不新增或落库 correlationId 批量汇总记录；客户动作类别继续统一投影为新增和修改。本声明仅保留历史推断，不再是待确认方案。"
        status: deprecated
        visibility: internal
      - id: DEC-0018-07
        statement: "provenance: historical-inference + resolved-by-user-confirmed；该早期推断建议 DHR 在生产对象首次开工时创建，拆分阶段不创建有效 DHR。2026-09-17 用户已通过 DEC-0062 确认该时点并收敛同事务、唯一性和非目标；本声明仅保留历史推断来源。"
        status: deprecated
        visibility: internal
      - id: DEC-0018-08
        statement: "provenance: user-confirmed；工单管理中的生产对象拆分弹窗负责工单在 CREATED 或 IN_PROCESS 状态下按剩余计划数量创建对象并维护待提交清单；批次管理中的再拆分属于既有批次的独立能力，两者不可复用为同一业务入口。"
        status: specified
        visibility: internal
    supersedes: [DEC-0013]
    evidenceIds: [evidence.production-work-order-entity, evidence.work-order-status-machine, evidence.production-service, evidence.production-object-status-machine, evidence.production-object-entity, evidence.production-object-controller, evidence.production-object-audit-annotations, evidence.audit-controller-action-projection, evidence.guancheng-batch-lifecycle-source, evidence.guancheng-batch-close-source, evidence.guancheng-batch-remove-source, evidence.guancheng-batch-split-source, evidence.guancheng-batch-start-source, evidence.batch-process-direct-correction-confirmed]
    acceptanceScenarios:
      - id: scenario.production-work-order-early-termination
        given: 工单处于CREATED或IN_PROCESS（入口状态集合为本轮工程选择），所有子对象均为终态且不存在CREATED或IN_PROGRESS对象
        when: 用户填写原因并执行工单提前结束
        then: 工单EARLY_TERMINATED并保留原因时间审计，不修改任何子对象；若存在CREATED或IN_PROGRESS对象则阻断，后续不能拆分或开工
        evidenceIds: [evidence.work-order-status-machine, evidence.production-service, evidence.production-object-status-machine, evidence.guancheng-batch-close-source]
        evidenceRequirements: [未结束对象阻断测试, 原因必填及审计测试, 子对象无级联变更测试]
      - id: scenario.production-cancel-releases-work-order-allocation
        given: CREATED 或 IN_PROCESS 工单有一个或多个未开工生产对象
        when: 用户取消其中对象或全部对象
        then: 计划数量不变，取消对象数量从有效分配量中扣除；全部对象均未开工取消时工单保持 CREATED 并可继续拆分；已进入 IN_PROCESS 的工单仍可在剩余计划数量内继续拆分
        evidenceIds: [evidence.production-service, evidence.production-object-cancel-side-effects-current, evidence.production-service-test, evidence.guancheng-batch-remove-source]
        evidenceRequirements: [已取消未开工对象全量替代拆分测试, 全部取消保持 CREATED 测试]
      - id: scenario.production-batch-resplit-is-post-mvp
        given: 用户在批次管理页面查看既有 BATCH 生产对象
        when: 用户需要再次拆分该批次
        then: 当前 MVP 不提供该动作；后续独立能力不得调用工单初始拆分弹窗，且实现时必须保留父子关系和数量守恒
        evidenceIds: [evidence.production-work-order-page-pending-list, evidence.production-service, evidence.guancheng-batch-lifecycle-source]
        evidenceRequirements: [页面入口边界验证, 后续批次再拆分设计评审]
      - id: scenario.production-object-lineage-query
        given: 生产对象由既有批次拆分、转 SN 或返工产生子对象
        when: 用户查看对象详情或数据审计
        then: 当前 MVP 不提供父子对象查询或谱系页面；后续批次再拆分立项时再确认字段、查询形式和关联审计
        evidenceIds: [evidence.production-object-entity, evidence.guancheng-batch-lifecycle-source, evidence.guancheng-batch-split-source]
        evidenceRequirements: [父子关系持久化测试, 详情和审计查询验证]
      - id: scenario.production-dhr-created-on-first-start
        given: 生产对象已完成工单拆分但尚未开工
        when: 生产执行模块首次开工该对象
        then: 系统在首次合法 START 时同事务创建唯一 DHR 并绑定执行快照；拆分阶段不创建 DHR
        evidenceIds: [evidence.dhr-instance-management-user-confirmed, evidence.dhr-instance-start-transaction-source, evidence.production-service]
        evidenceRequirements: [首次开工 DHR 创建测试, 未开工取消无 DHR 残留测试]
    implementationDiscrepancies:
      - id: discrepancy.production-work-order-early-termination-contract-not-implemented
        status: resolved
        severity: high
        visibility: internal
        path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/engine/WorkOrderStatusMachine.java
        lineHint: 8
        summary: "provenance: original-evidence + user-confirmed；状态机IN_PROCESS->EARLY_TERMINATED已有实现，该原缺口关闭。2026-10-27直接撤销全部对象终态且存在提前结束对象时的自动联动，改为独立工单命令；状态机存在不等于命令与审计已经验收。"
        evidenceIds: [evidence.work-order-status-machine, evidence.production-service, evidence.production-service-test]
      - id: discrepancy.production-work-order-early-termination-command-not-implemented
        status: resolved
        severity: high
        visibility: internal
        path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/controller/WorkOrderController.java
        lineHint: 98
        summary: "provenance: original-evidence；本轮WorkOrderController.end和ProductionService.endOrder已新增显式命令，原因及时间持久化、无未结束子对象校验、不主动级联，并写审计。CREATED/IN_PROCESS入口集合属于工程落实；状态机、数据库及运行验收取本轮证据，不能由旧对象自动汇总替代。"
        evidenceIds: [evidence.work-order-controller, evidence.production-service, evidence.production-service-test, evidence.production-object-early-termination-gap]
      - id: discrepancy.production-batch-resplit-not-mvp
        status: accepted
        severity: medium
        visibility: internal
        path: gmp-platform/frontend/src/pages/production/WorkOrderPage.tsx
        lineHint: 545
        summary: 'provenance: user-confirmed；DEC-0018-04/-05 已确认既有对象再拆分不纳入当前 MVP，原“建议/待业务确认”的说法已过时。当前排除范围继续有效；将来谱系、数量和新页面/API细节仍需独立设计，不能由排除确认推定已确认全部后续规则。'
        evidenceIds: [evidence.production-work-order-page-pending-list, evidence.production-service]
      - id: discrepancy.production-object-lineage-not-queryable
        status: accepted
        severity: medium
        visibility: internal
        path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/entity/ProductionObject.java
        lineHint: 12
        summary: "provenance: user-confirmed；MVP 明确不实现父子对象查询或谱系页面，待后续批次再拆分立项时重新讨论。"
        evidenceIds: [evidence.production-object-entity, evidence.guancheng-batch-lifecycle-source]
