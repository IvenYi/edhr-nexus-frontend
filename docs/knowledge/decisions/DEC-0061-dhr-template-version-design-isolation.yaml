knowledgeModelVersion: 0.3.25
decisions:
  - id: DEC-0061
    title: DHR 模板设计版本隔离
    status: implemented
    visibility: internal
    context: user-confirmed；同一批记录模板可拥有独立版本 composition。用户从版本行点击设计时必须以明确选择的版本作为设计上下文，避免缓存或默认排序展示或保存到另一个版本。本决策具体化 RDO 版本治理中的显式版本引用约束，仅覆盖模板设计 composition，不改变 DHR 实例、生产快照、审计事件或持久化模型。
    decisionStatements:
      - id: DEC-0061-01
        statement: 批记录模板复制版本后，目标版本的目录和表单引用可独立于源版本保存。
        status: implemented
        visibility: internal
      - id: DEC-0061-02
        statement: 从版本行点击设计时，DHR 模板设计窗口必须读取和保存用户明确选择的 templateId 与 versionId；不得以缓存、默认排序、最新版本或父模板替代该 versionId。
        status: implemented
        visibility: internal
    supersedes: []
    evidenceIds: [evidence.dhr-template-version-design-isolation-user-confirmed, evidence.dhr-template-composition-controller, evidence.dhr-template-workspace-version-selection, evidence.dhr-template-composition-controller-test, evidence.dhr-template-workspace-static-regression]
    acceptanceScenarios:
      - id: scenario.dhr-template-design-target-version
        given: 同一批记录模板存在 V1 和已复制并独立修改的 V2，且工作区查询已缓存
        when: 用户从 V1 版本行点击设计
        then: 窗口标题、目录和引用表单均来自 V1，不显示或保存 V2 内容
        evidenceIds: [evidence.dhr-template-version-design-isolation-user-confirmed, evidence.dhr-template-workspace-version-selection, evidence.dhr-template-workspace-static-regression]
        evidenceRequirements: [前端回归断言, 用户手工交互验收]
      - id: scenario.dhr-template-composition-read-scope
        given: V1 与 V2 各有不同目录
        when: 请求 V1 composition
        then: 后端只读取 V1 目录和条目
        evidenceIds: [evidence.dhr-template-composition-controller, evidence.dhr-template-composition-controller-test]
        evidenceRequirements: [控制器单元测试]
    implementationDiscrepancies:
    - id: discrepancy.dhr-template-explicit-version-list-fallback
      status: open
      severity: high
      visibility: internal
      path: gmp-platform/frontend/src/pages/master-data/DhrTemplateWorkspaceDialog.tsx
      lineHint: 1272
      summary: 'provenance: original-evidence；cb863ad83e2aca20caf86f0e78602120e8b4727f 审计确认显式 versionId 缺失时可能静默回退。2026-10-13 在 fix/review-batch-01-20261013 按原 DEC-0061-02 修复：在查询前同步解析目标，缺失时不读其他版本且阻断保存；草稿与响应须匹配目标版本，templateId/initialVersionId/open 变化隔离工作区本地状态。新增纯函数及实际工作区 hook/API 边界测试覆盖缺失、空列表、加载/错误、显式选择、读写目标和草稿不匹配；重新引入回退后测试按预期失败。不改变复制规则、后端事务或历史实例快照；真实浏览器及独立质量门禁仍待完成，差异暂保留 open。详见 docs/development/code-review-repair-20261013.md。'
      evidenceIds:
      - evidence.dhr-template-version-design-isolation-user-confirmed
      - evidence.dhr-template-workspace-version-selection
      - evidence.dhr-template-composition-controller
