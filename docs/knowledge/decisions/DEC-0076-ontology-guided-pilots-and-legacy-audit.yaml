knowledgeModelVersion: 0.3.25
decisions:
  - id: DEC-0076
    title: AI 引导本体试点与全量存量知识审计边界
    status: specified
    visibility: internal
    context: >-
      provenance: user-confirmed / original-evidence；2026-10-12 用户认可确定性遗漏修复、全量存量知识语义对账及稳定领域通用规则层验证三个后续成果，并要求实际开发试点时由 AI 逐步指引。
      已合入的 PR #2 架构与契约允许有明确用途的 P0/P1 标准映射或 SHACL 小范围试点，本决策补齐该当前政策与 DEC-0038-04 的声明级对齐。
      同日后续 user-confirmed 澄清当前 MVP 以功能开发为主，AI 引导试点应低频开展，全项目当前 MVP 累计选择 1–2 个代表性业务功能，优先复用已有试点，不按阶段、模块或会话重新计数。
      用户确认的是目标、引导责任与审计范围，不是认定某个运行试点已经完成；本轮只补齐治理、当前说明和审计入口，保持知识 0.3.25 / schema 1.2.0，以具体 Git 提交区分增量，不提升历史业务资产成熟度。
    decisionStatements:
      - id: DEC-0076-01
        statement: >-
          provenance: original-evidence；仅替代 DEC-0038-04 被解释为所有后续 P0/P1 切片禁止有明确用途的标准映射或校验试点的范围。语义稳定且具有具体用途的切片可在 P0/P1 提前实施稳定 ID 到 IRI 的映射、JSON-LD/RDF 导出或 SHACL 校验试点，并说明依赖缺口、所有权、回滚和验证范围。
          允许提前试点不要求立即引入标准工具；本期安排同时服从 DEC-0076-02 的 MVP 功能优先与全项目累计范围。
          保留首次 P0 0.3.16 切片未引入这些能力的历史，以及不要求全量标准输出、图数据库、自动完整代码依赖图或生产直接读取研发知识目录的边界；受控推理继续由真实需求驱动，不得绕过权限、版本、审计和确定性执行契约。DEC-0038 其他声明不因决策级 supersedes 导航而整体失效。
        status: specified
        visibility: internal
      - id: DEC-0076-02
        statement: >-
          provenance: user-confirmed；当前 MVP 以功能开发为主，全项目累计 1–2 个代表性业务功能用于 AI 引导试点，不按阶段、模块或会话重置数量。优先复用、补齐已有表单流程版本引用与作业流程表单填写节点绑定试点，已有证据与当前验证目标匹配才计入；一个功能已覆盖目的即可停止新增，第二个只补不同的关键能力，不为凑数安排。
          普通功能继续必要的知识增量同步，不例行输出是否适合试点、建立新计划或重复提议。只有已有证据不能覆盖且真实功能需要的新关键路径，才在累计范围内低频触发引导，说明必要性、步骤和验收；达到目的后复用证据直到真实需求变化。超出累计范围属于新增工作，不自动扩张；必要业务修复及验收不受试点数量限制。
          用户无需先判断阶段、选择标准工具或填写交接表。已授权范围由智能体连续推进，不逐步骤重复请求批准；真实业务歧义、会改变产品取舍或新增重大交付范围时才向用户确认，未决问题只阻断依赖范围。
        status: specified
        visibility: internal
      - id: DEC-0076-03
        statement: >-
          provenance: implementation-constraint；试点计划区分语义基础、关系查询、历史解释、标准映射与 SHACL 数据校验、通用规则执行的目标，可以在同一业务切片组合，但分别记录进入依据、退出条件和证据。语义目录覆盖或标准校验通过不证明通用执行完成，稳定领域已有实现也不自动证明新规则求值器正确。
          这些类别用于区分证据，不表示 MVP 每类都需安排试点；同一代表性功能补齐相应验证时仍按该业务功能识别，不能将已有语义试点直接记为通用执行已验证。
          运行试点按既有契约闭环真实事实来源及取值时点、类型和操作符、自定义谓词、缺失及异常结果、动作适配、权限、事务、审计、适用幂等与失败处理，并在生产使用前冻结规则、事实目录、执行契约、配置版本及必要执行依据。
        status: specified
        visibility: internal
      - id: DEC-0076-04
        statement: >-
          provenance: user-confirmed；明确授权的全量存量知识审计覆盖固定目标 Git 基线下全部当前术语、概念、关系、事实、规则，以及支撑它们的决策、证据、实现锚点、执行契约、未决问题、验收场景和实现差异。没有 ID 的 Markdown 证据与说明按文件登记核对。按域分批执行只改变顺序，不缩小覆盖分母。
          对当前资产核对新契约要求、已确认含义、源码与适用测试证据、状态和投影、当前替代范围及路线依赖；对历史和废弃资产核对适用时点、来源与替代链，不强行改写成现行定义，不补造历史审计。尚未合入的功能分支按自身提交及实际集成候选单独核对，不能套用目标分支结论。MVP 的试点数量不缩小完整审计范围，完整审计也不阻塞没有相关依赖的功能开发。
        status: specified
        visibility: internal
      - id: DEC-0076-05
        statement: >-
          provenance: implementation-constraint；全量清单只建立盘点覆盖，逐项语义审计需保留资产 ID、来源提交、已读契约基线、核对依据、结论、处置和验证证据。待审、已核对一致、明确错误待修复、被替代的历史范围、业务未决和证据不足必须能够区分；结构检查、语义核对、修复闭环和运行验收分别计数。
          尚未核对的记录不得计入语义通过；已说明的未决或证据缺口可以证明完成了该项审查，但不能计入契约一致通过。目标内容变化后增量核对受影响 ID，不用相同 knowledgeModelVersion 或旧 CI 结果替代新候选验证。该全量任务与普通功能默认增量审计边界并存，不要求每次开发重审全库。
          正式审计建议在本治理 PR #3 合并后，读取当时实际 edhr-dev 提交并固定新基线，相对既有 db8d361 清单对新增、修改、删除及关联影响作增量映射；保留原始清单和来源。合并前可以准备或只读核对，合并事件本身不启动后台审计，也不证明审计已经完成。
        status: specified
        visibility: internal
      - id: DEC-0076-06
        statement: >-
          provenance: original-evidence；DEC-0038 中 discrepancy.ontology-p0-independent-quality-gate 已为 resolved，历史 P0 覆盖报告亦说明该次质量门禁已关闭。当前 README 同步这一历史事实，不再将其写成待关闭；逐事实精确来源、当前全库语义对账和后续切片验证仍按各自证据判断。历史通过既不撤销，也不继承为本次或未来范围的通过。
        status: specified
        visibility: internal
    supersedes: [DEC-0038]
    evidenceIds:
      - evidence.ontology-guided-pilot-confirmed
      - evidence.ontology-guided-pilot-policy-baseline
      - evidence.ontology-guided-pilot-project-contract
      - evidence.ontology-guided-audit-handoff
      - evidence.ontology-p0-coverage-review
    acceptanceScenarios:
      - id: scenario.ontology-pilot-current-stage-scope
        given: 人或智能体同时读取 DEC-0038-04、当前架构与新决策
        when: 判断一个有明确用途的 P0/P1 标准映射或校验候选
        then: 可以定位 DEC-0076-01 的部分替代范围及仍保留的历史和执行约束，按 DEC-0076-02 控制本期试点范围；不把旧决策整体废弃，也不因增加格式宣称阶段完成
        evidenceIds: [evidence.ontology-guided-pilot-policy-baseline, evidence.ontology-guided-pilot-confirmed]
        evidenceRequirements: [声明级同步核对, 独立质量检查]
      - id: scenario.ontology-pilot-ai-guidance
        given: 当前 MVP 以功能开发为主，用户描述待开发功能且已有试点证据可供复用
        when: 已有证据不能覆盖真实功能所需的新关键路径，且该功能在全项目累计 1–2 个代表性功能范围内
        then: 优先复用或补齐已有绑定试点，只对必要缺口低频引导；一个功能覆盖目的即可停止新增，第二个只补不同能力，普通功能不例行输出试点评估，已有授权连续执行，超范围不自动扩张
        evidenceIds: [evidence.ontology-guided-pilot-confirmed, evidence.ontology-guided-pilot-project-contract]
        evidenceRequirements: [任务计划与过程记录, 对应切片的验证结果]
      - id: scenario.ontology-pilot-separate-validation
        given: 一个切片完成事实语义梳理或标准数据校验
        when: 复用既有试点或报告本期验证范围
        then: 只有证据匹配当前目标才计入，只报告相应目标的证据，不把语义或标准验证扩大为通用执行或阶段完成；必要业务修复与验收不受试点数量限制，生产运行与版本要求独立适用
        evidenceIds: [evidence.ontology-guided-pilot-policy-baseline, evidence.ontology-guided-audit-handoff]
        evidenceRequirements: [试点进入与退出条件逐项核对]
      - id: scenario.ontology-legacy-audit-whole-baseline
        given: 用户明确要求对历史知识进行全盘审计
        when: 治理 PR 合并后固定实际目标提交，并按业务域分批检查知识资产
        then: 相对原清单映射增量并保留全部范围，逐项关联证据与结论，历史和废弃资产按其适用范围核对，未合入分支不冒充已覆盖；合并本身不触发后台任务或证明完成，无依赖功能继续
        evidenceIds: [evidence.ontology-guided-pilot-confirmed, evidence.ontology-guided-audit-handoff]
        evidenceRequirements: [固定基线清单, 逐项语义核对及处置记录]
      - id: scenario.ontology-legacy-audit-no-inherited-pass
        given: 已有历史 P0 门禁通过和新生成的全量盘点清单
        when: 汇报当前知识是否符合新契约
        then: 历史门禁状态准确保留；清单不算语义审计完成，待审、未决与证据不足不算一致通过，新候选按实际范围验证
        evidenceIds: [evidence.ontology-p0-coverage-review, evidence.ontology-guided-audit-handoff]
        evidenceRequirements: [README 历史状态核对, 审计覆盖与结论分类核对]
