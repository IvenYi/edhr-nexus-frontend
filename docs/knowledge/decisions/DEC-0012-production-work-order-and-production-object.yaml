        summary: "provenance: original-evidence；工单状态机已定义 RELEASED 及 CREATED->RELEASED、RELEASED->IN_PROCESS/COMPLETED 转移，ProductionService.releaseOrder 和控制器发布接口已落地，拆分服务仅允许 RELEASED 工单；聚焦测试覆盖该生命周期定义。"
        evidenceIds: [evidence.work-order-status-machine, evidence.production-service, evidence.work-order-controller, evidence.production-service-test, evidence.production-audit-annotations]
