        summary: "provenance: original-evidence + user-confirmed；全部未开工对象取消时工单保持CREATED、释放分配量，原修复范围保留。2026-10-27当前正常完成另要求计划全部分配且未取消对象全部正常完成；旧全部对象终态即完成的判断不再作为有效规则，运行验收取本次证据。"
        evidenceIds: [evidence.production-service, evidence.production-service-test]
      - id: discrepancy.production-work-order-create-fields-not-supported
