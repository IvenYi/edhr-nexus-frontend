knowledgeModelVersion: 0.3.25
decisions:
  - id: DEC-0015
    title: 工单审计保留真实变更前后快照
    status: implemented
    visibility: internal
    context: "provenance: user-confirmed；工单数据审计继续将客户动作投影为新增/修改，每条创建、编辑、取消和关闭事件保留可追溯的业务字段变更前后快照。创建事件的变更前快照为空对象；编辑、取消和关闭事件的快照来自真实持久化对象状态，不得把方法参数或请求对象伪装为快照。WorkOrderController 已显式写入快照，AuditAspect 继续负责通用元数据。"
    decisionStatements:
      - id: DEC-0015-01
        statement: "provenance: user-confirmed；工单 CREATE/UPDATE/CANCEL/CLOSE 客户动作统一投影为新增或修改，同时保留 contentBefore/contentAfter 业务字段快照。"
        status: implemented
        visibility: internal
      - id: DEC-0015-02
        statement: "provenance: user-confirmed；创建工单的 contentBefore 必须为空对象，contentAfter 为创建后真实工单字段；编辑、取消和关闭均需记录真实持久化对象变化前后的字段。"
        status: implemented
        visibility: internal
      - id: DEC-0015-03
        statement: "provenance: user-confirmed；方法参数、请求 DTO 或注解元数据不得直接作为工单审计快照，必须使用持久化对象的业务字段状态。"
        status: implemented
        visibility: internal
      - id: DEC-0015-04
        statement: "provenance: original-evidence；历史实现中 AuditAspect 仅写审计元数据、工单快照缺失；该缺口现已由 WorkOrderController 显式构造真实 contentBefore/contentAfter 修复。"
        status: implemented
        visibility: internal
      - id: DEC-0015-05
        statement: "provenance: user-confirmed；工单制程选择下拉框无值时保持空白，有值时提供清除控件恢复空值，不增加‘暂不选择’选项。"
        status: implemented
        visibility: internal
    supersedes: []
    evidenceIds: [evidence.audit-controller-action-projection, evidence.work-order-audit-snapshot-controller, evidence.work-order-audit-snapshot-controller-test, evidence.production-audit-annotations, evidence.audit-aspect-test, evidence.production-process-selector-clearable]
    acceptanceScenarios:
      - id: scenario.work-order-create-audit-snapshot
        given: 用户创建字段有效的工单
        when: 创建请求成功并生成审计事件
        then: 审计动作显示新增，contentBefore 为空对象，contentAfter 包含真实工单业务字段
        evidenceIds: [evidence.work-order-audit-snapshot-controller, evidence.work-order-audit-snapshot-controller-test, evidence.production-audit-annotations]
        evidenceRequirements: [工单创建审计快照集成测试]
      - id: scenario.work-order-update-audit-snapshot
        given: 已存在工单
        when: 用户编辑、取消或关闭工单
        then: 审计动作显示修改，contentBefore/contentAfter 分别反映真实持久化对象前后字段
        evidenceIds: [evidence.work-order-audit-snapshot-controller, evidence.work-order-audit-snapshot-controller-test, evidence.production-audit-annotations]
        evidenceRequirements: [编辑取消关闭审计快照集成测试]
      - id: scenario.work-order-audit-no-synthetic-arguments
        given: 审计方法接收请求参数
        when: 审计事件持久化
        then: 方法参数不作为 contentBefore/contentAfter 快照
        evidenceIds: [evidence.work-order-audit-snapshot-controller-test, evidence.audit-aspect-test]
      - id: scenario.work-order-process-selector-clear
        given: 工单产品或制程版本下拉框已选择值
        when: 用户点击清除控件
        then: 选择恢复空值；无值时下拉框保持空白且不显示额外占位选项
        evidenceIds: [evidence.production-process-selector-clearable]
    implementationDiscrepancies:
    - id: discrepancy.work-order-audit-snapshot-missing
      status: resolved
      severity: high
      visibility: internal
      path: gmp-platform/backend/src/main/java/com/zencas/edhr/common/audit/AuditAspect.java
      lineHint: 37
      summary: 原工单审计快照缺口已由 WorkOrderController 显式构造真实业务字段前后快照修复；AuditAspect 继续仅负责通用元数据审计。
      evidenceIds:
      - evidence.work-order-audit-snapshot-controller
      - evidence.work-order-audit-snapshot-controller-test
      - evidence.audit-aspect
    - id: discrepancy.work-order-close-audit-atomicity
      status: resolved
      severity: high
      visibility: internal
      path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/controller/WorkOrderController.java
      lineHint: 112
      summary: 'provenance: original-evidence；2026-10-15 首次修复给 WorkOrderController.close 增加 REQUIRED 事务，使关闭状态、审计序列化及保存整体回滚；旧四例及相邻55项通过仅为当轮 Spring/H2 JDBC 与仓储适配替身的历史证据。独立验证随后以真实 JPA 查出 QF-W1-001：先普通读取 before 再锁查询会复用一级缓存旧 COMPLETED，允许并发重复关闭与双审计。当前修复在同一外层事务先调用既有 findByTenantIdAndIdForUpdate，再构造真实 before 快照和执行 closeOrder，不改变权限、状态机或差量审计政策。升级后的五例使用真实 WorkOrder 实体、Spring Data JPA 仓储、Hibernate、JpaTransactionManager 与私有 H2；其他仓储为替身，审计替身写同事务实际 SQL。新并发例在锁前修复前为5项/1失败/0错误，修复后五例及相邻回归合计56项通过、0失败/错误/跳过；不与旧55相加。人为暂停2秒和10秒锁等待仅属隔离测试库设置，生产锁参数未改。原独立 failed 及红绿索引保留于本轮分支审查 validation.md；不是 HTTP、实际 AuditEvent JPA 或 PostgreSQL 验收，最终候选仍须由未参与修复的全新质量实例复核。'
      evidenceIds:
      - evidence.work-order-controller
      - evidence.work-order-audit-snapshot-controller
      - evidence.production-service
      - evidence.work-order-close-audit-atomicity-test
