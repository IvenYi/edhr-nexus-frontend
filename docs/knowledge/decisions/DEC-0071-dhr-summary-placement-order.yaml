knowledgeModelVersion: 0.3.24
decisions:
  - id: DEC-0071
    title: DHR 汇总实例展示位置与同级顺序
    status: specified
    visibility: internal
    context: user-confirmed；2026-09-25 在原 DEC-0071 直接纠正目录展示与证据范围混同，承接统一决策包；基础目录开工快照、同级顺序和实例身份保留。旧移出行为由 Git 追溯，当前工作树已有默认位置回退路径；完整规则仍为 specified/internal。
    decisionStatements:
      - id: DEC-0071-01
        statement: user-confirmed；作业/自定义实例可在同级目录或表单之间调整自定义展示位置；保存、重开与提交冻结保持位置和顺序。同模板多份仍是独立证据，来源组仅便于整组或单份整理，不控制证据纳入。
        status: specified
        visibility: internal
      - id: DEC-0071-02
        statement: user-confirmed；取消自定义展示位置恢复默认来源位置，不删除实例、证据关联、内容或生产归属，不改变完整审批范围；不存在通过移出目录排除本次证据的动作。
        status: specified
        visibility: internal
      - id: DEC-0071-03
        statement: user-confirmed；提交冻结全部证据并记录其展示位置、别名和顺序及校验指纹；人工退回或重新整理产生新草稿和新版本，不改写旧版。
        status: specified
        visibility: internal
    supersedes: []
    evidenceIds: [evidence.dhr-summary-order-user-confirmed, evidence.dhr-summary-order-service, evidence.dhr-summary-order-migration, evidence.dhr-summary-order-ui, evidence.dhr-summary-order-tests]
    acceptanceScenarios:
      - id: scenario.dhr-summary-ordered-placement
        given: 同一目录下存在静态目录或表单节点，且有两份同模板的实际关联表单实例
        when: 用户分别插入同级位置、保存草稿、重新打开并提交汇总
        then: 两份实例各自保留展示位置及顺序，冻结版本使用完整证据范围；整组和单份整理不改变证据身份或完整性检查
        evidenceIds: [evidence.dhr-summary-order-user-confirmed, evidence.dhr-summary-order-service, evidence.dhr-summary-order-ui, evidence.dhr-summary-order-tests]
        evidenceRequirements: [同级锚点校验, 草稿保存重开, 冻结版本重读, 同模板多实例]
      - id: scenario.dhr-summary-remove-optional-placement
        given: 一份自动归集实例已有自定义展示位置
        when: 用户取消自定义展示位置并保存草稿
        then: 该实例恢复默认位置，证据仍可见且属于完整审批范围，源记录和生产归属不变
        evidenceIds: [evidence.dhr-summary-order-user-confirmed, evidence.dhr-summary-order-ui, evidence.dhr-summary-order-service]
        evidenceRequirements: [恢复默认位置后重读, 证据范围不变, 来源表单未删除]
    implementationDiscrepancies:
      - id: discrepancy.dhr-summary-removal-is-still-unlink
        status: open
        severity: high
        visibility: internal
        path: gmp-platform/frontend/src/pages/dhr-management/summarySourceGroups.ts
        lineHint: 35
        summary: original-evidence；placeSummarySourceGroup 在目标为空时过滤自定义 placements，当前前端 effectivePlacements 以默认位置补回实例，后端 validatePlacements 先为全部实际实例建默认位置再叠加自定义展示。旧移出即排除证据的缺口已由源码消除；仍需真实交互、持久化及并发回归证明恢复默认位置不缩减冻结范围，故本项保留为 open 验证缺口。
        evidenceIds: [evidence.dhr-summary-source-group-ui, evidence.dhr-summary-order-service]
