knowledgeModelVersion: 0.3.25
decisions:
  - id: DEC-0085
    title: 共享登录会话跨标签变化时阻断旧页面与旧请求
    status: specified
    visibility: internal
    context: user-confirmed；2026-10-27整体审计发现跨标签会话缺口后，用户标注并接受“保留当前共享登录模式、检测账号变化立即停止旧页操作并提示重新登录、保存提交前再次检查并拦截、保留另一标签新凭据、不自动补交旧表单”的两层保护方案，明确回复“我觉得这样ok，可以按这个来”。此前自动重载后直接进入另一账号只是讨论方案，未成为现行决策，本次不采用；也不把用户较早询问“提交时应回登录页”解释为允许旧页继续发送请求。中央页面阻断、会话代际与随机本地登录标记、异步退出收尾比较属于工程落实，不是用户逐字指定的机制。只新增精确决策和来源证据，不为本项建立整套认证事实目录或运行执行契约。规范保持specified/internal和0.3.25；历史39f292d8独立failed及high/open不因政策确认改写，当前实现与最终全新独立验收另取本切片证据。
    decisionStatements:
      - id: DEC-0085-01
        statement: 沿用同一浏览器配置下同一站点共享登录会话的模式。当其他标签切换或退出共享登录会话，当前旧页面检测到变化后立即停止继续操作，并明确提示“登录账号已在其他标签变化，请重新登录”；不能让旧页面在用户未重新确认身份时继续使用另一账号处理其原有内容。本次不改为每个标签独立保持不同账号，也不自动重载后直接让旧页面进入另一账号继续工作。
        status: specified
        visibility: internal
      - id: DEC-0085-02
        statement: 保存、提交请求发出前再次校验页面所认可的登录会话与当前共享会话是否一致；不一致时先阻止请求，并让当前标签回到登录页，不得先执行操作再跳转。页面通知与请求前校验为两层保护，不能只依赖可见提示、按钮禁用或后续服务器返回401。
        status: specified
        visibility: internal
      - id: DEC-0085-03
        statement: 使旧页面失效、跳回登录页或处理旧请求的迟到结果时，保留另一标签已建立的新登录凭据。旧会话的迟到成功、401及异步退出收尾不能安装旧数据、清掉新会话或把新会话误登出；旧页面恢复登录前不再消费其原会话操作结果。本声明不等于服务器能撤回此前已经收到并执行的写请求，也不新增后端JWT撤销或全设备单点登录政策。
        status: specified
        visibility: internal
      - id: DEC-0085-04
        statement: 不把旧表单的未提交内容自动按新账号保存或提交，也不在重新登录后自动补交原表单。本次不提供跨账号草稿迁移、自动保存或自动恢复；重新登录后重新打开记录并按当前业务权限处理，不能借会话保护放宽原有记录、状态、签署、冻结或审计约束。
        status: specified
        visibility: internal
      - id: DEC-0085-05
        statement: 本确认针对实际登录会话变化。同一登录会话内仅头像、姓名等资料刷新沿用既有同步行为，不视为跨账号变化而中断编辑；工程识别应与显示文字解耦，不从本声明推定新的后台自动令牌续期政策或无条件清理当前编辑。
        status: specified
        visibility: internal
      - id: DEC-0085-06
        statement: DEC-0074允许A登录而B本人使用独立电子签名密码完成有权的普通按钮签署，该过程不切换A的登录会话，因此不能仅因签署人不同触发本决策的跨标签会话阻断。原按钮与SIGN_FIELD区分、DHR专属签署、节点与字段权限、快照及审计规则保持；TaskDetail签名密码、记录控制变更作废及其DHR依赖等原暂缓不因本次恢复。
        status: specified
        visibility: internal
    supersedes: []
    evidenceIds: [evidence.shared-login-cross-tab-confirmed, evidence.shared-login-cross-tab-failed-baseline, evidence.shared-login-cross-tab-session-source, evidence.shared-login-cross-tab-client-source, evidence.shared-login-cross-tab-existing-regression, evidence.button-signature-confirmed]
    acceptanceScenarios:
      - id: scenario.shared-login-cross-tab-stops-old-page
        given: 标签1以A会话打开记录并保留当前页面状态，标签2共享同一站点登录存储
        when: 标签2切换为B或退出登录，标签1检测到共享会话变化
        then: 标签1停止旧页面操作并显示明确重新登录提示，不自动沿用B身份处理A的旧内容，旧会话缓存与迟到结果不能被新会话消费
        evidenceIds: [evidence.shared-login-cross-tab-confirmed, evidence.shared-login-cross-tab-failed-baseline]
        evidenceRequirements: [同一浏览器上下文双标签真实组件交互, 切账号及退出反例, 旧页面操作区阻断与提示, 旧缓存及迟到响应隔离]
      - id: scenario.shared-login-cross-tab-blocks-before-submit
        given: 旧页面尚未收到跨标签变化通知，但共享登录会话已经变化
        when: 旧页面尝试保存或提交
        then: 在请求发送前识别不一致并拒绝发出写请求，仅让当前标签回登录页，不清除标签2的新凭据，不自动补交旧表单
        evidenceIds: [evidence.shared-login-cross-tab-confirmed, evidence.shared-login-cross-tab-client-source]
        evidenceRequirements: [通知延迟下请求前拦截, 后端写请求零发出断言, 另一标签新凭据保持, 登录后无旧表单自动重放]
      - id: scenario.shared-login-cross-tab-preserves-new-session
        given: 旧A请求或退出流程尚未结束，新B会话已经建立
        when: A的迟到成功、401或退出收尾到达
        then: 不将A结果装入B的状态，不清理B凭据，不因旧退出跳走B会话；真实当前会话失败及正常退出继续按各自既有规则处理
        evidenceIds: [evidence.shared-login-cross-tab-confirmed, evidence.shared-login-cross-tab-failed-baseline, evidence.shared-login-cross-tab-session-source]
        evidenceRequirements: [迟到成功及401反例, 异步退出收尾竞争, 当前会话正常退出正例, 同标签代际回归]
      - id: scenario.shared-login-profile-and-signer-boundaries
        given: 实际登录会话未变化，或A登录期间按DEC-0074由有权B本人签署
        when: 更新同账号资料，或执行既有跨签署人普通按钮认证
        then: 不仅凭资料文字或签署人不同触发会话切换保护，原编辑及签署业务边界保持
        evidenceIds: [evidence.shared-login-cross-tab-confirmed, evidence.shared-login-cross-tab-existing-regression, evidence.button-signature-confirmed]
        evidenceRequirements: [同会话资料刷新保留编辑与查询代际, 普通签署不切登录会话源码核对, 不恢复原暂缓]
