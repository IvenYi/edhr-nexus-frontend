knowledgeModelVersion: 0.3.24
decisions:
  - id: DEC-0075
    title: 电子表单追溯与业务投影的模型所有权和配置边界
    status: specified
    visibility: internal
    context: user-confirmed；同一 DEC-PACKAGE-20260929-FORM-PROJECTION 切片从独立设计进入实现，2026-09-29 补充 Q1/Q2/Q5/Q7/Q8 确认，2026-09-30确认最终产出与独立质量统计口径，2026-10-03补录画布优先、低成本二开、跨表单指标汇总、查找追溯与业务统计并列可选、真实上下文统计归属及部分字段自动带入目标。2026-10-09的27–29收敛MVP开发历史处理、预置生产批次/SN的所属主体含义及组合查询匹配粒度；局部替代范围以各声明明确的supersedes文字为准，旧证据原文保留。统计模型由产品方预定义，客户选择字段并配置来源，试验实现允许统一替换；新增正式统计与 DEC-0045/0046 的已保存数量过程参考分开，不废弃其历史解释。以下确认不是实现、发布或全报表验收证明；技术存储选择、具体交互、跨表单同事件关联方式、独立检索索引时机与结果页面、上下文带入生命周期及 AI 不冒充用户业务决定。
    decisionStatements:
      - id: DEC-0075-01
        statement: 各报表使用的统计模型由产品方预先定义和维护；客户负责从自身表单选择取值字段并配置对应来源，不承担从头建立统计模型的职责。配置体验以降低实施和培训成本为目标，但原型或设计文档不能作为客户已经能独立低成本配置的验证证据。
        status: specified
        visibility: internal
      - id: DEC-0075-02
        statement: 现有试验性、零散的表单用途和投影代码可以被更合理的统一方案替换，不能以旧实现限制新设计；该授权只覆盖相关实现的统一收敛，不授权删除源表单、历史投影、签名、审计或 DHR 证据。实际历史处置须在后续实现前清点并明确。此前历史保留限制在MVP开发历史范围内已由DEC-0075-27替代，不能继续作为该范围修复迁移或作废的阻断；真实客户生产证据与未来正确数据快照不在此局部替代范围内。
        status: specified
        visibility: internal
      - id: DEC-0075-03
        statement: 并非每张客户表单都需要内容追溯或业务统计配置，应按实际查询与统计需求选择用途；没有配置这类用途不改变表单记录保存、实际生产关联及既有 DHR 证据归集职责。
        status: specified
        visibility: internal
      - id: DEC-0075-04
        statement: 报废后自动扣库存等新增业务动作不纳入本次追溯投影配置范围，应另行提出业务需求并开发相应功能；不能把此类动作当作新增查询属性或展示维度自动开放。
        status: specified
        visibility: internal
      - id: DEC-0075-05
        statement: 报废数量取客户明确配置为报废数量的字段，不强加申请、批准或实际处理阶段；保留具体字段来源。统计模型仍由产品方维护，不能通过字段名称猜测口径。
        status: specified
        visibility: internal
      - id: DEC-0075-06
        statement: 正式统计按工序和用途合计并可回查逐来源明细；同工序配置为正式来源的多份记录可累加，重复记载表只配置查表用途。同批工序A报工100件、工序B报工100件不得合称批次产量200件；技术重试幂等不解决业务重复来源选择问题。
        status: specified
        visibility: internal
      - id: DEC-0075-07
        statement: 必要业务数据或配置校验失败阻止表单最终完成；完成状态与待投影事件必须同事务持久化。投影系统处理故障或延迟不撤销已完成表单，必须明确展示待处理或失败并支持可靠重试；依赖正式投影结果的下游动作须等待成功。保存、提交待审及退回不是正式统计生效事件。
        status: specified
        visibility: internal
      - id: DEC-0075-08
        statement: 生产工作台保留进行中数量并明确标为过程参考，不混入最终正式报表；既有数量用途和跨份已保存汇总仅在此边界继续解释。
        status: specified
        visibility: internal
      - id: DEC-0075-09
        statement: 本轮保留原数据库及全部旧数据，使用独立本地数据库和虚构新模板、数据验证；Git功能分支本身不隔离数据库，本次不授权历史转换、清理或正式生产切换。此为2026-09-29阶段政策，MVP开发历史不得修复迁移或作废的限制已由DEC-0075-27替代；独立数据库要求及不据此宣称正式生产切换的边界继续适用。
        status: specified
        visibility: internal
      - id: DEC-0075-10
        statement: 用户接受本分支先交付首次最终完成的投影闭环；A12受控修订和作废未覆盖，不作为本次已实现范围，也不据此宣称完整记录控制或正式生产发布。
        status: specified
        visibility: internal
      - id: DEC-0075-11
        statement: 数量层级为工序报工更新各自工序产出，批次最终产出来自配置的最终产出工序，工单产出为所属批次产出之和；不能把不同工序直接相加为批次产出。最终产出字段语义已由 DEC-0075-13 于 2026-09-30 确认；2026-09-29 曾记录的良品或总量未决状态仅为当时状态。当前首次投影与工序报表不证明批次/工单最终产出联动已实现。
        status: specified
        visibility: internal
      - id: DEC-0075-12
        statement: 表单追溯与统计的字段来源映射随实际生产使用进入执行快照；工序或作业表单在生产对象首次开工时复制当时模板配置，执行中附加的自定义表单在附加时复制当时配置。后续修改同一表单模板版本不回写已形成的执行快照、来源表单或投影结果；新使用读取当时配置。表单模板沿用原有编辑和版本规则，不为追溯投影另设手动发布冻结或禁止编辑的生命周期。
        status: specified
        visibility: internal
      - id: DEC-0075-13
        statement: 用途配置在正式生效后按配置形成统计或内容追溯投影；未配置用途不强制产生投影，实际生产关联与 DHR 证据独立保留。批次最终产出取指定最终产出工序的正式报工数量，工单汇总各批次产出，不能跨工序相加。所选报工字段须表达约定的产出语义，但不强制映射任何外部系统字段名或固定为 goodQty。良品、不良和报废按各自配置独立统计，不自动加减最终产出；计算产出不要求另有质量表单。无采集或无正式生效数据不等于实际零。同一表单可配置多个用途，相关指标可在同一报表展示；质量比率、对账、倒扣等另行提出需求。使用时配置冻结和历史实例保护继续适用，A12 受控修订/作废仍延期。
        status: specified
        visibility: internal
      - id: DEC-0075-14
        statement: 表单画布上直接点选字段或子表是用途配置的主要入口；集中配置面向熟练后的总览与调整。页面应有主次并渐进展示，降低首次配置的学习门槛。该要求替代此前集中配置优先的建议；轻量侧栏、用途配置模式及与布局编辑的具体交互仍是待评审建议，不因本条确认而定版。
        status: specified
        visibility: internal
      - id: DEC-0075-15
        statement: 未来新增业务用途允许二次开发，目标是开发成本低、容易维护；不要求所有业务通过零代码配置完成，也不为此提前建设庞大通用规则引擎。统计模型默认由产品方维护的现有边界继续适用；公共配置与投影基础流程加用途独立业务实现的拆分属于技术建议，客户自建业务模型能力仍未定。
        status: specified
        visibility: internal
      - id: DEC-0075-16
        statement: 认可不同表单分别提供指标并汇总到同一报表行的方向，但每个指标必须明确统计对象、范围与来源。该方向不等于已支持任意跨表单事件关联；同一次业务事件的关联方式仍待定。指标并列不自动产生最终产出加减、良率或对账规则，无正式生效数据仍不能记为真实零；原始表单记录、正式业务数据、报表汇总与证据追溯保持各自层次。
        status: specified
        visibility: internal
      - id: DEC-0075-17
        statement: 画布优先配置覆盖用于查找与追溯、用于业务统计两个并列且可选的任务，允许仅前者、仅后者、两者都配或都不配；查找与追溯不能藏成业务统计的高级附属。保留用户按批次号、设备号、工序等信息查找所有相关报表的意图，并区分原始表单或证据与业务报表入口，具体结果页面待设计。检索命中只表明配置字段与查询信息匹配，不证明正式谱系、设备使用或工序执行身份；文本不覆盖实际执行上下文，同字符串的不同信息类型不混查，命中保留字段来源与实例。所有相关限既有授权范围，不开放越权全局查询。本条不改变既有formTrace与最终内容索引沿首次最终完成路径的当前契约，也不替独立检索索引决定暂存、进行中、未完成或失效数据的范围、生效或更新时机。
        status: specified
        visibility: internal
      - id: DEC-0075-18
        statement: 冠骋源码与产品可作参考对照，交互应自行设计以降低配置学习成本，并满足可维护二开目标，不照搬竞品交互。业务统计事实必须按用途定义具有批次、工序等明确归属与粒度，由真实执行上下文确定，不依赖额外手填同名字段或配置查找追溯用途。部分表单字段可配置生产上下文自动带入；系统事实归属、上下文字段展示或原始证据、字段检索采集须分层，同字段可兼容带入与查询或统计但不能因此重复形成事实，编辑显示文本不能覆盖实际身份。取值来源与用途正交、身份字段只读或受控修改是交互建议；带入时机、持久化、缺上下文、刷新、可编辑覆盖及多个设备选择与唯一性仍待定，不假设单工序单设备，也不以文本设备号形成正式设备使用关系。
        status: specified
        visibility: internal
      - id: DEC-0075-19
        statement: 首期用途配置同时覆盖子表和主表多个分散字段组合成一条业务明细的场景；子表是常见采集形式和降低配置成本的交互设计重点，不代表首期只交付子表投影或将主表字段配对延期。用户对安速康表单子表常见性的观察属于用户反馈，不是本轮原始样本统计。数据对象用于解释哪些值属于同一条明细，但不因本条确认而定版具体配置交互、子表行身份、表头共享字段或其他运行契约；Q14只收敛来源形态范围，其余阶段出口和能力分期继续待定。
        status: specified
        visibility: internal
      - id: DEC-0075-20
        statement: MVP纳入客户维护可复用查找项目录、普通字段或子表列关联查找项、查询页面按查找项提供条件并回查有权限来源表单与命中位置的路径；名称不同的来源字段可以关联同一查找项。客户管理员定义查找项，值类型限产品支持范围，常用项可预置；制表人配置字段来源，查询人使用条件。此职责划分不规定每份表单必须由三人依次操作。查找项是运行查询配置，不等于客户编辑研发本体、定义任意统计口径或据文本建立正式实体关系；具体类型、操作符、目录生命周期、组合条件、索引时机与历史处理仍须在对应实现前明确。
        status: specified
        visibility: internal
      - id: DEC-0075-21
        statement: MVP业务统计继续使用预设报表展示，不新增用户自定义报表编辑器；自定义报表放第二期，当前架构保留扩展空间，不提前实现BI、自由公式或跨来源连接引擎。二期自定义报表组合不等于客户自由创建统计模型，其指标、维度、编辑分享权限及开放范围仍待设计。此分期不取消首期子表与主表分散字段明细、查找与统计并列可选、产品维护统计口径、真实执行归属、使用时快照与历史保护、正式统计首次最终完成、来源权限、独立数据库及A12延期；Q14仅进一步收敛本条所列分期边界，其他未定运行契约不因此获得默认答案。
        status: specified
        visibility: internal
      - id: DEC-0075-22
        statement: 查找与统计采用同一表单画布内的独立侧栏入口，与字段配置同级；不以离开画布的独立整页作为日常配置入口。切换侧栏保留所选字段或子表及画布定位，共用原有来源配置、保存和撤销；用途面板显示当前配置范围。子表与主表分散字段两类来源继续覆盖，集中总览承担核对和预览。此确认仅收敛Q10的入口组织与上下文连续性，不证明客户易用性已经验证，也不决定目录CRUD、行身份、独立索引、上下文带入生命周期或新增统计口径；其余规则与未决项继续适用。
        status: specified
        visibility: internal
      - id: DEC-0075-23
        statement: 普通文本只有在明确配置的追溯或统计用途表示相应物料时，才可触发对应身份匹配；不能凭字段名、内容形态或仅声明其他文本查找含义猜测物料身份。匹配信息采用次要展示，优先hover且避免遮挡相邻单元格；影响正式统计的阻断问题仍须明确定位，不能仅藏在hover。原生引用字段继续按自身引用配置查询、选取和校验，不要求另配投影用途，沿用DEC-0060。本条仅确认普通文本匹配的触发前提与展示要求，不确认Q6编号唯一范围、改号重用、零或多匹配处置及解析是否纳入MVP，不将唯一匹配视为填写意图证明，也不授权自动建立物料使用关系。
        status: specified
        visibility: internal
      - id: DEC-0075-24
        statement: 管理员新增可用查找项后，表单设计侧兼容字段的用途候选和授权追溯页面的条件候选自动从同一目录获得该项，不另维护查询页面条件，不要求先有模板绑定、实例或索引命中。制表人仍须明确关联来源字段，查询人选择条件后输入实际查询值；候选出现不代表已有数据已覆盖。设计侧按产品支持类型与语义兼容性筛选，查询侧继续遵守权限，目录管理不授予来源数据访问权。本条不新增任意统计模型、实体类型或操作符，也不决定目录完整停用生命周期及Q15可查状态。
        status: specified
        visibility: internal
      - id: DEC-0075-25
        statement: 新查找含义对未关联该含义的旧实例进行补充覆盖，包括回填绑定、补索引或重新解释，排入第二期；MVP不凭旧字段同名或同值猜测新含义。新增配置供后续采用该配置的新实例使用；原有已配置实例的查询、冻结快照、审计和DHR证据继续保留。本延期不授权删除旧数据、不取消已有含义下的查询能力，也不允许用最新目录或模板解释静默覆盖旧实例；目录自身历史读取及其他未定生命周期仍须分别设计。上述开发旧数据保留及兼容负担在MVP开发历史范围内由DEC-0075-27替代；二期补充覆盖分期与未来正确实例快照不被取消。
        status: specified
        visibility: internal
      - id: DEC-0075-26
        statement: 产品对外将查找项统一称为追溯项，两者表示同一配置含义，不创建第二套目录或重分配身份。开发页面须遵循仓库统一UI/UE、列表及弹窗规范，不自行引入不一致的交互和样式。历史用户引文和证据原文保留旧称，既有稳定ID、API、表名和历史快照保持兼容；本次称谓与界面约束不改变统计、冻结、引用或索引规则，不关闭原有未决项，也不证明完整功能或客户易用性已验证。为MVP开发旧数据维持纯兼容路径的要求已由DEC-0075-27替代；统一术语及不另建同义目录的要求继续适用，实际API或存储改造另以实现范围和验证为准。
        status: specified
        visibility: internal
      - id: DEC-0075-27
        statement: MVP开发阶段的历史数据可直接修复迁移或作废，无需为了旧开发数据维持兼容层，应保证此后功能数据遵守正确契约。在MVP开发历史范围内supersedes DEC-0075-02/09/25/26对应的旧数据保留限制及纯兼容负担；原决定和证据保留历史来源。本条不取消独立数据库、未来正确数据的使用时快照、真实生产/DHR关联、权限、签署或审计契约，不外推为删除真实客户生产证据。此为设计政策确认，本轮未执行数据修复、迁移或作废；具体处置须在实现记录中列明受影响数据与结果，开发清理不等同A12受控记录作废运行能力。
        status: specified
        visibility: internal
      - id: DEC-0075-28
        statement: 产品预置的生产批次/SN追溯项在具有真实生产或作业执行上下文时表示本单所属生产对象，含义同时覆盖批次与SN；所属身份沿该上下文确定，不以用户填写或选择另一个编号改变表单、统计或DHR归属。本条收敛DEC-0075-17/18/20中的预置主体含义，不将内容提及的其他对象等同所属主体。2026-10-10的DEC-0075-30局部替代本条无上下文时始终表示真实所属及草稿校验阶段尚未定的解释：无上下文可登记系统内对象但不据此建立归属，草稿不做阻断性业务校验。自动带入时机、持久化、刷新、覆盖及不存在对象的最终完成校验细则继续未定，不因含义确认而宣称已实现校验或带入。
        status: specified
        visibility: internal
      - id: DEC-0075-29
        statement: 追溯查询的多个主表字段条件按同一表单实例同时满足；同一子表的多个明细条件按同一实际行同时满足，父级主表条件可与该行条件联合，不从不同子表行拼出不存在的记录，也不由隐藏配置组或配置顺序决定匹配粒度。本条在该匹配粒度范围内supersedes DEC-0075-20中组合条件尚未明确的状态；不同子表之间如何组合及更复杂OR规则仍待定，索引时机未定的历史状态在2026-10-10已由DEC-0075-33局部替代。此为已确认查询契约，当前按同一内部投影记录AND的实现尚需改造，不是运行验收结论。
        status: specified
        visibility: internal
      - id: DEC-0075-30
        statement: 草稿保存或暂存不做阻断性字段完整性与投影业务校验，认证、来源授权、字段权限、请求格式及证据和签署安全校验继续适用，不将草稿免业务校验解释为绕过写入权限或伪造证据。无生产上下文时，已配置自动带入的字段明确提示无法带入；未配置自动带入时允许用户自行填写或选择系统内生产批次/SN。无上下文填选对象只登记内容，不自动生成真实生产执行、统计归属或DHR成员；正式归入其DHR仍须特别业务流程，流程本身本次未定义或实现。有上下文时仍沿真实执行归属，最终完成业务校验未被取消。本条局部supersedes DEC-0075-28的无上下文绝对所属解释与DEC-0075-18中的缺上下文行为未定状态，不一并确认带入取值时点、持久化、刷新覆盖或不存在对象的最终校验细则。
        status: specified
        visibility: internal
      - id: DEC-0075-31
        statement: 消耗或报废等已明确物料数量用途的物料批号允许为空，也允许登记系统内未建档的自由文本批号，不要求仓库物料批实体存在。空批号表示未记录批号，不自动补造批号或认定为已知批实体；物料身份、数量含义及来源粒度继续按既有用途契约，客户主动将表单字段设为必填的普通字段约束不因此取消。该确认使投影不再一律要求配置非空物料批号来源及值；当前解释器仍有强制配置和非空校验，尚需改造。
        status: specified
        visibility: internal
      - id: DEC-0075-32
        statement: MVP不做单位换算，统计用途的单位不再由投影强制必填，允许无单位来源或空值；空单位只与同一工序且单位同样为空、其他用途粒度也相同的数量合计。保留用途、实际生产对象及适用的物料、物料批号等分组维度，不能把只强调工序和单位解释为跨对象或跨物料混加；有单位记录不与空单位合并，也不根据物料或默认值自动猜测缺失单位。空单位分组不证明实际计量一致，不赋予单位换算或物理总量含义；普通字段自身必填约束不被取消。此为用户确认的可空及合计边界，未填写标记、单位字典或普通单选的具体交互仍为建议；当前解释器强制单位来源及非空值的差异尚需实现修复。
        status: specified
        visibility: internal
      - id: DEC-0075-33
        statement: 已成功保存或暂存的最新表单内容即可在授权追溯查询中查到，包含草稿、填报中、审批中及已完成记录，结果显示来源记录状态；未保存输入不参与查询。正式业务统计仍等待最终完成及其投影成功，不把过程查询命中当成正式结果、DHR归属或业务关系，来源授权与真实归属继续适用。本条在保存生效时点、已保存过程内容及可查状态范围内supersedes DEC-0075-17/20/29的独立索引尚未定状态；失效历史与A12视图仍另定，不因本条开放受控修订或作废。具体检索存储和事务方案是待实现选择，不引入用户未确认的异步延迟政策；当前只查完成SUCCEEDED批次的实现尚未满足新契约。
        status: specified
        visibility: internal
      - id: DEC-0075-34
        statement: MVP继续展示产品预设统计报表，并为二期用户基于已有正式业务事实进行报表统计设计保留扩展空间；本条在二期已有事实报表设计方向上收敛DEC-0075-21。该方向不要求客户新建业务用途或定义任意统计模型，不授权MVP提前实现报表编辑器、自由公式、任意跨事实联表或分摊规则；已有事实的指标、维度、可用聚合、视图分享权限与配置生命周期仍须在二期设计。可选明细展示列从既有字段选取的方案及日期、多选扩展仍是建议，不随本条变成已确认完整能力。
        status: specified
        visibility: internal
      - id: DEC-0075-35
        statement: 报工用途的工时表示投入人时，绑定由用户填写的数字字段；系统读取该值，不根据报工起止时间、人数或签名计算工时。报工开始时间与报工结束时间分别记录业务起止，生产日期独立记录，不以表单创建、提交、最终完成或投影处理等审计时点替代，也不将创建人当作报工人。该确认局部supersedes同切片2026-10-12报表复核中人时来源或自动算法尚待决定的解释，旧解释直接改写；不引入逐人工时、多人分摊、生产日期派生及表头共享规则。字段可选性属于最小实现选择；报工人候选不再接受普通文本，依DEC-0075-36只接受人员引用或签名。2026-10-13手填人时及独立时间/报工人来源链、专用逐笔报表已实现并完成主智能体基础验证，本条局部标implemented/internal，不标verified；真实执行归属、使用时快照、正式统计最终完成及其余未决口径保持不变。
        status: implemented
        visibility: internal
      - id: DEC-0075-36
        statement: 在现有画布统计侧栏中，预设业务报表展示的来源字段默认直接呈现在展开的业务配置内，不放入另一个默认收起的可选区；正式报工的开始时间、结束时间、报工人、生产日期及其他用途的同类报表属性均适用。展示层级不改变字段是否必填、保存校验或统计分组。静态操作与口径说明移至对应tip，投入工时下的解释段落直接删除；具体缺项、错误来源及其他阻断问题仍须明确可见并定位，不只藏在tip。报工人来源只接受引用-人员或签名，签名来源读取已保存的实际签署人身份及名称，不以文本、查询时当前登录人或创建人替代，不按签名人数扩展或重复计量数量和人时。本条局部supersedes DEC-0075-35及同切片现行说明中允许文本报工人与报表业务来源默认折叠的最小工程选择；不改变签名认证、来源权限、字段权限、原流程、使用时快照、最终完成入统计及真实执行/DHR归属。共用来源编辑器、字段顺序及签名值的具体读取路径属于工程选择；字段签署SIGN_FIELD与按钮事件FILL_SIGN_FIELD两条既有合法路径均保留已认证实际签署人的身份、名称及签名记录标识，不拆解历史展示文本猜身份。后者的结构化回填是本轮缺陷修复，不是新签署流程或新业务授权。同日后续DEC-0075-37已局部替代本条所有未配置可选来源也默认外显的展示要求，已配置、必需及错误来源仍外显，人员身份和tip要求继续适用。本条当前specified/internal，不宣称实现验收或客户低学习成本已经验证。
        status: specified
        visibility: internal
      - id: DEC-0075-37
        statement: 业务统计配置采用用户明确选择的已配置外显、未配置可选来源收起方式；必需来源和报工良品/不良数量二选一的两个来源常显，具体错误来源也须直接可见并可修复。未配置可选来源在更多字段内选择，选配后直接显示，下次重开依据保存配置外显，不因上次收起隐藏已配置结果。主表业务用途组标题统一可展开收起，新增同一用途的记录打开该组并展开新记录；记录仍称消耗明细、报废明细或报工记录。用户要求撤下各业务用途的明细中另外显示入口；只撤配置入口、不自动清除已有保存映射或正式事实，失效旧展示映射以具体问题及明确移除操作处理，后两项是保护数据及可修复性的工程选择。用户提出生产报工称呼，主智能体采纳为production显示名，模型ID不变；正式表示最终完成后的统计生效阶段，不再充当业务用途名。本条在未配置可选来源的展示范围内局部supersedes DEC-0075-36及现行额外展示选择入口的工程方案，保留36人员引用/签名约束、实际签署人身份与tip要求。不改变来源必填性、字段自身约束、统计粒度、单位、人时手填、最终完成边界、真实生产/DHR归属、追溯交互或既有快照，不新增统计模型。本条specified/internal，不以层级调整宣称客户低学习成本或整体功能已验证。
        status: specified
        visibility: internal
    supersedes: []
    evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed, evidence.form-projection-report-source-visibility-and-reporter-20261013, evidence.form-projection-compact-statistics-sidebar-20261013]
    acceptanceScenarios:
      - id: scenario.form-projection-configured-sources-visible-and-empty-optional-collapsed
        given: 制表人在主表或子表展开报工、报废或消耗来源配置，部分可选来源已保存，其他尚未配置
        when: 打开或重新打开配置，并在更多字段中选择一个可选来源
        then: 必需来源、报工数量二选一及已配置或出错来源直接显示；未配置可选来源收在更多字段，选配后外显且保存重开后仍外显。未配可选项不因此变成必填，具体错误不只藏在tip；此为验收要求，不证明客户试用已完成
        evidenceIds: [evidence.form-projection-compact-statistics-sidebar-20261013]
      - id: scenario.form-projection-purpose-group-collapse-and-add-record
        given: 主表存在生产报工、报废或消耗用途组，组内有一笔或多笔记录配置
        when: 点击用途标题收起，再新增同用途的记录
        then: 标题统一支持展开收起，新增时打开该用途组并展开新记录，来源下拉与主动画布选取仍可用；production显示名为生产报工而稳定模型ID及最终完成才正式统计边界不变
        evidenceIds: [evidence.form-projection-compact-statistics-sidebar-20261013]
      - id: scenario.form-projection-extra-display-entry-removed-without-data-loss
        given: 三类业务配置可能已有保存的补充展示映射，其中一条引用的来源已失效
        when: 打开配置并处理具体保存校验问题
        then: 不提供明细中另外显示选择入口，不自动清空有效旧映射或改写已有事实；失效映射的具体问题直接显示，并有明确移除动作，不留下无法修复的隐藏阻塞。此为本轮工程保护验收要求，不增加二期自定义报表能力
        evidenceIds: [evidence.form-projection-compact-statistics-sidebar-20261013]
      - id: scenario.form-projection-report-sources-directly-visible
        given: 制表人员在主表或子表业务用途的侧栏展开一笔报工、报废或消耗配置
        when: 对应业务报表存在时间、人员、原因、分类等预设展示属性的来源配置
        then: 按36确认时要求报表属性直接呈现；同日后续37收敛为已配置、必需及错误来源外显，未配置可选来源进更多字段，现行展示按37处理。静态说明通过对应tip查看，人时下无解释段落，具体校验仍可见；展示不增加必填性或改变合计粒度，客户试用仍未由此证明
        evidenceIds: [evidence.form-projection-report-source-visibility-and-reporter-20261013]
      - id: scenario.form-projection-reporter-from-user-or-signature
        given: 表单包含普通文本、人员引用、其他对象引用和保存了实际签署人信息的签名字段，创建人与签署人不同，签名可由字段签署或既有按钮签署事件回填
        when: 制表人员选择报工人来源并在正式业务记录中读取该值
        then: 候选仅包含人员引用及签名；文本与其他对象引用不作为报工人来源。两种合法签署路径均保存实际签署人身份、名称及签名记录标识，报工人从该保存值读取，不用创建人替代，不改变签名认证或将工时按签名人数计算；此例不证明运行验证已经完成
        evidenceIds: [evidence.form-projection-report-source-visibility-and-reporter-20261013]
      - id: scenario.form-projection-person-hours-distinct-from-report-period
        given: 一笔报工的业务开始和结束之间经过2小时，填报人在所绑定数字字段中填写4人时，表单在稍后提交并最终完成
        when: 读取该笔报工的工时、业务时间与报工人来源
        then: 工时读取填写的4人时，不根据2小时区间或人员及签名数重算；业务起止与生产日期读取各自来源，不取审计时点替代，创建人不冒充报工人。此例不要求逐人工时模块或自动分摊；当前指定定义不证明运行已验证
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-product-owned-models
        given: 产品设计包含表单配置、报表统计模型和客户实施流程
        when: 核对模型所有权与客户操作职责
        then: 统计模型由产品方维护，客户只配置来源；候选配置体验不被表述为已经通过客户易用性验收
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-replacement-preserves-evidence
        given: 后续实现准备统一替换试验性字段用途和投影逻辑
        when: 判断本次授权范围
        then: 可以重构相关代码；MVP开发历史按DEC-0075-27可修复迁移或作废，真实客户生产证据不据此删除；不能宣称新的运行契约已经实现
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-optional-scope
        given: 客户表单没有内容追溯或业务统计需求
        when: 配置该表单并判断关联业务范围
        then: 无需强制配置数据用途，既有表单与生产证据职责保留；新增库存动作另走需求
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-operation-purpose-total
        given: 同批次工序A与工序B各有正式报工100件，另有仅供查表的重复记载
        when: 查询正式统计及来源明细
        then: 每个工序和用途分别合计100件，重复记载不入账，每笔正式结果可定位来源表单，不显示批次产量200件
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-completion-retry
        given: 最终完成前业务校验通过，但完成后投影处理发生系统故障
        when: 查询状态、重试并尝试依赖正式结果的下游动作
        then: 已完成表单与持久化事件保留，状态明确且重试不重复入账，下游等待成功；必要业务校验失败则不完成
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-use-time-snapshot
        given: 一个表单模板版本已配置追溯来源，生产实例已开工或已附加自定义表单
        when: 修改同一模板版本的字段或来源映射并创建新的生产使用
        then: 已使用实例继续按自己的执行快照填写、完成和投影；新的使用复制修改后的配置，不要求执行追溯专属发布冻结动作
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-final-output-and-independent-quality-quantities
        given: 指定的最终产出工序有正式报工，且表单可配置产出、不良和报废等多个用途
        when: 形成批次/工单最终产出及同报表中的用途统计
        then: 批次最终产出只取指定工序约定语义的正式报工数量，工单只汇总所属批次；不良和报废按配置独立展示且不自动加减产出，无数据不显示为实际零
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-canvas-primary-entry
        given: 制表人员首次配置用途，并在画布选中字段或子表
        when: 从所选对象进入配置，再需要全表总览或调整
        then: 预期主要配置路径从画布开始，信息按需渐进展示，集中入口承担总览与调整；此场景是未来验收要求，具体侧栏与模式交互仍待评审，不证明当前实现或易用性验收已通过
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-cross-form-independent-metrics
        given: 同一已明确统计对象与范围中，表A正式良品指标为90，表B正式不良指标为5
        when: 将两项指标汇总到同一报表行
        then: 预期可以并列展示90与5并分别回查来源，不能据此自动扣减最终产出或计算良率；此例不证明任意跨表单同事件关联已支持，也不是已运行测试结果
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-cross-form-missing-metric
        given: 同一已明确统计范围中，表A存在正式指标，表B无正式生效数据
        when: 展示该报表行及指标来源
        then: 预期表A指标仍可展示，表B不填为真实0；如何表示缺失值随后定义，此例仅是验收行为而非当前运行结果
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-same-fact-header-detail-no-double-count
        given: 同一业务事实同时有表头总数和子表明细合计，另有独立的多次正式记录
        when: 按明确的事实身份、统计粒度与来源形成汇总
        then: 预期同一事实的表头与明细不重复累计，独立多次记录仍可累计；事实身份及具体去重实现待设计，此例不证明当前解释器已完成去重
        evidenceIds: [evidence.form-traceability-projection-ownership-user-confirmed]
      - id: scenario.form-projection-new-purpose-preserves-old-snapshot
        given: 已有生产实例在START或ATTACH_FORM时冻结了用途配置
        when: 后续新增业务用途或字段并形成新的使用
        then: 预期新增配置不改写旧实例的冻结配置，旧记录与投影继续按原快照解释；此例延续DEC-0075-12，不新增发布冻结步骤或宣称本例已运行验证
