        summary: 既有DEC-0019及批次详情已实现对象数据审计，旧独立审计TODO陈旧。2026-10-27进一步要求制程身份和当次冻结快照详情，其实际实现与验证由本轮证据单列。
        evidenceIds: [evidence.production-work-order-page-pending-list]
