knowledgeModelVersion: 0.3.12
decisions:
  - id: DEC-0003
    title: Codex 协作交付与自定义事务运行边界
    status: deprecated
    visibility: internal
    context: eDHR 以标准化产品内核支持团队使用 Codex 进行项目二开和高度定制。Codex 是产品外部的开发与交付工具；团队通过仓库化协作契约、知识基线、业务决策、decisionPackage 和 Git 版本化资产保持多人理解与交付质量一致。产品内仍由业务知识本体、结构化规则、事务编排和受控动作处理器共同实现生产运行；当前仅记录架构与运行边界，尚无已验证运行引擎或执行契约。
    decisionStatements:
      - id: DEC-0003-01
        statement: 业务规则运行引擎只读取已发布且具备执行契约的结构化规则，对业务事件和事实进行确定性判断并返回允许、阻断或触发结果。
        status: specified
        visibility: internal
      - id: DEC-0003-02
        statement: 事务编排根据已发布事务定义管理事务实例、节点状态、等待、条件分支和流程推进，并通过执行契约调用已注册动作处理器。
        status: specified
        visibility: internal
      - id: DEC-0003-03
        statement: 动作处理器以标准处理器或项目插件的形式，按受控执行契约完成创建表单、更新状态、写入审计和调用外部系统等确定性副作用。
        status: specified
        visibility: internal
      - id: DEC-0003-04
        statement: 产品外部的 Codex 协作交付流程将已确认项目需求转化为本体、规则、事务流程、扩展插件、迁移、测试和文档候选产物，并通过仓库协作契约和版本化知识资产保持多人对业务决策与质量标准的理解一致；候选产物必须经校验和人工确认后才能发布。
        status: specified
        visibility: internal
      - id: DEC-0003-05
        statement: Codex 或其他生成式 AI 不得在生产运行时直接决定业务结果；生产运行必须使用版本化规则、已发布事务定义和已注册动作处理器。Codex 生成的候选资产必须经过仓库契约规定的校验、人工确认和发布后才能被产品运行时读取。
        status: specified
        visibility: internal
      - id: DEC-0003-06
        statement: 生产对象开始执行事务后冻结所用事务版本引用，后续新版本只供新生产对象选择，不能改变原生产对象的历史执行依据。
        status: specified
        visibility: internal
      - id: DEC-0003-07
        statement: 为支撑 Codex 协作交付和项目定制，产品第一阶段即纳入最小可用的可视化自定义事务编排、事务运行时和动作扩展接口，但不在第一阶段复制冠骋全部复杂节点；该能力属于 eDHR 产品业务运行能力，不是产品内的 AI 交付工作台。
        status: specified
        visibility: internal
    supersedes: []
    evidenceIds: [evidence.ai-transaction-runtime-architecture, evidence.crown-transaction-module-research]
    acceptanceScenarios:
      - id: scenario.ai-generated-transaction-requires-release
        given: Codex 根据客户需求生成一份自定义事务草稿
        when: 草稿尚未通过校验和人工确认发布
        then: 生产运行时不得创建该事务的实例
        evidenceIds: []
        evidenceRequirements: [后续运行引擎集成测试]
      - id: scenario.published-transaction-invokes-registered-handler
        given: 已发布事务版本包含一个已注册动作节点
        when: 事务实例推进到该节点
        then: 编排器按执行契约调用对应处理器并记录节点与审计结果
        evidenceIds: []
        evidenceRequirements: [后续事务运行集成测试]
      - id: scenario.production-keeps-transaction-version-snapshot
        given: 生产对象已按已发布事务版本开始执行
        when: 后续发布新的事务版本
        then: 原生产对象继续使用已冻结版本，新生产对象才可使用新版本
        evidenceIds: []
        evidenceRequirements: [后续快照和版本兼容测试]
  - id: DEC-0005
    title: Codex 协作交付与生产作业运行边界
    status: specified
    visibility: internal
    context: eDHR 以标准化产品内核支持团队使用 Codex 进行项目二开和高度定制。Codex 是产品外部的开发与交付工具；团队通过仓库化协作契约、知识基线、业务决策、decisionPackage 和 Git 版本化资产保持多人理解与交付质量一致。产品内仍由业务知识本体、结构化规则、生产作业编排和受控动作处理器共同实现生产运行；当前仅记录架构与运行边界，尚无已验证运行引擎或执行契约。
    decisionStatements:
      - id: DEC-0005-01
        statement: 业务规则运行引擎只读取已发布且具备执行契约的结构化规则，对业务事件和事实进行确定性判断并返回允许、阻断或触发结果。
        status: specified
        visibility: internal
      - id: DEC-0005-02
        statement: 生产作业是可被触发并按作业步骤执行的受控生产业务单元，由作业模板、流程版本、实例、步骤与受控动作组成；作业编排根据已发布作业流程版本管理作业实例、步骤状态、等待、条件分支和流程推进，并通过执行契约调用已注册动作处理器。
        status: specified
        visibility: internal
      - id: DEC-0005-03
        statement: 动作处理器以标准处理器或项目插件的形式，按受控执行契约完成创建表单、更新状态、写入审计和调用外部系统等确定性副作用。
        status: specified
        visibility: internal
      - id: DEC-0005-04
        statement: 产品外部的 Codex 协作交付流程将已确认项目需求转化为本体、规则、作业定义、扩展插件、迁移、测试和文档候选产物，并通过仓库协作契约和版本化知识资产保持多人对业务决策与质量标准的理解一致；候选产物必须经校验和人工确认后才能发布。
        status: specified
        visibility: internal
      - id: DEC-0005-05
        statement: Codex 或其他生成式 AI 不得在生产运行时直接决定业务结果；生产运行必须使用版本化规则、已发布作业流程版本和已注册动作处理器。Codex 生成的候选资产必须经过仓库契约规定的校验、人工确认和发布后才能被产品运行时读取。
        status: specified
        visibility: internal
      - id: DEC-0005-06
        statement: 生产对象开始执行作业后冻结所用已发布作业流程版本引用，后续新版本只供新生产对象选择，不能改变原生产对象的历史执行依据；审计和运行证据以作业、作业步骤和作业实例表述。
        status: specified
        visibility: internal
      - id: DEC-0005-07
        statement: 为支撑 Codex 协作交付和项目定制，产品第一阶段即纳入最小可用的可视化自定义作业编排、作业运行时和动作扩展接口，但不在第一阶段复制冠骋全部复杂节点；该能力属于 eDHR 产品业务运行能力，不是产品内的 AI 交付工作台。
        status: specified
        visibility: internal
      - id: DEC-0005-08
        statement: 生产作业不是数据库或框架 transaction；Spring、数据库及其他未证明属于生产作业的技术 transaction 保持其技术边界，不纳入本轮业务术语迁移。
        status: specified
        visibility: internal
      - id: DEC-0005-09
        statement: 生产作业定义持久化为 workflow_definition 中 type 为 WORK 的记录。WORK 标识 eDHR 生产作业定义，不能用作数据库或框架 transaction 的同义词，也不能以旧 TRANSACTION 类型继续表达生产作业。
        status: specified
        visibility: internal
      - id: DEC-0005-10
        statement: 流程中心作业模板尚未正式投入生产，且不存在需要保留的 workflow_definition 数据、生产快照或主数据业务依赖；因此旧 TRANSACTION 类型、transaction-templates API、txn-templates UI 路由和旧权限代码均无需对外兼容。新 Liquibase 迁移仅用于将本机开发数据库归一到 WORK，不构成生产历史数据兼容承诺。
        status: specified
        visibility: internal
      - id: DEC-0005-11
        statement: 本次交付仅归一生产作业术语和作业定义骨架；不实现或验证作业实例运行、步骤推进、动作处理器调用、生产快照或审计。因此作业运行时及其执行契约仍为 specified，不得对客户或运行时投影声明已完成。
        status: specified
        visibility: internal
    supersedes: [DEC-0003]
    evidenceIds: [evidence.ai-transaction-runtime-architecture, evidence.crown-transaction-module-research]
    acceptanceScenarios:
      - id: scenario.ai-generated-production-work-requires-release
        given: Codex 根据客户需求生成一份自定义作业草稿
        when: 草稿尚未通过校验和人工确认发布
        then: 生产运行时不得创建该作业的实例
        evidenceIds: []
        evidenceRequirements: [后续作业运行集成测试]
      - id: scenario.published-production-work-invokes-registered-handler
        given: 已发布作业流程版本包含一个已注册动作步骤
        when: 作业实例推进到该步骤
        then: 编排器按执行契约调用对应处理器并记录步骤与审计结果
        evidenceIds: []
        evidenceRequirements: [后续作业运行集成测试]
      - id: scenario.production-keeps-production-work-version-snapshot
        given: 生产对象已按已发布作业流程版本开始执行
        when: 后续发布新的作业流程版本
        then: 原生产对象继续使用已冻结版本，新生产对象才可使用新版本
        evidenceIds: []
        evidenceRequirements: [后续快照和版本兼容测试]
      - id: scenario.production-work-definition-uses-work-type
        given: 用户在生产下的生产配置创建或读取生产作业模板
        when: 系统持久化或查询其 workflow_definition
        then: 作业定义使用 type 为 WORK 的记录
        evidenceIds: []
        evidenceRequirements: [Liquibase 迁移测试, 作业模板 API 隔离测试]
      - id: scenario.legacy-transaction-skeleton-has-no-external-compatibility
        given: 本机开发数据库或旧前端代码中仍存在 TRANSACTION、transaction-templates、txn-templates 或 workflow.txn-templates 标识
        when: 应用本次作业骨架归一变更
        then: 本机开发数据库迁移至 WORK；系统不为旧类型、API、UI 路由或权限代码保留对外兼容行为
        evidenceIds: []
        evidenceRequirements: [Liquibase 迁移测试, API 路由测试, 前端路由测试, 权限回归测试]
      - id: scenario.production-work-runtime-remains-unimplemented
        given: 作业定义骨架已归一为 WORK
        when: 评估当前可交付能力
        then: 不得将作业实例运行、步骤推进、动作处理器、生产快照或审计标记为已完成或已验证
        evidenceIds: []
        evidenceRequirements: [后续作业运行端到端测试, 执行契约注册和验证证据]
