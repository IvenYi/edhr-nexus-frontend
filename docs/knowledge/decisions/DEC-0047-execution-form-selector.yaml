knowledgeModelVersion: 0.3.25
decisions:
  - id: DEC-0047
    title: 三类填报表单、运行时自定义挂载与正在填写人数
    status: specified
    visibility: internal
    context: user-confirmed；初始确认三类来源分别展示、自定义挂载显式选择必填、正在填写人数按同一表单用户跨份去重。原“已发布模板”技术映射待决已由 DEC-0075-08 明确取消版本PUBLISHED准入，仅保留有效模板、租户及显式版本冻结；归属由 DEC-0075-01/02 扩展为工序或批次，并按归属分层校验。DEC-0059 已局部替代此处继承的显式结束前置，DEC-0075 再规定已有未完成自定义份的受控继续填报。原三类来源、独立份、必填选择和人员去重继续；历史计划保留原文及时间，知识仍 specified/internal，不表示运行验收通过。
    decisionStatements:
      - id: DEC-0047-01
        statement: 填报表单区分工序配置、自定义挂载和作业发起三种来源；相同表单模板版本不构成实例复用或隐藏依据。工序开工前可展示并切换查看冻结计划表单，但不得创建实例、显示实例份数或允许填报，并明确显示“待工序开工”；工序开工后工序配置表单创建并可填，作业表单在对应作业节点未到达时可切换查看并显示“待作业流程到达”，到达后才创建并可填；已结束而未到达的作业表单显示“不适用”。显示表单名称、编码、版本、是否必填、计划或实例份数、聚合状态和正在填写人数。
        status: specified
        visibility: internal
      - id: DEC-0047-02
        statement: 自定义挂载的显式必填选择和独立多份意图继续适用；早期当前工序及已发布版本措辞按 DEC-0075-01/02/08 局部替代为工序或批次归属、有效模板及租户校验、显式版本冻结，不要求模板版本PUBLISHED。显式结束前置由 DEC-0059 替代，非必填未闭环与完工后受控继续填报按 DEC-0075 核对，不倒退生产完成事实。
        status: specified
        visibility: internal
      - id: DEC-0047-03
        statement: 只统计实际填写该表单的用户，同一用户跨份、跨窗口去重；纯查看不计入，不将此人数功能解释为文档实时合并编辑。
        status: specified
        visibility: internal
    supersedes: []
