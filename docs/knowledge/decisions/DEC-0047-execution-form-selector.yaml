    acceptanceScenarios:
      - id: scenario.execution-custom-form-attachment
        given: 操作员在当前生产对象显式选择有效且属于当前租户的表单模板版本，不要求版本PUBLISHED，并选择工序或批次归属
        when: 填写添加原因、明确归属及完工校验设置并完成挂载
        then: 出现可追溯的自定义表单与独立份，刷新保留版本、归属和完工校验设置；按DEC-0075的归属分层阻断与资料齐套规则处理，批次归属跨工序共享同一份。无需旧显式结束动作，已有未完成份的完工后继续填报走受控路径
        evidenceIds:
        - evidence.execution-form-selector-user-decision
        - evidence.custom-form-scope-confirmed
        - evidence.custom-form-template-selection-boundary
        - evidence.production-form-auto-finish-confirmed
        evidenceRequirements: [挂载API持久化与审计, 必填和非必填检查, 旧执行快照兼容]
      - id: scenario.execution-form-source-selection
        given: 当前工序有配置表单、自定义表单及作业流程表单
        when: 打开切换表单抽屉并切换来源或表单
        then: 三类来源清楚可辨；未开工的冻结计划表单显示“待工序开工”、尚未到达的作业表单显示“待作业流程到达”，均可见、可切换查看但不可填，不得冒充实例或显示实例份数；到达后才显示实际填报状态，显示完整元数据并保留脏数据保护
        evidenceIds: [evidence.execution-form-selector-user-decision]
        evidenceRequirements: [分类与选择测试, 页面紧凑布局检查, 未保存内容保护]
      - id: scenario.execution-active-editor-deduplication
        given: 两名用户填写同一表单不同份且其中一人打开多个窗口，另有只读查看者
        when: 查询在线填写人数
        then: 计为两人且不计只读者，离开或过期的会话被排除，人数不跨对象工序表单混算
        evidenceIds: [evidence.execution-form-selector-user-decision]
        evidenceRequirements: [用户身份去重, 跨份窗口与隔离测试, 只读排除, 离开和过期测试]
    implementationDiscrepancies:
    - id: discrepancy.execution-form-plan-count-and-not-applicable-projection
      status: resolved
      severity: medium
      visibility: internal
      path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/ProductionExecutionService.java
      lineHint: 355
      summary: >-
        provenance: original-evidence；历史静态审读记录（保留当时范围）：未实例化的计划表单在抽屉仍显示共0份；后端 formAvailabilityStatus 先以工序非IN_PROGRESS返回WAITING_OPERATION_START，使已结束而未到达的作业表单可能不能投影NOT_APPLICABLE。应维持计划/实例区别及已结束不适用规范；本次未运行UI或实际实例回归。 本次仅核对源码及已有断言，未修改生产代码或执行业务运行验收。
        2026-10-16以edhr-dev@41f19bca31a6232ae568dde073ef366c5d894e86为新审查基线另行取得真实红绿证据：合法条件分支跳过FORM、作业结束及工序正常完工后，public service.get原投影待开工；局部修复保持已有实例状态优先，无实例且作业已结束投影不适用，再判断工序待开工。实际React选择器的普通行和作业步骤tooltip不再对未实例化计划显示共0份，不捏造计划份数；非当前步骤已有份保留实际进行中或完成状态，缺少copyControls时按已结束作业解释无实例预览。原预览、当前动作、权限及实际多份计数保持。
        本轮测试覆盖合法引擎到公开只读服务、GET不写库，以及现存END_FORM兼容口产生的已结束作业未完成选填份；该兼容验证不恢复已取消的显式结束按钮。浏览器验证使用实际组件及受控只读fixtures，不能冒充生产服务或数据库端到端验收。原静态审读未运行的历史不改写，DEC-0047及相关规则成熟度仍specified/internal；本差异收敛不代表W2全量审查、独立质量或知识运行投影已经完成。
      evidenceIds:
      - evidence.execution-form-selector-user-decision
      - evidence.production-execution-service-source
      - evidence.execution-form-availability-read-regression
      - evidence.execution-form-availability-selector-browser
      - evidence.execution-form-availability-batch-validation
