knowledgeModelVersion: 0.3.24
decisions:
  - id: DEC-0072
    title: DHR 汇总来源分组默认批量与实例级纳入
    status: implemented
    visibility: internal
    context: >-
      user-confirmed；DEC-PACKAGE-20260924-DHR-SUMMARY-ORDER 同一切片增量。
      仅局部替代 DEC-0063-02 与 DEC-0071-01 中“同模板多份逐实例作为汇总候选呈现和操作”的历史表述；
      保留三类来源、按实例独立归档与冻结、同级顺序、基础目录、审核和权限边界。
      DEC-0068 的填报/列表按实例识别仍适用，本决策只限定 DHR 汇总交互。
      本轮 user-confirmed 直接修订同一讨论方案，不新建决策或重复迭代历史，也不变更知识基线版本。
      来源组是默认批量交互，不构成全有或全无、同目录或连续位置的业务硬约束；保存与提交沿用底层逐实例校验。
      既有来源分组实现及历史聚焦测试记录保留；本次全来源别名和目录交互增量已完成主智能体聚焦持久化与隔离浏览器验证，保持 implemented/internal，不等同于真实生产提交或发布验证。
    decisionStatements:
      - id: DEC-0072-01
        statement: user-confirmed；DHR 汇总右侧作业来源按同一生产工序及同一作业填报节点定义 formId 成组，自定义来源按同一次创建项 formId 成组；分组键为 originKind、operationId、formId，同模板但不同节点或不同创建项不得合组，来源键缺失时按实例独立处理。候选区默认整组拖拽或选择，也可展开明确选择已完成实例，部分纳入显示 x/y。左侧按真实归档位置与顺序，仅相邻同源实例折叠；每份均可查看，草稿可逐份移出，移出只解除本次归档关系。
        status: implemented
        visibility: internal
      - id: DEC-0072-02
        statement: user-confirmed；来源组只改变汇总展示与交互单位。归档位置、同级顺序、候选冻结、来源快照、校验指纹与审计继续按每份表单实例保存；同一实例在同一汇总版本中仍只能归入一个位置，不修改来源表单。
        status: implemented
        visibility: internal
      - id: DEC-0072-03
        statement: original-evidence；后端 validatePlacements 只接受 COMPLETED 表单实例，并校验候选、目标目录、同级锚点、排序和实例唯一归档。user-confirmed；保留该底层校验及既有证据纳入政策、源业务校验、必填目录和未完成补录阻断；取消全组硬约束不产生新的必填或选填豁免规则。
        status: implemented
        visibility: internal
      - id: DEC-0072-04
        statement: user-confirmed；来源组不要求全部纳入、同目录或连续位置；在既有校验通过的前提下，部分、分散或交错的实例归档可保存和提交。混合完成状态不得整组操作后静默跳过未完成实例，须明确反馈并允许展开选择已完成实例；未完成实例不可纳入。草稿与 readOnly 冻结目录都保持真实交错顺序，不因合组重新排序，不改写已冻结历史。
        status: implemented
        visibility: internal
      - id: DEC-0072-05
        statement: user-confirmed；DHR 汇总工作区提供可收起概览，来源候选保持右侧独立入口；冠骋原始页面仅作为交互参考，不改变本产品来源分组与逐实例归档规则。
        status: implemented
        visibility: internal
      - id: DEC-0072-06
        statement: user-confirmed；所有目录下已有真实证据的表单均支持草稿归档显示名重命名，包括 DIRECTORY、WORK 和 CUSTOM 来源。组行重命名作用于当前范围全部已归档实例（可选来源折叠行仍限当前相邻段），单份行仅修改该实例；保存重开保持别名，提交后与归档位置一起冻结并参与校验指纹，已冻结版本只读。重新整理以新草稿复制上版显示名，包括 DIRECTORY 别名，不改写旧版本。显示名仅属于逐实例汇总关联，不修改来源表单名称、内容、实例号或基础目录快照；旧版空别名回退原名。DIRECTORY 自动归位、固定归属和不可移除规则不变，别名输入不能覆盖目标或排序。
        status: implemented
        visibility: internal
      - id: DEC-0072-07
        statement: user-confirmed；汇总目录表单行去掉独立份数数字，单实例也显示实例列表按钮；点击表单行默认预览第一份实例，拖拽仅显示一个落点。此目录呈现调整不取消右侧候选部分纳入 x/y 反馈，也不改变证据关系、归档顺序、编辑权限或冻结只读规则。
        status: implemented
        visibility: internal
    supersedes: [DEC-0063, DEC-0071]
    evidenceIds: [evidence.dhr-summary-source-group-user-confirmed, evidence.dhr-summary-source-group-ui, evidence.dhr-summary-work-form-id, evidence.dhr-summary-custom-form-id, evidence.dhr-summary-source-group-test, evidence.dhr-summary-service, evidence.dhr-summary-order-service, evidence.dhr-summary-source-group-backend-test, evidence.dhr-summary-display-name-migration, evidence.dhr-summary-display-name-test-source]
    acceptanceScenarios:
      - id: scenario.dhr-summary-source-bulk-placement
        given: 同一工序作业节点有两份已完成实例，另一节点使用相同模板；一次自定义创建项有两份实例
        when: 用户对某一来源默认整组归档，或展开明确选择单份归档，然后保存、重开并提交
        then: 整组操作可用，选一份时显示 1/2，另一节点或创建项不受影响；各份可查看，草稿可逐份移出且不删除来源表单，完整候选范围及逐实例关联、顺序和哈希继续冻结
        evidenceIds: [evidence.dhr-summary-source-group-user-confirmed, evidence.dhr-summary-source-group-ui, evidence.dhr-summary-work-form-id, evidence.dhr-summary-custom-form-id, evidence.dhr-summary-source-group-test, evidence.dhr-summary-service, evidence.dhr-summary-source-group-backend-test]
        evidenceRequirements: [分组键与整组及单份交互浏览器测试, 部分保存提交重开, 逐实例服务校验, 冻结版本审计与哈希核对]
      - id: scenario.dhr-summary-source-mixed-completion
        given: 同一来源含已完成和未完成实例
        when: 用户尝试整组纳入或展开选择实例
        then: 整组操作明确反馈未完成阻断且不静默跳过，用户可明确选择已完成实例，未完成实例仍不可纳入
        evidenceIds: [evidence.dhr-summary-source-group-user-confirmed, evidence.dhr-summary-source-group-test, evidence.dhr-summary-source-group-backend-test]
        evidenceRequirements: [混合状态交互验证, 未完成实例服务端阻断]
      - id: scenario.dhr-summary-source-interleaved-order
        given: 同源 A1、A2 在草稿中分目录或与另一来源 B1 按 A1、B1、A2 交错归档
        when: 用户保存重开、提交后读取 readOnly 冻结版本
        then: 真实位置和顺序不变，左侧仅相邻同源实例折叠，不把 A2 移到 A1 旁；冻结历史不回写
        evidenceIds: [evidence.dhr-summary-source-group-user-confirmed, evidence.dhr-summary-source-group-test, evidence.dhr-summary-source-group-backend-test, evidence.dhr-summary-order-service]
        evidenceRequirements: [分目录与交错归档持久化测试, 草稿与只读目录浏览器测试]
      - id: scenario.dhr-summary-source-preserves-existing-validation
        given: 汇总存在必填目录缺失或未完成补录等既有阻断条件
        when: 用户展开选择部分来源实例并提交
        then: 既有证据纳入政策和源业务校验继续阻断，不以取消全组硬约束作为必填或选填豁免，空来源不生成证据
        evidenceIds: [evidence.dhr-summary-source-group-user-confirmed, evidence.dhr-summary-service, evidence.dhr-summary-source-group-backend-test]
        evidenceRequirements: [必填目录与未完成补录回归, 空来源证据检查]
      - id: scenario.dhr-summary-archive-display-name
        given: 汇总草稿内有 DIRECTORY 目录实例、相邻同源可选多份归档实例、单份归档实例和旧版本空显示名
        when: 用户分别重命名相邻折叠行与单份行，保存重开、提交并重新整理
        then: 所有来源仅当前范围的目标已归档实例获得显示名；冻结版本及指纹保持该名称，新草稿继承该名称，旧版本空别名显示原名；来源表单和基础快照不变，DIRECTORY 自动归位、固定归属及不可移除规则不变，冻结版本不可编辑
        evidenceIds: [evidence.dhr-summary-source-group-user-confirmed, evidence.dhr-summary-service, evidence.dhr-summary-display-name-migration, evidence.dhr-summary-display-name-test-source]
        evidenceRequirements: [目录组及可选相邻段与单份作用域交互, 全来源草稿保存重开, 冻结哈希与只读及审核显示名, DIRECTORY 重新整理继承, 空别名旧版读取, 拒绝 DIRECTORY 移动及排序覆盖, 重复实例及异常名称与越权阻断, 单实例列表按钮与首份预览, 单一拖拽落点及行尾对齐]
    implementationDiscrepancies: []
