knowledgeModelVersion: 0.3.25
decisions:
  - id: DEC-0002
    title: 产品簇制程模型与生产版本解析
    status: specified
    visibility: internal
    context: 产品簇复用产品制程根、版本及工序绑定，解析按产品优先、簇兜底及有效期。2026-10-27直接修正工单锁版与转簇边界：各对象独立引用，未开工按当前资格重核，首次START冻结当时制程与产品簇依据，已开工不改写。作业按2026-10-26规则实时匹配后续工序，已有实例保留；制程原未决已收敛，不能继续用旧差异否定新规则。
    decisionStatements:
      - id: DEC-0002-01
        statement: 产品簇可包含多个半成品或产成品产品。
        status: implemented
        visibility: internal
      - id: DEC-0002-02
        statement: 一个产品最多属于一个产品簇。
        status: implemented
        visibility: internal
      - id: DEC-0002-03
        statement: 产品簇可以拥有多个并行制程版本。
        status: implemented
        visibility: internal
      - id: DEC-0002-04
        statement: 产品和产品簇共用同一套制程根、版本、工序表单和文档绑定模型。
        status: implemented
        visibility: internal
      - id: DEC-0002-05
        statement: 共享制程模型的实现方案是在现有 product_process 增加 owner_type(PRODUCT/PRODUCT_FAMILY) 和 owner_id，并兼容迁移历史 product_version_id。
        status: implemented
        visibility: internal
      - id: DEC-0002-06
        statement: 制程解析服务在产品存在可用制程版本时只返回产品版本，不返回产品簇兜底。
        status: implemented
        visibility: internal
      - id: DEC-0002-07
        statement: 制程解析服务在产品没有可用制程版本且所属产品簇有可用版本时返回产品簇版本，并提示“当前产品未配置可用制程，以下为产品簇兜底制程”。
        status: implemented
        visibility: internal
      - id: DEC-0002-08
        statement: 制程解析服务在产品和所属产品簇都没有可用制程版本时阻断解析。
        status: implemented
        visibility: internal
      - id: DEC-0002-09
        statement: 制程版本可用状态严格沿用 RdoVersionStatusResolver；effectiveFrom 晚于查询时间，或 effectiveTo 小于等于查询时间，均不可用。
        status: implemented
        visibility: internal
      - id: DEC-0002-10
        statement: "provenance: user-confirmed；产品簇成员变化后，新对象按当前产品/产品簇选择制程；已有未开工对象仍保存原引用，但首次开工必须按当前归属、有效期及既定生产形态重核，不适用时提示并要求明确重选。已开工制程快照不改写。产品新增自有制程不否定仍合法的既有簇引用。作业独立按当前簇实时匹配后续工序，既有实例保留，已过站不补做，见DEC-0007-03/04。"
        status: specified
        visibility: internal
      - id: DEC-0002-11
        statement: 产品成员转移需要事务、二次确认、不填写转移原因，并记录产品、旧产品簇和新产品簇审计。
        status: implemented
        visibility: internal
      - id: DEC-0002-12
        statement: 产品簇页面使用产品管理同一套建模页面交互和制程版本编辑器。
        status: implemented
        visibility: internal
      - id: DEC-0002-13
        statement: 产品簇编码由用户在新增和编辑时维护，不能为空，并在同一租户内不区分大小写唯一。
        status: implemented
        visibility: internal
      - id: DEC-0002-14
        statement: 产品簇不具有独立的客户可操作状态；历史 status 持久字段仅为兼容保留，不投影到列表、详情或审计快照。
        status: implemented
        visibility: internal
      - id: DEC-0002-15
        statement: 产品簇的制程版本状态由 RdoVersionStatusResolver 根据各版本的生效时间和失效时间计算。
        status: implemented
        visibility: internal
      - id: DEC-0002-16
        statement: 产品簇详情的数据审计记录制程版本新增、编辑和删除，以及版本字段和工序表单、文档配置的变更前后快照；审计隐藏技术 id 和 productProcessId，成员关系与制程配置字段使用中文业务标签，嵌套制程版本状态保留为版本状态。
        status: implemented
        visibility: internal
    supersedes: []
    evidenceIds: [evidence.product-family-member-entity, evidence.product-family-member-repository, evidence.product-process-entity, evidence.product-process-owner-repository, evidence.migration-0053-product-family-process-owner, evidence.product-family-membership-service, evidence.product-family-repository, evidence.migration-0054-product-family-code-case-insensitive, evidence.process-modeling-controller, evidence.product-process-owner-service, evidence.product-process-resolution-service, evidence.product-family-modeling-page, evidence.product-family-modeling-api, evidence.product-family-membership-service-test, evidence.process-modeling-controller-test, evidence.product-process-owner-service-test, evidence.product-process-resolution-service-test, evidence.batch-process-direct-correction-confirmed]
    acceptanceScenarios:
      - id: scenario.product-family-membership
        given: 存在多个半成品或产成品产品
        when: 将这些产品加入同一产品簇并尝试为一个产品再指定第二个产品簇
        then: 产品簇可以包含多个产品，单个产品不能同时属于两个产品簇
        evidenceIds: [evidence.product-family-member-entity, evidence.product-family-member-repository, evidence.migration-0053-product-family-process-owner, evidence.product-family-member-repository-test, evidence.product-family-membership-service, evidence.product-family-membership-service-test]
      - id: scenario.product-family-parallel-process-versions
        given: 一个产品簇已存在一个制程版本
        when: 为同一产品簇新增另一个版本号不同的制程版本
        then: 两个产品簇制程版本并行保留
        evidenceIds: [evidence.product-process-owner-service, evidence.product-process-owner-service-test]
      - id: scenario.product-family-user-code-and-status-projection
        given: 用户新增或编辑产品簇，且历史记录可能保留 status 列
        when: 输入空编码、重复编码或唯一编码，并查看列表、详情和审计
        then: 空编码或租户内不区分大小写重复编码被拒绝，唯一编码被持久化；父产品簇状态不展示，子制程版本仍按有效期显示版本状态
        evidenceIds: [evidence.product-family-repository, evidence.migration-0054-product-family-code-case-insensitive, evidence.process-modeling-controller, evidence.process-modeling-controller-test, evidence.product-family-modeling-page]
      - id: scenario.product-process-owner-compatibility
        given: 现有 product_process 数据包含历史 product_version_id
        when: 迁移或保存产品与产品簇制程
        then: 共享模型通过 owner_type 和 owner_id 表达所有者，并兼容历史 product_version_id
        evidenceIds: [evidence.product-process-entity, evidence.product-process-owner-repository, evidence.migration-0053-product-family-process-owner, evidence.product-process-owner-service, evidence.product-process-owner-service-test]
      - id: scenario.product-process-resolution-priority
        given: 产品和所属产品簇均存在制程配置，但产品有至少一个可用版本
        when: 生产侧解析可用制程
        then: 只返回产品版本，不返回产品簇兜底
        evidenceIds: [evidence.product-process-resolution-service, evidence.product-process-resolution-service-test]
      - id: scenario.product-family-process-fallback
        given: 产品没有可用版本且所属产品簇有可用版本
        when: 生产侧解析可用制程
        then: 返回产品簇版本并显示已确认的产品簇兜底提示
        evidenceIds: [evidence.product-process-resolution-service, evidence.product-process-resolution-service-test]
      - id: scenario.no-available-process-version
        given: 产品和所属产品簇都没有可用版本
        when: 生产侧解析可用制程
        then: 生产侧阻断
        evidenceIds: [evidence.product-process-resolution-service, evidence.product-process-resolution-service-test]
      - id: scenario.product-family-transfer
        given: 产品已属于一个产品簇
        when: 在事务中二次确认并将其转移到另一个产品簇
        then: 不填写转移原因，记录产品、旧产品簇和新产品簇审计；作业对既有批次后续工序实时匹配且保留已有实例，制程侧转移影响另行核对
        evidenceIds: [evidence.product-family-membership-service, evidence.process-modeling-controller, evidence.product-family-membership-service-test, evidence.process-modeling-controller-test]
      - id: scenario.production-object-snapshot
        given: 产品簇成员关系和可选制程版本已确定
        when: 创建未来生产对象
        then: 保存产品、产品簇、所选版本和配置快照
        evidenceIds: []
      - id: scenario.product-family-process-editor
        given: 用户进入产品簇页面
        when: 查看或编辑制程版本
        then: 使用产品管理同一套建模页面交互和制程版本编辑器
        evidenceIds: [evidence.product-family-modeling-page, evidence.product-family-modeling-api, evidence.product-process-version-editor]
      - id: scenario.product-family-process-audit-traceability
        given: 产品簇新增、编辑或删除制程版本，或修改版本字段和工序表单、文档配置
        when: 用户打开产品簇详情的数据审计
        then: 审计显示对应制程版本和工序配置的变更前后快照；技术 id 不展示，嵌套制程版本 status 作为版本状态保留
        evidenceIds: [evidence.product-process-owner-service, evidence.product-process-owner-service-test, evidence.product-family-modeling-page]
    implementationDiscrepancies:
    - id: discrepancy.product-family-transfer-unstarted-object-context
      status: resolved
      severity: medium
      visibility: internal
      path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/ProductionService.java
      lineHint: 243
      summary: "provenance: user-confirmed + original-evidence；本轮直接收敛原制程差异：工单不锁版，按对象选择；未开工首次START重核当前归属/有效期/形态，冻结当时产品簇及配置，已开工不改。原作业范围已于2026-10-26修正为当前簇实时匹配；两者不再待讨论。源码范围见ProductionService及ExecutionSnapshotBuilder，运行验证取本轮，不沿用前序作业测试。"
      evidenceIds:
      - evidence.product-family-membership-service
      - evidence.product-family-membership-service-test
      - evidence.product-process-resolution-service
      - evidence.production-service
      - evidence.production-execution-snapshot-builder-source
