        evidenceIds: [evidence.migration-0061-workshop-management, evidence.workshop-router, evidence.workshop-navigation, evidence.workshop-managed-menu, evidence.workshop-page-verification]
        evidenceRequirements: [前端菜单测试或页面验证]
