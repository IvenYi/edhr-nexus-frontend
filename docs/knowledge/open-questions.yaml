knowledgeModelVersion: 0.3.25
questions:
  - id: question.dhr-termination-sop-extra-signature
    question: 具体企业 SOP 是否要求生产对象提前结束动作增加额外电子签名，若要求应由哪项受控配置决定？
    context: DEC-0069 已确认本期只复用现有生产提前结束权限、原因和审计，不新增独立质量审批；企业 SOP 的额外签名要求需结合客户制度、签名责任及配置所有权后研究，不能从法规引用或历史系统行为直接推断。
    options:
      - 企业 SOP 不要求额外签名，沿用现有终止权限、原因和审计
      - 企业 SOP 要求额外签名，后续定义受控配置、责任人、校验与审计契约
    impact: 非本期阻断问题；不改变已确认的同步真实终止、证据保留和普通执行停止政策，也不授权当前实现私自新增审批或豁免既有签署要求。
    visibility: internal
  - id: question.record-control-managerial-reassignment-signature
    question: 记录控制审批的重新分配是否必须额外完成电子签名，还是只要求专门权限、原因和不可变审计？
    context: 阶段一共享命令保留可选 signatureId，但重新分配运行时尚未实现；当前已确认其需要专门权限、目标资格、原因并保持节点和流程路径不变，尚未确认是否以电子签名作为执行阻断条件。
    options:
      - 重新分配必须电子签名，缺少有效签名时阻断动作
      - 重新分配不强制电子签名，但仍记录管理员、原因、原处理人、目标处理人和时间
      - 按已发布流程或租户合规配置决定，并补充配置所有权、默认值和审计语义
    impact: 该问题只阻塞重新分配的签名校验、签名审计字段和发布级验收，不阻塞阶段一候选查询、显式版本启动以及后续权限、原因和目标资格边界实现。
    visibility: internal
  - id: question.record-control-active-form-void-boundary
    question: 活动中的表单记录是否允许发起作废申请，还是必须在作废入口阻断并继续原填报或审批流程？
    context: 本次记录控制设计已确认独立作废申请、P0 审批和来源记录状态保留，但“打开中、已提交待审、已退回或未填报记录”的可作废边界仍需产品确认；不得将阻断建议写成 user-confirmed 规则。
    options:
      - 允许活动记录进入作废申请，但仍必须走 P0 审批
      - 阻断活动表单作废，仅允许已完成记录或误创建记录进入作废申请
      - 分状态分别定义允许条件、替代方案和审批影响后再确定
    impact: 该边界会影响作废候选查询、状态机入口、表单审批流程、DHR 完整性检查和前端动作可见性；确认前不得新增活动表单作废阻断规则。
    visibility: internal
  - id: question.production-work-condition-runtime-source-snapshot-contract
    question: 已确认作业条件第一版字段目录和字段类型，但运行时真实来源、取值快照方式以及目录版本与生产实例快照的绑定契约何时闭环？
    context: 当前目录 work-runtime-fields-v1 开放五个 string 字段，并随分支保存字段显示快照。2026-10-12 内审确认 ProductionExecutionEngine.conditionOutlet 已从冻结 context 读取 sourceType/objectType、sourceNumber/objectNo，固定设置 workType=WORK、triggerType=OPERATION_START、executionStatus=RUNNING，并把本次取值写入节点 conditionFacts；生产执行已有 snapshot_json/state_json。固定取值、取值时点及来源版本的完整业务含义仍未确认，节点工作数据也不等同于完整不可变求值证据包；问题继续保留，不能再声称所有来源和快照均未实现。
    options:
      - 由生产作业运行上下文提供五个字段，并在作业实例创建时绑定来源值快照
      - 由生产对象或工序上下文提供五个字段，并在作业实例创建时绑定来源值快照
      - 待确认各字段的真实来源、取值时点、快照存储位置和历史数据迁移策略
    impact: 在来源、取值时点和快照绑定契约闭环前，不能声称字段可被生产运行时可靠读取或进入作业实例执行快照；该问题影响字段目录兼容、历史解释和审计追溯。
    visibility: internal
  - id: question.production-work-condition-runtime-evaluation-contract
    question: 结构化条件 AST 的求值、执行结果、异常处理和条件节点推进契约应如何落地？
    context: 当前 ProductionExecutionEngine.evaluate 已在受限 WORK 执行中解释 all/any/not 和七个 string 运算符；conditionOutlet 按数组顺序选首个命中，否则使用默认分支，finishNode 记录 decisions 并按出口推进；未知字段和运算符会抛业务错误。完整异常政策、通用类型比较、规则版本与动作及审计证据契约仍未闭环；本次只静态核对实现，不把该局部求值器提升为通用规则运行层或 verified/runtime 验收。
    options:
      - 由产品内核规则引擎按目录版本解释 AST，并返回满足/否则确定性结果
      - 由作业运行时编排器解释 AST，并将结果转换为条件节点出口事件
      - 待确认求值器所有权、异常语义、类型比较规则和执行审计要求
    impact: 该问题影响条件节点运行、出口推进、失败处理、执行契约注册、作业实例快照解释和发布级验收。
    visibility: internal
  - id: question.production-work-condition-branch-model
    question: 条件分支配置闭环后，动态出口与运行时分支结果如何绑定到实际节点和连线事件？
    context: 条件节点的有序分支、唯一否则分支及每出口最多一条线已经确认。当前受限运行由 conditionOutlet 返回命中或默认出口，finishNode 写入 state.decisions 并按 sourceHandle 选择后继；已有局部实现不等于结果事件版本、完整异常处理及不可变执行审计契约均已确认，后者仍需在相关功能开发中核对。
    options:
      - 由已发布条件分支数组动态决定出口集合，并将每个出口映射为单条实例推进事件
      - 由运行时编排器统一转换命中分支和否则分支结果，再推进对应目标节点
      - 待确认分支结果事件、目标节点绑定、异常处理和执行审计字段
    impact: 配置层分支数量和出口基数已确认，但在运行时事件、目标节点绑定和异常审计闭环前，不得把条件分支求值或节点推进标记为 verified/runtime。
    visibility: internal
  - id: question.multi-tenant-workflow-isolation
    question: 启用多租户时，工作流数据和运行时操作的租户隔离契约如何统一落地？
    context: 当前 eDHR 按一个默认租户运行，本次 MVP 不实现租户隔离。未来多租户不能只在某个查询接口增加 tenant_id 条件，必须统一处理认证租户上下文、工作流定义与绑定、流程实例、任务、候选快照、主体解析、仓储查询、控制器授权和引擎按 ID 操作。
    options:
      - 启用多租户时为全部工作流实体补充租户归属，并由认证上下文强制约束所有查询和运行时操作
      - 待确认租户上下文来源、历史数据迁移、跨租户管理员边界和审计字段后统一设计
    impact: 这是非 MVP TODO，不阻塞当前默认单租户工作流交付；在契约闭环前不得宣称工作流已具备多租户隔离或直接进入多租户生产发布。
    visibility: internal
