knowledgeModelVersion: 0.3.25
questions:
  - id: question.production-batch-quantity-lower-bound
    question: BATCH 手动目标数量及按每批数量生成时，是否允许 0 < q < 1，还是要求输入数量至少为 1；所选下限如何适用于已经确认的末批余数？
    context: 旧 rule.production.production-batch-input-quantity-required 与 rule.production.mass-batch-quantity-distribution 的结构化条件为 >= 1，旧词条及中文解释要求正数量，当前 WorkOrderPage、ProductionService.split 和数据库 CHECK(target_quantity > 0) 按 > 0 校验。DEC-0012/0014 明确数量必填、SN=1、分配及总量边界，但未明确该区间的业务资格。0d46558234a933a020430ccf6c6a064ecfa05687 将阈值改为 > 0 并判定无需业务确认属于过度推断，本次按用户授权撤回；两条组合规则的历史 AST 保留为 deprecated/internal，双方来源均不能自动决定当前政策。
    options:
      - 允许大于 0 的数量，包括 0 < q < 1；仍须遵守既有精度、总量及其他资格约束，并完成相应边界验证
      - 输入数量至少为 1；同时明确已经确认的末批余数在不足 1 时如何处理，并核对实际入口、持久化和既有数据影响
    impact: 仅在后续需要确定或改变该下限的业务规则、手动添加、批量生成、导入、服务或存储校验时阻塞依赖范围；不阻塞本次恢复待决记录及无关功能。确认前不把 > 0 或 >= 1 提升为已确认准入规范，不取消数量必填、正整数批次数、SN=1、总量和末批余数要求，不擅自丢弃、补足余数或改变生产数据。本次不修改运行代码，也未完成小数边界业务验证。补正来源见 docs/knowledge/evidence/ontology-foundation-fact-types.md 第四节。
    visibility: internal
  - id: question.form-projection-notebook-effective-unit
    question: 长期记录本按单条还是整本最终生效，条目如何关联跨工单生产对象？
    context: DEC-0077首轮实施只覆盖普通生产表单，设计Q3尚未确定长期记录本的记录单位和生命周期。
    options:
      - 独立条目最终完成后生效并显式绑定各自生产上下文
      - 整本受控完成后生效并另行定义条目跨工单关联
    impact: 仅阻塞长期记录本投影，不阻塞普通字段配置、最终完成投影和来源回查；不得以生产表单替代完整记录本模型。
    visibility: internal
  - id: question.form-projection-defect-count-semantics
    question: 不良原因分项数量统计不良件数还是缺陷次数，各原因是否允许重叠？
    context: DEC-0077按工序用途合计不自动解决设计Q4，同一件多缺陷不能推定为多件不良品，缺少分项数量不能从总量自动拆分。
    options:
      - 统计不良件数并明确原因互斥或归属规则
      - 统计缺陷次数并与不良品件数分别展示
    impact: 仅阻塞不良原因分项数量模型及报表，不阻塞已明确用途的普通数量投影。
    visibility: internal
  - id: question.form-projection-free-text-identity
    question: 在草稿免阻断性业务校验及无上下文可登记系统内对象已确认后，编号解析范围、最终完成时错误值及其他实体歧义如何处理？
    context: 设计Q6尚未闭环。2026-10-07的DEC-0077-23确认普通文本只在显式对应物料用途下才可触发匹配、信息次要展示且优先hover，原生引用自身能力不要求投影用途。DEC-0077-28/30明确预置生产批次/SN有上下文时沿真实所属，无上下文时可登记系统内对象但不自动绑定执行、统计或DHR；草稿不因业务完整性或投影校验阻断。不存在对象或与上下文不一致的值在最终完成时的具体处置仍待定。本前提不确认其他编号唯一范围、改号重用、零或多匹配处置，也不确认通用文本实体解析纳入MVP。DEC-0077-31允许物料批号为空或自由文本，不据相同批号默认等同实体。
    options:
      - 仅接受已存在的受控引用，自由文字继续只作文本查询
      - 定义身份范围及受控解析确认流程后开放自由文字转实体关联
    impact: 仅阻塞依赖该细则的文本身份解析、最终错误值校验及关系追溯，不阻塞已确认目录含义、文字查表和既有物料引用；不重问草稿免业务校验、无上下文登记、显式物料用途触发前提或有上下文所属含义，不能凭字符串相同或唯一匹配改变生产或DHR归属、自动形成物料使用关系。
    visibility: internal
  - id: question.form-projection-header-shared-fields
    question: 是否支持表头字段向同一表单的子表各行业务记录共享，及如何明确统计粒度与重复计数边界？
    context: DEC-0077的2026-10-03补录确认画布字段或子表优先配置，但表头共享值尚未确认；同一事实表头总数与明细合计不能重复累计的验收期望，不等于共享字段能力或具体配置方案已定版。
    options:
      - 暂不支持共享值，所需字段由各条业务记录显式提供
      - 支持显式共享指定表头字段，并先定义身份、空值与聚合去重边界
    impact: 仅在实现表头共享或相关子表聚合前确认；不阻塞本次已确认内容补录，不得以默认复制所有表头字段补足尚未确认的能力。
    visibility: internal
  - id: question.form-projection-sidebar-mode-interaction
    question: 已确认同一画布内独立查找统计侧栏后，渐进配置、字段补齐及定位细节如何通过客户试用核对？
    context: DEC-0077-14确认画布主入口，2026-10-05的DEC-0077-22进一步确认与字段配置同级的独立侧栏、共享选择与配置及保存撤销，不离开画布。2026-10-12用户进一步确认侧栏按业务逐条配置，同业务新增不重选用途；来源保留下拉并支持主动进入画布选取，选中兼容来源后退出、不自动转下一角色，可取消。来源记录按业务称消耗明细、报废明细、报工记录，不新增业务模型；原话见既有确认证据文末“侧栏逐条配置与画布来源选取”。具体引导方案已有确认，实际操作负担和低学习成本仍缺客户试用证据；本问题只保留其余体验验证，不重新询问已确认的侧栏与选取形式。
    options:
      - 先按确认入口完成两类来源的渐进配置，再通过代表性任务试用核对细节
      - 在确认入口保持不变的前提下先补充引导原型并安排制表人员试用
    impact: 不阻塞本轮独立侧栏实现与工程验证；尚未完成客户试用时不得宣称配置学习成本已验证。此收敛不替Q12及Q15-Q17、目录运行契约或其他未决项提供答案，也不恢复集中配置优先。
    visibility: internal
  - id: question.form-projection-cross-form-event-association
    question: 需要描述同一次业务事件时，不同表单的正式记录通过什么稳定身份和范围关联？
    context: DEC-0077-16认可不同表单分别提供指标并汇总同一报表行，但这不确认任意跨表单同事件关联。批次、工单、工序等身份沿执行上下文；相同文本或相同报表行不能单独证明同事件。
    options:
      - 当前只在明确的执行对象与范围按指标分别汇总，不建立同事件关联
      - 为指定业务用途定义受控事件标识及关联契约，再开放跨表单同事件追溯
    impact: 仅阻塞跨表单同事件关联及依赖它的计算，不阻塞本次方向补录；关联确认前不得推定明细可任意连接、自动扣产出或计算良率。
    visibility: internal
  - id: question.form-projection-customer-owned-model-capability
    question: 未来是否开放客户自建业务模型能力，若开放其所有权、校验、版本与维护边界是什么？
    context: DEC-0077-01继续规定当前统计模型由产品方维护，DEC-0077-15允许新增用途二开但不要求全业务零代码；DEC-0077-20/21/34确认MVP追溯项目录配置、预设统计与二期基于已有事实的用户报表设计方向，不等于开放客户自建统计模型。客户自建模型尚未确认，不能从追溯配置、已有事实的报表组合或可维护二开目标推导客户自由建立运行模型。
    options:
      - 继续由产品或受控二开维护业务模型，客户只配置来源
      - 以后另行定义受控客户建模能力，先确认所有权与执行隔离边界
    impact: 仅阻塞未来客户建模能力，不阻塞本次补录、已确认MVP查找路径或产品维护模型范围；自定义报表排二期不关闭本问题，确认前不建设客户规则编辑器或庞大通用规则引擎。
    visibility: internal
  - id: question.form-projection-first-phase-detailed-scope
    question: MVP已明确两类来源、查找项目录路径及预设统计报表，自定义报表和新含义对未关联旧实例的补充覆盖排二期；其余具体交互、能力和阶段出口如何确定？
    context: DEC-0077-19确认子表是交互重点但首期不只做子表，主表分散字段配对也须覆盖；DEC-0077-20/21/34确认MVP目录路径与预设统计、二期基于已有事实设计报表。DEC-0077-24确认新增可用项自动进入两处候选，25将未关联旧实例的新含义补充覆盖排二期。DEC-0077-27允许MVP开发历史直接修复迁移或作废，不要求旧开发数据兼容；未来正确实例按各自快照解释。29确认主表同表单、子表同实际行匹配，不同子表/复杂OR尚未定；30至33进一步确认草稿及缺上下文分支、可空物料批号/单位和保存后过程可查。DEC-0077-40已明确新增日期型预置追溯日期，绑定实际业务日期且不自动取创建时间；九项预置、三默认/其余固定展开、预置不可删除、自定义文本/数字/日期及数字精确与日期范围查询，自定义引用延后。41明确自定义CRUD、先解除配置再删除、关联配置弹窗支持勾选/全选、预览看清字段/子表列位置及历史内容保留，不再把这些范围列为待确认；预览首版平铺不分组是工程选择，不因缺少频率数据推断多处配置少。当前目录切片不代表其余停用/历史目录检索、表头共享、跨表单指标或其余带入生命周期全部定版；正式统计最终完成及A12延期继续适用。
    options:
      - 按已确认MVP范围收敛目录与来源配置契约，其他能力另定阶段出口
      - 在已确认MVP及二期报表边界内补充明确选择的其他能力，并逐项确认依赖与阶段验收
    impact: 不重问两类来源、目录候选、自定义CRUD与选择解除、二期已有事实报表分期、MVP开发历史、已确认匹配粒度、草稿/无上下文分支、批号/单位可空和保存后过程追溯时机。超出文本/数字精确/日期范围的类型与操作符、其余停用/历史目录检索、不同子表/复杂OR在对应实现前处理，Q15仅失效历史、Q16及Q17其余部分保留；未来正确快照不被开发清理取消。本问题不阻塞已确认补录及无依赖切片，不把当前工程范围提升为完整生命周期确认。
    visibility: internal
  - id: question.form-projection-trace-index-effective-scope
    question: 保存或暂存后过程内容可查已确认，失效历史及受控修订/作废视图如何展示与隔离？
    context: 2026-10-10的DEC-0077-33明确成功保存或暂存后可查最新已保存内容，包含草稿、填报中、审批中及完成记录；结果显示状态，未保存输入不参与，正式统计仍等最终完成。Q15生效时点和过程状态范围已收敛，不重复确认；当前工作树在保存事务中更新独立form_trace_value，已取得真实保存到审批再完成的聚焦证据，不引入未确认异步延迟。早期formTrace沿COMPLETED并只查SUCCEEDED是本轮已修正差异。A12延期，失效历史或修订后的当前与历史视图尚未明确。
    options:
      - 在A12切片再定义失效或修订历史的独立查询入口及状态标记
      - 在A12切片定义当前与历史切换的授权视图及明确的来源版本
    impact: 仅阻塞依赖失效历史的A12检索视图，不阻塞已确认保存后过程检索实现；不得继续把过程可查状态或更新时间作为未决，也不提前实现A12或改写冻结配置，未保存输入和无权来源仍不可查。
    visibility: internal
  - id: question.form-projection-trace-result-navigation
    question: 固定业务筛选及表单、DHR正反向组织已明确后，其余跨报表导航与历史版本查询如何呈现？
    context: DEC-0077-38明确四独立页面与原表单定位；DEC-0077-39明确业务固定条件、正向真实关系/反向绑定内容及自定义项、DHR两向和各自条件粒度。正向不依赖内容追溯项，支持来源内有权且满足条件的已保存实际实例可查，模板及未保存输入不可查。DHR反向允许同DHR内不同真实关联表单贡献；完整DHR详情标记命中表单及对应字段/实际行已明确，不再作为待确认设计。DEC-0077-40已明确反向九项预置（含显式绑定业务日期的追溯日期）及三个默认条件、其他固定条件展开和自定义添加入口默认隐藏；反向查询区按最新授权可重新设计，页签形式保持；反向归属与属性区已确认移除且不新增限定范围浮层，正向原布局及列表实际归属展示保持；移除空自定义分组、隐藏非空值计数和错误自动展开属于inferred工程选择，不能写成用户逐字确认。具体正向字段、默认方向及去重/计数仍inferred，实际实现和验证按同包证据更新。其余跨报表导航、冻结版本反向及A12历史视图仍未定；内容命中不建立归属，冠骋GET核心与精确字段标记缺口不由候选推断填补。
    options:
      - 保持独立记录页面、表单与DHR两向含义及直接来源查看，其余跨报表导航仅沿已存在且授权的事实关系另行设计
      - 为指定跨报表场景定义关联与历史视图契约，再增加对应授权入口
    impact: 仅阻塞其余跨报表组织和历史入口，不阻塞已确认业务固定条件、两向查询、各自组合粒度和完整DHR命中定位的实现；查询、总数、命中标记和详情须保持原授权与同一证据依据，不能按内容认领生产/DHR归属，也不由新入口推定冻结历史反向或A12闭环。
    visibility: internal
  - id: question.form-projection-context-prefill-lifecycle
    question: 缺上下文分支已明确后，生产上下文字段自动带入的取值时点、证据持久化、重开刷新、可编辑覆盖及多设备选择如何处理？
    context: DEC-0077-18确认部分字段可配置上下文自动带入，统计事实归属由真实上下文独立确定；DEC-0077-28/30进一步明确有上下文时的所属与无上下文登记边界。无上下文但已设自动带入时给明确提示，未设自动带入时允许填选系统内对象且不自动成为DHR成员，草稿不做阻断性业务校验；这些分支不重问。默认回写、创建/打开/任务绑定取值时点、持久化、刷新覆盖及多设备情形仍待定，身份字段只读或受控修改仍是建议。
    options:
      - 在明确创建或绑定时点复制选定上下文并保留记录值，另行定义刷新、缺失与覆盖规则
      - 先定义打开时辅助显示及持久化边界，再明确刷新、缺失与覆盖规则
    impact: 仅在实现其余带入生命周期与相应证据语义前确认，不重问有上下文所属、无上下文提示或手填登记边界，不阻塞本次目标补录；DHR正式归属的特别业务流程另定，不默认单工序单设备，不以显示文本改写实际身份或生成设备正式使用关系，不改变START/ATTACH_FORM配置冻结与未来正确实例保护。
    visibility: internal
  - id: question.dhr-termination-sop-extra-signature
    question: 具体企业 SOP 是否要求生产对象提前结束动作增加额外电子签名，若要求应由哪项受控配置决定？
    context: DEC-0069 已确认本期只复用现有生产提前结束权限、原因和审计，不新增独立质量审批；企业 SOP 的额外签名要求需结合客户制度、签名责任及配置所有权后研究，不能从法规引用或历史系统行为直接推断。
    options:
      - 企业 SOP 不要求额外签名，沿用现有终止权限、原因和审计
      - 企业 SOP 要求额外签名，后续定义受控配置、责任人、校验与审计契约
    impact: 非本期阻断问题；不改变已确认的同步真实终止、证据保留和普通执行停止政策，也不授权当前实现私自新增审批或豁免既有签署要求。
    visibility: internal
  - id: question.record-control-managerial-reassignment-signature
    question: 记录控制审批的重新分配是否必须额外完成电子签名，还是只要求专门权限、原因和不可变审计？
    context: 阶段一共享命令保留可选 signatureId，但重新分配运行时尚未实现；当前已确认其需要专门权限、目标资格、原因并保持节点和流程路径不变，尚未确认是否以电子签名作为执行阻断条件。
    options:
      - 重新分配必须电子签名，缺少有效签名时阻断动作
      - 重新分配不强制电子签名，但仍记录管理员、原因、原处理人、目标处理人和时间
      - 按已发布流程或租户合规配置决定，并补充配置所有权、默认值和审计语义
    impact: 该问题只阻塞重新分配的签名校验、签名审计字段和发布级验收，不阻塞阶段一候选查询、显式版本启动以及后续权限、原因和目标资格边界实现。
    visibility: internal
  - id: question.record-control-active-form-void-boundary
    question: 活动中的表单记录是否允许发起作废申请，还是必须在作废入口阻断并继续原填报或审批流程？
    context: 本次记录控制设计已确认独立作废申请、P0 审批和来源记录状态保留，但“打开中、已提交待审、已退回或未填报记录”的可作废边界仍需产品确认；不得将阻断建议写成 user-confirmed 规则。
    options:
      - 允许活动记录进入作废申请，但仍必须走 P0 审批
      - 阻断活动表单作废，仅允许已完成记录或误创建记录进入作废申请
      - 分状态分别定义允许条件、替代方案和审批影响后再确定
    impact: 该边界会影响作废候选查询、状态机入口、表单审批流程、DHR 完整性检查和前端动作可见性；确认前不得新增活动表单作废阻断规则。
    visibility: internal
  - id: question.production-work-condition-runtime-source-snapshot-contract
    question: 已确认作业条件第一版字段目录和字段类型，但运行时真实来源、取值快照方式以及目录版本与生产实例快照的绑定契约何时闭环？
    context: 当前目录 work-runtime-fields-v1 开放五个 string 字段，并随分支保存字段显示快照。2026-10-12 内审确认 ProductionExecutionEngine.conditionOutlet 已从冻结 context 读取 sourceType/objectType、sourceNumber/objectNo，固定设置 workType=WORK、triggerType=OPERATION_START、executionStatus=RUNNING，并把本次取值写入节点 conditionFacts；生产执行已有 snapshot_json/state_json。固定取值、取值时点及来源版本的完整业务含义仍未确认，节点工作数据也不等同于完整不可变求值证据包；问题继续保留，不能再声称所有来源和快照均未实现。
    options:
      - 由生产作业运行上下文提供五个字段，并在作业实例创建时绑定来源值快照
      - 由生产对象或工序上下文提供五个字段，并在作业实例创建时绑定来源值快照
      - 待确认各字段的真实来源、取值时点、快照存储位置和历史数据迁移策略
    impact: 在来源、取值时点和快照绑定契约闭环前，不能声称字段可被生产运行时可靠读取或进入作业实例执行快照；该问题影响字段目录兼容、历史解释和审计追溯。
    visibility: internal
  - id: question.production-work-condition-runtime-evaluation-contract
    question: 结构化条件 AST 的求值、执行结果、异常处理和条件节点推进契约应如何落地？
    context: 当前 ProductionExecutionEngine.evaluate 已在受限 WORK 执行中解释 all/any/not 和七个 string 运算符；conditionOutlet 按数组顺序选首个命中，否则使用默认分支，finishNode 记录 decisions 并按出口推进；未知字段和运算符会抛业务错误。完整异常政策、通用类型比较、规则版本与动作及审计证据契约仍未闭环；本次只静态核对实现，不把该局部求值器提升为通用规则运行层或 verified/runtime 验收。
    options:
      - 由产品内核规则引擎按目录版本解释 AST，并返回满足/否则确定性结果
      - 由作业运行时编排器解释 AST，并将结果转换为条件节点出口事件
      - 待确认求值器所有权、异常语义、类型比较规则和执行审计要求
    impact: 该问题影响条件节点运行、出口推进、失败处理、执行契约注册、作业实例快照解释和发布级验收。
    visibility: internal
  - id: question.production-work-condition-branch-model
    question: 条件分支配置闭环后，动态出口与运行时分支结果如何绑定到实际节点和连线事件？
    context: 条件节点的有序分支、唯一否则分支及每出口最多一条线已经确认。当前受限运行由 conditionOutlet 返回命中或默认出口，finishNode 写入 state.decisions 并按 sourceHandle 选择后继；已有局部实现不等于结果事件版本、完整异常处理及不可变执行审计契约均已确认，后者仍需在相关功能开发中核对。
    options:
      - 由已发布条件分支数组动态决定出口集合，并将每个出口映射为单条实例推进事件
      - 由运行时编排器统一转换命中分支和否则分支结果，再推进对应目标节点
      - 待确认分支结果事件、目标节点绑定、异常处理和执行审计字段
    impact: 配置层分支数量和出口基数已确认，但在运行时事件、目标节点绑定和异常审计闭环前，不得把条件分支求值或节点推进标记为 verified/runtime。
    visibility: internal
  - id: question.multi-tenant-workflow-isolation
    question: 启用多租户时，工作流数据和运行时操作的租户隔离契约如何统一落地？
    context: 当前 eDHR 按一个默认租户运行，本次 MVP 不实现完整租户隔离。DEC-0081在2026-10-20只确认通用工作流和普通生产表单显式委托的目标限同租户正常可用用户；该局部目标资格不等于工作流全域租户隔离已实现，也不关闭本问题。未来多租户必须统一处理认证租户上下文、工作流定义与绑定、流程实例、任务、候选快照、主体解析、仓储查询、控制器授权和引擎按 ID 操作，不能仅靠某个查询接口的tenant_id条件宣称完成。
    options:
      - 启用多租户时为全部工作流实体补充租户归属，并由认证上下文强制约束所有查询和运行时操作
      - 待确认租户上下文来源、历史数据迁移、跨租户管理员边界和审计字段后统一设计
    impact: 这是非 MVP TODO，不阻塞当前默认单租户工作流交付；在契约闭环前不得宣称工作流已具备多租户隔离或直接进入多租户生产发布。
    visibility: internal
