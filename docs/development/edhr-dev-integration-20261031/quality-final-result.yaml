    - id: risk.scope-and-deferred-capabilities
      description: 本结论为开发环境集成与人工验收准备；完整DHR变化比较/未覆盖矩阵、放行判断、完整A12、归档、独立DHR变更申请及打印作废过滤仍按既有范围暂缓。
      impact: 不得解释为完整业务链路、生产发布、法规CSV或全部历史知识语义审计通过。
      mitigation: 保持现行知识成熟度与未决项；后续相关功能另行确定范围并验收。
    - id: risk.destructive-main-flow-not-executed
      description: 为保留用户人工样例，本轮没有在edhr_dev执行批准、改派、转办、撤回、保存草稿或重置；分类浏览器使用受控API。
      impact: 主环境证明正常读取与入口可用，业务变更正确性由独立真实PG和其他已核对测试证明，不能声称主库八场景均已消费式E2E通过。
      mitigation: 用户按验收README进行人工动作；动作会改变样例状态，必要恢复前先保存验收结果，禁止用源库整库覆盖主库。
    - id: risk.post-gate-delivery
      description: 远端push及指定旧工作树移除在本报告时尚未发生；分支保护/ruleset必需检查未由本实例核验。
      impact: 本报告不能证明远端已更新、清理已完成或仓库具强制服务端门禁。
      mitigation: 主侧在通过后只提交交付文档/证据、重新确认目标并非强制推送，随后通过授权工具移除指定工作树并保留回执；目标或产品变动须重新评估检查范围。
  blockingConditions: []
