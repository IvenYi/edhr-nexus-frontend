  acceptanceScenarios:
  - id: scenario.quantity-amendment-withdraws-unconfirmed-eligibility
    given: 0d46558 的两个 implemented 组合规则把 >0 写成当前规范，而下限证据不足
    when: 读取本次补正后的规则、词表和开放问题
    then: 两规则为 deprecated/internal，历史 AST 与结果保持原样且不能作为当前准入依据；数量下限明确待决，没有另建生效的 >=1 或 >0 替代规则。
    evidenceRequirements: [结构差异核对, 状态投影检查, 独立语义复核]
  - id: scenario.quantity-amendment-retains-confirmed-boundaries
    given: DEC-0012/0014 及现行实现分别提供已确认业务范围和实际校验行为
    when: 完成知识资格补正
    then: 原已确认声明与相关服务、页面、SQL、数量事实条目不变；必填、余数分配、SN=1、整数批次数及总量约束继续保留。
    evidenceRequirements: [精确文件及 ID 差异, 原始决策和源码定位]
  - id: scenario.quantity-amendment-preserves-audit-history
    given: 初次审计在 0d46558 留存 2292 个原始 ID 及当次候选结论
    when: 在同一 PR 增加此次补正
    then: 原账本、内容摘要和质量回执保留；数量结论的纠正用独立修订记录与当前入口明确说明，旧脚本只验证其历史候选。
    evidenceRequirements: [固定历史快照验证, 当前增量验证, 新独立质量结果]
