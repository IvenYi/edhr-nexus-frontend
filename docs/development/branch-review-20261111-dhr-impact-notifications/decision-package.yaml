  acceptanceScenarios:
    - id: scenario.dhr-effective-source-notification-matrix
      given: 自有canonical PG、真实冻结版本和记录控制申请；旧双在审及旧提交身份情况明确限定为存量fixture
      when: 变更/作废真实批准、事件重投或个人读取/已读
      then: 只投给原规则定义的账号集合，未知身份不猜，事件幂等且原件/历史保留，越权不写；性能证据可重算，不擅自改变业务或优化
      evidenceRequirements: [真实原生运行/HTTP/SQL与候选字节绑定, 原冻结和状态前后摘要, 原规则及历史去重, 本体/知识精确同步, 全新独立验收, 全部FINAL后实际PR前漂移复核]
