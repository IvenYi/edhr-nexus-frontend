decisionPackage:
  id: DEC-PACKAGE-AUDIT-DHR-ATTACHMENT-WRITE-20261102
  scope: DHR附件登记前写入失败所有权及保持下载响应语义的有界流式摘要
  knowledgeBaselineVersion: 0.3.25
  contractBaseline:
    sourceCommit: 320a4c74717dd913d44d6e01e6c5a6f2993d4695
    targetBranch: edhr-dev
    targetCommit: e3e49784eda6bc01e7e5c686d6f79dc5a600d5ae
    contractReadCommit: e3e49784eda6bc01e7e5c686d6f79dc5a600d5ae
    uncommittedContractPaths: []
  summary: PR53已合入且整树同2a0d9fd2，无外部增量；先修登记前当前残片并验证碰撞保护。用户随后明确若体验无差异就做流式摘要；按条件新增独立小提交，完整SHA后再输出、响应字节/头/资格不变，查询/索引不改。原601独立通过仅作初候选，组合重新fresh验收。
  confirmed: {concepts: [], relationships: [], rules: [], executionContracts: []}
  inferred:
    - id: inference.dhr-attachment-owned-write-failure
      statement: CREATE_NEW成功取得写入流后才拥有当前新文件；写入或关闭IOException应清理本次残片，创建失败不能删除原有路径。
      rationale: 文件所有权与登记前失败的工程一致性，不改变业务历史保留或删除资格。
      relatedIds: []
    - id: inference.dhr-attachment-cleanup-primary-error
      statement: 清理失败须记录ID/path并作为suppressed保留，不替换最初写入错误，不返回成功。
      rationale: 未登记前没有事务回调可依赖，原始故障及残片须可定位。
      relatedIds: []
    - id: inference.bounded-download-digest
      statement: 用8KiB缓冲流式计算完整SHA256，比较通过后再返回原资源；保留两遍逻辑读取、文件名/响应头/字节及损坏输出前拒绝，不改变UI或业务资格。
      rationale: 用户本轮条件授权原话为“如果对用户来说没什么体验差距，那么就做流式摘要优化”；已在独立树完成127及12组观测/响应头断言，单独提交整合。该授权是工程选择，不新增本体业务政策。
      relatedIds: []
  unresolved: []
  replacementScopes: []
  impactAnalysis:
    level: L2
    directImpacts:
      - area: upload-write
        change: 仅本次已创建流的写入/关闭失败补偿，保留创建碰撞路径。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrAttachmentService.java]
      - area: download-digest
        change: file中的SHA改为Path流式完整读取；verify仍保留解析所需byte[]，完整校验先于输出，原错误映射/控制器/页面不变。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrAttachmentService.java]
    transitiveImpacts:
      - area: registration-audit
        change: 写入失败时不进入附件登记/LINK审计；既有提交/回滚/UNKNOWN回调保持。
        evidenceReferences: []
      - area: summary-review-and-archive-readers
        change: DhrSummaryService附件集合/提交核验、DhrArchiveService取得原件及任务下载间接复用file()，其摘要阶段也有界；完整SHA、审批/冻结资格、锁与输出规则保持。原27个DHR邻接用例为有限回归，不称全链路认证。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrSummaryService.java, gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrArchiveService.java, gmp-platform/backend/src/main/java/com/zencas/edhr/production/controller/DhrReviewController.java]
    potentialImpacts:
      - area: cleanup-and-crash
        concern: 清理失败或进程崩溃仍可能遗留原件，日志不等于持久对账；无事务直接调用仍另审。
        evidenceReferences: []
      - area: download-capacity
        concern: 在自有测试库对比优化前后当前/冻结有效/损坏50MiB和1/4/16并发，查询/逻辑读取/分配/堆/延迟仅代表该环境，不承诺单次更快或生产SLA。
        evidenceReferences: []
    unaffectedAreas:
      - area: retained-policy
        change: 不改变格式/50MiB/元信息、SHA256含义、资格、核验、解除保留历史、冻结版本成员、HTTP权限、响应字节/文件名/头、数据库查询/结构/索引或页面。
        evidenceReferences: [docs/knowledge/decisions/DEC-0063-dhr-summary-and-review-configuration.yaml]
    compatibilityAndMigration: []
    snapshotImpacts: []
    auditImpacts:
      - area: failure-diagnostics
        change: 补偿只留技术日志/原异常，不补造历史LINK审计或恢复记录。
        evidenceReferences: []
    permissionImpacts: []
    testImpacts:
      - scope: owned-stream-faults
        scenarios: [部分写入IOException, 完整写入后关闭IOException, 清理失败, 已有文件/目录碰撞保护, 既有事务/附件回归]
        evidenceReferences: []
      - scope: download-compatibility-and-capacity
        scenarios: [当前/冻结, 有效/损坏, 50MiB, 并发1/4/16, 实际查询和内存前后观测, 完整输出SHA一致, 文件名/下载类型/ContentType/nosniff保持]
        evidenceReferences: []
    evidenceGaps: [流故障注入不等于真实磁盘耗尽或网络故障, 表/版本投影测试不等于完整迁移/HTTP/浏览器验收, 无跨资源原子/崩溃持久对账或完整幂等, 查询复用及更多性能取舍另议, 所有旧high/全审队列保持]
  extensionStrategy:
    selectedPaths: [transaction-orchestration, product-core]
    rationale: 当前服务局部所有权补偿和私有Path摘要重载，不新增存储框架、业务状态或重试，不改既有byte[]解析或页面。
    ownershipBoundaries:
      - owner: DhrAttachmentService.upload
        responsibility: 当前新文件的写入/关闭及登记前失败清理。
  affectedFiles:
    - path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrAttachmentService.java
      changeType: update
      reason: 防止登记前写入/关闭失败遗留本次残片，保护既有碰撞路径。
    - path: gmp-platform/backend/src/test/java/com/zencas/edhr/production/service/DhrAttachmentWriteFailureTest.java
      changeType: create
      reason: 真实文件字节配合流IOException注入及创建碰撞控制。
    - path: gmp-platform/backend/src/test/java/com/zencas/edhr/production/service/DhrAttachmentDownloadCapacityPostgresTest.java
      changeType: create
      reason: 自有原生PG下比较完整流式摘要前后容量，并核对下载响应与业务校验保持。
  acceptanceScenarios:
    - id: scenario.owned-write-failure
      given: 合法附件且尚未登记数据库
      when: 创建失败或本次创建成功后写入/关闭失败
      then: 仅清理本次残片，保留既有路径及原错误；无附件登记或LINK审计。
      evidenceRequirements: [同源旧断言红, 当前正负控制, 全新独立最终质量]
    - id: scenario.download-observation
      given: 自有测试库当前/冻结50MiB附件
      when: 有效或损坏文件的并发1/4/16读取
      then: 记录前后实际查询/分配/逻辑读取/堆/耗时且保持完整摘要、响应与冻结成员；仅按用户本轮条件授权实现流式摘要，更多方案另议。
      evidenceRequirements: [原始指标/命令/环境, 明确进程内与真实HTTP/生产SLA的区别]
