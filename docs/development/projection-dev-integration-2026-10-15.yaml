  impactAnalysis:
    level: L2
    directImpacts:
      - area: knowledge-integration
        change: 对齐0.3.25/schema1.2.0；处理投影ID、类型、引用、当前定义及声明级替代范围，保留目标治理与批次数量下限待决。
        evidenceReferences: [AGENTS.md, docs/agents/agent-handoff-contract.md, docs/development/ontology-foundation-repair.md]
      - area: execution-integration
        change: 合并正式投影/过程索引与目标批次自定义表单归属、补填原因、认证主体及文档安全修复。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/ExecutionSnapshotBuilder.java, gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/FormInstanceRecordService.java, gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/ProductionExecutionEngine.java, gmp-platform/frontend/src/pages/production/ProductionExecutionPage.tsx]
    transitiveImpacts:
      - area: source-ownership
        change: 原始表单、过程内容索引、正式业务事实、真实归属、DHR证据与审计仍保留各自来源、时点和权限；合并不以内容文本改归属。
        evidenceReferences: [docs/knowledge/decisions/DEC-0077-form-traceability-projection-ownership.yaml, docs/knowledge/decisions/DEC-0075-custom-form-scope-and-record-completeness.yaml]
    potentialImpacts:
      - area: merged-regression
        concern: 自动合并可能保留旧假设或遗漏新认证、批次共享表单与直接填报分支，须用聚焦测试和源码核对发现并修复。
        evidenceReferences: []
    unaffectedAreas:
      - area: final-output-runtime
        reason: 仅保存调研TODO，未确认的必配/基数、回写时点与历史补算不在本次实现范围。
    compatibilityAndMigration:
      - area: initialization-and-history
        change: 核对投影初始化及迁移纳入主清单、测试在独立库执行；不迁移或回写当前8087运行库，不上传本地模拟或未跟踪output。
        evidenceReferences: [gmp-platform/backend/src/main/resources/db/changelog/db.changelog-master.yaml]
    snapshotImpacts:
      - area: execution-snapshots
        change: 保留目标表单归属/资料齐套及投影绑定冻结，两者不能相互覆盖；正确历史继续按各自冻结配置解释。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/ExecutionSnapshotBuilder.java]
    auditImpacts:
      - area: projection-audit
        change: 保留实际操作者/签署者、配置解除与目录CRUD审计，不补造历史验收；历史研究的旧ID以来源提交和映射说明解释。
        evidenceReferences: [docs/knowledge/evidence/form-traceability-projection-ownership.yaml]
    permissionImpacts:
      - area: source-access-and-identity
        change: 保留目标账号精确身份及主体范围修复，投影报告与DHR详情继续按来源权限授权，不能用报告权限绕过。
        evidenceReferences: [gmp-platform/backend/src/test/java/com/zencas/edhr/production/controller/TraceReportAuthorizationTest.java]
    testImpacts:
      - scope: actual-merge-candidate
        scenarios: [知识结构与类型及引用, 业务配置与正式投影, 最近保存过程查询, 正反向及DHR匹配, 目录预置与自定义解除, 批次自定义表单归属, 认证主体与按钮签署, 前端构建与相邻回归, 独立数据库迁移]
        evidenceReferences: [tools/knowledge-model/pom.xml, .github/workflows/frontend-review-regression.yml]
    evidenceGaps:
      - 不将目标分支历史全量内审覆盖率套用到投影新增资产；本轮按投影及实际集成影响范围增量核对。
      - 本地验收不证明远端分支保护或必需检查已启用；本轮不改变仓库管理设置。
  extensionStrategy:
    selectedPaths: [configuration, product-core]
    rationale: 保留双方既有标准能力与领域所有权，修复集成接缝；不新增客户分支或通用规则引擎。
