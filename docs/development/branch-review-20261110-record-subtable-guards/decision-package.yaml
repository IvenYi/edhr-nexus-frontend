  scope: W3/W5 record-control proposed revision signature ownership; W6 robustness/A23 and W7 incremental audit
  knowledgeBaselineVersion: 0.3.25
  contractBaseline:
    sourceCommit: 0701b3d5d99787195e9d4c33935ae36da370839d
