      reviewer: 01a0e418-6775-73c0-9a7c-994fb9878f29
      report: /tmp/dhr-print-independent-qa-result.yaml
      findings: [QF-PRINT-001高风险Word选项省略未拒绝、QF-PRINT-002选定范围丢失来源审计签名索引]
      remediation:
        - 共享预览增加统一字段DOM标记，打印检查覆盖网格和Word全部字段后代；Word长下拉选项补失败闭合回归，不仅检查input。
        - 部分导出保留所选记录的来源身份及所属生产对象审计/签名的标识、人员、时间和摘要索引，剔除可能含未选字段的原始载荷；明确对象级上下文不是实例专属证据，完整验签载荷查完整DHR。仅选汇总附件时不带生产表单追溯。
      disposition: 原质量实例未参与修复并已关闭，修复完成后交全新L2质量实例复验。
    qualityResult:
      result: passed
      reviewer: 01a0e424-1ca4-77f3-a2da-4f6439ced541
      baseCommit: dcbc67864147750579b8328da28c45d380798693
      headCommit: dcbc67864147750579b8328da28c45d380798693
      workingTreeState: dirty
      report: /tmp/dhr-print-final-qa-result.yaml
      resolvedFindings: [QF-PRINT-001, QF-PRINT-002]
      detail: 全新且未参与修复的质量实例独立复跑48项后端、59项知识校验、11项前端测试及构建；真实Chrome配合隔离mock完成导出修订5组、相邻导航7组回归；重新生成3份真实冻结模板及长表/横向Word等PDF并目视检查。无阻塞发现，实例已关闭。
      limitations: [真实数据库只读取冻结样例，业务写入使用H2和mock；未执行Docker/Nginx运行验证、生产容量或实际业务全链验收；不覆盖并行按钮签署及旧迁移。]
    residualLimitations:
      - 本机无Docker，容器构建、部署网关超时和生产容量尚未实测。
      - 冻结字段超出版式时明确阻断，不在导出时静默修改旧版式；复杂版式仍需按客户模板验收。
      - 缺少冠骋平台打印合并实现，不将本产品按来源单表PDF结构描述为已核实的竞品实现。
    validationStatus: passed
  officeAttachmentSupport:
    executionLevel: L2
    knowledgeBaselineVersion: 0.3.24
    confirmed:
      - user-confirmed：新增DOC/DOCX/XLS/XLSX原文件上传下载，不做Office在线编辑或预览；保留PDF/PNG/JPEG。
      - user-confirmed：单个附件上限50MB（50*1024*1024字节，含边界）。
      - 受控附件核验、摘要、权限、冻结引用和解除关联保留历史原件的规则不变。
    inferred:
      - 文件扩展名与内容结构共同校验，不信任客户端MIME；加密、宏和无法解析的Office文件拒绝，格式检查不等于病毒扫描或人工核验。
    unresolved: []
    impactAnalysis:
      level: L2
      directImpacts: [DHR附件上传格式与50MB边界、选择控件和提示、修复附件API继承JSON请求头造成的非multipart上传]
      transitiveImpacts: [附件核验读取、单件下载原文件名、冻结ZIP中Office扩展名、Nginx请求体限制]
      potentialImpacts: [Office解析内存和压缩展开开销，限制压缩展开总量；外部部署网关仍需核对]
      unaffectedAreas: [eSOP及通用上传业务规则、生产记录、表单在线编辑、汇总审批与放行规则]
      compatibilityAndMigration: [新增迁移扩容mime_type为128字符，不重写已应用迁移、不修改既有附件字节或摘要]
      snapshotImpacts: [快照结构不变，记录真实Office MIME及原文件名；ZIP原样输出]
      auditImpacts: [沿用LINK/VERIFY/UNLINK及导出审计，不改事件语义]
      permissionImpacts: [保持汇总编辑权与审批任务冻结附件授权]
      testImpacts: [四种Office合法上传核验下载及ZIP、伪造格式和加密宏拒绝、50MB与超限、MIME字段迁移、浏览器上传下载与只读回归]
      evidenceGaps: [未引入恶意软件扫描服务；自动格式检查不能证明内容无恶意或证据合格]
    extensionStrategy:
      selectedPaths: [product-core]
      rationale: DHR标准附件能力，复用现有POI依赖，不增加客户分支或新文件存储子系统。
      ownershipBoundaries: [DHR附件服务负责格式和证据保留，下载控制器负责文件名，ZIP服务负责冻结输出，前端负责选择和提示]
    implementationChecks:
      - 后端已用真实DOC、生成DOCX/XLS/XLSX验证原件上传、人工核验状态、单件下载及完整/混选/附件单选ZIP，字节一致且保留冻结解除关联规则。
      - 50MiB含边界通过、超限读取前拒绝；伪造格式、宏、加密、损坏Office及100MiB以上ZIP展开拒绝。
      - 独立临时PostgreSQL验证0105扩容、既有数据不变和事务回滚；独立复验后本机开发库已由Liquibase正式应用0105。
      - 前端构建通过；真实Chrome配合HTTP mock检查multipart文件名和字节、四种Office原件下载、超限请求不发送及冻结只读/导出权限回归；不是实际用户档案写入。
    ontologyResult:
