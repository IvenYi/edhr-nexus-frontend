  confirmedUiRefinements:
    - 使用分段按钮区分档案目录/按来源，仅来源视图显示来源分类；不改变选择身份和未保存保护。
    - 汇总及冻结查看的附件入口切换右侧主内容为附件列表，沿用原上传信息、核验、下载及带原因解除关联，不物理删除历史文件；其他工作区不新增写权。
    - 冻结版本导出统一入口支持完整ZIP或跨来源实例与附件混选，显式标记部分范围，切换版本清空选择，不改变证据范围。
    - 发起修订在列表操作栏使用带提示的纯图标，冻结查看头部直接显示按钮；基于最新定版创建新草稿、保留旧版、重新提交并按配置审批，技术动作和权限不变。
    - 四工作区统一档案目录与按来源两种视图；来源分类显示批记录模板、作业表单、自定义表单。填报默认按来源，其余默认档案目录。
    - 整理是档案目录的编辑状态，完成整理返回档案浏览并保留选中实例；来源身份不变、同一实例不重复计数。
    - 默认作业与自定义区域可折叠，零份仍显示紧凑入口及空态；整理后只保留未调整位置的实例，来源视图始终保留全部。
    - 审批及定版查看的两种视图仅使用同一冻结版本；填报仍展示当前生产记录及已有展示编排，不增加整理或上传权限。
    - 覆盖 DHR 管理下相似工作区的公共标题、间距和导航样式；审批保留冻结档案树，不增加汇总专属整理或上传动作。
    - 导航统一称 DHR 导航，压缩标题留白；范围说明移至工作区头部。
    - 整理目录入口放在导航标题行，返回浏览保留当前实例；模式和实例栏以短过渡切换并支持减少动态效果。
    - 附件入口放在导航底部独立行，不增加第四种表单来源；零附件仍可打开，权限与冻结范围不变。
    - 移除业务工作区重复 DHR 数据审计入口，保留四列表行详情数据审计；表单实例日志以表单管理为主入口，本轮不新增实例日志界面。
