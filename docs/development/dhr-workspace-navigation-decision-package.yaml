decisionPackage:
  id: DEC-PACKAGE-20260927-DHR-WORKSPACE-NAVIGATION
  scope: dhr-workspace-navigation
  knowledgeBaselineVersion: 0.3.24
  summary: 原位修正 DHR 查看、填报、汇总导航与目录整理交互
  confirmed:
    concepts: []
    relationships: []
    rules:
      - id: rule.dhr-workspace-source-placement-display
        name: 来源与档案位置分离展示
        status: specified
        trigger: dhr.workspace.browse
        condition:
          all:
            - fact: evidence.originKind
              operator: exists
              value: true
        result:
          type: display
          description: 同一实例保留来源身份，整理目录只改变展示位置；来源和档案位置都可找到记录且总数不重复。
        sourceReferences: [docs/knowledge/decisions/DEC-0063-dhr-summary-and-review-configuration.yaml]
    executionContracts: []
  inferred:
    - id: inference.dhr-workspace-shared-components
      statement: 三页复用来源导航、表单行与实例窄栏；整理模式使用相邻来源与目录面板，窄屏允许收起预览。
      rationale: 落实用户确认的布局一致性、短距离拖拽及多份实例可发现性。
      relatedIds: [DEC-0063, DEC-0068]
  unresolved: []
  revisionPrintableExport:
    executionLevel: L2
    knowledgeBaselineVersion: 0.3.24
    confirmed:
      - user-confirmed：列表修订入口使用符合统一规范的纯图标及提示，查看弹窗直接显示发起修订，不再藏在更多菜单。
      - user-confirmed：修订基于最新定版新建草稿，旧版不覆盖；草稿及历次冻结版本可切换，旧版只读及可导出。
      - user-confirmed：导出选择按冻结档案目录展示，支持完整及自定义范围、目录/组/实例勾选。
      - user-confirmed：ZIP使用中文目录，总DHR为可打印PDF，单表PDF按来源分类；表单内附件放在对应实例的附件目录，汇总附件单独放根目录汇总附件。
      - user-confirmed：附件内容不并入总PDF，只保留附件索引和ZIP原件，Office不转码、不在线编辑。
      - 总PDF按冻结档案目录顺序，所有输出使用同一冻结版本；JSON保留在追溯资料，不能用当前值代替冻结值。
    inferred:
      - 使用现有React版式渲染组件及离线服务端Chromium打印，PDFBox合并；不另写一套表单布局解释器。
      - 表单文件按冻结字段引用识别，校验不可覆盖的文件对象元数据和原件，缺失或摘要不符阻断导出。
      - 自定义范围带出选中表单的字段附件，不额外带出未选实例的字段数据或附件。
    unresolved: []
    impactAnalysis:
      level: L2
      directImpacts: [DHR列表及汇总工作区修订入口、版本选择、导出勾选树、PDF及ZIP结构]
      transitiveImpacts: [模板共享预览组件的独立打印构建、文件对象读取、服务器浏览器运行依赖]
      potentialImpacts: [长表单分页与嵌套子表版式、字体可用性、导出内存与处理耗时]
      unaffectedAreas: [生产执行和放行规则、电子签名语义、汇总审批配置、Office上传格式及50MiB限制]
      compatibilityAndMigration: [不覆盖既有冻结版本，不新增旧证据模型分支；缺少原件/版式的快照应明确拒绝而非伪造PDF]
      snapshotImpacts: [冻结记录和版式作为唯一内容来源，归档位置与来源身份分离，当前草稿不得污染历史PDF]
      auditImpacts: [继续记录版本及范围导出审计、文件摘要清单；修订原因及旧审批历史保留]
      permissionImpacts: [沿用reorganize和export权限及后端授权，不因新增入口放宽权限]
      testImpacts: [旧版查看/导出与新草稿切换、树勾选及搜索、ZIP中文路径和去重、单表/总PDF页数和版式、字段附件完整性及篡改拒绝、选定范围边界]
      evidenceGaps: [冠骋所给源码仅包含打印任务和实例选取适配，平台合并及ZIP实现不在源码内；参考ZIP证实总PDF，未证实其按来源单表PDF结构]
    extensionStrategy:
      selectedPaths: [product-core]
      rationale: 标准冻结档案输出与修订能力，复用预览组件、PDFBox和文件存储，不引入客户条件分支。
      ownershipBoundaries: [DHR服务负责版本/范围/附件校验及ZIP，离线打印入口只渲染已授权冻结数据，前端负责导航与选择]
    acceptanceScenarios:
      - 发起修订后可在当前草稿和V1间切换；V1保持只读，可独立导出。
      - 档案中跨来源调整位置的记录在总PDF按档案顺序，在ZIP按原来源归档，不重复计数。
      - 单表附件和汇总附件原件独立保存，总PDF只有附件索引；选定范围有明确非完整标识。
      - 缺失或被修改的原件、无法渲染的冻结版式阻断输出，不返回看似成功的残缺ZIP。
    implementationChecks:
      - 前端构建及11项导航/详情投影测试通过；真实Chrome配合mock接口验证目录半选、混选导出、跨版本重置、行图标修订、当前草稿/V1切换、旧版只读和权限。
      - 后端PDF、原件解析、ZIP、修订持久化与权限聚焦测试通过；包含总PDF不合入附件、原件字节一致、字段附件随选中实例输出、伪造/损坏/跨对象原件拒绝。
      - PDF实测横向Word、长表60行分页、字段溢出拒绝、外部网络资源拒绝；只读查询开发库唯一当前定版的3份表单完成原版式PDF生成与目视检查，未执行真实业务修订或导出审计写入。
      - 2026-09-28 02:33修复后本机8081后端重启为PID49877，启动及API文档HTTP200；日志/tmp/dhr-print-runtime.JSOz8u/backend-final.log；没有新增数据库迁移，134个已应用变更集不变。
      - 独立发现修复后主实现再验48项聚焦后端检查（含7项PDF及只读真实3表）、前端构建与浏览器5组回归通过；源码及模板预览字段标记不改变生产记录。
    ontologyResult:
      result: updated
      reviewer: 01a0e3ff-93e1-7330-a6d3-5fdc9e5797ba
      baselineBefore: 0.3.24
      baselineAfter: 0.3.24
      report: /tmp/dhr-print-ontology-result.yaml
      detail: 11份知识资产原位同步，181份YAML解析及59项知识校验通过；规则保持specified/internal，不冒称整体法规或发布验收；实例已关闭。
    firstQualityResult:
