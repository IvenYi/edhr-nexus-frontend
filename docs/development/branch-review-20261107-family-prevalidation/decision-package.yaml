  summary: PR73已人工合入且整树同ffc8e443，无额外代码/知识/契约增量。落实用户对call_dad21472bffe4d2d8d878fa7adb7c04e明确批准的下一批预校验批读，仅在原成员Service内按有界512ID读取选中物料/类型/当前tenant成员，保留输入去重顺序、首个资格和冲突错误、第二轮即时成员复核、原写入/审计/事务及唯一索引。512是每次SQL参数边界，非总选择上限。原事件日志数据库分页未获答复、不实施；不改候选选项页全载或其他性能子项。
