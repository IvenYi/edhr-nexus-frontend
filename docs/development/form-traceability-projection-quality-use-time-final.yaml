  checks:
    - id: qa-final-template-save-authorization
      required: true
      category: security
      description: 全新实例复验设计保存方法权限拦截、缺权时不触发存储，合法保存仍可用。
      method: automated-test
      command: "PROJECTION_TEST_DATABASE_URL=jdbc:postgresql://localhost:5432/edhr_form_projection mvn -q -Dexec.skip=true -Dtest=TemplateProjectionAuthorizationTest,TemplateModelingControllerTest test"
      outcome: passed
      evidence:
        - "TemplateModelingController.saveFormTemplateVersionDesign 显式 @PreAuthorize('master-data.form-templates')；实际 SecurityConfig 开启 @EnableMethodSecurity。"
        - "Spring 代理测试用仅有 form-instances.view 的主体得到 AccessDeniedException，verifyNoInteractions(forms) 确认拒绝发生在仓储调用前；两套测试共39项通过。"
        - "Chrome 管理员账户点击已使用的虚构模板 V1 保存，独立库 form_template_version 980012 updated_at 更新为 2026-09-29 14:58:58.009355；该测试未冒充低权限 HTTP 账户。"
    - id: qa-final-snapshot-contract
      required: true
      category: integration
      description: START/ATTACH_FORM 使用时复制当时映射，旧实例与后续模板编辑隔离，完成只读冻结来源。
      method: automated-test
      command: "PROJECTION_TEST_DATABASE_URL=jdbc:postgresql://localhost:5432/edhr_form_projection mvn -q -Dexec.skip=true -Dtest=FormProjectionInterpreterTest,FormProjectionPostgresTest,FormProjectionAuthorizationTest,TemplateModelingControllerTest,TemplateProjectionAuthorizationTest,FormFillSnapshotTest,ProductionExecutionEngineTest,BusinessKnowledgeModelTest test"
      outcome: passed
      evidence:
        - "8 suites、139 tests、0 failures、0 errors、0 skipped；其中真实 PostgreSQL 7 项。"
        - "ExecutionSnapshotBuilder.build 在首次 START 获取所绑表单模型；customForm 在 ATTACH_FORM 获取当前版本，validate 后复制映射。ProductionExecutionService 将快照存入 snapshot_json，后续动作读取已存快照。"
        - "FormProjectionPostgresTest 编辑模板后旧快照仍取 lot1、新使用取 lot2，旧表单完成投影 L1；坏映射阻断新使用。FormInstanceRecordService 和 FormProjectionService 从执行快照入完成事件。"
