        - "选中物料批号一后，左侧面板滚动至填写限制、验证规则及查看效果；截图 /tmp/edhr-projection-final-qa-scroll.png。"
        - "追溯与统计弹窗仅有校验并预览、保存配置，无发布并冻结按钮。"
