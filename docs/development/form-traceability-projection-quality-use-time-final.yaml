      severity: high
      scope: 表单模板设计与追溯映射配置权限
      summary: 修复前任意登录用户可调用设计保存接口改写未来来源映射；本次已复验解决。
      reproductionSteps:
        - 以缺少 master-data.form-templates 权限的已认证主体调用设计保存方法。
        - 验证权限异常及仓储没有被调用，再由合法管理员通过浏览器保存虚构 V1。
      expectedResult: 缺权主体在存储前遭拒；合法主体仍可编辑并保存已使用的模板版本。
      actualResult: Spring 方法安全代理抛 AccessDeniedException，仓储无调用；管理员保存更新隔离库 V1。
      evidence:
