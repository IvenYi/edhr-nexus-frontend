  findings:
  - id: W2-F001-SAVE-ACK
    severity: high
    scope: shared React form designer save acknowledgement
    summary: 保存A成功把未发送B误标为已保存，可能无提示关闭丢失B；候选已修复并独立验证。
    reproductionSteps:
    - 使用9542原始Shell/store和最终同一脚本，真实F2键盘输入A并发起保存。
    - 保存等待中真实编辑为B，再完成A请求并点击关闭。
    expectedResult: B未发送应继续dirty并显示未保存确认；仅再保存B成功后解除。
    actualResult: 旧组件closed=1而预期0；6db候选closed=0显示确认，重试保存B、undo/redo、失败及跨模板/版本store边界通过。
