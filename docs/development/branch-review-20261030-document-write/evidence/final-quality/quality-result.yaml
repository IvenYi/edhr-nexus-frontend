  residualRisks:
  - id: risk.partial-deletion-and-files
    description: 授权/原子性测试用真实五类实体仓储，但产品绑定repo为mock、删除Aspect未装配、文件只有合成元数据。
    impact: 不能认证完整生产引用/删除图、多租户或磁盘文件内容。
    mitigation: 按真实生产guard与文件领域后续单独验证；当前仅静态确认methodsecurity200先于删除Aspect1000。
  - id: risk.schema-environment
    description: freshORM为H2，PG为自建16.15/en_US.utf8合成库；生产Liquibase/完整迁移未回放，父code修改不执行历史数据修复。
    impact: 不等同生产schema/部署全链认证。
    mitigation: 保持ddl-auto:none与已有canonical，实际发布按风险补环境验证。
  - id: risk.performance-candidates
    description: 分类写全量读取/重复计数、详情文件及删除版本查询增长仍为source候选/单文档观测；库内扫描和大页完整历史风险保持。
    impact: 本批不能声称全路径性能、生产时延/堆GC/SLA已通过。
    mitigation: 先量化真实guard/缓存/增长反证，再与用户讨论方案；不未经讨论优化。
  - id: risk.sorting-policy-gap
    description: 分类排序未知/重复ID兼容与审计归属尚待核依据，访问正向测试没有固化其合法性。
    impact: 不能以授权修复关闭排序业务/审计规范。
    mitigation: 独立候选跟踪，按已有规则及真实来源核对后处理。
  - id: risk.audit-coverage-remains
    description: 4650盘点与有限8源码/8知识范围不等全审；W2/W3/W4余项、W5–W7、A23旧已审全量/SQL队列及新增增量仍待完成。
    impact: 本批通过只覆盖当前切片，不给整体百分比或新unique。
    mitigation: 保持固定清单/历史原件，后续fetch增量复核和W6/W7反查。
  - id: risk.retained-deferrals
    description: TaskDetail友方修复、生产弹窗设计、记录控制依赖DHRhigh/A12、四知识gap及缺文件政策不关闭。
    impact: 原延期功能/政策缺口不能因本批通过自动变绿。
    mitigation: 按既有所有权及用户确认推进，无merge/deploy/restore。
  - id: risk.ui-tooling-not-run
    description: 无UI变动，未跑浏览器/完整前端build/strict/lint；历史strict19/ESLint配置缺口仍非绿。
    impact: Maven打印资源生成不代表前端全量验收；未核分支强制CI设置。
    mitigation: 按适用模块后续验证，不查询触发CI/Actions。
