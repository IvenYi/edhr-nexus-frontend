  - id: F004-ASYNC-BINDING-LOSS
    severity: high
    scope: same editor asynchronous route graph and replacement payload
    summary: 旧组件慢路线图时可发送空operationBindings清空原绑定；最终候选阻断直到同路线配置初始化并保留原绑定。
    reproductionSteps:
    - 只读加载d63旧组件，运行slow graph场景。
    - target有1条绑定且finalOutput=true，延迟路线图响应，提前点击保存。
    expectedResult: 路线加载/失败不得保存；成功重试后仍发原绑定和最终标记。
    actualResult: 旧基线回调0条，预期1条；58fb慢加载与失败重试均保留1条及finalOutput=true。
    evidence:
    - baseline-async-red.log
    - browser-result.json
    - ProductProcessOwnerService.saveOperationBindings替换语义只读核对
    resolutionStatus: resolved
    resolutionEvidence:
    - type: commit
      reference: 58fb346f2d1eb860c09c3f95eed448ef8b813112
    - type: command
      reference: browser-result.json：slow graph / failed graph load and retry 两场景passed
