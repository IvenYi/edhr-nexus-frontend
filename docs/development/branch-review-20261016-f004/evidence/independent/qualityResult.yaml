  - id: F004
    severity: medium
    scope: product/product-family process editor saved version identity
    summary: 退出当前候选的已存DHR/路线引用原先空白，最终候选已修复。
    reproductionSteps:
    - 用最终浏览器脚本加载d63旧组件并运行saved DHR reference场景。
    - 候选仅有501、target已存502及原名称版本，打开编辑。
