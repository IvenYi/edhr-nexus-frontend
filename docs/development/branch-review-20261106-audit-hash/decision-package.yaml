  engineeringDecisions:
    - id: engineering.audit-event-v2
      status: implementation-choice-within-authorized-defect-fix
      source: W5原始PG双失败、当前AuditEvent源码及PR66只读兼容方案；不是用户新业务政策
      scope: 新自动生成摘要事件标记audit-event-v2，追加nullable无default版本列且不回填；保留旧算法与显式已有hash路径。
      encoding: 固定18字段顺序的UTF8 JSON数组加版本域；普通文本保留/null独立，JSON字段用单元素数组区分SQLnull与JSONnull，对象键按Java字符串顺序递归排序，数组保序，任意精度十进制去尾零，重复键按JSONB最后值语义；摘要流式写入SHA不再构造完整canonical副本。新自动事件时间赋为同一LocalDateTime的微秒截断，固定六位小数，不改时区。
      compatibility: 未标版本事件按旧算法仅可诊断不认证可靠重算，未知版本明确拒绝计算、不猜算法；现有非空摘要保留且不自动盖v2。旧应用忽略nullable列可继续读写，应用回滚保留列及新旧hash，不做破坏性schema回退。
    - id: engineering.actual-persisted-text
      status: independent-finding-remediation
      source: 初版独立质量QF-W5-UTF16-001/QF-W5-VARCHAR-002实际PG/JDBC反证；不是新业务限制
      scope: 普通文本hash按PG JDBC实际未配对UTF16代理项到问号的替换值编码；13个varchar字段仅去除DB确会截断的超宽ASCII空格，宽度按Unicode代码点；不修改event业务字段、接收规则、全局parser或JSONB内容。
      acceptance: 同源4例文本反证1正3真红；补8单元和19原生文本/全部varchar/补充字符/原非空格超限拒绝，最终201回归及全新独立质量，不复用初版failed为passed。
    - id: engineering.json-carrier-jdbc-text
      status: independent-finding-remediation
      source: f640独立质量QF-W5-JSON-UTF16-003实际源码/PG/JDBC/默认ObjectMapper反证
      scope: JSON载体Java String在解析前复用同一JDBC UTF8原始文本转换；只替换原始未配对UTF16代理项，不替换六字符字面Unicode转义或解析后JSONB叶子，保持原数据库拒绝与event原字段。
      acceptance: 同源5例原生反证2正3真红0E/S，修复后完整206及全新最终QA；原201/89/六例/59参数只是f640历史通过范围。
  impactAnalysis:
    level: L2
    directImpacts:
      - {area: audit-entity, change: 自动封存新事件的版本化确定编码及时间精度，原18字段/不可变约束保持, evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/compliance/entity/AuditEvent.java]}
    transitiveImpacts:
      - {area: audit-producers, change: 当前49位点37文件仍由同一PrePersist封存；复验配置/生产附件/签署关联审计/切面，防止新增SQL或业务失败, evidenceReferences: [docs/development/branch-review-20261106-image-verification/w5-producer-inventory.json]}
    potentialImpacts:
      - {area: capacity, concern: JSON解析和排序有资源成本，实测代表性大before/after分配与耗时，不宣称峰值或吞吐, evidenceReferences: []}
    unaffectedAreas:
      - {area: ui-and-other-hashes, change: UI/DTO/归档投影与下载规则不改；Signature/DHR/file摘要不改，ZIP裁剪视图不冒称自足重算, evidenceReferences: [docs/development/branch-review-20261106-image-verification/W5-COMPATIBILITY-PLAN.md]}
    compatibilityAndMigration:
      - {area: schema, change: 新0092仅追加nullable snapshot_hash_version，无default/UPDATE或历史修复；正式Liquibase升级/重复与旧应用列集合插入读取实测，原baseline不改, evidenceReferences: [gmp-platform/backend/src/main/resources/db/changelog/db.changelog-master.yaml]}
    snapshotImpacts:
      - {area: evidence, change: 仅AuditEvent新自动封存计算，原JSON原文入JSONB和已有业务快照所有权保持，不修改原件/签名/冻结内容, evidenceReferences: []}
    auditImpacts:
      - {area: atomicity, change: 自动封存保留原审计写入事务关系/拒绝更新；不校验历史后报坏、不增加读下载阻断/自愈/重封存, evidenceReferences: []}
    permissionImpacts:
      - {area: existing-authority, change: 无新入口与权限分支；原操作者/来源/原因/审计字段覆盖保持, evidenceReferences: []}
    testImpacts:
      - {scope: new-hash, scenarios: [旧源JSON与时间分离真实PG反证, 同源最终往返, 编码固定向量及18字段篡改, null/数字/Unicode/重复键/顺序边界, 未标/未知/外部hash兼容, 新旧混部与无历史DML迁移, 原子性/不可变/实际生产者, 大JSON成本, 全新独立质量与有限本体], evidenceReferences: []}
    evidenceGaps: [旧行无法可靠还原原始JSON/时间因此历史限制保留, 无新增离线完整证据/UI校验产品政策, 非生产部署/并发SLA/全审完成，原W2-W7与931/86/A12/高风险/容量/UNKNOWN/A23及暂停队列保持]
