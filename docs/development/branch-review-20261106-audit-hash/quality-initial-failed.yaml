  findings:
    - id: QF-W5-UTF16-001
      severity: medium
      scope: AuditEventHash.text ordinary text fields
      summary: JDBC成功替换未配对代理项后，普通文本v2摘要仍按替换前UTF16封存，产生新的往返不匹配。
      reproductionSteps:
        - 使用固定候选编译的真实AuditEvent构造普通operatorName为未配对高代理项、低代理项或x高代理项y，其他字段为合法固定值。
        - 调用真实sealSnapshotHash，使用相同PostgreSQL JDBC驱动setString持久化普通文本及摘要/版本。
        - 重新读取普通文本，其代理项已被JDBC持久化为U+003F，再调用真实computeSnapshotHash。
      expectedResult: 对现有写入链成功接受的新自动事件，读回可复算同摘要，且不新增业务拒绝或修改原字段/历史。
      actualResult: 中文和合法配对补充字符正例通过；三类未配对代理项均成功写入，但v2重算失败，旧算法在同固定时间场景均匹配。
      evidence: [text-unicode-probe.jsonl, text-unicode-probe-runtime.json, TextUnicodeProbe.java, source-snapshot/gmp-platform/backend/src/main/java/com/zencas/edhr/compliance/entity/AuditEventHash.java, REVIEW.md]
      resolutionStatus: open
      resolutionEvidence: []
    - id: QF-W5-VARCHAR-002
      severity: medium
      scope: AuditEventHash ordinary varchar fields with persisted type limits
      summary: PG接受并截断超出varchar长度的尾空格，新自动摘要没有按实际持久值封存。
      reproductionSteps:
        - 按当前DDL建立operator_name varchar(128)和data_summary varchar(512)。
        - 分别构造128个N加1尾空格、512个S加1尾空格，调用实际sealSnapshotHash并经JDBC写入。
        - PG成功写为128或512字符；读回实际字段后再次调用computeSnapshotHash。
      expectedResult: 对数据库已接受的普通varchar值，按实际持久语义复算一致；不能对所有文本trim或用UTF16长度误计合法补充字符。
      actualResult: 两例v2均不匹配；旧算法也不匹配，说明该既有归一化边界仍未被本批新行修复覆盖。
      evidence: [text-unicode-probe.jsonl, text-unicode-probe-runtime.json, TextUnicodeProbe.java, source-snapshot/gmp-platform/backend/src/main/resources/db/changelog/baseline/0001-current-schema.sql, REVIEW.md]
      resolutionStatus: open
      resolutionEvidence: []
