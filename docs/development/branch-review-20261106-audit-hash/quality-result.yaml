    - id: risk.legacy-and-offline-export
      description: 旧未标事件不能可靠还原原JSON/纳秒，精简/裁剪ZIP缺18字段不能脱库自足重算。
      impact: 本批只修新自动事件，不修旧hash或新增导出/下载验证政策。
      mitigation: 保留历史原值/缺口和旧算法诊断，不回填或虚称历史已验证。
    - id: risk.resource-measurement-and-evolution
      description: JSON树与排序仍有成本，累计堆/一次耗时非峰值/RSS/native/并发/SLA；编码或持久语义变更需版本兼容评估。
      impact: 不能以Digest流输出声称常量内存或生产容量，不能静默改变v2。
      mitigation: 保存原始样本与明确编码；README旧50/36ms是corrected阶段，主L0登记对齐transport约62/45ms，未用旧标签作为当前性能保证。
    - id: risk.full-http-and-producer-coverage
      description: producer运行包含真实组件和明确合成边界，不是完整密码/图片/HTTP/JWT或全部49业务链认证。
      impact: 不宣称全系统权限/生命周期或全域审计失败原子性；原Aspect吞错仍在。
      mitigation: 保持实际206与原生/Mock边界，未触及的全审及既有问题队列继续。
    - id: risk.production-migration-and-mixed-deploy
      description: 原生升级/旧列集合测试是受控兼容协议模拟，未执行生产迁移或混部。
      impact: 不赋予部署/merge/历史恢复授权或生产零停机保障。
      mitigation: 应用回滚保留新增nullable列与新旧hash，发布时再按实际环境评估。
