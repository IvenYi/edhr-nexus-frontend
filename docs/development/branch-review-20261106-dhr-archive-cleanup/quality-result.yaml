  residualRisks:
    - id: gap.http-async-and-handoff
      description: 未运行完整servlet HTTP/异步调度；Files.size或响应构造失败、body未开始、拒绝/取消/超时及Error/OOM路径仍原缺口。
      impact: 回调向容器抛错不能撤回已经发出的状态/字节；cleanup-only失败时客户端可能已收到完整ZIP。成功EXPORT审计发生流之前，流失败不保证回滚它。
      mitigation: 后续单独验真实异步生命周期/清理交接，不把本轮异常传播修复称网络原子回滚或全故障回收。
    - id: gap.fault-fixture-and-runtime-limits
      description: 新fault用例显式启用、真实Linux自有路径置换非空目录，数据库/renderer为mock；原生12真实PG但renderer仍mock，成功空记录版本仅隔离打包夹具。
      impact: 不认证其他OS/磁盘掉线/权限故障、Chromium布局或空DHR业务资格；删除Runtime分支部分为源码检查。
      mitigation: 保持实际测试与源码范围分列，所需平台及完整渲染/HTTP验收在对应切片补证，不降低既有断言。
    - id: gap.cleanup-persistence-and-capacity
      description: UNKNOWN、持久对账、未知孤儿回收及PDF/上传/Office容量仍待审；本轮不新增自动重试/清扫/恢复或实施DB分页方案。
      impact: 附属清理错误可定位不等于文件已经成功回收或崩溃后自动恢复，资源与性能风险未全关闭。
      mitigation: 按台账和用户真实决策继续，不自动删除未知文件或从merge推断性能方案授权。
    - id: gap.whole-audit-and-policy
      description: W2-W7、931知识/86UI候选、高风险/A12/完整矩阵、历史ZIP/text-ID/共享ACL并发/A23及用户暂停队列保持；知识0.3.25/schema1.2/P0不提升。
      impact: 85/89和有限本体/源码结果只裁定本批，不能代整文件、全分支或完整发布验收。
      mitigation: 主侧在全部角色/子项FINAL后实际漂移/阶段复核，并按最新目标持续增量审查。
