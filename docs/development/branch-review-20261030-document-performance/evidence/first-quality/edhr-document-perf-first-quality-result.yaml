  - id: QF-DOCUMENT-UNICODE-FOLD-001
    severity: medium
    scope: document-list-keyword-search
    summary: Java ROOT规范化参数与PostgreSQL LOWER折叠不一致，合法Unicode标题用同样关键词无法查到自身。
    reproductionSteps:
    - 在候选7d376e81的真实JWT/filter/controller/service/repositories、独立本地PG(en_US.utf8)中，POST
      /api/v1/master-data/documents title='İzmir work instruction', version='V1',
      code='IZMIR-PROBE'。
    - POST200且数据库保留原文；GET同列表 keyword='İzmir'。
    - 同登录及数据下将keyword改为ASCII 'izmir'作为正向对照。
    expectedResult: 合法已保存标题包含原关键词，使用原样关键词应命中同一文档，保持大小写不敏感检索。
    actualResult: 原样İzmir查询HTTP200但totalElements=0；ASCII izmir HTTP200,totalElements=1。Java参数为i+组合点，PG
      LOWER标题为izmir。
    evidence:
