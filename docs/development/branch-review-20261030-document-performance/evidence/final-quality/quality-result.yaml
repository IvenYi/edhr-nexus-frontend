  residualRisks:
  - id: risk.database-scanning
    description: COUNT/包含搜索/父页排序仍扫描候选范围，深页offset仍有成本。
    impact: 应用实体读取有界不代表数据库只扫一页。
    mitigation: 按实际容量讨论索引或检索方案；本次不承诺生产SLA。
  - id: risk.complete-page-version-size
    description: 完整页内版本和metadata仍按业务完整性返回；客户可请求大页。
    impact: 大页/单文档极多版本仍可能占用内存；512仅限制IN参数批次。
    mitigation: 不擅加客户页长cap或删完整版本，实际大规模再测再讨论。
  - id: risk.locale-and-fixture
    description: 当前原生验证PG16.15/en_US.utf8，未形式证明任意Unicode或locale；H2仅测试NFC兼容。
    impact: 不能泛化为所有部署locale/语言均等价。
    mitigation: 部署locale变化时重跑代表性查询；NFC仅比较不改变身份。
  - id: risk.production-migration-environment
    description: 隔离合成库/4表计划复现不等于生产迁移、磁盘文件内容、堆GC或容量认证。
    impact: 不覆盖实际生产环境全链。
    mitigation: 按真实发布风险另行验证，不接生产库。
  - id: risk.retained-policy-and-security-gaps
    description: 方法权限、父code实体nullable、缺文件合法性与原四知识gap保持；TaskDetail友方页、生产弹窗、记录控制依赖DHRhigh/A12暂缓。
    impact: 本批不关闭这些其他范围，也不恢复旧功能收尾。
    mitigation: 按既有所有权与阶段继续，不以性能修复规避规则决策。
