        responsibility: 父对象/DHR锁顺序、来源集合/人工确认、冻结与审计。
      - owner: dhr-attachment
        responsibility: 有效关联元数据及完整SHA/核验/存量下载资格。
      - owner: audit-observation
        responsibility: 可复现SQL/计划/JFR和容量/失败证据，性能取舍待实际确认。
