decisionPackage:
  id: DEC-PACKAGE-DHR-SUMMARY-ATTACHMENT-20261105
  scope: edhr-dev DHR summary submission attachment metadata, integrity, transaction locks and native capacity audit
  knowledgeBaselineVersion: 0.3.25
  contractBaseline:
    sourceCommit: 7704f11267a810b2bda82e99f049a0206a5e73c7
    targetBranch: edhr-dev
    targetCommit: a429f983a7a69553753034e9306d12598fcc15be
    contractReadCommit: a429f983a7a69553753034e9306d12598fcc15be
    uncommittedContractPaths: []
  summary: 同一批完整canonical取证后，用户明确批准提交内附件元数据复用；仅在已持父DHR锁的提交事务中，一次构建公开快照与内部路径/SHA上下文，原核验/完整摘要/来源hash/错误顺序与冻结保持，下载和历史导出入口不改。
  confirmed:
    concepts: []
    relationships: []
    rules: []
    executionContracts: []
  inferred:
    - id: inference.summary-attachment-repeated-metadata
      statement: snapshot已读取有效附件元数据但submit逐项file仍查询DHR和路径，父锁下有复用候选；旧605仅局部guard前缀，需在真实成功事务和完整索引上重新核对。
      rationale: DhrSummaryService.submit和DhrAttachmentService.snapshot/file/ensureDhr实际源码；旧观察未完整安装canonical迁移及真实detail/impact。
      relatedIds: [rule.dhr-summary-freeze-version, rule.dhr-summary-controlled-attachment-upload]
  unresolved: []
  replacementScopes: []
  engineeringDecisions:
    - id: decision.summary-attachment-call-context
      status: user-confirmed
      source: 用户本轮异步明确回复“先做提交内元数据复用（推荐）”
      scope: 同一次实际提交父锁内读取活动关联集合并复用内部路径/SHA；不跨请求缓存、不暴露stored_path、不全局改变file/下载/历史导出。
      invariants: [固定生产对象/DHR/草稿锁顺序, 租户/DHR/active完整集合, 来源hash先于原件校验, 按原顺序VERIFIED及完整SHA和错误优先级, 公开快照字段/顺序/冻结摘要/审计保持]
  impactAnalysis:
    level: L2
    directImpacts:
      - area: dhr-summary-submit
        change: 新增显式opt-in原生观察及预算；AttachmentService内部同次上下文复用与SummaryService.submit消费者局部改动，真实保存草稿/提交冻结及摘要复验。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrSummaryService.java, gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrAttachmentService.java]
    transitiveImpacts:
      - area: evidence-and-file-integrity
        change: 真实detail/impact/forms和冻结完整性服务；测试坏文件、未核验、来源变化及失败回滚，不以mock替代这些边界。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrFrozenEvidenceIntegrity.java]
    potentialImpacts:
      - area: metadata-reuse-and-index
        concern: 元数据查询次数/实际执行计划和全字节SHA/持锁时间分别量化；批读复用或索引方案先讨论，不以单一SQL次数判断生产容量。
        evidenceReferences: []
    unaffectedAreas:
      - area: policies-and-pr63
        change: 签名图局部复用、人员完整分页、下载/导出资格及冻结政策保持，不修历史/本体旧规则或暂停页面。
        evidenceReferences: []
    compatibilityAndMigration:
      - area: no-migration
        change: 局部提交读取与测试/审计记录；完整隔离库使用既有迁移，不改schema/索引或历史数据。
        evidenceReferences: []
    snapshotImpacts:
      - area: successful-summary-freeze
        change: 合法完成生产对象/现有源表单夹具由真实saveDraft/submit形成新冻结版，再核元数据/摘要/顺序及草稿删除，不宣称首次START/生产完成路径验收。
        evidenceReferences: []
    auditImpacts:
      - area: submit-and-unlink-audit
        change: 实际JPA审计写入及失败事务回滚，运行计数分开SELECT/写入/初始化/断言。
        evidenceReferences: []
    permissionImpacts:
      - area: service-boundary
        change: 服务级真实租户/DHR成员/核验/SHA/冻结资格及父锁；不认证完整登录HTTP/RBAC/真实部署多租户。
        evidenceReferences: []
    testImpacts:
      - scope: native-summary-attachment
        scenarios: [0/1/10/100/300及50MiB提交查询预算/旧源反证, 原件逻辑读取与线程分配, 缺失/坏原件/未核验/来源变化回滚, DHR/tenant/inactive排除, 缺失及未核验错误优先级, 合法unlink被实际提交父锁串行化, 完整现有索引与混合分布计划, 相关DHR摘要/持久化/附件回归]
        evidenceReferences: []
    evidenceGaps: [生产并发及SLA/完整HTTP与首次START不覆盖, 七格式及上传/核验完整矩阵不因本轮读取自动完成, PDF累计内存和原全审931知识/86UI及暂停保留]
  extensionStrategy:
    selectedPaths: [product-core]
    rationale: 在既有服务内用包内SubmissionAttachments保存公开快照及内部路径/SHA，复用既有完整文件校验；公共snapshot共用相同单行映射，不创建通用批处理/全局缓存或暴露stored_path。
    ownershipBoundaries:
      - owner: dhr-summary
        responsibility: 父对象/DHR锁顺序、来源集合/人工确认、冻结与审计。
      - owner: dhr-attachment
        responsibility: 有效关联元数据及完整SHA/核验/存量下载资格。
      - owner: audit-observation
        responsibility: 可复现SQL/计划/JFR和容量/失败证据，性能取舍待实际确认。
  affectedFiles:
    - {path: gmp-platform/backend/src/test/java/com/zencas/edhr/production/service/DhrSummaryAttachmentObservationPostgresTest.java, changeType: create, reason: canonical实际成功提交与资源/锁观察}
    - {path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrSummaryService.java, changeType: update, reason: 同次提交使用已锁内部附件上下文}
    - {path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrAttachmentService.java, changeType: update, reason: 单查询内部上下文及原映射/校验复用，外部资格入口保持}
    - {path: gmp-platform/backend/src/test/java/com/zencas/edhr/production/service/DhrSummaryPersistenceTest.java, changeType: update, reason: 原无附件单测更新内部上下文mock，原断言不变}
  acceptanceScenarios:
    - id: scenario.native-summary-attachment-read-audit
      given: 完整canonical隔离库中的合法完成对象和真实现有附件原件
      when: 实际保存草稿、提交汇总并核冻结摘要，及并发解除/非法原件
      then: 元数据与顺序/原字节/冻结身份保持、失败回滚/父锁有证据，分列真实SQL与JFR资源，不将取证视作优化或完整发布验收
      evidenceRequirements: [新鲜XML/命令/源码指纹, 原始PG日志/计划及JFR, 有限本体核对, 全新独立最终质量, 全部FINAL后任务漂移复核]
