  residualRisks:
  - id: risk.large-active-count-and-search
    description: 5万同时待审仍有JSON候选过滤/准确COUNT开销；深OFFSET和跨表任意子串不被两个索引变成常量工作。
    impact: 本轮消除全局Java搬运与往返，不是全规模/生产SLA或堆峰值认证。
    mitigation: 按实际活跃量/本人比例/搜索负载继续量化，再讨论规范投影或专用搜索索引，不直接增读模型。
  - id: risk.runtime-capability
    description: 实际验证PG16.15、ICU root153.136；部署目标库未连接，ICU/JDK升级及PG14未执行认证。
    impact: 关键词依赖ICU root前置，缺失会HALT；并发建索引仍需IO/事务等待，失败可能留下invalid索引。
    mitigation: 部署前核ICU及迁移版本/索引状态；按明确恢复流程处理失败，不用IF NOT EXISTS吞错；版本升级重跑等价矩阵。
  - id: risk.finite-matrix-and-existing-highs
    description: 两旧DHRhigh、全部外部质量事实/普通权限UI/账号状态/接收人及A12/四gap未关闭。新测试是原生SQL/服务和迁移，不含浏览器/socket/login-RBAC或所有Unicode/JSON可能输入。
    impact: 本批通过不代表DHR全链、全项目审计或发布认证。
    mitigation: 保持既有待审台账，继续按原始规则分批审查，不新增自动质判或权限政策。
  - id: risk.shared-index-and-global-audit
    description: done部分索引承担所有共享流程符合状态的写入/存储成本；固定6017/134只是盘点，wholeFile0/unique未知，666/44/183、旧A23/W6含旧已审/W7、ACL三问、文件一致性与朋友页/生产弹窗暂缓继续。
    impact: 局部代码/计划不能外推全部共享表生产分布或关闭全局待审。
    mitigation: 保持所有旧索引和队列，跟随真实数据选择计划；PR50独立未合入及后续目标增量须重新集成验证。
