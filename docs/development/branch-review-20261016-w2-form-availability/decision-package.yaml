decisionPackage:
  id: DEC-PACKAGE-20261016-W2-FORM-AVAILABILITY
  scope: W2第二批；冻结计划表单与实际实例份数、已结束但未到达作业表单的只读状态投影；先复现再最小整改
  knowledgeBaselineVersion: 0.3.25
