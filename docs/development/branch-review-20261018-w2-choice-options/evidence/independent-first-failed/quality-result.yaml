    - id: QF-W2-CHOICE-001
      severity: medium
      scope: ModelTab实际子列创建和主动类型变更入口；canonical选项与动态行默认。
      summary: 子列字段设计对话框绕过新选项初始化，新建单选子列仍保存空canonical选项，点击可见预置默认后真实新行缺失该值。
      reproductionSteps:
        - 打开字段设计，已有子表点击设计子表。
        - 在实际新增字段对话框填写名称，字段类型选单选，确认；不通过store.addSubTableFields快捷入口创建。
        - 返回表单设计，将该子列放入动态子表；保持可见预置选项1和选项2文本不变，直接点击选项1的设为默认值。
        - 在实际FormDocumentPreview新增行，检查canonical model options、组件defaultValue及真实行值。
      expectedResult: 当前新建单选子列canonical模型持久化与界面相同的两个预置，defaultValue选项1能由既有行工厂解析并写入新行。
      actualResult: 实际ModelTab新增得到type=singleSelect且canonical options=[]；Inspector显示选项1和选项2，点击默认记录选项1，但canonical仍空，实际新增两行均没有该字段值。
      evidence:
