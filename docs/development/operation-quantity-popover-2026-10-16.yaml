      reason: 紧凑累计和进度布局
    - path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/ProductionOutputService.java
      changeType: update
      reason: 普通工序空单位不得并入正式产出，原始证据仍保留
    - path: gmp-platform/backend/src/test/java/com/zencas/edhr/production/service/ProductionOutputPostgresTest.java
