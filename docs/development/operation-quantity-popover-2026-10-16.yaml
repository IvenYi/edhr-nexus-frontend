  acceptanceScenarios:
    - id: scenario.operation-output-missing-unit
      given: 普通工序正式来源产出30但单位为空，另有产出0根
      when: 查询当前工序产出
      then: 空单位30保留来源且未计入，状态UNIT_REVIEW；有效0根单独计入，不能补产品单位，也不改变批次最终工序范围
      evidenceRequirements: [ordinaryOutputWithoutUnitKeepsEvidenceButDoesNotEnterEitherCumulative测试、独立质量复验]
    - id: scenario.operation-quantity-effective-and-saved
      given: 一笔30已生效，一笔20已保存未完成
      when: 查看良品浮层
      then: 已生效30、已填报50，来源两条且状态分列
      evidenceRequirements: [聚焦测试]
    - id: scenario.operation-quantity-workspace-space
      given: 1280x720及更低窗口
      when: 悬浮或固定数量浮层
      then: 不推挤左栏，切换表单入口可见，长来源内部滚动
      evidenceRequirements: [浏览器检查]
