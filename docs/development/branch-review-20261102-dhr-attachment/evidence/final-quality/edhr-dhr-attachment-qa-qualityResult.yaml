  - id: QF-DHR-ATTACHMENT-CLEANUP-DIAGNOSTICS
    severity: medium
    scope: DhrAttachmentService.upload rollback compensation
    summary: 旧回滚清理吞IO异常无文件定位；当前记录id/path及异常且保留原事务失败
    reproductionSteps:
    - Upload inside actual outer transaction
    - Replace newly written original with nonempty directory, then throw original transaction error
    - Inspect rollback result, retained directory child, unrelated file and service error logs
    expectedResult: Rollback cleanup failure leaves identity/path/exception while original transaction error remains
      primary
    actualResult: Old same control fails absent diagnostic log; current logs DirectoryNotEmptyException with exact
      id/path, row and audit rollback, original error and physical child preserved
    evidence:
    - /tmp/edhr-dhr-attachment-qa-old-DhrAttachmentTransactionPostgresTest.xml
    - /tmp/edhr-dhr-attachment-qa-current-DhrAttachmentTransactionPostgresTest.xml
