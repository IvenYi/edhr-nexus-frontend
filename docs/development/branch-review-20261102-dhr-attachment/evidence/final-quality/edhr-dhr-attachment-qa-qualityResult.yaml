  - id: QF-DHR-ATTACHMENT-UNKNOWN-LOSS
    severity: high
    scope: DhrAttachmentService.upload transaction completion
    summary: 旧UNKNOWN误当回滚删除可能已登记原件；当前保留并定位
    reproductionSteps:
    - Use actual proxied service and canonical native PostgreSQL/JPA audit/JDBC attachment registration
    - Commit actual database then throw synthetic acknowledgement exception in manager, yielding actual STATUS_UNKNOWN
      notification
    - Inspect actual attachment and audit rows and exact original bytes after failed request
    expectedResult: UNKNOWN must not destroy possibly committed original; retain and report identity/path without
      guessing database rollback
    actualResult: Old native control leaves attachment+audit rows but fails original existence; current same scenario
      keeps exact bytes, status UNKNOWN and error log
    evidence:
    - /tmp/edhr-dhr-attachment-qa-old-DhrAttachmentTransactionPostgresTest.xml
    - /tmp/edhr-dhr-attachment-qa-current-DhrAttachmentTransactionPostgresTest.xml
