  residualRisks:
  - id: risk.unknown-retry-and-durable-reconcile
    description: UNKNOWN can have either DB outcome; retained original, request error, retry duplicates and process
      crash still require explicit durable reconciliation.
    impact: No cross-resource atomicity or automatic recovery/idempotent retry guarantee.
    mitigation: Preserve id/path and inspect registration before retry; do not automatically resubmit, restore history
      or sweep/delete orphans.
  - id: risk.pre-registration-write-and-direct-calls
    description: Interrupted physical write before callback registration and unsynchronized direct/internal invocation
      remain separate review scopes.
    impact: Current passed result does not close entire attachment file-consistency family.
    mitigation: Dedicated fault reproduction and ownership review before follow-up deterministic fix.
  - id: risk.limited-runtime
    description: New native test uses actual proxy/JPA audit/JDBC and three canonical table subset plus test-only
      constraints; UNKNOWN manager fault is synthetic.
    impact: No full schema/FK/migration, real socket fault, browser or complete DHR HTTP/RBAC/tenant/recipient certification.
    mitigation: Keep exact evidence limits; run domain/deployment/UI checks when applicable.
