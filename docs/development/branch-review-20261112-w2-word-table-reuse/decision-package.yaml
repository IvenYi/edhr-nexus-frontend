decisionPackage:
  id: DEC-PACKAGE-W2-WORD-TABLE-REUSE-20261112
  scope: W2 user-authorized per-import Word table parsing reuse;W6 performance/robustness/A23;W7 increment
  knowledgeBaselineVersion: 0.3.25
  contractBaseline:
    sourceCommit: 8a415040babc1cc91ca9f5683bf0db46829eea76
