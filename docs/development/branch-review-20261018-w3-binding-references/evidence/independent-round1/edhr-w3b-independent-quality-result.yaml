    - id: QF-W3B-001
      severity: medium
      scope: AUD-H004 work draft active binding references and malformed published process metadata
      summary: A non-array nodesJson on an existing PUBLISHED FORM_PROCESS bypasses the new reference guard and reaches graph, repository, projection and audit writes.
      reproductionSteps:
        - Use candidate actual compiled controller and service with existing form702 and PUBLISHED FORM_PROCESS901 owned by definition902.
        - Provide active PROCESS settings with form702/process901 and fieldPermissions start:removed referencing valid field keep.
        - Set process nodesJson to object {}, JSON null, or a JSON string and invoke actual saveGraph(101,201,payload).
        - Run the independent standalone probe against candidate compiled classes; inspect captured graph mutation and repository invocation counts.
      expectedResult: Existing malformed published-process metadata rejects before any draft graph mutation, version save, reference projection rebuild or audit save; only genuinely unresolved/incomplete references retain the draft allowance.
      actualResult: All three non-array values return normally; graph contains start:removed and version.save, rebuildForWorkVersion and audit.save each run once. Array controls and syntax-invalid JSON reject with zero writes.
      evidence:
        - gmp-platform/backend/src/main/java/com/zencas/edhr/workflow/service/FormFillSettingsService.java:129
