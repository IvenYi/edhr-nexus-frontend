  residualRisks:
  - id: risk.single-table-synthetic-environment
    description: Native PG16.15/en_US.utf8 and H2 tests initialize verbatim canonical file_object table plusPK/testCHECK
      only; other repositories for UI asset lookups are mocks.
    impact: Not full production schema, migrations, complete multi-tenant or every business-reference certification.
    mitigation: Keep scope explicit; later real-domain and deployment validation separately.
  - id: risk.unknown-and-durable-reconciliation
    description: Unknown commit uses synthetic transaction-manager failure and preserves file; real network disconnect,
      process crash and durable reconciliation not implemented.
    impact: An orphan may remain; this is not filesystem/database distributed atomicity.
    mitigation: Preserve possibly registered originals and report id/path; separately design controlled reconciliation
      without historic deletion.
  - id: risk.cleanup-failure
    description: Physical rollback/start cleanup may fail and retain current file; late rollback cleanup logs rather
      than replacing database failure.
    impact: No guarantee all failed requests leave zero physical bytes under I/O failure.
    mitigation: Original request fails, retained error/log evidence; subsequent manual/controlled handling is separate.
  - id: risk.delete-and-related-dhr-callback
    description: General DELETE order and DhrAttachmentService noncommitted cleanup remain source candidates; not
      changed or certified here.
    impact: This batch does not close the whole file-consistency family or DHR controlled attachment lifecycle.
    mitigation: Prioritize actual constraints/failure tests on dedicated chains; do not copy !=COMMITTED semantics
      as policy.
