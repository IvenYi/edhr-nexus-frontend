      reason: 原生实际公开提交前缀与父锁/query量化。
  acceptanceScenarios:
    - id: scenario.query-and-lock-observation
      given: 自有原生PG与受控附件元数据/真实字节
      when: 公开submit运行到原人工确认guard或合法unlink并发等待
      then: 记录实际查询且维持当前校验与父锁，不落冻结版本、不伪造成功提交。
      evidenceRequirements: [原始命令/SQL/结果, 实际pg_stat_activity锁等待, 全新独立最终质量]
