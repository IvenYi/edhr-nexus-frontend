    - id: scenario.current-initialization-source
      given: 当前事实或锚点引用已从生产master移除的SQL
      when: 定位现行表列约束或预置
      then: 引用可解析到对应新schema或seed，定位文本准确且无重复路径
      evidenceRequirements: [逐处映射清单, 原始SQL核对, 正式知识校验]
    - id: scenario.historical-migration-evidence
      given: 历史证据说明旧迁移和旧验证
      when: 修改文件位置引用
      then: 指向原字节测试夹具，保留原时点政策、状态、来源和验收边界，不冒充当前安装过程
      evidenceRequirements: [历史文件摘要一致, 语义差异核对]
    - id: scenario.no-obsolete-tool-execution
      given: 用户把触发说明误认为待执行操作
      when: 阅读修正后的旧入口清单
      then: 明确工具已删除，无待运行命令，不恢复旧库或8087
      evidenceRequirements: [开发说明复核]
