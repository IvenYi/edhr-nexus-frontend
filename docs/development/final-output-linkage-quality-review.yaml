  findings:
    - id: QF-FINAL-001
      severity: high
      scope: product-process-existing-workspace
      summary: 既有产品制程工作台保存工序配置会静默清除全部最终产出标记。
      reproductionSteps:
        - 在产品制程版本共享编辑器设置一个最终产出工序并保存。
        - 打开仍在router注册的master-data/products/:productVersionId/modeling工作台，选择该版本的工序配置。
        - 保持或修改任一表单/文档后保存；该页面toOperationDrafts和toPayload均未保留finalOutput。
        - 后端saveOperationBindings将缺失的Boolean按false保存，后续新开工快照因此没有最终产出工序。
      expectedResult: 所有可访问编辑入口均保留最终产出选择，并提供一致的零或一配置交互；修改无关绑定不清除最终标记。
      actualResult: 工作台请求缺少finalOutput，后端将原先true保存为false，用户没有取消该选择却丢失配置。
      evidence:
        - gmp-platform/frontend/src/router/index.tsx:130注册ProductModelingWorkspacePage。
        - gmp-platform/frontend/src/pages/master-data/ProductModelingWorkspacePage.tsx:109的OperationDraft、156的toPayload、196的toOperationDrafts无finalOutput；374行saveOperationsMutation直接提交此请求。
