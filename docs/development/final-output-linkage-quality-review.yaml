      expectedResult: 以中文字段“最终产出工序”及是/否解释该审计变化。
      actualResult: 后端operationSnapshot新增finalOutput，现有三处审计格式化器未映射此键并回退原始key及String(boolean)，显示finalOutput：true或false。
      evidence:
