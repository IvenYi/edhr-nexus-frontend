  findings:
    - id: QF-RC-INTEGRATION-001
      severity: high
      scope: Current production subtable records submitted for controlled change
      summary: RecordControlDiff rejects the __rowId produced by the current form renderer, so ordinary completed forms with subtable rows cannot submit a change.
      reproductionSteps:
        - Use a subTable field named rows with a text column named value, as in the independent probe.
        - Supply a saved row containing the current production metadata __rowId and value original; newSubTableRow.ts line 5 creates this metadata for normal rows.
        - Call the actual RecordControlDiff.identifyRows with source revision 123, clone the result, and change value to changed.
        - Call the actual RecordControlDiff.prepare. Compare with the identical source/proposal after removing only __rowId.
      expectedResult: Production row identity metadata is supported and preserved while the legitimate business-field change yields one stable row/field difference.
      actualResult: normalizeSubtable accepts only __recordRowId and configured column IDs, treating __rowId as an unknown field and throwing 子表包含未知字段. The control without __rowId produces one valid field difference. Keeping a normal subtable while modifying a main field also reaches this rejection path.
      evidence:
        - gmp-platform/backend/src/main/java/com/zencas/edhr/recordcontrol/service/RecordControlDiff.java:107
        - gmp-platform/frontend/src/components/form-renderer/newSubTableRow.ts:5
        - gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/FormTraceIndexService.java:70
        - evidence/independent/SubtableRowIdentityProbe.java
        - evidence/independent/subtable-row-identity-probe.log
        - 'DEC-0087-04 requires stable field/row identities; the defect is in the current application path, not the deferred A12 consumer.'
      resolutionStatus: open
      resolutionEvidence: []
