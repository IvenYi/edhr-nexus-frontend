      then: 完整证据比较与缺失变化提示保持，资格失败不读文件，业务内容/冻结历史无写；性能量化可重算且旧风险去重，不擅改产品
      evidenceRequirements: [真实命令/提交与运行输入绑定, 原始SQL与PG日志, JFR逻辑文件读取与分配口径, 正反快照摘要, 本体有限语义核对, 全新独立验收, 全部FINAL后实际PR前漂移复核]
