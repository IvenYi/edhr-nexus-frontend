      statement: changes仍整数组摘要且review.detail重复调用，可放大单请求附件IO和分配；具体规模待实际测量。
      rationale: 原始源码与已有PERF-DHR-REVIEW-REPEAT-001；旧H2双调用不是当前PG/大文件容量结论。
      relatedIds: [DEC-0063-06, DEC-0063-10, DEC-0063-14]
