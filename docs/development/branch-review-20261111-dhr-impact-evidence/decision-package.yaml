  impactAnalysis:
    level: L2
    directImpacts:
      - {area: native-evidence-observation, change: 在维护的canonical附件测试中增加冻结后changes/version/review读取观察及失败对照，产品字节不改, evidenceReferences: [gmp-platform/backend/src/test/java/com/zencas/edhr/production/service/DhrSummaryAttachmentObservationPostgresTest.java]}
    transitiveImpacts:
      - {area: review-and-files, change: 核对summary.version到review.detail和act的复用/锁内新鲜度边界，当前合法审批任务用真实冻结流程产生, evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrEvidenceImpactService.java, gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/DhrReviewService.java]}
    potentialImpacts:
      - {area: capacity, concern: 附件数量/大小及并发会放大内存和IO；线程累计分配不等于峰值/堆/RSS，JFR逻辑读取不等于物理磁盘IO或生产SLA, evidenceReferences: []}
    unaffectedAreas:
      - {area: implementation, change: 不改产品/UI/SQL/schema/索引/知识/配置；不删除来源或摘要检查、不跨请求缓存、不跳过锁内重核, evidenceReferences: []}
    compatibilityAndMigration:
      - {area: isolated-fixtures, change: 只用自身临时PG与原生canonical迁移，不连接或恢复共享/历史业务库；旧在审/历史不自动净化, evidenceReferences: []}
    snapshotImpacts:
      - {area: immutable-evidence, change: 原始版本通过真实saveDraft/submit创建；读取及失败不应重写冻结快照或签名，元数据/文件变化分开观察, evidenceReferences: [docs/knowledge/decisions/DEC-0063-dhr-summary-and-review-configuration.yaml]}
    auditImpacts:
      - {area: no-write-reads, change: 读调用前后业务表内容摘要核对；审批命令保留既有审计和事务边界，不把只读详情代替写时再核, evidenceReferences: []}
    permissionImpacts:
      - {area: original-eligibility, change: 资格先于文件读取；实际任务由冻结流程创建，越权拒绝不能被性能取证绕过, evidenceReferences: []}
    testImpacts:
      - {scope: native-and-adjacent, scenarios: [0/1/100/300附件, 50MiB完整逻辑读与累计分配, 元数据未变但原件篡改或缺失, pending/新增/解除及范围外附件, 冻结快照无写, 真实冻结审批任务详情与版本读取, 授权拒绝及相邻审批回归], evidenceReferences: []}
    evidenceGaps: [尚无生产数据规模/并发峰值/SLA, 前端未改不运行新浏览器/视觉验收, 全审/W2-W7/A23已审复看/知识全语义/strict86/lint缺配置/A12高风险/完整矩阵/其他未答方案和暂停继续]
  extensionStrategy:
    selectedPaths: [product-core]
    rationale: 测量贴近现有DHR冻结和附件所有者，复用维护测试；未来若获授权可在同请求复用比较、提取有界摘要/冻结附件索引，不能用提取方法冒称已优化。
    ownershipBoundaries:
      - {owner: production-dhr, responsibility: 冻结来源比对、附件校验、审批资格/锁/审计}
      - {owner: audit-test, responsibility: 自有fixture、原始SQL/IO/分配/快照证据与有限范围结论}
  affectedFiles:
