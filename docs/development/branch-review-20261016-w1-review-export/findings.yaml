auditDocumentationCorrections:
  - id: audit.coverage-git-quoted-chinese-paths
    severity: medium
    status: resolved-by-fresh-independent-verification
    scope: coverage.csv中的六个中文路径
    rootCause: 初次git ls-tree未使用-z，core.quotePath把中文路径输出成带引号的转义文本；总数正确但路径集合不等于真实Git树。
    remediation: 主侧以git ls-tree -r -z按UTF-8生成，逐条核对1524个实际路径及blob；pending和分母不变。
    evidence: [evidence/coverage-utf8-correction.json, evidence/legacy-inventory-path-recheck.json, evidence/final-independent/qualityResult.yaml, evidence/final-independent/inventory-check.json]
    productCodeChanged: false
