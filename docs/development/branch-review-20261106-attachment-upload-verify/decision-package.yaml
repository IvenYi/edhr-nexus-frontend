    - id: scenario.attachment-upload-verify-native-audit
      given: 完整canonical隔离库与自有磁盘Part/真实小格式原件及受控大PNG
      when: 真实上传核验下载、故障拒绝或外层回滚
      then: 字节/SHA与登记/审计相符，失败无错误提交或误删他人原件，逻辑读写和累计分配有原件，不把它当全部HTTP/生产峰值认证
      evidenceRequirements: [源码/命令/新鲜XML, 原始PG日志及JFR, 具名故障/文件生命周期证据, 有限本体核对及全新独立质量, 全部FINAL后实际PR前任务漂移复核]
