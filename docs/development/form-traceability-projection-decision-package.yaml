      then: 两种来源形态均覆盖，子表为交互重点，主表明细配对不被延后；具体操作、行身份、表头共享和其他运行契约仍按对应待定项处理，不将设计写成已实现。
      evidenceRequirements: [用户本轮范围澄清, DEC-0075-19, 后续两种来源形态的交互与运行验证]
    - id: scenario.projection.trace-only-configured-field-search
      given: 表单仅将设备号等字段配置为查找与追溯，未配置任何业务统计用途
      when: 在已明确索引生效范围内，授权用户按相应信息类型及字段值查询
      then: 应能找到准确原始实例及命中字段/明细位置，不生成报工报废消耗统计明细；结果页面和独立索引时机仍待定，此为验收期望。
      evidenceRequirements: [用途独立选择核验, 来源类型及位置和权限核验, 后续索引契约与聚焦运行测试]
    - id: scenario.projection.trace-types-and-source-authorization
      given: 批次号和设备号具有相同字符串，另有无权来源
      when: 按明确检索信息类型查找所有相关记录
      then: 不混查不同类型，不泄露无权记录及数量，命中不形成正式谱系设备关系或工序身份，不覆盖执行context；此为验收期望。
      evidenceRequirements: [类型范围和授权说明, 后续检索权限运行验证]
    - id: scenario.projection.context-ownership-and-configured-prefill
      given: 批次B001工序P10的真实执行上下文启动表单，配置业务统计及上下文带入字段但没有检索用途
      when: 按后续明确的带入生命周期展示字段并形成正式统计事实
      then: 事实归属由真实B001/P10执行上下文确定，所配字段可显示对应信息，不依赖额外手填或检索配置；具体带入时机持久化刷新编辑及多设备策略仍待定，此为验收期望。
      evidenceRequirements: [执行context与字段展示的分别核验, 带入生命周期确认, 后续聚焦运行与快照测试]
    - id: scenario.projection-cross-form-independent-metrics
      given: 同一明确统计范围表A良品90、表B不良5，两者分别有正式来源
      when: 后续实现同报表行展示与来源回查
      then: 两指标并列且分别回查，不自动扣产出或算良率，不默认同次事件关联；这是验收期望，不是已实现声明。
      evidenceRequirements: [统计范围和来源说明, 后续聚焦运行测试与独立质量验收]
    - id: scenario.projection-cross-form-missing-metric
      given: 同一明确范围表A有效，表B无正式数据
      when: 后续查询同报表行
      then: A仍可展示，B保持无正式数据而不填真实0；这是验收期望。
      evidenceRequirements: [缺失值语义与来源回查, 后续聚焦运行测试]
    - id: scenario.projection-summary-detail-same-fact
      given: 同一事实表头总数与子表明细并存，另有独立多次正式记录
      when: 后续合计正式业务数据
      then: 同事实表头与明细不重复累计，独立多次记录仍可累计，正式来源选择可解释；这是验收期望，当前仍有静态风险。
      evidenceRequirements: [正式来源粒度说明, 后续重复计数与独立记录测试]
    - id: scenario.projection-new-purpose-old-snapshot
      given: 旧实例已按START或ATTACH_FORM冻结配置
      when: 模板新增用途或字段
      then: 旧实例冻结配置不改写，新使用读取当时配置；这是验收期望，保留既有历史隔离规则。
      evidenceRequirements: [冻结前后配置对比, 后续快照隔离测试]
    - id: scenario.projection-field-configuration
      given: 制表人员在表单设计画布选中普通字段
      when: 从数据用途先选查表或正式业务明细、再选字段含义，必要时加入同条明细并保存
      then: 无需打开全表弹窗即可编辑来源；保存重开后回显，全表入口先显示摘要并能展开同一配置；模拟值不保存。
      evidenceRequirements: [前端构建, 设计器检查, 独立库浏览器保存重开]
    - id: scenario.projection-design-brief-and-handoff
      given: 朋友阅读简版，后续开发上下文阅读完整方案
      when: 分别理解客户配置过程和定位开发起点
      then: 简版以实例解释配置与报表复用，明确首次完成交付与未覆盖范围；开发版提供接手顺序、约束、问题依赖及阶段出口，二者业务含义一致。
      evidenceRequirements: [独立读者审查, 两版一致性检查, 本地链接检查]
    - id: scenario.projection-design-customer-responsibility
      given: 读者只阅读设计文档
      when: 判断谁定义统计模型和扩展属性
      then: 能确认由产品方维护，客户只配置来源，不要求客户建模。
      evidenceRequirements: [独立读者审查]
    - id: scenario.projection-design-maturity-and-scope
      given: 文档包含原型、当前源码、候选设计与实施计划
      when: 读者判断可交付范围和剩余问题
      then: 能区分已确认边界、待评审实现、现有能力与后续问题，不误认全部矩阵已实现。
      evidenceRequirements: [原始源码核对, 文档一致性检查]
    - id: scenario.projection-batch-final-output-quantity
      given: 生产对象按已确认配置具有指定最终产出工序，正式报工记录可从配置用途来源取得数量
      when: 未来实现批次和工单产出投影
      then: 批次只读取该工序正式报工数量，工单汇总批次；不跨工序相加，不把不良或报废自动加减该值，也不将缺少正式生效数据记为实际零。实现需保留用途快照并另行完成运行验证。
      evidenceRequirements: [用户确认, 知识正式校验, 最终产出运行实现与独立质量验收]
    - id: scenario.projection-design-branch-sharing
      given: 用户希望在GitHub功能分支向朋友展示
      when: 阅读协作与演示计划
      then: 本目录功能分支可推送，分支不隔离数据库；朋友按运行说明在空的独立数据库迁移和运行虚构演示。
      evidenceRequirements: [Git状态只读核对, 文档审查]
