  extensionStrategy:
    selectedPaths: [product-core, configuration, transaction-orchestration]
    rationale: 产品内核维护统计模型与查询能力，客户配置合法来源并在支持类型内维护查找项；投影事件与结果由内核持久化。MVP读预设报表，二期报表复用同一事实与来源，具体扩展接口仍待设计。
    ownershipBoundaries:
      - owner: template-module
        responsibility: 字段与分组身份、模板版本及可编辑配置入口；不新增专属发布锁。
      - owner: projection-module
        responsibility: 标准模型和受控查询类型、查找目录契约、取值校验、投影批次、业务记录与查询索引；客户定义查找项不修改内核统计规则。
      - owner: production-and-work-runtime
        responsibility: 首次执行或后续挂接时校验并保存配置快照、真实执行上下文、最终完成事件与来源权限。
