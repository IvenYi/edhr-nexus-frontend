  acceptanceScenarios:
    - id: scenario.projection.mvp-customer-trace-query-catalog
      given: 管理员定义灭菌锅次查找项，两个表单的普通字段或子表列名称不同但关联同一项
      when: 查询人员按该项输入值，在明确索引范围和权限内查询
      then: 应按同一查询含义查到授权来源及准确命中位置，无需为该项新增硬编码类别或配置业务统计；类型/操作符与时机等运行细则另行设计，本轮不是运行验收。
