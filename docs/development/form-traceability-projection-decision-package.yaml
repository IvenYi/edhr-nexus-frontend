      evidenceRequirements: [DEC-0075-21, 设计简版主稿与交接入口一致核对]
    - id: scenario.projection.first-phase-source-shape-coverage
      given: 首期设计包含子表及分散在主表的多个字段，分别用于查找或组成正式业务明细
