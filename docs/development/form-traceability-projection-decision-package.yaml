  acceptanceScenarios:
    - id: scenario.saved-progress-trace-before-completion
      given: 有权限的填报人暂存了包含追溯来源值但尚未完整的表单
      when: 查询人员在暂存成功后查询该已保存值
      then: 可找到来源与其草稿/进行中状态，未保存变化不命中，不提前生成正式统计；2026-10-10已实施并用真实保存/查询API及聚焦测试验证。
      evidenceRequirements: [user-confirmed-20261010-saved-progress-trace-reply, 正式知识校验, 独立知识审查, 保存与查询真实集成验证]
    - id: scenario.unbound-manual-object-is-not-dhr-owner
      given: 表单没有生产上下文，用户填选系统内B001
      when: 保存登记并执行内容查询
      then: 这是记录中登记的对象而非自动取得的生产/DHR归属；配置自动带入时明确提示无上下文，正式DHR关联另走业务流程。
      evidenceRequirements: [user-confirmed-20261010-annotation-1, 正式知识校验, 独立知识审查]
    - id: scenario.optional-lot-and-unit-grouping
      given: 物料消耗记录未填批号或单位
      when: 核对完成校验与合计规则
      then: 投影不因该空值阻断，空值不推断身份或单位，空单位仅在同用途/对象/工序/物料/批号的空单位组累计，不与明确单位混算；2026-10-10已实施并用虚构API及聚焦测试验证。
      evidenceRequirements: [user-confirmed-20261010-annotation-3, user-confirmed-20261010-annotation-6, 正式知识校验, 独立知识审查]
    - id: scenario.mvp-development-history-policy
      given: 本功能旧MVP开发数据与新方案不一致
      when: 核对迁移和兼容要求
      then: 允许修复迁移或作废，不要求旧格式双轨兼容；本轮只在独立开发库应用0109至0111，不改原业务库和旧完成快照，未来正确数据使用时快照仍有效。
      evidenceRequirements: [user-confirmed-20261009-annotation-1, 正式知识校验, 独立知识质量审查]
    - id: scenario.owning-production-trace-item-semantics
      given: 表单真实所属生产对象A，内容可能提及B
      when: 解释预置生产批次SN与DHR归属
      then: 预置项表示本单所属A，字段不能改绑真实归属；内容提及B不把该表单纳入B的正式DHR。自动回写仍未实施；来源详情可核对真实归属与内容命中位置。
      evidenceRequirements: [user-confirmed-20261009-annotation-13, 正式知识校验, 独立知识质量审查]
    - id: scenario.trace-query-same-actual-row
      given: 同一子表两行分别物料M1批号L1及物料M2批号L2
      when: 查询物料M1且批号L2并结合主表条件
      then: 主表按同表单匹配，明细组合必须命中同一实际行，不跨行拼接，不由内部配置组或添加顺序决定；2026-10-10已实施并经PostgreSQL与真实API验证。
      evidenceRequirements: [user-confirmed-20261009-annotation-15, 正式知识校验, 独立知识质量审查]
    - id: scenario.lookup-catalog-ready-slice
      given: 管理员新建文本查找项，尚无绑定与填写值
      when: 制表人员打开兼容字段候选，查询人员打开条件候选
      then: 两处均提供新项；无结果正常返回空集，不按旧同名字段或同值自动回填；显式配置的新实例保存后可查到字段或子表行，正式统计仍等最终完成。
      evidenceRequirements: [真实PostgreSQL集成测试, 方法权限测试, 迁移与实际API闭环, 浏览器新增与查询验证]
    - id: scenario.independent-canvas-projection-panel
      given: 画布已选择普通字段或整子表，来源配置有未保存修改
      when: 切换字段配置与查找统计侧栏，或在用途面板点选另一来源
      then: 保持画布与选中位置，显示对应字段/子表用途；配置、撤销及保存共用原链路，空白或不支持的来源只显示指引，不自动启用用途。
      evidenceRequirements: [前端聚焦测试, 浏览器主表/子表交互, 保存重开及撤销, 侧栏滚动与窄屏核对]
