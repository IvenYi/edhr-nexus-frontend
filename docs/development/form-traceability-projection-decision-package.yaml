decisionPackage:
  id: DEC-PACKAGE-20260929-FORM-PROJECTION
  scope: form-traceability-projection-implementation
  knowledgeBaselineVersion: 0.3.24
  summary: 同一首次完成投影切片保留既有统计、真实上下文、两类来源及使用时快照边界。2026-10-07侧边确认目录自动进入设计及查询候选、新含义未关联历史补充覆盖排二期、文本物料匹配须显式配置对应含义并次要展示。继续L2实施不依赖Q6/Q9/Q15/Q17的目录切片：新增与显示信息维护、已有文本精确能力的动态来源映射、既有最终完成查询中的自定义条件。仅采用产品当前支持的文本/单选来源，保存服务端目录解释到模板配置并随使用快照固定；不新增文本实体解析、在制索引或历史回填。此前侧栏成果和评审证据保留，不把本切片当成完整MVP。
  # 2026-10-05预置项复核时管理员目录尚未实现；从冠骋原始字段与消费者提炼候选，见form-projection-preset-source-review-2026-10-05.md。该历史增量不修改运行目录、统计默认、数据库或未决问题；10-07当前实现以目录切片记录为准。
  # 同日整体补查：直接核对冠骋前端设计器8种追溯/21种业务字段和后端41种注册声明，补字典选项/取值来源/动作分层；候选非运行默认，未新增字段类型、统计规则或Q17答案。
  # 同日追加：查找与追溯、业务统计是并列可选任务，可仅其一/两者/都不配；部分字段可配置生产上下文自动带入。统计归属独立来自实际执行上下文。Q15-Q17保留独立索引时机、结果页面及字段带入生命周期，当前formTrace完成路径不替未来需求定版。
  # 首期来源形态补充确认：子表是交互设计重点，但首期也覆盖主表多个分散字段组成一条业务明细；子表优先不等于仅交付子表。具体交互与其他运行契约继续按对应未决项处理。
  # 同日用户确认独立侧栏：查找与统计作为画布内同级入口；保留当前选择、同一配置与统一保存，不跳到脱离画布的整页。本增量不实现目录CRUD或改变Q12/Q15-Q17。
  # 2026-10-07开发前整体评审及多角色流程图见form-projection-final-design-review-2026-10-07.md；复用本决策包。仅核对并提出建议，未修改产品代码或数据库，未将混合编号检索、Q6/Q9/Q15/Q17建议提升为confirmed。该评审补充当前切片L2影响与验收范围，不新建竞争性决策包。
  # 2026-10-07侧边用户确认增量见主设计2.5节及handoff同日入口：用途驱动的文本匹配与次要展示、查找项自动进入两处候选、新含义对未关联旧实例的补充覆盖排二期。其余Q6/Q9/Q15/Q17保留；原生引用能力与原有历史查询保留。主会话须同步适用结构化知识并复核门禁，本条不冒充已完成同步或实现。用户追加授权：交接后判断开发/优化条件，具备则开始。
  confirmed:
    concepts: []
    relationships: []
    rules:
      - id: design-rule.form-projection.trace-item-terminology
        name: 产品统一使用追溯项并遵循统一页面规范
        status: specified
        trigger: form-projection.present
        condition:
          all:
            - fact: presentation.targetsCustomer
              operator: equals
              value: true
        result:
          type: constrain-presentation
          preferredTerm: 追溯项
          previousTerm: 查找项
          sharedUiGuidelinesRequired: true
          preserveStableIdentifiersAndHistoricalEvidence: true
        sourceReferences: [docs/development/form-lookup-catalog-2026-10-07.md]
      - id: design-rule.form-projection.explicit-text-material-purpose
        name: 普通文本须明确物料用途才触发身份匹配
        status: specified
        trigger: form-field.text-identity-match
        condition:
          all:
            - fact: field.explicitPurposeRepresentsMaterial
              operator: equals
              value: true
        result:
          type: constrain-identity-matching
          inferFromFieldNameOrTextShape: false
          presentation: secondary-hover-preferred
          nativeReferenceRequiresProjectionPurpose: false
          uniqueMatchProvesUserIntent: false
        sourceReferences: [docs/architecture/form-traceability-projection-design.md#25-c侧边讨论确认增量2026-10-07供主开发会话接手]
      - id: design-rule.form-projection.lookup-directory-shared-candidates
        name: 新增查找项自动进入设计与查询候选
        status: specified
        trigger: form-lookup-item.create
        condition:
          all:
            - fact: lookupItem.available
              operator: equals
              value: true
        result:
          type: expose-shared-directory
          targets: [compatible-designer-sources, authorized-query-conditions]
          requiresExistingBindingsOrHits: false
          sourceBinding: explicit
        sourceReferences: [docs/architecture/form-traceability-projection-design.md]
      - id: design-rule.form-projection.new-meaning-history-phase-two
        name: 未关联新含义的历史补充覆盖排二期
        status: specified
        trigger: form-lookup-item.create
        condition:
          all:
            - fact: historicalInstance.snapshotHasLookupBinding
              operator: equals
              value: false
        result:
          type: defer-historical-enrichment
          targetPhase: phase-two
          inferBindingFromNameOrValue: false
          preserveExistingQueriesAndEvidence: true
        sourceReferences: [docs/architecture/form-traceability-projection-design.md]
      - id: design-rule.form-projection.product-owned-models
        name: 统计模型由产品方维护
        status: specified
        trigger: form-projection.configure
        condition:
          all:
            - fact: configuration.targetsBusinessReport
              operator: equals
              value: true
        result:
          type: persist-field-contract
          modelOwner: product-team
          customerResponsibility: select-source-fields-and-confirm-mappings
        sourceReferences:
          - docs/architecture/transaction-traceability-dhr-business-rules.md
          - user-confirmed-20260929-statistical-models-owned-by-product
      - id: design-rule.form-projection.unified-replacement
        name: 试验实现允许被统一方案替换
        status: specified
        trigger: form-projection.implement
        condition:
          all:
            - fact: implementation.isExperimentalProjectionLogic
              operator: equals
              value: true
        result:
          type: allow-with-governance
          target: unified-projection-contract
          scope: relevant-experimental-code
          historicalDataDeletionAuthorized: false
        sourceReferences:
          - user-confirmed-20260929-replace-experimental-projection-code
      - id: design-rule.form-projection.optional-use
        name: 按实际需求配置追溯与统计
        status: specified
        trigger: form-template.configure
        condition:
          all:
            - fact: template.requiresTraceOrStatistics
              operator: equals
              value: false
        result:
          type: omit-projection
          preserveFormAndProductionEvidence: true
        sourceReferences:
          - user-confirmed-not-every-customer-form-needs-projection
          - docs/architecture/transaction-traceability-dhr-business-rules.md
      - id: design-rule.form-projection.first-completion
        name: 首次完成正式投影边界
        status: specified
        trigger: form.final-completion
        condition:
          all:
            - fact: projection.enabled
              operator: equals
              value: true
        result:
          type: validate-and-enqueue-atomically
          operationalFailureRevokesCompletion: false
          retryRequiresReason: true
          downstreamRequiresSucceeded: true
        sourceReferences: [DEC-0075-07, DEC-0075-10]
      - id: design-rule.form-projection.use-time-snapshot
        name: 来源配置在生产使用时进入执行快照
        status: specified
        trigger: production-execution.first-use-or-attach-form
        condition:
          all:
            - fact: formTemplateVersion.selectedForUse
              operator: equals
              value: true
        result:
          type: validate-and-copy-execution-snapshot
          templateRemainsEditable: true
          completedProjectionReadsInstanceSnapshot: true
        sourceReferences: [DEC-0075-12]
      - id: design-rule.form-projection.operation-totals
        name: 工序用途合计与数量来源
        status: specified
        trigger: report.aggregate
        condition:
          all:
            - fact: projection.status
              operator: equals
              value: SUCCEEDED
        result:
          type: aggregate-by-operation-and-purpose
          scrapQuantityFrom: configured-field
          retainSourceDetails: true
          implyBatchFinalOutput: false
        sourceReferences: [DEC-0075-05, DEC-0075-06, DEC-0075-11]
      - id: design-rule.form-projection.batch-final-output-source
        name: 批次最终产出使用最终产出工序正式报工数量
        status: specified
        trigger: production.batch-final-output
        condition:
          all:
            - fact: operation.finalOutput
              operator: equals
              value: true
        result:
          type: planned-final-output
          quantitySource: configured-formal-production-report-quantity
          operationScope: designated-final-output-operation-only
          workOrderAggregation: sum-final-output-by-associated-batches
          qualityQuantities: independently-configured-statistics
          autoAddOrSubtractQualityQuantities: false
          requiresSeparateQualityForm: false
          missingOrNotEffectiveDataMeansZero: false
          fixedGoodQuantityFieldRequired: false
        sourceReferences: [DEC-0075-13, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
      - id: design-rule.form-projection.isolated-first-delivery
        name: 独立演示与分期交付
        status: specified
        trigger: form-projection.deliver
        condition:
          all:
            - fact: delivery.scope
              operator: equals
              value: first-completion
        result:
          type: preserve-existing-data
          isolatedDatabase: true
          ongoingQuantityLabel: process-reference
          exclude: [controlled-revision, void, rule-rebuild]
        sourceReferences: [DEC-0075-08, DEC-0075-09, DEC-0075-10]
      - id: design-rule.form-projection.canvas-primary-entry
        name: 画布字段和子表作为主要配置入口
        status: specified
        trigger: form-projection.configure
        condition:
          all:
            - fact: configuration.domain
              operator: equals
              value: form-projection
        result:
          type: design-entry-priority
          primary: canvas-field-or-subtable-selection
          secondary: central-overview-and-adjustment
          progressiveDisclosure: true
          goal: lower-learning-cost
        sourceReferences: [DEC-0075-14, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
      - id: design-rule.form-projection.low-cost-purpose-development
        name: 新增用途允许低成本可维护二开
        status: specified
        trigger: form-projection.extend
        condition:
          all:
            - fact: configuration.domain
              operator: equals
              value: form-projection
        result:
          type: design-extension-goal
          businessDevelopmentAllowed: true
          goal: low-development-cost-and-maintainability
          allBusinessZeroCodeRequired: false
          largeGenericRuleEngineRequiredInAdvance: false
        sourceReferences: [DEC-0075-15, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
      - id: design-rule.form-projection.cross-form-metric-direction
        name: 跨表单同报表行指标必须明确统计对象范围来源
        status: specified
        trigger: form-projection.report-design
        condition:
          all:
            - fact: configuration.targetsBusinessReport
              operator: equals
              value: true
        result:
          type: design-metric-boundary
          require: [statistical-object, scope, per-metric-source]
          differentFormsMayProvideMetrics: true
          arbitraryCrossFormEventAssociationConfirmed: false
        sourceReferences: [DEC-0075-16, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
      - id: design-rule.form-projection.independent-trace-and-statistics
        name: 查找追溯与业务统计并列可选
        status: specified
        trigger: form-projection.configure
        condition:
          all:
            - fact: configuration.domain
              operator: equals
              value: form-projection
        result:
          type: independent-purpose-selection
          tasks: [lookup-and-trace, business-statistics]
          combinations: [trace-only, statistics-only, both, neither]
          canvasPrimaryForBothTasks: true
          traceIsAdvancedStatisticsSubtask: false
          traceOnlyRequiresBusinessQuantityFields: false
          allRelatedScope: existing-source-authorization
          traceHitEstablishesFormalBusinessRelationship: false
          indexEffectiveScopeConfirmed: false
          resultPageConfirmed: false
        sourceReferences: [DEC-0075-17, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
      - id: design-rule.form-projection.context-ownership-and-field-prefill
        name: 执行上下文归属与字段自动带入分开
        status: specified
        trigger: form-projection.context-design
        condition:
          all:
            - fact: configuration.domain
              operator: equals
              value: form-projection
        result:
          type: context-and-field-boundaries
          statisticalOwnership: execution-context-and-purpose-grain
          ownershipRequiresHandEnteredIdentityField: false
          ownershipRequiresTracePurpose: false
          configurableContextFieldPrefillRequired: true
          compatiblePrefillAndFieldUseAllowed: true
          displayEditsOverrideExecutionIdentity: false
          competitorReferenceMeansCopyInteraction: false
          prefillLifecycleConfirmed: false
          singleEquipmentPerOperationAssumed: false
        sourceReferences: [DEC-0075-18, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
      - id: design-rule.form-projection.first-phase-source-shapes
        name: 首期覆盖子表和主表分散字段组成业务明细
        status: specified
        trigger: form-projection.first-phase-design
        condition:
          all:
            - fact: configuration.domain
              operator: equals
              value: form-projection
        result:
          type: source-shape-scope
          sourceShapes: [subtable, scattered-main-form-fields]
          subtableInteractionPriority: true
          subtableOnlyFirstPhase: false
          concreteInteractionConfirmed: false
          remainingRuntimeContractsConfirmed: false
        sourceReferences: [DEC-0075-19, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
      - id: design-rule.form-projection.customer-trace-query-catalog
        name: MVP客户维护可复用查找项目录
        status: specified
        trigger: form-projection.mvp-scope-design
        condition:
          all:
            - fact: configuration.domain
              operator: equals
              value: form-projection
        result:
          type: trace-query-catalog-scope
          definitionOwner: customer-administrator
          supportedTypesOwner: product
          commonDefinitionsPredefined: true
          sourceShapes: [ordinary-field, subtable-column]
          crossFormDefinitionReuse: true
          definitionAndQueryValueSeparated: true
          queryControlsFollowDefinitions: true
          resultsIncludeAuthorizedSourcesAndHitLocations: true
          permitsCustomerBusinessOntologyEditing: false
          runtimeLifecycleConfirmed: false
        sourceReferences: [DEC-0075-20, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
      - id: design-rule.form-projection.mvp-preset-reports-phase-two-custom-reports
        name: MVP预设统计报表和二期自定义报表
        status: specified
        trigger: form-projection.mvp-scope-design
        condition:
          all:
            - fact: configuration.domain
              operator: equals
              value: form-projection
        result:
          type: report-phase-scope
          mvpTraceQueryCatalog: true
          mvpBusinessReports: product-preset
          customerCustomReportPhase: phase-two
          preserveExtensionSpace: true
          existingSourceShapeAndUseBoundariesPreserved: true
          customerOwnedBusinessModelsConfirmed: false
          arbitraryFormulaAndCrossSourceJoinConfirmed: false
        sourceReferences: [DEC-0075-21, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
      - id: design-rule.form-projection.independent-canvas-panel
        name: 同一画布内独立查找与统计侧栏
        status: specified
        trigger: form-projection.designer-interaction
        condition:
          all:
            - fact: configuration.domain
              operator: equals
              value: form-projection
        result:
          type: designer-panel-scope
          entryLevel: canvas-side-rail
          preserveSelectedSource: true
          sharedConfigurationAndSave: true
          fullPageNavigation: false
          sourceShapes: [subtable, scattered-main-form-fields]
        sourceReferences: [DEC-0075-22, docs/knowledge/evidence/form-traceability-projection-ownership-user-confirmed.md]
    executionContracts: []
  inferred:
    - id: inference.form-projection.designer-field-preset-layers
      statement: 建议总体提炼查找含义、统计用途、模型属性/字典来源、取值来源和独立业务动作；关联批次/订单号为补充查找候选，检验/评审选项只作后续候选。客户配置按场景渐进显示，普通字段及子表列复用已有组件。
      rationale: 原始在线表单前端入口为8种追溯和21种业务字段，后端41类声明不等于菜单；引用、系统日期、上下文默认及签名职责各异，不能机械复制类型枚举、唯一性约束或结论即动作。总体考虑不扩大MVP三类统计用途、不新增数量/人员/日期默认规则。
      relatedIds: [DEC-0075-18, DEC-0075-19, DEC-0075-20, DEC-0075-21, docs/development/form-projection-preset-source-review-2026-10-05.md]
    - id: inference.form-projection.source-derived-presets
      statement: 建议从冠骋实际反查消费者提炼生产批号/产品序列号、设备、工单、产品、记录单号等查找含义，保留现有物料批号及补充项；日期查询属于类型扩展候选。统计MVP保留正式报工、报废、实耗，工时/检验/仓储另定规则。
      rationale: 原始LOT/SN关联生产标识，不能误当物料批号；枚举混合度量、维度、实体引用和动作，不能直接全部作为查找项或投影用途。2026-10-05复核时管理员目录未实现，10-07已完成的目录范围以当日实现记录为准；正式报工独立产出属性及批次/工单联动仍缺失，历史候选不升为用户已确认默认。
      relatedIds: [DEC-0075-18, DEC-0075-20, DEC-0075-21, docs/development/form-projection-preset-source-review-2026-10-05.md]
    - id: inference.form-projection.metadata-and-extension-storage
      statement: 采用产品维护的属性目录、固定业务核心字段及有类型的JSONB扩展值；客户不建立统计模型或自定义执行动作。
      rationale: 减少字段枚举膨胀及预留空列，满足既有报表的新增展示、筛选和分组需求；存储与接口名称是待评审技术建议。
      relatedIds: [design-rule.form-projection.product-owned-models]
    - id: inference.form-projection.unified-entrypoints
      statement: 建议画布主入口与集中总览调整编辑同一配置并可互相定位，可选AI只提供同一配置的候选；入口主次已确认，互定位等具体交互仍为建议。
      rationale: 避免不同入口产生重复规则或双重计数；尚未作为已实现或用户已定版的交互写入权威规则。
      relatedIds: [design-rule.form-projection.unified-replacement]
    - id: inference.form-projection.current-scope
      statement: 批次最终产出数量来源已确认，但当前首次完成切片未实现批次/工单产出联动；工作台工序汇总仍只作过程参考。
      rationale: 截至ac1a395b，ExecutionOutputSummary仅汇总工序良品、不良和报废过程数量；product-process最终产出规则仍planned，未见最终产出写回或工单汇总实现。
      relatedIds: [DEC-0075-11, DEC-0075-13]
    - id: inference.form-projection.progressive-configuration-order
      statement: 建议画布加轻量侧栏，选字段后选用途并引导补齐同一业务记录所需字段，集中入口默认收起详细来源；用途配置模式区分布局编辑，提供单条与子表逐行预览。
      rationale: 画布优先与渐进展示已确认，DEC-0075-22进一步确认画布内独立同级侧栏及选择/配置/保存连续性；其余选项顺序、引导和客户使用频率仍缺少试用证据。
      relatedIds: [design-rule.form-projection.optional-use]
    - id: inference.form-projection.purpose-owned-business-implementation
      statement: 建议通用配置与投影基础流程加用途独立业务实现，普通新用途主要加定义、业务代码和测试并少改公共页面；用途按业务事实定义，新报表优先复用已有事实。
      rationale: 支持已确认的低成本可维护二开目标；实现所有权和详细开发范围仍待评审，不能提升为已确认架构。
      relatedIds: [DEC-0075-15]
    - id: inference.form-projection.aggregate-before-merge
      statement: 建议各来源先按目标行粒度分别聚合再合并指标，保留各指标来源，避免原始明细多对多放大。
      rationale: 跨表单同报表行方向已确认，但同次事件的跨表单关联仍待定；报表汇总不改写原始记录或正式业务事实。
      relatedIds: [DEC-0075-16]
    - id: inference.form-projection.trace-and-business-shared-foundation
      statement: 建议共享画布点选、配置快照和来源定位基础；查找索引检索字段值，业务投影形成有明确语义/粒度的事实，两类用途不要求同一生效时机。
      rationale: 两类任务并列且独立已确认；索引覆盖状态、生效更新和结果页待定，当前完成链路是源码事实而非本次新时机确认。
      relatedIds: [DEC-0075-17]
    - id: inference.form-projection.context-prefill-source-orthogonal-to-use
      statement: 建议画布点字段分别设置取值来源（手填/当前生产上下文等）和数据用途，自动带入不是第三种报表用途；身份显示字段只读或受控修改，语义兼容时同字段复用带入与用途配置。
      rationale: 自动带入能力目标已确认，具体交互、时机、持久化、缺上下文、重开刷新、编辑覆盖和多设备选择/唯一性未定；不得由设备文本号形成正式使用关系。
      relatedIds: [DEC-0075-18]
    - id: inference.form-projection.source-shape-progressive-interaction
      statement: 建议子表沿每行明细配置列含义，避免逐行创建记录组；主表从一个字段发起业务用途，再引导选择同一明细的其他来源字段。用具体业务名称解释配对，内部数据对象不要求用户先行建模。
      rationale: 首期两种来源形态及子表交互重点已确认；每行语义、具体引导、命名和行身份机制仍需交互稿核对，不能凭物理表格或字段名称自动确定业务口径。
      relatedIds: [DEC-0075-19, DEC-0075-14, DEC-0075-17]
    - id: inference.form-projection.trace-query-catalog-contract
      statement: 当前目录切片复用既有文本精确/单选来源、稳定身份及同记录条件匹配；新增与显示信息维护先行，不开放改类型或删除。更多类型与生命周期后续设计，新含义未关联历史的补充覆盖已排二期。
      rationale: 这是明确目录目标下的最小工程范围，不把工程选择写成完整生命周期确认，也不扩大既有查询索引时机。
      relatedIds: [DEC-0075-20]
    - id: inference.form-projection.phase-two-report-extension-boundary
      statement: 建议二期报表定义复用属性身份、正式事实与来源定位，来源绑定不依赖某一张报表；MVP不提前建设报表编辑器、自由公式或通用跨表查询引擎。
      rationale: 自定义业务报表已明确进入二期；保留扩展边界不等于提前实现全部二期能力，也不确认客户自由建立统计模型。
      relatedIds: [DEC-0075-21, DEC-0075-01, DEC-0075-15]
