  scope: edhr-dev PNG/JPEG verification bounded buffers and owned temporary snapshot; read-only W5 compatibility planning
  knowledgeBaselineVersion: 0.3.25
  contractBaseline:
    sourceCommit: cf5594947e96dcc56497997d7941da0f7a89be7e
    targetBranch: edhr-dev
