      given: 已核资格的登记PNG/JPEG，或原件/临时IO/清理故障
      when: 实际核验
      then: 完整原字节SHA和原图片规则保持、同一视图、原件不改、失败不错误更新、临时资源清理且大PNG不再分配整文件数组
      evidenceRequirements: [同字节旧源预算红与最终XML, 原生PG/JFR/分配及临时IO/清理证据, 主异常与抑制异常/日志及原件保护, 有限本体与全新独立质量, 全部FINAL后实际PR前漂移复核]
