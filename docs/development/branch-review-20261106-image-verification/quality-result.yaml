    - id: risk.resource-measurement-scope
      description: 大例为填充PNG、JPEG仅小格式回归；ThreadMXBean为调用线程累计分配，JFR为逻辑IO。
      impact: 不能外推全像素解码、峰值/RSS/native内存、并发、物理磁盘或生产SLA。
      mitigation: 保留原始数值/字节/来源和限定范围，生产容量另行测量。
    - id: risk.temporary-disk-and-crash
      description: 临时快照新增同原件大小磁盘写入；清理异常可留有日志定位的临时文件，进程崩溃与真实磁盘满未认证。
      impact: 当前核验会在IO/清理失败时阻断，不提供持久对账或全目录扫除保证。
      mitigation: 自有资源作用域及原件保护已验证，崩溃/UNKNOWN/持久对账仍在原队列；不自动删历史。
    - id: risk.http-and-full-lifecycle
      description: 真实Spring multipart适配器上使用磁盘Part夹具；业务状态由真实PG种子提供，单位故障为显式模拟。
      impact: 不等于真实servlet multipart解析/网络/JWT/RBAC浏览器全流程、开工或完整多租户认证。
      mitigation: 本批没有接口或UI改动，保持方法级资格/事务与相邻回归边界，不宣称全系统验收。
    - id: risk.original-external-mutation
      description: 固定快照使摘要和格式消费同一次读取视图，不锁住文件系统外部进程。
      impact: 复制后原件仍可被外部改变，不能承诺跨进程不可变。
      mitigation: 原有后续消费者完整SHA复核保留；固定视图测试明确为外部改写模拟。
    - id: risk.preexisting-capacity-and-w5
