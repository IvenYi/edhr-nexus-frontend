  impactAnalysis:
    level: L2
    directImpacts:
      - area: work-order-close
        change: 外层事务覆盖状态与审计，先锁再读before防止同JPA上下文陈旧状态并发重复关闭。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/controller/WorkOrderController.java]
    transitiveImpacts:
      - area: production-service-and-audit
        change: 既有REQUIRED服务事务加入控制器事务，锁持有至审计完成。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/ProductionService.java]
    potentialImpacts:
      - area: adjacent-cancel-and-edit-concurrency
        concern: 邻接路径同类缓存与锁顺序仍需W3单独核对，不能用本批关闭回归替代。
        evidenceReferences: [NEXT.md]
    unaffectedAreas:
      - area: lifecycle-permissions-quantity-dhr-ui
        reason: 状态边、权限、数量/DHR规则和UI不变，未新增表/迁移或数据修复。
        evidenceReferences: [findings.yaml]
    compatibilityAndMigration:
      - change: 无schema/API契约变更；回滚可revert代码提交，不撤销已经发生的真实业务数据。
