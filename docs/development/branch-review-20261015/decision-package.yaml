    snapshotImpacts: []
    auditImpacts:
      - area: work-order-audit
        change: 已有真实前后快照和操作者格式保持，提交原子性修复。
        evidenceReferences: [evidence/close-green-case-index.json]
    permissionImpacts:
      - area: endpoint
        change: 原PreAuthorize不变；测试未模拟HTTP鉴权，不宣称鉴权E2E。
        evidenceReferences: [validation.md]
    testImpacts:
      - scope: regression
        scenarios: [首轮55例历史通过，JPA双关闭独立失败证据，升级真实JPA的五例及相邻回归，最终全新实例验收]
        evidenceReferences: [validation.md]
    evidenceGaps: [真实PostgreSQL和HTTP未执行，除关闭竞争外并发全矩阵未执行，全分支W1到W7尚未完成]
  extensionStrategy:
    selectedPaths: [transaction-orchestration]
    rationale: 保持同控制器create/update/cancel的现有事务编排，不引入通用大模块重构。
    ownershipBoundaries:
      - owner: work-order-controller
        responsibility: 关闭入口先持同一工单行锁再建before快照，整个动作与审计同事务；生产领域仍校验状态。
  affectedFiles:
    - path: gmp-platform/backend/src/main/java/com/zencas/edhr/production/controller/WorkOrderController.java
      changeType: update
      reason: close事务及快照前行锁边界
