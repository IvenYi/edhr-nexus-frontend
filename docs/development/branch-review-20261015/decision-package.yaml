  acceptanceScenarios:
    - id: scenario.audit-close-failure-rollback
      given: 工单COMPLETED
      when: close的审计保存或序列化失败
      then: 状态仍COMPLETED且无审计行
      evidenceRequirements: [真实事务代理和SQL断言，修复前红轮，修复后绿轮]
    - id: scenario.audit-close-success-and-invalid-state
      given: 合法COMPLETED或非法CREATED工单
      when: 请求关闭
      then: 合法时CLOSED与精确前后审计同提交；非法时拒绝且无写入
      evidenceRequirements: [新增五例及相邻回归，实际未参与修复实例的最终质量结果]
    - id: scenario.audit-close-concurrent-once
      given: 两个独立事务同时关闭同一个COMPLETED工单
      when: 第一个请求读取before时第二个请求尝试关闭
      then: 第二个请求等行锁释放后按真实CLOSED拒绝，只有一条COMPLETED到CLOSED审计
      evidenceRequirements: [真实Hibernate与SpringDataJPA及两个线程，修复前失败与修复后通过]
