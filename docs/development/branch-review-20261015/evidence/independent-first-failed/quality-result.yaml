      scope: work-order-close-jpa-concurrency
      summary: 新增外层事务先普通加载实体再加锁，锁查询返回一级缓存旧状态，允许并发重复关闭并形成两条相同业务变更审计。
      reproductionSteps:
        - 保持候选fbbf6318生产字节，使用证据目录的CloseJpaRaceProbe，在独立H2建立COMPLETED工单。
        - 请求A进入真实控制器事务，requireOrder普通查询将工单COMPLETED放入持久上下文，在随后toResponse的材料读取处暂停。
        - 独立线程B通过同一真实控制器和事务代理关闭工单，提交状态CLOSED及第一条审计。
        - 恢复A，真实ProductionService.closeOrder通过PESSIMISTIC_WRITE JPQL锁定同一行；JPA返回已有受管实体的旧COMPLETED状态。
        - A再次通过COMPLETED校验，成功返回CLOSED并提交第二条COMPLETED到CLOSED审计。
      expectedResult: 并发关闭应串行核对当前持久状态；B提交后A必须因状态已CLOSED被拒绝，不产生第二次成功变更或重复审计。
      actualResult: 两个请求均成功，状态最终CLOSED，产生两条COMPLETED到CLOSED审计；行锁未刷新先前受管实体。
