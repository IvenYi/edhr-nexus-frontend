  findings:
    - id: QF-DHR-ASYNC-NORMAL-HTTP-001
      severity: medium
      scope: DhrArchiveAsyncLifecycleTest normal HTTP positive control and its security/async fixture
      summary: Normal HTTP positive control fails after Tomcat security-header exceptions and a second export invocation; final acceptance cannot be reported passed.
      reproductionSteps:
        - Check out exact candidate8fc765dd in own detached worktree and supply existing frontend dependencies.
        - Run retained run.py final with own PG container and original95 selected tests, without source/test/config modification.
        - Inspect normalHttpStreamReturnsExactBytesAndDeletesOwnedArchive line78, normal.json and timestamped container log.
      expectedResult: Normal synthetic HTTP returns exact ZIP with one submitted/started task, and no MimeHeaders exception.
      actualResult: HTTP200 exact164 bytes and file removal assertions pass, but submitted=2 and started=2; expected started1 fails. First authorized invocation17:06:06.384Z is followed by MimeHeaders AIOOBE at06.395Z in servlet HeaderWriterFilter; worker stack also reaches the same header writer via Files.copy. A second GET appears at06.419Z and authorized invocation at06.498Z. First async timeout appears only07.962Z in a HOLD case, so logs do not support attributing the normal-path failure to the250ms timeout. Automatic client GET retry is plausible but remains inference without client trace.
      evidence: [final/http/normal.json, final/TEST-com.zencas.edhr.production.controller.DhrArchiveAsyncLifecycleTest.xml, normal-http-failure-extract.txt, final/maven.log]
      resolutionStatus: open
      resolutionEvidence: []
