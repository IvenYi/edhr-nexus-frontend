      impact: 不覆盖真实约束、事务回滚、网络失败与版本元数据/图跨请求的所有并发窗口；现有版本元数据与图仍是分开保存。
      mitigation: 不将测试声明扩大到真实DB或发布；涉及真实持久化或执行调整时补相应集成检查。
