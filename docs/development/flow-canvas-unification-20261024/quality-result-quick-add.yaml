      description: 本门禁仅证明正常骨架连通，不新增生产环路禁止、返工运行或引用资格规则。
      impact: 通过图保存不意味着既有生产运行检查或配置条件已经全部满足。
      mitigation: 保留原执行入口、快照与运行阻断，向用户描述本次仅是图保存完整性。
    - id: risk.route-quick-add-legacy-tools
      description: 旧process-modeling验证依赖不存在的main历史迁移，ESLint配置缺失；全仓Premium审计仍有既有告警。
      impact: 不具有这些全仓工具全绿的证据。
      mitigation: 如实保留基线差异及聚焦检查，单独维护旧工具，不降低当前业务断言。
    - id: risk.route-quick-add-candidate-freshness
      description: 本结果仅针对manifest核对时的27个冻结候选文件；尚未提交、合并、推送或核验分支保护。
      impact: 修复QF-ROUTE-QUICK-001后，旧候选结果不能覆盖新代码。
      mitigation: 由主智能体修复；依L2角色契约另派全新质量实例，对新manifest候选回归问题及邻接功能并取得passed。
