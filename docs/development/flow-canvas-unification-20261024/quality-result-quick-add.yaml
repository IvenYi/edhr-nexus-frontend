    - id: QF-ROUTE-QUICK-001
      severity: medium
      scope: 工艺路线快捷添加面板的连接已有节点列表
      summary: 同一工序的正常生产与返工副本候选完全同名，列表无法辨认目标类型
      reproductionSteps:
        - 打开含装配工序a的路线编辑器，右键装配并选择复制为返工工序。
        - 点击结束节点的上方快捷箭头，切换连接已有节点。
        - 查看列表中的两个装配ASM按钮，分别对应OPERATION的a与REWORK的a-copy节点。
      expectedResult: 保留原名称和编码，使用清晰可见及可访问的生产/返工标识、返工编号或其他稳定区分信息，让用户能够确定所连节点。
      actualResult: 两行只显示相同的label和operationCode，名称、编码及可访问名称完全相同；错误选择返工目标不会补全正常生产路径。
      evidence:
        - gmp-platform/frontend/src/components/route-graph/RouteQuickAddPanel.tsx existing.map只渲染label与operationCode
        - gmp-platform/frontend/src/pages/master-data/ProcessModelingPage.tsx copyRouteContextSelection对REWORK副本保留原label
        - output/playwright/route-quick-add-ambiguity-20261025/ambiguous-targets.json
        - output/playwright/route-quick-add-ambiguity-20261025/qa-ambiguous-production-rework-target.png
