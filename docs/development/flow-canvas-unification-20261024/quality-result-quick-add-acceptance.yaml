        - 两个返工候选均只呈现装配、ASM、返工工序，文本和可访问名称完全相同。
      expectedResult: 保留既有多副本能力及节点身份，列表通过对应画布返工编号或其他可见稳定标识区分两个目标。
      actualResult: 两份同工序返工候选显示与画布一致的返1/返2，选第二份保存正确nodeKey；同型同名生产候选以原nodeKey区分并保存准确。
