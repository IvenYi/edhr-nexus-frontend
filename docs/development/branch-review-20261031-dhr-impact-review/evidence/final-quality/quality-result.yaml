  residualRisks:
  - id: risk.known-dhr-highs-not-closed
    description: 两项既有DHR high仍open：完整质量事实/变化比较及全部普通权限UI、账号状态和收件人矩阵。本批只补有限测试证据。
    impact: 本批通过不能作为DHR全链、合规放行或全项目发布认证。
    mitigation: 按真实权威事实与剩余矩阵继续分批审查；不从人工checkResult发明自动质判。
  - id: risk.list-global-scan
    description: 个人DHR页仍遍历全部任务，容量机制独立复现；detail重复影响读取、附件/逐版本投递容量候选继续。
    impact: 历史任务增多使SQL往返、读取和CPU增长；未测生产时延、PG计划或堆峰值。
    mitigation: 先讨论等价DB筛选/计数/分页，明确授权后优化并证明权限、关键词和排序等价；本批不实施。
  - id: risk.identity-and-ui-coverage
    description: 新测试用真实JWT claims+MockMvc及ACTIVE账号，不包含登录/RBAC签发、停用锁定撤销、多租户及完整浏览器/所有附件权限。
    impact: 不能外推为完整账号即时状态或UI验收；JWTFilter仅claim验证是后续审查入口，不擅定撤销政策。
    mitigation: 后续定位已确认身份契约并补独立矩阵，保留任务签署页朋友负责范围。
  - id: risk.global-audit-and-deferred-work
    description: 6017盘点非已审；wholeFile0/unique未知，666/44/183、W2余项、全部W6/A23旧已审复核及W7增量、ACL三问、DELETE/UNKNOWN/DHR附件回调、A12及四gap仍待审/待决。
    impact: 不能声称整体审计结束或全部业务一致。
    mitigation: 继续版本化台账，每次fetch核新代码增量，已暂缓生产弹窗/朋友任务签署页不私自修改。
