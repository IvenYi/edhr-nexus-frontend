    observations: [真实controller/repository/PostgreSQL小页对匹配规模, 共享/不同/缺失人员逐行查询与参数, module/menu/summary派生筛选及排序/个人入口, 调用线程分配和查询计划与索引边界, A23和具体职责拆分]
