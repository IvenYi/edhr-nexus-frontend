        change: 使用相同where/排序和数据库上限100直接返回List，不执行未使用COUNT。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/identity/service/TenantTransferTargets.java]
    transitiveImpacts:
      - area: domain-target-consumers
        change: 通用/普通表单同租户委托、记录控制原候选与申请人回避、DHR/普通表单管理员双权限目标读取均复用同一目录，须回归但不改其条件。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/workflow/service/WorkflowResponsibilityService.java, gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/FormWorkflowOperations.java]
