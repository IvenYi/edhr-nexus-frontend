  confirmed: {concepts: [], relationships: [], rules: [], executionContracts: []}
  inferred:
    - id: inference.personnel-list-without-unused-total
      statement: 用JpaSpecificationExecutor.findBy的sortBy/limit(100)/all直接读取列表，移除Page/getContent未消费的总数，不在Java全量截断。
      rationale: 既有PERF-TENANT-DIRECTORY-COUNT-20261104实际证据、用户继续已列队审计及现有全部调用方返回List；不冒称用户新确认100为业务政策。
      relatedIds: [DEC-0081-01, DEC-0092-02, DEC-0093-02, DEC-0093-04]
  unresolved: []
  replacementScopes: []
  impactAnalysis:
    level: L2
    directImpacts:
