      - area: form-instance-record
        change: 核对实际保存份身份、冻结来源、最新保存值及正式完成时点。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/FormInstanceRecordService.java]
      - area: projection-and-trace
        change: 核对过程索引与正式统计分层、主子表行身份、事务失败及处理重试的确定性。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/FormProjectionService.java, gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/FormTraceIndexService.java]
    transitiveImpacts:
      - area: source-navigation
        change: 核对冻结来源的回查与行定位，不以最新行序猜测历史记录。
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/controller/FormProjectionController.java]
    potentialImpacts:
      - area: quantity-summaries
        concern: 新DEC0079消费正式来源及保存参考，需保留真实份、用途和行身份，不混合两种计入时点。
        evidenceReferences: [docs/knowledge/decisions/DEC-0079-batch-quality-linkage.yaml]
    unaffectedAreas:
      - area: A12-record-control
        reason: 用户明确暂缓未实现的表单变更/作废及依赖，不以当前审查关闭旧DHR high。
    compatibilityAndMigration: [不恢复历史数据、不回填旧索引或正式投影，不发明缺失行身份及单位。]
    snapshotImpacts: [使用既有冻结配置与完成时持久化来源，不改生产快照生命周期。]
    auditImpacts: [核对保存/完成/重试证据及原子性，未确认缺陷前不改变写入或审计语义。]
    permissionImpacts: [保持真实上下文权限与只读来源边界，不新增绕过或宽松查询。]
    testImpacts:
      - scope: saved-to-formal-projection
        scenarios: [保存未完成不正式计入, 完成业务预检失败回滚, 系统处理失败与幂等重试, 主子表字段和真实rowKey定位, 冻结来源不读最新配置]
        evidenceReferences: []
    evidenceGaps: [新贯通用例为真实服务配显式TransactionTemplate，不覆盖完整执行HTTP/JPA/签署；无UI或生产变更，未重跑完整前端构建/浏览器视觉。不将盘点或173项运行计为完整W2。]
  extensionStrategy:
