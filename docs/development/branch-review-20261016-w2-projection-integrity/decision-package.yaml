  acceptanceScenarios:
    - id: scenario.w2-projection-row-chain
      given: 同一实际份有独立主表报工5及两行独立报工2和3，子表尚无客户配置行键
      when: 真实engine保存、序列化重开、换序保存、最终完成及投影失败重试
      then: UUID及字段来源保持；过程立即可查、正式等成功，重试只产生三笔记录、合计10，冻结source不变。
      evidenceRequirements: [真实PostgreSQL与生产组件组合测试, 失败中间写入回滚, 重复处理幂等, 真实读取行索引]
    - id: scenario.w2-projection-business-rejection
      given: 合法草稿已保存并可追溯
      when: 最终提交改追溯文本并含正式数量负数
      then: 必要业务预检失败，数据库原记录和索引一起回滚，未生成outbox。
      evidenceRequirements: [真实引擎及保存服务事务回归, 原值和状态核对, 新旧追溯查询反证]
