        "id": "DEC-0012",
        "disposition": "updated",
        "scope": "provenance: user-confirmed；2026-10-27直接修正当前生产准备模型：工单表达产品及计划需求，不再绑定唯一制程。各生产对象创建时显式选择当前可用制程，产品优先、产品簇兜底，同一工单固定生产形态。未开工对象保存引用并可在资格内修改；首次合法START重核并冻结当时配置。旧工单锁版及过期继续拆分不再为有效策略。原始来源与声明级修正范围见批次制程确认证据。",
        "sourceReferences": [
          "docs/knowledge/evidence/batch-process-2026-10-27.md",
          "docs/knowledge/decisions/DEC-0012-production-work-order-and-production-object.yaml"
        ]
      },
      {
        "id": "DEC-0012-02",
        "disposition": "updated",
        "scope": "provenance: user-confirmed；工单创建和编辑使用 CREATED，不存在发布或 RELEASED 状态；CREATED 与 IN_PROCESS 工单均可在剩余计划数量内继续拆分对象，各对象可选择不同制程版本但生产形态须一致。首次对象开工使工单进入 IN_PROCESS；只有计划全部分配且全部未取消对象正常完成才自动 COMPLETED；已完成可 CLOSED；无对象且未开工可 CANCELLED。生产中不开放工单编辑。",
        "sourceReferences": [
          "docs/knowledge/evidence/batch-process-2026-10-27.md",
          "docs/knowledge/decisions/DEC-0012-production-work-order-and-production-object.yaml"
