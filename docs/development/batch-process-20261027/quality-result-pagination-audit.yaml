    - id: QF-PAG-001
      severity: high
      scope: 图标管理分组切换与图标排序
      summary: 无条件placeholder保留上一分组图标，切组加载时排序会把上一组图标误移到当前组
      reproductionSteps:
        - 自定义组101包含图标201和202，组102为空；令组102的GET响应延迟2500ms。
        - 打开图标管理并选择组101，待数据返回后选择组102。
        - 组102等待期间仍显示组101两项且可拖动；将201拖到202上。
        - 运行独立icon-context-repro.mjs可在隔离HTTP下稳定复现错误PUT。
      expectedResult: 切换父分组时不显示可操作的其他组记录；仅同组翻页可保留上一页数据。
      actualResult: 请求PUT /api/v1/system/icons/order携带groupId=102和旧组IDs [202,201]；后端reorderIcons逐条setGroupId(request.groupId())，会真实改变两图标归组。
