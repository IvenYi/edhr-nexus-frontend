    - id: QF-PAG-002
      severity: medium
      scope: 批次审计动作显示与当前知识规则
      summary: 开工事件标签替换修改，与仍有效的统一新增/修改动作投影定义冲突
      reproductionSteps:
        - 打开含processSnapshot的批次首次START审计事件，界面显示开工。
        - 对照rule.production.audit-action-projection的actionLabels.UPDATE=修改及所有页面只显示新增/修改的解释。
        - 对照同文件batch审计规则仍写新增/修改动作投影不变，以及本轮本体结果仅追加证据、不改规则。
      expectedResult: 保留统一动作类别同时提供可辨识开工说明，或按已确认范围完整修正当前有效定义；实现与知识不得并存相反陈述。
      actualResult: BatchManagementPage直接将含冻结详情的UPDATE标签替换为开工，但当前规则仍明确开工归修改，报告却声称未改变客户动作显示语义。
      evidence:
        - gmp-platform/frontend/src/pages/production/BatchManagementPage.tsx:168
        - docs/knowledge/rules/production.yaml:640
        - docs/knowledge/rules/production.yaml:1131
        - docs/development/batch-process-20261027/ontology-result-pagination-audit.yaml
