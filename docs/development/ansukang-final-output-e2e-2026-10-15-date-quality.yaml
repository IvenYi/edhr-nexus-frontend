      required: true
      category: e2e
      description: 在本轮安速康清洁模板的临时模拟中比较自动fill和系统原生可访问输入。
      method: browser
      command: Cua独立隐藏IAB标签；模板列表展开ASK-FINAL-20261015-CLEAN版本，设计→模拟填报。
      outcome: passed
      evidence:
        - 模板386185810556030976、版本386185810564419584；页面显示安速康新轮模拟·刀头末道清洁V1.0；模拟区只有一个input[type=date]。
        - 在空日期上使用playwright.locator('input[type="date"]').fill('2026-10-15')，read-only DOM读取value立即为''；随后对模拟增补单位普通文本fill('件')，日期value仍为''。独立重做同场景得到相同结果。
        - native typeText粘贴式日期也未形成完整日期；逐键输入可改变分段日期，但本次未取得可靠的年月日分段键盘顺序，不把该尝试当作成功手工日期录入证据。
        - 对AX树中的date field使用tab.setValue(index,'2026-10-15')，AX显示2026-10-15且read-only DOM读取value为2026-10-15。
        - 随后以playwright普通文本fill('件-重绘核验')改变另一个受控字段，日期DOM仍为2026-10-15，AX也继续显示该日期。表明原生可访问输入后的日期可进入受控视图并经其他字段重绘保持。
        - output/ansukang-final-output-e2e-2026-10-15/date-quality/native-date-after-rerender.png
