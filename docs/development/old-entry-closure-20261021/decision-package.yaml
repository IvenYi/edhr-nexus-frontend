        reason: 原工作区包含原因目录与引用改造等未合入功能，只追加七个Java文件的关闭旧入口改动、对应测试和两份旧工具删除，不覆盖其他改动
        evidenceReferences: []
    compatibilityAndMigration:
      - area: historical-execution
        change: 用户明确旧数据均为无用开发测试数据；备份后定向删除四组旧演示对象及派生记录，清除四模板六处退役映射；旧快照仅解释读取，新增份数和保存不再绕过当前校验
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/production/service/ProductionExecutionService.java]
    snapshotImpacts:
      - area: start-and-attach
        change: 退役模板阻断发生在持久化新快照、执行、DHR和审计之前
        evidenceReferences: [gmp-platform/backend/src/test/java/com/zencas/edhr/production/controller/ProductionExecutionIntegrationTest.java]
    auditImpacts:
      - area: obsolete-deletion
        change: 关闭旧删除旁路；当前版本化文档审计保留；拒绝新冻结不新增业务审计
        evidenceReferences: []
    permissionImpacts:
      - area: retired-routes
        change: 有旧权限也不能执行已移除映射；不增加权限、不放宽现有授权
        evidenceReferences: []
    testImpacts:
      - scope: obsolete-writers
        scenarios: [两组旧CUD拒绝且无持久化, 历史GET, 当前文档版本与审计, 新执行阻断, 新附加模板阻断, 旧执行新增份数和保存阻断, 旧投影重试阻断, 旧快照读取, 历史投影解释, CSV往返一致, 清理范围与非目标数据不变]
        evidenceReferences: []
