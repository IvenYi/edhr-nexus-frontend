  acceptanceScenarios:
    - id: scenario.old-document-writes-closed
      given: 认证账号直接调用旧轻量文档接口
      when: 新增、编辑或删除
      then: 返回404或405，不保存或删除文档，正式版本化接口继续工作
      evidenceRequirements: [MVC测试, 隔离应用HTTP与数据库记录]
    - id: scenario.retired-trace-new-execution
      given: 来源模板仍包含四项退役追溯含义之一
      when: 扫码预览、首次开工或附加该来源模板
      then: 提示配置错误且不形成新的执行来源；既有冻结执行和历史预览不被改写
      evidenceRequirements: [执行集成测试, 历史预览回归]
    - id: scenario.csv-encoding
      given: 原107条UTF8清单无BOM
      when: 补UTF8编码标记并重新读取
      then: 中文有效且全部单元格内容保持一致
      evidenceRequirements: [CSV往返与内容摘要, 可读清单]
