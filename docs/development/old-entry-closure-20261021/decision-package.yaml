  impactAnalysis:
    level: L2
    directImpacts:
      - area: obsolete-document-api
        change: 移除两组POST/PUT/DELETE；保留GET，正式版本化文档入口保留
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/controller/SopDocumentController.java, gmp-platform/backend/src/main/java/com/zencas/edhr/masterdata/controller/ProcessModelingController.java]
