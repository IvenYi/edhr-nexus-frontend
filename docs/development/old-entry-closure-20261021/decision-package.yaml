        evidenceReferences: [docs/development/clean-initialization-baseline-20261021/knowledge-path-followups.csv]
    transitiveImpacts:
      - area: http-status
        change: 移除的写口返回405或404，不被泛化异常处理误报500
        evidenceReferences: [gmp-platform/backend/src/main/java/com/zencas/edhr/common/exception/GlobalExceptionHandler.java]
    potentialImpacts:
      - area: external-api-callers
        concern: 直接调用旧接口的外部调用方将被拒绝，改用当前版本化文档接口
        evidenceReferences: []
    unaffectedAreas:
