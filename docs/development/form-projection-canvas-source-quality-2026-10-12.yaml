      expectedResult: 可供选取字段有清晰且不改布局的蓝色标记。
      actualResult: 修复前1px内虚线多数被控件边框覆盖，仅角点明显。
      evidence:
        - CUA独立截图与既有主截图output/canvas-source-20261012/pick-material.png。
      resolutionStatus: resolved
      resolutionEvidence:
        - type: document
          reference: gmp-platform/frontend/src/pages/master-data/template-designer-react/components/ProjectionCanvasPicker.tsx
        - type: command
          reference: 本报告check.visual-and-markers，2px外虚线实际截图复核清晰可见。
