  findings:
    - id: QF-CANVAS-001
      severity: medium
      scope: ProjectionSourceEditor cleanup / ProjectionCanvasPicker cancellation
      summary: 快速切换明细后旧编辑器延迟卸载取消新明细选取
      reproductionSteps:
        - 展开消耗明细2。
        - 点击消耗明细1标题，立即点击其从表单选取数量按钮。
        - 等旧Collapse完成退出，读取选择状态。
      expectedResult: 新明细选取保持，直到用户选取、取消或离开配置。
      actualResult: 修复前新明细的aria-pressed变为false且提示消失。
      evidence:
        - CUA独立复现；原SourceEditor卸载cleanup无条件调用全局cancel。
      resolutionStatus: resolved
      resolutionEvidence:
        - type: document
          reference: gmp-platform/frontend/src/pages/master-data/template-designer-react/components/ProjectionCanvasPicker.tsx
        - type: document
          reference: gmp-platform/frontend/src/pages/master-data/template-designer-react/components/ProjectionSourceEditor.tsx
        - type: command
