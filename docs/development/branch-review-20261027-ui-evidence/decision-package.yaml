    ownershipBoundaries:
      - owner: primary
        responsibility: 复现、局部布局修复、浏览器验证与持续台账。
      - owner: source-review-helper
        responsibility: 只读核对静态线索的实际源码及证据，不参与修复。
      - owner: ontology
        responsibility: 只读评估相关规则来源、适用性与合理性，不盲信知识或改业务政策。
      - owner: quality
        responsibility: 收尾独立复核实际候选，不参与修复。
