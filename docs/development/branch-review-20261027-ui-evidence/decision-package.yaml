        evidenceReferences: [gmp-platform/frontend/src/pages/production/WorkOrderPage.tsx]
      - area: static-evidence
        change: 27条扫描提示逐项核对，区分误报、证据不足和真实缺陷，不为扫描绿色修改业务。
