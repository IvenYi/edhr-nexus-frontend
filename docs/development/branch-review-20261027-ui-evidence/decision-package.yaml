      - area: accessibility
        concern: 可点击控件与文件入口必须可见可达，宽表保留局部横向滚动。
    unaffectedAreas:
      - area: business-policy
        reason: 不改变模板列、旧备注兼容、开工冻结、作业匹配、数量、权限和签名政策。
