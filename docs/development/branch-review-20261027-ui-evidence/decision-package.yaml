      given: 390px及1440px宽度的生产对象管理弹窗
      when: 显式选择制程、下载导入并暂存提交
      then: 表单和控件不被横向裁切；宽表在自身区域横向滚动；业务payload保持
      evidenceRequirements: [基线几何失败, 候选真实浏览器通过, 受控API边界披露]
