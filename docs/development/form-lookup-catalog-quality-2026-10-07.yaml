      expectedResult: 两个候选和已选用途完整显示管理员定义的名称，可明确区分业务含义。
      actualResult: 组件对所有目录名称执行replace(/（.*?）/g,'')，两项均显示批号；源码表达式已实际执行核对，本实例未新增这两项目录数据。
