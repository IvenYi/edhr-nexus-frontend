        - 管理员修改该内置项名称；或如本次验证仅拦截浏览器GET目录响应模拟改名，不改现有数据。
        - 打开该历史表单的查询结果和来源详情。
      expectedResult: 已使用实例仍显示当时定义；无定义快照的存量实例使用既有v1固定解释，不由最新目录改名改变历史解释。
      actualResult: FR-20260929-000004来源详情声明来自冻结快照，却显示QA仅浏览器模拟改名；新保存也因只收集lookup_前缀而不保护原五项。
