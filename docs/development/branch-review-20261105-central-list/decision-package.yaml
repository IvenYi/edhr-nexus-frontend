  inferred:
    - id: inference.central-form-json-scaling
      statement: 普通表单源按每份记录连接执行快照并枚举作业与表单，COUNT和内容查询可能重复解析大JSON，长期多对象累计时即使每对象不超过300表单也可能增加成本。
      rationale: WorkflowOperationsQuery.list复用同一union两次，FormWorkflowOperations.FROM具有jsonb横向枚举；需原生计划确认实际loops及耗时，不能仅按SQL条数判断。
      relatedIds: []
  unresolved: []
