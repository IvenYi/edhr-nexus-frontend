      evidence:
        - upload先Files.createFile取得新路径所有权，失败不能替换或删除已有原件；流复制失败清本次文件。
        - registerUploadedFile使用TransactionTemplate与afterCompletion；只在明确STATUS_ROLLED_BACK清本次上传，STATUS_UNKNOWN保留并记录，事务未启动时的清理只针对ownedPath。
        - delete在数据库删除事务内注册afterCommit物理清理；SQL或提交失败不会先删原件；UNKNOWN保留，物理清理失败向调用方传播，不伪报成功。
        - PRODUCTION_EXECUTION与SIGNATURE_EVIDENCE原保护判断仍先于删除；uploadedBy改为认证AuditContext身份，原内部调用fallback保持。
    - id: quality.integration-dhr-attachment-source
      required: true
      category: security
      description: DHR附件写入补偿、有界摘要及下载元数据复用保留既有资格与冻结边界。
      method: inspection
      command: 对比DhrAttachmentService、两个下载控制器及DhrAttachmentTransactionPostgresTest、DhrAttachmentWriteFailureTest、DhrAttachmentDownloadMetadataPostgresTest源码
      outcome: passed
      evidence:
        - CREATE_NEW碰撞发生在清理拥有权取得前；IOException写入/关闭失败只清本次未注册片段，明确回滚清本次文件，UNKNOWN保留。
        - 上传/核验/解除关联沿原@Transactional、DHR父锁、状态门禁和领域审计；解除关联只改active，不删历史文件。
        - 下载仍两次检查DHR存在、按default租户及DHR身份读取附件、要求冻结版本同时匹配附件ID和sha256；非冻结下载拒绝已解除关联附件。
