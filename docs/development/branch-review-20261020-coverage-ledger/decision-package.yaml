    transitiveImpacts: []
    potentialImpacts:
      - area: evidence-carry-and-counting
        concern: 错误承接可能伪造完成度；通过来源断言、保守降级及独立验证控制。
        evidenceReferences: [docs/development/branch-review-20261020-coverage-ledger/source-catalog.json]
    unaffectedAreas:
      - area: application-and-knowledge-policy
        reason: 不改业务源码/测试、迁移、配置、知识定义、架构或角色契约。
    compatibilityAndMigration: []
    snapshotImpacts: []
    auditImpacts: []
    permissionImpacts: []
    testImpacts:
      - scope: isolated-git-history-fixtures-and-fixed-tree-reproduction
        scenarios: [二进制及中文路径, schema定义与引用区分, 源码变化及移除, 知识依赖变化, 伪造来源拒绝, 未决来源不承接, 完整ID去重, 原失败与脏树状态保留, 防覆盖及逐字节再生成]
