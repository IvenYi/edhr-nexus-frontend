name: Isolated review repair 20261013
on:
  push:
    branches: [fix/review-batch-01-20261013]
    paths: [.review-transfer/ready]
permissions:
  contents: write
concurrency:
  group: isolated-review-repair-20261013
  cancel-in-progress: false
jobs:
  apply-reviewed-patch:
    if: github.ref == 'refs/heads/fix/review-batch-01-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply exact locally tested patch
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, subprocess
          root = pathlib.Path('.review-transfer')
          parts = sorted(root.glob('part-*.b64'))
          assert len(parts) == 4, 'incomplete source transfer'
          data = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts)))
          assert hashlib.sha256(data).hexdigest() == root.joinpath('ready').read_text().strip(), 'patch checksum mismatch'
          patch = pathlib.Path('/tmp/review-repair.patch')
          patch.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
      - name: Commit only staged repair, never merge or force-push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/review-batch-01-20261013
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'fix(frontend): isolate auth cache, forward reference context and enforce DHR version targets'
          git push origin HEAD:refs/heads/fix/review-batch-01-20261013
          printf 'repair_commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
